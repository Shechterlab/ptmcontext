# Disease families: each DisGeNET disease term, by its name, into at most one family. The curated vocabulary of the
# Methylarginine Site Explorer's disease tests (release v1.4.3: FAMILY_RULES, ADDITIONAL_FAMILY_RULES and
# CURATED_OVERRIDES of its scripts/disease_families.py), written out as data. Read by the disease_family and
# disease_family_additional questions of sites/methylarginine.yaml (sets.families). Contract:
# ptmcontext/schemas/set_families.schema.json.
schema_version: 1
title: Disease families (DisGeNET terms, by name)
source: "Methylarginine Site Explorer release v1.4.3 (PTM_Pipeline scripts/disease_families.py), transcribed"
case_sensitive: false      # each pattern is a Python regular expression, searched in the name ignoring case
overrides:                 # exact names, placed before any rule; family null: in no family (not tested)
  - name: 'Ataxia Telangiectasia'
    family: null
    note: 'excluded rather than counted as general ataxia: a genome-instability syndrome, outside the eight audited families'
  - name: 'INCLUSION BODY MYOPATHY WITH EARLY-ONSET PAGET DISEASE AND FRONTOTEMPORAL DEMENTIA'
    family: 'ALS / motor neuron / FTD'
    note: 'frontotemporal dementia takes precedence over the myopathy in its name'
  - name: 'Inclusion Body Myopathy with Early-Onset Paget Disease with or without Frontotemporal Dementia 1'
    family: 'ALS / motor neuron / FTD'
    note: 'frontotemporal dementia takes precedence over the myopathy in its name'
  - name: 'INCLUSION BODY MYOPATHY WITH EARLY-ONSET PAGET DISEASE WITH OR WITHOUT FRONTOTEMPORAL DEMENTIA 2'
    family: 'ALS / motor neuron / FTD'
    note: 'frontotemporal dementia takes precedence over the myopathy in its name'
  - name: 'INCLUSION BODY MYOPATHY WITH EARLY-ONSET PAGET DISEASE WITH OR WITHOUT FRONTOTEMPORAL DEMENTIA 3'
    family: 'ALS / motor neuron / FTD'
    note: 'frontotemporal dementia takes precedence over the myopathy in its name'
lists:                     # a name takes the family of the first rule it matches, list by list: a later list sees only
                           # the names no earlier list places. A name no rule matches is in no family (not tested)
  - name: audited
    note: "the eight audited families, hand-checked rules from the published analysis; v1.1.0 adds TDP-43 proteinopathy, Pick disease (not Niemann-Pick) and anterior horn cell disease to the first"
    families:
      - family: 'ALS / motor neuron / FTD'
        match:
          - 'amyotrophic'
          - '\bals\b'
          - 'motor neuron'
          - 'frontotemporal'
          - '\bftd\b'
          - 'bulbar palsy'
          - 'tdp-?43 proteinopath'
          - "(?<!niemann-)pick(?:'s)? disease"
          - 'anterior horn'
      - family: 'Alzheimer / tau / dementia'
        match:
          - 'alzheimer'
          - 'tauopath'
          - '\bdementia\b'
          - 'cognitive disorder'
      - family: 'Parkinsonism'
        match:
          - 'parkinson'
      - family: 'Ataxia / cerebellar degeneration'
        match:
          - 'ataxia'
          - 'spinocerebellar'
          - 'friedreich'
          - 'cerebellar'
      - family: 'Myopathy / muscle / cardiomyopathy'
        match:
          - 'myopath'
          - 'muscular dystrophy'
          - 'cardiomyopath'
          - 'rhabdomyolysis'
          - 'myositis'
      - family: 'Cancer / neoplasia'
        match:
          - 'cancer'
          - 'carcinoma'
          - 'sarcoma'
          - 'glioma'
          - 'leukemia'
          - 'lymphoma'
          - 'melanoma'
          - 'tumou?r'
          - 'adenoma'
          - 'neoplas'
          - 'myeloma'
      - family: 'Immune / inflammatory'
        match:
          - 'autoimmune'
          - 'inflamm'
          - 'lupus'
          - 'arthritis'
          - 'colitis'
          - 'crohn'
          - 'asthma'
          - 'dermatitis'
          - 'psoriasis'
      - family: 'Developmental / congenital syndromes'
        match:
          - 'congenital'
          - 'dysmorph'
          - 'cranio'
          - 'palate'
          - 'facies'
          - 'syndrom'
          - 'hypoplasia'
          - 'epicanthus'
          - 'forehead'
          - 'midface'
          - 'feeding difficulties'
  - name: additional
    note: "grouped automatically by matching words in the disease terms and not checked by hand, mostly clinical signs (HPO terms): tested apart from the eight families checked by hand"
    families:
      - family: 'Cancer-related (other)'
        match:
          - 'leukaemia'
          - 'malignan'
          - 'teratoma'
          - 'astrocytoma'
          - 'blastoma'
          - 'neurofibromatos'
          - 'fibromatosis'
          - 'lymphangioleiomyomatosis'
          - 'microsatellite instability'
          - 'replication error'
          - 'somatic mutation'
          - 'myelodysplas'
          - 'myeloproliferative'
          - 'blast phase'
          - 'excess blasts'
      - family: 'Neurodegeneration and neuromuscular (other)'
        match:
          - 'neurodegenerat'
