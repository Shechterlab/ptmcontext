# Site: the methylarginine analyses with structural domains instead of InterPro's: ECOD domains that DomainMapper
# assigned on AlphaFold models (SHEPHARD's precomputed human files, MIT). One line differs from methylarginine.yaml:
# the input that fills the domains role. A robustness check of every domain-dependent result, not a release.
schema_version: 1
id: methylarginine_ecod
title: Human methylarginine sites, structural (ECOD) domains
status: working
mark: methylarginine
manifest: sites/methylarginine_ecod.inputs.json

snapshot: {input: uniprot_fasta, release: "UniProt 2026_03"}
inputs:
  disorder: mobidb_disorder
  domains: shephard_ecod_domains      # was: interpro_domains

marks:
  input: methylarginine_sites_v1_4_3
  accession: uniprot_accession
  position: position
  exclude:
    - {column: flags, contains: one_sided_window}
  residue_mismatch: error

analyses:
  - {id: domain_context, layer: domain_context}
  - {id: structure_context, layer: structure_context}

outputs: {folder: out/methylarginine_ecod}
