# Site: the human methylarginine sites, rebuilt. Its analyses must equal release v1.4.3 of the Methylarginine Site
# Explorer (reference), row for row. Contract: ptmcontext/schemas/site.schema.json.
schema_version: 1
id: methylarginine
title: Human methylarginine sites
status: working
mark: methylarginine

snapshot: {input: uniprot_fasta, release: "UniProt 2026_03"}   # quoted: unquoted, YAML reads 2026_03 as 202603
inputs:                # role the layers read: manifest input that fills it
  disorder: mobidb_disorder
  domains: interpro_domains
  reactome: reactome_protein_pathways
  reactome_names: reactome_pathways
  hpa: hpa_locations
  abundance: paxdb_abundance
  panther_classes: panther_protein_classes
  panther_ontology: panther_class_ontology
  uniprot_entries: uniprot_entries
  gene_symbols: orghs_symbol_entrez
  disgenet: disgenet_term_genes
  accession_history: uniprot_accession_history
  cdcode_membership: cdcode_membership
  cdcode_proteins: cdcode_proteins
  cdcode_condensates: cdcode_condensates
  cdcode_members: cdcode_members_2_3

marks:
  # Until this repository builds the site union from the studies, the marks are the release's own sites.
  input: methylarginine_sites_v1_4_3
  accession: uniprot_accession
  position: position
  left_out:            # sites kept pending: counted on neither side (none of v1.4.3's sites carries this flag; the
    - {column: flags, contains: one_sided_window}   # release keeps them in a separate table)
  residue_mismatch: error
  attributes:          # what the website keeps for each site: to colour, filter and explain it (no test reads these)
    state:
      column: methyl_state
      label: Methylation state
      kind: category
      values: {Rme1: Monomethyl (Rme1), Rme2: Dimethyl (Rme2), Rme1_Rme2: Mono- and dimethyl, "": No assigned state}
      colour: true
      filter: true
      help: The methylation state the studies report for the site; Rme2 is dimethylarginine, asymmetric or symmetric not resolved
    studies:
      column: studies
      provenance: true                       # how the site was found, not what it is
      label: Studies and databases
      kind: list
      separator: "; "
      link: {column: study_dois, url: "https://doi.org/{}"}
      records:             # a database's own record of the protein, rather than its paper
        PSP: "https://www.phosphosite.org/uniprotAccAction?id={acc}"
        UniProt: "https://www.uniprot.org/uniprotkb/{acc}/entry#ptm_processing"
      values:
        Fedoriw2019: Fedoriw 2019
        Fong2019: Fong 2019
        Geoghegan2015: Geoghegan 2015
        Guo2014: Guo 2014
        Hartel2019: Hartel 2019
        IEDB: IEDB
        Larsen2016: Larsen 2016
        Li2021: Li 2021
        Lim2020: Lim 2020
        Lu2024: Lu 2024
        Lu2025: Lu 2025
        Ma2023: Ma 2023
        Maron2021: Maron 2021
        Musiani2019: Musiani 2019
        PSP: PhosphoSitePlus
        ProMetheusDB: ProMetheusDB
        Sylvestersen2014: Sylvestersen 2014
        UniProt: UniProt
        Wei2020: Wei 2020
      filter: true
      help: The studies and databases that report the site
    n_studies:
      column: n_studies
      provenance: true                       # how the site was found, not what it is
      label: Studies reporting it
      kind: number
      colour: true
      filter: true
    interaction:
      column: interaction_status
      label: Interaction evidence
      kind: category
      values: {experimental: Experimental, predicted_only: Predicted only, none: None recorded}
      colours: {experimental: "#334155", predicted_only: "#94A3B8", none: "#D9DEE2"}
      colour: true
      filter: true
      help: "Experimental: an RNA or DNA crosslink at the residue, an RBDmap fragment covering it, or a PDB interface; predicted only: an AlphaFold-Multimer interface or a confident predicted contact"
    localised_by:
      column: localised_by
      provenance: true                       # how the site was found, not what it is
      label: Localised by
      kind: list
      separator: "; "
      values:
        localisation_score: a localisation score
        one_methylatable_residue: one methylatable residue on the peptide
        every_arginine_dimethylated: every arginine on the peptide dimethylated
        curated_experimental: UniProt, experimental evidence (curated)
        curated_database: PhosphoSitePlus 2021 (curated)
    flags:
      column: flags
      provenance: true                       # how the site was found, not what it is
      label: Notes
      kind: list
      separator: "; "
      values:
        single_study: reported by one study
        paralog_assigned: assigned to one of several paralogs
        paralog_window: the same window in a paralog
        shared_sequence: the peptide's sequence is shared with another protein
        xenograft_only: seen only in xenograft samples

    # the release's own evidence at each site (human_methylarginine_sites_v1.4.3.tsv; definitions in its README)
    tcga:
      column: tcga_changes
      label: Changes in TCGA tumours
      kind: list
      separator: "; "
      help: "Somatic missense and stop changes of the arginine in TCGA tumours (MC3 public calls from the GDC: 33 projects, 10,294 tumour samples), most tumours first; * is a stop"
    tcga_any:
      column: tcga_changes
      present: true
      label: Changed in TCGA tumours
      kind: category
      values: {"yes": Changed in a tumour, "no": Not changed}
      colours: {"yes": "#B42318", "no": "#D9DEE2"}
      colour: true
      filter: true
      help: "Whether a TCGA tumour (MC3 public calls) carries a missense or stop change of this arginine"
    depmap:
      column: depmap_changes
      label: Changes in DepMap cell lines
      kind: list
      separator: "; "
      help: "Missense and stop changes of the arginine in DepMap 24Q4 cell lines (OmicsSomaticMutations, on the canonical UniProt isoform), most lines first"
    depmap_any:
      column: depmap_changes
      present: true
      label: Changed in DepMap cell lines
      kind: category
      values: {"yes": Changed in a cell line, "no": Not changed}
      filter: true
      help: "Whether a DepMap 24Q4 cell line carries a missense or stop change of this arginine"
    maron_s2:
      column: maron2021_s2_states
      provenance: true                       # which study measured the site, as much as what it is
      label: Maron 2021 Table S2 call
      kind: list
      separator: "; "
      values: {Rme1: Rme1, Rme2: Rme2, Rme2a: Rme2a, Rme2s: Rme2s, Rme: Rme}
      filter: true
      help: "The degrees of methylation called at the site in Maron et al. 2021 Table S2"
    methyl_ip:
      column: maron2021_s3_antibodies
      provenance: true                       # which study measured the site, as much as what it is
      label: Recovered by methyl-IP (Maron 2021)
      kind: list
      separator: "; "
      values: {MMA: MMA antibody, ADMA: ADMA antibody, SDMA: SDMA antibody}
      filter: true
      help: "Antibodies whose immunoprecipitation recovered the site in Maron et al. 2021 Table S3"
    neutral_loss:
      column: dimethyl_type_neutral_loss
      provenance: true                       # which study measured the site, as much as what it is
      label: Dimethyl type by neutral loss (Hartel 2019)
      kind: list
      separator: "; "
      values: {ADMA: Asymmetric (ADMA), SDMA: Symmetric (SDMA)}
      filter: true
      help: "The dimethylarginine type Hartel et al. 2019 called at the site from neutral losses in the fragment spectra, whatever the antibody"
    gsk591:
      column: maron2021_GSK591_call
      provenance: true                       # which study measured the site, as much as what it is
      label: PRMT5 inhibitor GSK591 (Maron 2021)
      kind: category
      values: {decreased: Decreased, increased: Increased, mixed: Mixed, no_significant_change: No significant change, "": Not measured}
      filter: true
      help: "Response to GSK591 in Maron et al. 2021 Table S3, combined over antibodies (a peptide changes at adjusted p ≤ 0.05): peptide-level evidence"
    ms023:
      column: maron2021_MS023_call
      provenance: true                       # which study measured the site, as much as what it is
      label: Type I PRMT inhibitor MS023 (Maron 2021)
      kind: category
      values: {decreased: Decreased, increased: Increased, mixed: Mixed, no_significant_change: No significant change, "": Not measured}
      filter: true
      help: "Response to MS023 in Maron et al. 2021 Table S3, combined over antibodies (a peptide changes at adjusted p ≤ 0.05): peptide-level evidence"
    perturbation:
      column: perturbations
      provenance: true                       # which study measured the site, as much as what it is
      pair_with: perturbation_calls
      label: PRMT knockouts, knockdowns and inhibitors
      kind: list
      separator: "; "
      control: select
      filter: true
      help: "Each knockout, knockdown or inhibitor that quantified a peptide carrying the site, with its call (twofold at q < 0.05, or the published call): peptide-level evidence"
      values:
        "carm1_ko_mcf7:decreased": "CARM1 knockout (MCF7): decreased"
        "carm1_ko_mcf7:increased": "CARM1 knockout (MCF7): increased"
        "carm1_ko_mcf7:mixed": "CARM1 knockout (MCF7): mixed"
        "carm1_ko_mcf7:no_significant_change": "CARM1 knockout (MCF7): no significant change"
        "carm1_ko_mcf7:not_tested": "CARM1 knockout (MCF7): not tested"
        "carm1_ko_mdamb231:decreased": "CARM1 knockout (MDA-MB-231): decreased"
        "carm1_ko_mdamb231:increased": "CARM1 knockout (MDA-MB-231): increased"
        "carm1_ko_mdamb231:mixed": "CARM1 knockout (MDA-MB-231): mixed"
        "carm1_ko_mdamb231:no_significant_change": "CARM1 knockout (MDA-MB-231): no significant change"
        "carm1_ko_mdamb231:not_tested": "CARM1 knockout (MDA-MB-231): not tested"
        "prmt7_ko_hct116:decreased": "PRMT7 knockout (HCT116): decreased"
        "prmt7_ko_hct116:increased": "PRMT7 knockout (HCT116): increased"
        "prmt7_ko_hct116:mixed": "PRMT7 knockout (HCT116): mixed"
        "prmt7_ko_hct116:no_significant_change": "PRMT7 knockout (HCT116): no significant change"
        "prmt7_ko_hct116:not_tested": "PRMT7 knockout (HCT116): not tested"
        "prmt1_kd_hek293t:decreased": "PRMT1 knockdown (HEK293T): decreased"
        "prmt1_kd_hek293t:increased": "PRMT1 knockdown (HEK293T): increased"
        "prmt1_kd_hek293t:mixed": "PRMT1 knockdown (HEK293T): mixed"
        "prmt1_kd_hek293t:no_significant_change": "PRMT1 knockdown (HEK293T): no significant change"
        "prmt1_kd_hek293t:not_tested": "PRMT1 knockdown (HEK293T): not tested"
        "prmt5i_epz015666_hela:decreased": "PRMT5 inhibitor EPZ015666 (HeLa): decreased"
        "prmt5i_epz015666_hela:increased": "PRMT5 inhibitor EPZ015666 (HeLa): increased"
        "prmt5i_epz015666_hela:mixed": "PRMT5 inhibitor EPZ015666 (HeLa): mixed"
        "prmt5i_epz015666_hela:no_significant_change": "PRMT5 inhibitor EPZ015666 (HeLa): no significant change"
        "prmt5i_epz015666_hela:not_tested": "PRMT5 inhibitor EPZ015666 (HeLa): not tested"
        "prmt7_kd_hek293:decreased": "PRMT7 knockdown (HEK293): decreased"
        "prmt7_kd_hek293:increased": "PRMT7 knockdown (HEK293): increased"
        "prmt7_kd_hek293:mixed": "PRMT7 knockdown (HEK293): mixed"
        "prmt7_kd_hek293:no_significant_change": "PRMT7 knockdown (HEK293): no significant change"
        "prmt7_kd_hek293:not_tested": "PRMT7 knockdown (HEK293): not tested"
        "prmt7i_sgc3027_hek293:decreased": "PRMT7 inhibitor SGC3027 (HEK293): decreased"
        "prmt7i_sgc3027_hek293:increased": "PRMT7 inhibitor SGC3027 (HEK293): increased"
        "prmt7i_sgc3027_hek293:mixed": "PRMT7 inhibitor SGC3027 (HEK293): mixed"
        "prmt7i_sgc3027_hek293:no_significant_change": "PRMT7 inhibitor SGC3027 (HEK293): no significant change"
        "prmt7i_sgc3027_hek293:not_tested": "PRMT7 inhibitor SGC3027 (HEK293): not tested"
        "carm1_kd_hek293:decreased": "CARM1 knockdown (HEK293): decreased"
        "carm1_kd_hek293:increased": "CARM1 knockdown (HEK293): increased"
        "carm1_kd_hek293:mixed": "CARM1 knockdown (HEK293): mixed"
        "carm1_kd_hek293:no_significant_change": "CARM1 knockdown (HEK293): no significant change"
        "carm1_kd_hek293:not_tested": "CARM1 knockdown (HEK293): not tested"
        "prmt5_kd_hek293:decreased": "PRMT5 knockdown (HEK293): decreased"
        "prmt5_kd_hek293:increased": "PRMT5 knockdown (HEK293): increased"
        "prmt5_kd_hek293:mixed": "PRMT5 knockdown (HEK293): mixed"
        "prmt5_kd_hek293:no_significant_change": "PRMT5 knockdown (HEK293): no significant change"
        "prmt5_kd_hek293:not_tested": "PRMT5 knockdown (HEK293): not tested"
    nucleic_acid:
      column: bound_nucleic_acid
      label: RNA or DNA contact in PDB structures
      kind: list
      separator: "; "
      values: {rna_at: "RNA, direct (side chain within 4 Å)", dna_at: "DNA, direct (side chain within 4 Å)", rna_proximal: "RNA, proximal (within 8 Å)", dna_proximal: "DNA, proximal (within 8 Å)", rna_near: "RNA, via a residue at i ± 1–5", dna_near: "DNA, via a residue at i ± 1–5"}
      filter: true
      help: "RNA or DNA in direct contact with the site in PDB structures, within 8 Å of its side chain in a complex without direct contact, or in contact via a residue at i ± 1–5 in a complex with neither"
    nucleic_acid_type:
      column: bound_nucleic_acid_types
      label: Type of RNA or DNA in contact
      kind: list
      separator: "; "
      values: {rrna: rRNA, trna: tRNA, snrna: snRNA, mrna: mRNA, other_ncrna: Other ncRNA, viral_rna: Viral RNA, rna_oligo: RNA oligo, other_rna: Other RNA, nucleosomal_dna: Nucleosomal DNA, telomeric_dna: Telomeric DNA, other_dna: Other DNA}
      filter: true
      help: "The types of the RNA and DNA chains in those PDB structures"
    evidence:
      column: interaction_evidence
      label: Interaction evidence at the site
      kind: list
      separator: "; "
      control: select
      filter: true
      help: "The kinds of evidence that the site meets a partner: crosslinks and RNA-bound peptides in cells, PDB interfaces, predicted complexes and IntAct records"
      values:
        rna_crosslink: RNA-crosslinked residue
        rbdmap_fragment: RBDmap RNA-bound fragment
        capri_xl_peptide: CAPRI RNA-crosslinked peptide (XL)
        capri_adj_peptide: CAPRI RNA-bound peptide (ADJ)
        pclap_peptide: pCLAP RNA-binding peptide
        pclap_lysc_region: pCLAP RNA-binding region
        rbrid_residue: RBR-ID+ residue
        rbrid_residue_published_rule: RBR-ID+ residue (published rule)
        rbrid_region: RBR-ID region
        dna_crosslink: DNA-crosslinked residue
        dna_binding_region: UniProt DNA-binding region (annotation)
        pdb_protein: PDB protein–protein interface
        pdb_rna: PDB protein–RNA interface
        pdb_dna: PDB protein–DNA interface
        pdb_self: PDB interface with another copy of the protein
        predicted_interface: Predicted interface (ProtVar)
        predicted_contact: Contact in a predicted complex
        intact_mutation: IntAct mutation that changes an interaction
        intact_binding_region: IntAct binding region
        intact_methylated: IntAct records it methylated
        pdb_methylated_contact: Modelled as a methylarginine in a PDB entry
    partner_class:
      column: interaction_classes
      label: Interaction records at the site
      kind: list
      separator: "; "
      control: select
      filter: true
      help: "The classes of the interaction records at the site (IntAct, PDB, predicted complexes)"
      values:
        writes: Methylates the site (enzyme)
        removes: Demethylates the site (enzyme)
        binds_methylated: Binds it methylated
        binds_unmodified: Binds it unmodified (PDB)
        binds_other_residue: Binds a mutated or variant residue there (PDB)
        binds_state_not_read: PDB interface, residue not read
        mutation_changes_binding: Mutating it changes binding (IntAct)
        mutation_no_effect: Mutating it leaves binding unchanged (IntAct)
        mutation_unspecified: A mutation tested, effect not stated (IntAct)
        binds_region: Binds a region holding it (IntAct)
        other_reaction: Another reaction on a region holding it
        nucleic_acid: RNA or DNA
        not_a_protein: A partner that is not a protein
        self: Another copy of the same protein
        predicted: A predicted complex only
analyses:              # each: one statistics row per class, pooled (fisher) and within protein (mantel_haenszel)
  # protein sets: clusterProfiler's enricher, as the release ran it (scripts/release_layers.py, release_tables.py)
  # PANTHER protein classes (scripts/03b_panther_class_enrichment.py): every reviewed protein is the universe and the
  # background; the groups and the top-level classes, with the unclassified proteins, each partition it
  - id: panther_group
    test: protein_sets
    title: Protein classes (PANTHER), grouped
    question: "Which kinds of protein hold more methylated proteins than expected?"
    sub: "Methylated proteins against the reviewed human proteome, by PANTHER protein class (grouped); every protein is in one group (one-sided hypergeometric test)"
    section: Kinds of protein
    sets:
      input: panther_classes
      protein: uniprot_accession
      classes: protein_class_ids
      ontology: {input: panther_ontology, id: class_id, name: name, parent: parent_id, root: PC00000}
      level: top
      groups:                   # the release's overview groups (PTM_Pipeline config/panther_class_groups.json)
          "Transcription, chromatin and DNA": [PC00264, PC00077, PC00009]
          "RNA processing and translation": [PC00031, PC00263]
          "Metabolic enzymes": [PC00262]
          "Protein-modifying enzymes": [PC00260]
          "Signalling: receptors, ligands and modulators": [PC00197, PC00207, PC00095, PC00060]
          "Transport and membrane traffic": [PC00227, PC00219, PC00150]
          "Cytoskeleton, adhesion and matrix": [PC00085, PC00211, PC00069, PC00070, PC00102]
          "Scaffolds, adaptors and chaperones": [PC00226, PC00072]
          "Immunity and defence": [PC00090]
          "Other PANTHER classes": [PC00237, PC00210]
      unclassified: No PANTHER protein class
    universe: snapshot
    whole_universe: true
    background: other reviewed human proteins
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", each PaxDb abundance decile a stratum"}
  - id: panther_class
    test: protein_sets
    title: Protein classes (PANTHER)
    question: "Which PANTHER protein classes hold more methylated proteins than expected?"
    sub: "Methylated proteins against the reviewed human proteome, by top-level PANTHER protein class; every protein is in one class (one-sided hypergeometric test)"
    section: Kinds of protein
    sets:
      input: panther_classes
      protein: uniprot_accession
      classes: protein_class_ids
      ontology: {input: panther_ontology, id: class_id, name: name, parent: parent_id, root: PC00000}
      level: top
      unclassified: No PANTHER protein class
    universe: snapshot
    whole_universe: true
    background: other reviewed human proteins
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", each PaxDb abundance decile a stratum"}
  - id: panther_subclass
    test: protein_sets
    title: Protein subclasses (PANTHER)
    question: "Which PANTHER protein subclasses hold more methylated proteins than expected?"
    sub: "Methylated proteins against the reviewed human proteome, every PANTHER class below the top level with 10 or more proteins; subclasses overlap (one-sided hypergeometric test)"
    section: Kinds of protein
    sets:
      input: panther_classes
      protein: uniprot_accession
      classes: protein_class_ids
      ontology: {input: panther_ontology, id: class_id, name: name, parent: parent_id, root: PC00000}
      level: below_top
    universe: snapshot
    whole_universe: true
    min_size: 10
    background: other reviewed human proteins
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", each PaxDb abundance decile a stratum"}
  # Disease families (scripts/14_disease_enrichment.py): DisGeNET terms (as DOSE 4.4.0 ships them) gathered into
  # families by name (the release's rules, sites/data/methylarginine_disease_families.yaml); the sets are Entrez genes,
  # each protein's through its UniProt primary gene name (the first of several) and org.Hs.eg.db's symbols. Every
  # reviewed protein's genes are the universe, those with a DisGeNET term the background; the eight audited families
  # and the additional ones are tested apart (BH within each)
  - id: disease_family
    test: protein_sets
    title: Disease families (DisGeNET)
    question: "Which disease gene sets are over-represented?"
    sub: "Genes of methylated proteins vs all reviewed human genes with a DisGeNET term, by disease family: the eight audited families (one-sided hypergeometric test). Association, not causation"
    section: Kinds of protein
    identifiers:
      noun: gene
      nouns: genes
      map:
        - {input: uniprot_entries, from: Entry, to: "Gene Names (primary)", separator: ";", take: first}
        - {input: gene_symbols, from: symbol, to: entrez_id}
    sets:
      input: disgenet
      set: term_id
      protein: entrez_id
      families: {rules: sites/data/methylarginine_disease_families.yaml, by: term_name, lists: [audited]}
    universe: snapshot
    background: other reviewed human genes (Entrez) with a DisGeNET term
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, combine: max, label: ", each PaxDb abundance decile a stratum"}
  - id: disease_family_additional
    test: protein_sets
    title: Disease families, additional (rule-based, not audited)
    question: "Which of the additional disease families, mostly clinical signs, are over-represented?"
    sub: "Genes of methylated proteins vs all reviewed human genes with a DisGeNET term, by additional disease family: rule-based and not audited, mostly clinical signs, tested apart from the audited families (one-sided hypergeometric test). Association, not causation"
    section: Kinds of protein
    identifiers:
      noun: gene
      nouns: genes
      map:
        - {input: uniprot_entries, from: Entry, to: "Gene Names (primary)", separator: ";", take: first}
        - {input: gene_symbols, from: symbol, to: entrez_id}
    sets:
      input: disgenet
      set: term_id
      protein: entrez_id
      families: {rules: sites/data/methylarginine_disease_families.yaml, by: term_name, lists: [additional]}
    universe: snapshot
    background: other reviewed human genes (Entrez) with a DisGeNET term
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, combine: max, label: ", each PaxDb abundance decile a stratum"}
  # Biomolecular condensates (scripts/12_condensate_enrichment.py): CD-CODE's membership (export v2.2), kept for human
  # proteins (its protein table) in human condensates that are not synthetic (its condensate table); a member named by
  # a secondary accession counts as its current entry where the accession history names exactly one, and a member on
  # no reviewed entry is dropped. Every condensate of five or more members is tested against the reviewed proteome
  # (condensate_proteome) and against the proteins in any of these condensates (condensate); the release lists them by
  # fold enrichment, then by methylated members. The release keeps a condensate whose taxon is 9606 or whose species is
  # named Homo sapiens: in this export the name holds for every 9606 condensate and for two more (taxon 9607: RdRp
  # condensates, LANA body), so the name alone keeps the same ones; the protein table's taxon and name always agree.
  # The CD-CODE 2.3 confidence of each membership (0-5) is for the website's filter only.
  - id: condensate_proteome
    test: protein_sets
    title: Biomolecular condensates
    question: "Which biomolecular condensates are over-represented (CD-CODE)?"
    sub: "CD-CODE condensates with a higher fraction of methylated members than the reviewed proteome: every human condensate (not synthetic) with at least five members, its members against all reviewed human proteins (one-sided hypergeometric test). Condensate proteins are about twice as often methylated as proteins in general, so most condensates are enriched relative to the proteome, and few relative to other condensates"
    section: Kinds of protein
    sets:
      input: cdcode_membership
      set: condensate_id
      protein: uniprotkb_ac
      where:
        - {column: uniprotkb_ac, input: cdcode_proteins, key: uniprot_id, include: [{column: species_name, equals: Homo sapiens}]}
        - {column: condensate_id, input: cdcode_condensates, key: uid, include: [{column: species_name, equals: Homo sapiens}], exclude: [{column: condensate_type, equals: synthetic}]}
      history: {input: accession_history, from: key, to: accession, include: [{column: kind, equals: secondary}]}
    names: {input: cdcode_condensates, set: uid, name: name}
    universe: snapshot
    whole_universe: true
    min_size: 5
    order: [{by: fold_enrichment, descending: true}, {by: a, descending: true}]
    background: other reviewed human proteins
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", each PaxDb abundance decile a stratum"}
    scores: {input: cdcode_members, set: condensate_uid, protein: uniprot_accession, value: confidence_score, label: Membership confidence (CD-CODE),
             help: "CD-CODE's 0-5 confidence that the protein belongs to the condensate (CD-CODE 2.3)", levels: [2, 3, 4, 5], max: 5}
    filter: {label: CD-CODE condensate (methylated members), any: In any CD-CODE condensate, sets: all}   # every condensate with a methylated member, as the original
  - id: condensate
    test: protein_sets
    title: Biomolecular condensates, against other condensate proteins
    question: "Which biomolecular condensates stand out among condensate proteins (CD-CODE)?"
    sub: "CD-CODE condensates with a higher fraction of methylated members than all condensate proteins: every human condensate (not synthetic) with at least five members, its members against the proteins in any of these condensates, about half of which are methylated (one-sided hypergeometric test)"
    section: Kinds of protein
    sets:
      input: cdcode_membership
      set: condensate_id
      protein: uniprotkb_ac
      where:
        - {column: uniprotkb_ac, input: cdcode_proteins, key: uniprot_id, include: [{column: species_name, equals: Homo sapiens}]}
        - {column: condensate_id, input: cdcode_condensates, key: uid, include: [{column: species_name, equals: Homo sapiens}], exclude: [{column: condensate_type, equals: synthetic}]}
      history: {input: accession_history, from: key, to: accession, include: [{column: kind, equals: secondary}]}
    names: {input: cdcode_condensates, set: uid, name: name}
    universe: annotated            # the proteins in any of these condensates
    min_size: 5
    order: [{by: fold_enrichment, descending: true}, {by: a, descending: true}]
    background: other human proteins in CD-CODE condensates (export of 2026-03-18)
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", each PaxDb abundance decile a stratum"}
  - id: reactome_top_level
    test: protein_sets
    title: Reactome pathways, top level
    question: "Which top-level Reactome pathways hold more methylated proteins than expected?"
    sub: "Methylated proteins against the other proteins with a Reactome pathway, by top-level pathway (one-sided hypergeometric test)"
    section: Kinds of protein
    sets: {input: reactome, set: pathway_id, protein: canonical_UniProtAC}
    names: {input: reactome_names, set: pathway_id, name: name, include: [{column: depth, equals: "0"}]}
    background: other reviewed human proteins with at least one Reactome 97 pathway
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", each PaxDb abundance decile a stratum"}
  - id: reactome_pathway
    test: protein_sets
    title: Reactome pathways
    question: "Which Reactome pathways, at any level, hold more methylated proteins than expected?"
    sub: "Methylated proteins against the other proteins with a Reactome pathway, every pathway of 10 to 500 proteins (one-sided hypergeometric test)"
    section: Kinds of protein
    sets: {input: reactome, set: pathway_id, protein: canonical_UniProtAC}
    names: {input: reactome_names, set: pathway_id, name: name}
    min_size: 10
    max_size: 500
    background: other reviewed human proteins with at least one Reactome 97 pathway
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", each PaxDb abundance decile a stratum"}
  - id: hpa_location
    test: protein_sets
    title: Where in the cell
    question: "Where in the cell are methylated proteins found more often than other proteins?"
    sub: "Methylated proteins against the other proteins with a Human Protein Atlas location scored Approved or better (one-sided hypergeometric test)"
    section: Where in the cell
    sets: {input: hpa, set: location, protein: canonical_UniProtAC, exclude: [{column: reliability, equals: Uncertain}]}
    whole_universe: true
    background: other proteins with an HPA 25.1 location (Approved or better)
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", each PaxDb abundance decile a stratum"}
  - {id: motif, layer: motif}
  - {id: disorder, layer: disorder}
  - {id: domain_context, layer: domain_context}
  - {id: domain_class, layer: domain_class}
  - {id: structure_context, layer: structure_context}
  - {id: idr_charge, layer: idr_charge, new: true}   # not in the release: CIDER's charge classes of IDRs

reference:
  statistics: methylarginine_statistics_v1_4_3
proteins:                  # the release's protein table: facts of each methylated protein for the website (no test reads these)
  input: methylarginine_proteins_v1_4_3
  accession: uniprot_accession
  attributes:
    arg_enrichment: {column: arg_enrichment_log2, label: Arg enrichment, kind: number, help: "log2 of the shrinkage-estimated methylated share of the protein's arginines over the proteome-wide rate (negative when below it)"}
    arg_enrichment_q: {column: arg_enrichment_q, label: Arginines methylated more than the proteome rate, kind: number, levels: [0.05, 0.01], direction: max, also: {attribute: arg_enrichment, min: 0},
                       help: "Benjamini-Hochberg q of the protein's methylated share of arginines against the proteome-wide rate, with more of them methylated than that rate"}
    dense_window: {column: best_window_aa, label: Densest window (aa), kind: number, help: "the window, in residues, of the protein's most significant cluster of methylarginines"}
    dense_sites: {column: best_window_sites, label: Sites in the densest window, kind: number}
    architecture: {column: architecture_class, label: Clustered architecture, kind: category,
                   values: {"broad across IDR": Broad across an IDR, "domain-distal clustered": Domain-distal clusters, "domain-proximal clustered": Domain-proximal clusters},
                   help: "How the protein's clustered disordered sites (at least 3 within 20 residues) sit against its domains"}
    dense_q: {column: best_window_q, label: Protein has a significant dense region, kind: number, levels: [0.05, 0.01], direction: max,
              help: "q of the protein's most significant cluster of methylarginines (permutation test against the protein's own arginines)"}
    string_partners: {column: n_string_partners, label: STRING physical partners, kind: number, help: "STRING physical associations at score 0.7 or more"}
    complexes: {column: n_complexes, label: Complexes with methylated members, kind: number}
    go_rna: {column: go_rna_binding, label: GO RNA binding, kind: category}
    go_dna: {column: go_dna_binding, label: GO DNA binding, kind: category}
    hpa: {column: hpa_locations, label: Locations in the Human Protein Atlas, kind: list}
variants:                # the same questions on other marks; ptmc run --variant <name>
  with_lower_confidence:
    label: With lower-confidence sites
    description: "The release's lower-confidence sites added: those whose own evidence covers the arginine and leaves the methyl group on an arginine (in_analyses_with_lower_confidence), as statistics_with_lower_confidence_v1.4.3.tsv counts them"
    marks_add:
      - input: methylarginine_lower_confidence_sites_v1_4_3
        include: [{column: in_analyses_with_lower_confidence, equals: "true"}]
        left_out: [{column: in_analyses_with_lower_confidence, equals: "false"}]   # the others are on neither side
    reference: {statistics: methylarginine_statistics_lower_confidence_v1_4_3}
    attributes:
      confidence:
        column: in_analyses_with_lower_confidence
        present: true
        label: Confidence
        kind: category
        values: {"no": Site, "yes": Lower-confidence site}
        colours: {"no": "#334155", "yes": "#C9A227"}
        filter: true
        help: "A lower-confidence site: an arginine a study reports as methylated whose records each fail a site test, counted here because its own evidence covers the arginine and leaves the methyl group on an arginine"


outputs: {folder: out/methylarginine}
citation: sites/methylarginine.citation.cff   # the citation, data sources, version and date: edit there



website:                  # the look and words of the website (ptmc web); layout and behaviour are the kit's
  name: Methylarginine Site Explorer
  tagline: "Human arginine methylation sites from published studies."
  band: ["#155e75", "#0f3b47"]      # the header gradient: teal
  accent: "#c2410c"                 # the orange rule, active tab and links; shared by the lab's sites
  accent_dark: "#fb923c"
  icon: sites/art/methylarginine-icon.svg
  art: sites/art/methylarginine-hero.svg
  lab: {name: Shechter Lab, affiliation: Albert Einstein College of Medicine, url: "https://www.shechterlab.org/", logo: sites/art/shechterlab-logo.svg}
  links:
    - {label: Documentation, url: "#method"}
    - {label: Download data, url: "#method/download"}
    - {label: "Code & data", url: "https://github.com/Shechterlab/ptmcontext"}
    - {label: Research, url: "https://www.shechterlab.org/research/"}
    - {label: Publications, url: "https://www.shechterlab.org/publications/"}
  examples: [FUS, FUS R216, TAF15 EWSR1 FUS, "motif:RGG", "state:Rme2", "disease_family:ALS", "tcga_any:yes"]
  stats: [marks, proteins, {attribute: studies, label: studies and databases}]
  overview:                # what the Overview opens with: tiles, in sections, each with its most telling classes
    question: "What kinds of proteins are arginine methylated?"
    rows: 7
    starting_points:       # under the sections: proteins to start from, and ready-made selections (the explorer's)
      lists:
        - {title: Most sites, by: marks, n: 6, help: Proteins with the most methylarginine sites}
        - {title: Most of their arginines methylated, by: arg_enrichment, where: {attribute: arg_enrichment_q, max: 0.05}, show: "", n: 6,
           help: "Highest arginine-methylation enrichment: more of the protein's arginines methylated than its length and arginine count predict"}
        - {title: Densest clusters, by: dense_q, order: asc, where: {attribute: dense_q, max: 0.05}, show: "{dense_sites}/{dense_window} aa", n: 6,
           help: "Most significant clustering of methylarginines (permutation test): sites in the window"}
      quick:
        - {label: sites reported by 2 or more sources, query: "f=n:n_studies~2", view: sites}
        - {label: sites measured with PRMT inhibitors (Maron 2021), query: "f=t:gsk591~decreased|increased|mixed|no_significant_change", view: sites}
        - {label: proteins in condensates, query: "f=p:condensate_proteome~*", view: proteins}
        - {label: proteins with dense clusters, query: "f=r:dense_q~0.05", view: proteins}
    sections:
      - name: Disease and cancer
        cards:
          - {analysis: disease_family, title: Disease}
          - {analysis: disease_family_additional, title: "More disease families (rule-based, not audited)"}
      - name: Kinds of protein
        cards:
          - {analysis: panther_group, title: Protein classes}
          - {analysis: condensate_proteome, title: Biomolecular condensates, order: q}   # the proteome background, by evidence: a small condensate reaches the largest fold when every member is methylated
          - {analysis: hpa_location, title: Where in the cell}
          - {analysis: reactome_top_level, title: Reactome pathways (top level), rows: 4}
          - {analysis: panther_subclass, title: Protein subclasses}
      - name: Where in the protein
        cards:
          - {analysis: motif, title: Sequence motifs}
          - {analysis: structure_context}
          - {analysis: domain_class, title: Nearest domain class}
          - {analysis: idr_charge}
      - name: In more detail
        cards: [panther_class, {analysis: condensate, title: "Biomolecular condensates (vs other condensates)", order: q}, {analysis: reactome_pathway, title: Reactome pathways (all levels)}, disorder, domain_context]
  filters:                 # the Filters panel: groups in order, from the questions and the sites' attributes
    - {name: Disease and cancer, analyses: [disease_family, disease_family_additional], attributes: [tcga_any, depmap_any]}
    - {name: Protein function, analyses: [panther_group, panther_class, condensate_proteome, hpa_location, reactome_top_level], proteins: [marks, arg_enrichment_q]}
    - {name: Methylation state, attributes: [state, maron_s2, methyl_ip, neutral_loss]}
    - {name: "PRMT inhibitors, knockouts and knockdowns", attributes: [gsk591, ms023, perturbation]}
    - {name: Sequence motif, analyses: [motif]}
    - {name: Clustering, proteins: [dense_q, architecture]}
    - {name: Structural context, analyses: [structure_context, idr_charge, domain_class, disorder, domain_context]}
    - {name: Interactions and binding, attributes: [interaction, evidence, nucleic_acid, nucleic_acid_type, partner_class]}
    - {name: Provenance, attributes: [studies, n_studies, localised_by]}
  dataset: {label: dataset, version: v1.4.3, date: "2026-10-31", doi: "10.5281/zenodo.22696798", url: "https://github.com/Shechterlab/PTM_Pipeline/tree/b0d9049835fbd2527075629f00a4ebab154221bf/releases/v1.4.3"}
  download_terms: "The release's tables are under CC BY-NC-SA 4.0; PhosphoSitePlus records under CC BY-NC-SA 3.0. Cite the paper, the studies and databases that report the sites you use, and the archive (How to cite)."
  downloads:               # the release's files, at the commit the site was built from
    - {label: Sites, url: "https://raw.githubusercontent.com/Shechterlab/PTM_Pipeline/b0d9049835fbd2527075629f00a4ebab154221bf/releases/v1.4.3/human_methylarginine_sites_v1.4.3.xlsx", format: Excel, note: "every site with its evidence, one row per site"}
    - {label: Sites, url: "https://raw.githubusercontent.com/Shechterlab/PTM_Pipeline/b0d9049835fbd2527075629f00a4ebab154221bf/releases/v1.4.3/human_methylarginine_sites_v1.4.3.tsv", format: TSV, note: "the same, tab-separated"}
    - {label: Proteins, url: "https://raw.githubusercontent.com/Shechterlab/PTM_Pipeline/b0d9049835fbd2527075629f00a4ebab154221bf/releases/v1.4.3/human_methylarginine_proteins_v1.4.3.tsv", format: TSV, note: "every methylated protein with its classes, enrichment, clusters and evidence"}
    - {label: Lower-confidence sites, url: "https://raw.githubusercontent.com/Shechterlab/PTM_Pipeline/b0d9049835fbd2527075629f00a4ebab154221bf/releases/v1.4.3/human_methylarginine_lower_confidence_sites_v1.4.3.tsv", format: TSV, note: "arginines reported as methylated whose records each fail a site test, with the tests"}
    - {label: Statistics, url: "https://raw.githubusercontent.com/Shechterlab/PTM_Pipeline/b0d9049835fbd2527075629f00a4ebab154221bf/releases/v1.4.3/statistics_v1.4.3.tsv", format: TSV, note: "every test the site shows"}
    - {label: Statistics with lower-confidence sites, url: "https://raw.githubusercontent.com/Shechterlab/PTM_Pipeline/b0d9049835fbd2527075629f00a4ebab154221bf/releases/v1.4.3/statistics_with_lower_confidence_v1.4.3.tsv", format: TSV, note: "the same tests with the counted lower-confidence sites added"}
    - {label: Studies, url: "https://raw.githubusercontent.com/Shechterlab/PTM_Pipeline/b0d9049835fbd2527075629f00a4ebab154221bf/releases/v1.4.3/studies_v1.4.3.tsv", format: TSV, note: "the studies and databases, with their DOIs and counts"}
    - {label: Data dictionary, url: "https://raw.githubusercontent.com/Shechterlab/PTM_Pipeline/b0d9049835fbd2527075629f00a4ebab154221bf/releases/v1.4.3/data_dictionary.tsv", format: TSV, note: "every column of every file, with its codes"}
    - {label: README, url: "https://github.com/Shechterlab/PTM_Pipeline/blob/b0d9049835fbd2527075629f00a4ebab154221bf/releases/v1.4.3/README.md", format: Markdown, note: "how the release was made, and every column"}
    - {label: What changed, url: "https://github.com/Shechterlab/PTM_Pipeline/blob/b0d9049835fbd2527075629f00a4ebab154221bf/releases/v1.4.3/CHANGES.md", format: Markdown, note: "the changes since the previous release"}
  search_aliases:          # the explorer's search keys, read as this site's questions and attributes
    disease: disease_family
    location: hpa_location
    study: studies
    condensate: condensate_proteome
    panther: panther_class
    domain: domain_class
    bound: nucleic_acid_type
  legacy_links:            # the explorer's Overview anchors (#overview/ov-pan, ...) open the same questions here
    ov-pan: panther_group
    ov-dis: disease_family
    ov-cond: condensate_proteome
    ov-cell: hpa_location
    ov-path: reactome_top_level
    ov-motif: motif
    ov-struct: structure_context
    sel-enriched: "?vs=marks"
  partners: {species: 9606}         # interaction partners on protein pages, live from STRING (human)
  compare: {stratify: studies}      # "compared with other methylarginines, within studies": the same reporting sources
  sites: {columns: [structure_context], attributes: [state, interaction, studies]}   # the explorer's default columns                            # the Sites tab's context column
  tables:                  # tables the protein pages show (no test reads them), each in a format of CONTRACTS.md ("Tables
                           # the protein pages show"); here the release's own tables, their columns mapped to the format's
    site:
      input: methylarginine_sites_v1_4_3
      format: site_values
      columns: {site: site_id}
      values: [methyl_states_reported, maron2021_s2_states, uniprot_states, states_by_study_design, tcga_change_tumours, depmap_change_lines,
               reported_positions, nearest_domain_interpro, nearest_domain_name, domain_side, domain_edge_distance]
    proteins:                            # other names a search or an old link may use (#TDP-43); the facts are proteins.attributes
      input: methylarginine_proteins_v1_4_3
      format: protein_values
      columns: {accession: uniprot_accession, aliases: [gene_synonyms, reported_genes]}
    studies:
      input: methylarginine_studies_v1_4_3
      format: lookup
      columns: {key: study_id}
      values: [label, citation, doi, licence]
    interactions:
      input: methylarginine_site_interactions_v1_4_3
      format: site_evidence
      columns: {site: site_id, kind: evidence_type, partner: partner_gene, partner_accession: partner_accession, ids: structures, score: score, detail: detail}
    contacts:
      input: methylarginine_nucleic_acid_contacts_v1_4_3
      format: bound_windows
      columns: {site: site_id, window: window_marked, kind: nucleic_acid, type: nucleic_acid_type, name: molecule_name, entry: pdb_id,
                distance: closest_distance_a, preparation: sample_preparation}
    contacts_near:
      input: methylarginine_nucleic_acid_near_sites_v1_4_3
      format: bound_windows
      columns: {site: site_id, window: window_marked, kind: nucleic_acid, type: nucleic_acid_type, name: molecule_name, entry: pdb_id,
                entries: n_entries, offset: residue_offset, preparation: sample_preparation}
    residues:
      input: methylarginine_residue_evidence_v1_4_3
      format: residue_evidence
      columns: {accession: uniprot_accession, start: start, end: end, kind: evidence_type, source: sources}
      include: [{column: evidence_type, in: [rna_crosslink, dna_crosslink, rbdmap_fragment, capri_xl_peptide, capri_adj_peptide, rbrid_residue, rbrid_region, dna_binding_region]}]
    records:
      input: methylarginine_site_interaction_records_v1_4_3
      format: site_records
      columns: {site: site_id, group: record_class, partner: partner_gene, partner_name: partner_name, partner_accession: partner_accession,
                partner_kind: partner_kind, species: partner_species, source: source, id: source_id, method: method, context: context,
                state: site_state, state_detail: state_detail, other_marks: other_marks, pubmed: pubmed, doi: doi, citation: citation,
                title: paper_title}
    perturbations:
      input: methylarginine_writer_perturbations_v1_4_3
      format: site_measurements
      columns: {site: site_id, condition: perturbation, call: call, n: n_peptides, n_down: n_decreased, n_up: n_increased,
                value: log2_treated_over_control, q: q, rule: call_criteria}
    inhibitors:
      input: methylarginine_maron2021_inhibitors_v1_4_3
      format: site_table
      columns: {site: site_id}
      values: [antibody, inhibitor, log2_diff_median, adj_p_min, n_peptides, n_decreased, n_increased, call, call_single_site_peptides]
    sources:
      input: methylarginine_source_records_v1_4_3
      format: source_records
      columns: {site: placed_site, source: study, doi: study_doi, reference: reference_text, pubmed: pmid, source_table: source_table,
                peptide: evidence_sequence, state: reported_methyl_state, enzyme: reported_enzyme, sample: reported_sample, detail: reported_detail,
                reported_accession: reported_accession, reported_position: reported_position, check: placement_code}
    string:
      input: methylarginine_protein_partners_v1_4_3
      format: protein_partners
      columns: {accession: uniprot_accession, partner_accession: partner_accession, partner: partner_gene, score: string_score,
                partner_marked: partner_methylated, classes: partner_classes}
  protein:                 # the protein page
    numbering:             # proteins numbered as papers do: histones without the initiator methionine (H3R2 is UniProt R3)
      - genes: "^(H1-\\d+|H2A[A-Z0-9-]*|H2B[A-Z0-9-]*|H3C\\d+|H3-\\d+[A-Z]?|H3Y\\d|H4C\\d+|H4-\\d+|MACROH2A\\d|CENPA)$"
        names: "^(putative |core )?histone (h1|h2a|h2b|h3|h4|macro-h2a)\\b|^testis-specific h1 histone|^histone h3-like centromeric"
        offset: -1
        label: histone numbering
        note: "Histone numbering, without the initiator methionine"
    facts:                 # the headline cards under the map: each opens its section, with a hover
      - {count: marks, of: candidates, label: "{residues} methylated", kind: Sites, glyph: pins, opens: p-seq,
         tip: {values: [{attribute: arg_enrichment, label: "Arginine methylation enrichment: log2", format: l2}, {attribute: arg_enrichment_q, label: q, format: p}]}}
      - {analysis: motif, best: true, label: "in {class} motifs", kind: Sequence motif, glyph: letters, opens: p-score}
      - {analysis: disorder, classes: [disordered], label: in disordered regions, kind: Position in the protein, glyph: wave, opens: p-regions}
      - {attribute: evidence, values: [rna_crosslink, rbdmap_fragment, capri_xl_peptide, capri_adj_peptide, pclap_peptide, pclap_lysc_region, rbrid_residue, rbrid_residue_published_rule, rbrid_region],
         label: in RNA-bound regions, kind: RNA · in living cells, glyph: squiggle, opens: p-sites,
         tip: "Methylarginines crosslinked to RNA, or inside an RNA-bound peptide or fragment (RBDmap, CAPRI, pCLAP) or under an RBR-ID+ peptide, in living cells"}
      - {analysis: condensate_proteome, best: true, label: "CD-CODE condensates, with {class}", kind: Condensates, glyph: drops, opens: p-kinds}
      - {analysis: disease_family, label: disease families, kind: Disease, glyph: cross, opens: p-kinds}
    card:                  # the site card: its blocks, each reading an attribute or a table above (a block without its data is absent)
      labels: {states: Methylation state, calls: PRMT perturbation, changes: In cancers, reported: Reported by}
      hide: [perturbation, nucleic_acid, nucleic_acid_type]   # attributes the blocks show in full (calls, bound sequences)
      evidence:            # interaction evidence: a badge, tags, PDB entries, bound RNA and DNA, crosslinks near it, the whole protein
        title: Interaction evidence
        status: interaction                  # the category attribute the badge shows
        sentences:
          experimental: This arginine has experimental interaction evidence.
          experimental_pred: This arginine has experimental interaction evidence and is also at a predicted interface.
          predicted_only: Predicted to sit at a protein interface; no experimental interaction evidence recorded yet.
          none: No interaction evidence is recorded at this residue. Most proteins were never crystallised, crosslinked or mutated, so this is not evidence of no interaction.
        tags:
          attribute: evidence
          short: {rna_crosslink: RNA xl, rbdmap_fragment: RBDmap, capri_xl_peptide: CAPRI, capri_adj_peptide: CAPRI, pclap_peptide: pCLAP, pclap_lysc_region: pCLAP,
                  rbrid_residue: RBR-ID, rbrid_residue_published_rule: RBR-ID, rbrid_region: RBR-ID, dna_crosslink: DNA xl, dna_binding_region: DNA-binding domain,
                  pdb_rna: RNA, pdb_dna: DNA, pdb_protein: protein, pdb_self: another copy, intact_mutation: mutation alters binding,
                  intact_binding_region: binding region, intact_methylated: methylated (IntAct), pdb_methylated_contact: PDB methyl-R, predicted_interface: pred., predicted_contact: pred.}
          tone: {rna_crosslink: a, rbdmap_fragment: a, capri_xl_peptide: a, capri_adj_peptide: a, pclap_peptide: a, pclap_lysc_region: a, rbrid_residue: a,
                 rbrid_residue_published_rule: a, rbrid_region: a, pdb_rna: a, dna_crosslink: b, dna_binding_region: b, pdb_dna: b,
                 pdb_protein: c, pdb_self: c, intact_mutation: c, intact_binding_region: c, intact_methylated: c, pdb_methylated_contact: c,
                 predicted_interface: pred, predicted_contact: pred}
          predicted: [predicted_interface, predicted_contact]     # values that alone make a status "predicted only" (the badge says "+ pred.")
          partners: interactions             # a site_evidence table: the partner named in a predicted tag, the rest in its hover
        entries:                             # the site's entries in structures, by kind (a site_evidence table)
          table: interactions
          kinds: {pdb_rna: RNA, pdb_dna: DNA, pdb_protein: "", pdb_self: another copy}   # "": the partner's name
          url: "https://www.rcsb.org/structure/{id}"
        sequences:                           # bound_windows tables: the RNA and DNA in contact in structures
          title: RNA and DNA contacts of {site}
          tables: [contacts, contacts_near]
          kinds: {rna: RNA, dna: DNA}
          types: {rrna: rRNA, trna: tRNA, snrna: snRNA, mrna: mRNA, other_ncrna: Other ncRNA, viral_rna: Viral RNA, rna_oligo: RNA oligo, other_rna: Other RNA,
                  nucleosomal_dna: Nucleosomal DNA, telomeric_dna: Telomeric DNA, other_dna: Other DNA}
          designed: {preparation: Synthetically obtained, label: oligo}
          ends: ["5′", "3′"]
          max: 5
        around:                              # a residue_evidence table: crosslinks and RNA-bound stretches at or near the site
          table: residues
          span: 3
          labels: {rna_crosslink: UV-crosslinked to RNA in living cells, dna_crosslink: UV-crosslinked to DNA in living cells,
                   rbdmap_fragment: inside RBDmap RNA-bound fragment, capri_xl_peptide: inside CAPRI RNA-crosslinked peptide,
                   capri_adj_peptide: inside CAPRI RNA-bound peptide (ADJ), rbrid_residue: under an RBR-ID+ peptide, rbrid_region: inside an RBR-ID region,
                   dna_binding_region: inside a UniProt DNA-binding region}
        protein:                             # the whole protein (proteins.attributes), labelled so it is not read as site evidence
          title: "Whole protein (not specific to {site})"
          values:
            - {attribute: string_partners, label: "STRING physical associations (≥ 0.7)"}
            - {attribute: complexes, label: complexes with methylated members}
            - {attribute: go_rna, label: GO RNA binding, flag: true}
            - {attribute: go_dna, label: GO DNA binding, flag: true}
            - {attribute: hpa, label: "HPA:", before: true}
          opens: p-ix
          opens_label: Interaction partners of {gene}
      states:              # the methylation state as each source gives it (a site_values table, or an attribute)
        - {table: site, column: methyl_states_reported, label: Source records}
        - {table: site, column: maron2021_s2_states, label: Maron 2021 Table S2, source: Maron2021}
        - {table: site, column: uniprot_states, label: UniProt, url: "https://www.uniprot.org/uniprotkb/{acc}/entry#ptm_processing"}
        - {attribute: neutral_loss, label: "Hartel 2019, neutral loss", source: Hartel2019}
        - {table: site, column: states_by_study_design, label: a study that looked for one state only}
      changes:             # changes of the residue, with how many tumours or lines carry each (counts: a site_values column in step)
        - {attribute: tcga, table: site, counts: tcga_change_tumours, unit: [tumour, tumours], label: TCGA}
        - {attribute: depmap, table: site, counts: depmap_change_lines, unit: [cell line, cell lines], label: DepMap}
      calls:               # a mark per decrease or increase: site_measurements tables and category attributes
        tables: [perturbations]
        attributes: {gsk591: GSK591, ms023: MS023}
        conditions: {carm1_ko_mcf7: CARM1 KO (MCF7), carm1_ko_mdamb231: CARM1 KO (MDA-MB-231), prmt7_ko_hct116: PRMT7 KO, prmt1_kd_hek293t: PRMT1 KD,
                     prmt5i_epz015666_hela: PRMT5i EPZ015666, prmt7_kd_hek293: PRMT7 KD, prmt7i_sgc3027_hek293: PRMT7i SGC3027, carm1_kd_hek293: CARM1 KD,
                     prmt5_kd_hek293: PRMT5 KD}
        marks: {decreased: "▼", increased: "▲", mixed: "↕"}
        words: {decreased: decreased, increased: increased, mixed: mixed, no_significant_change: no significant change}
        quiet: n.s.                          # the word for "measured, no change"
        skip: [not_tested, ""]
      records:             # a site_records table: who binds it, and how it was found
        title: Who binds it, and how it was found
        table: records
        groups: partner_class                # the attribute whose values name the groups
        help:
          writes: IntAct methylation reactions with the methylarginine curated at this residue, or in which mutating it changes the reaction
          removes: IntAct demethylation reactions with the methylarginine curated at this residue
          binds_methylated: "the residue is a methylarginine in the experiment: modelled as one in a structure (2MR, DA2, NMM), or curated as methylated in IntAct"
          mutation_changes_binding: "IntAct: a mutation of this residue (alone or with up to two neighbours) decreased, disrupted or increased the binding"
          mutation_no_effect: "IntAct: a mutation of this residue had no effect on the binding"
          binds_unmodified: structures that model an unmodified arginine here (PDBe-KB interface)
          binds_other_residue: "structures with another residue here: a mutated construct or a natural variant"
          binds_state_not_read: PDBe-KB places an interface here, but the entry's sequence could not be matched to the site
          binds_region: IntAct binding regions of at most 20 residues; whether the site was methylated is not recorded
          other_reaction: IntAct reactions that IntAct does not place at this residue
          nucleic_acid: contacts in structures, crosslinks and RNA-bound peptides in cells, UniProt DNA-binding regions
          not_a_protein: "IntAct: a gene locus in chromatin immunoprecipitation, or a small molecule"
          self: homo-oligomer contacts in structures
          predicted: complex models (ProtVar, AlphaFold DB), not observations
        open: [writes, removes, binds_methylated, mutation_changes_binding, binds_region, other_reaction, not_a_protein]
        not_papers: [predicted]              # groups whose records are not counted among the papers
        kinds: {self: another copy, rna: RNA, dna: DNA, gene: Gene locus, small_molecule: Small molecule, peptide: Peptide or complex}
        species: Homo sapiens                # partners of another species are named with theirs
        urls: {PDB: "https://www.rcsb.org/structure/{id}", IntAct: "https://www.ebi.ac.uk/intact/details/interaction/{id}"}
        states: {arginine: R (unmodified), not_recorded: not recorded, not_read: not read, other_residue: variant, mutated: mutated}
      writer:              # writer and reader: who acts on it (site_records groups), a suggestion from the attributes, partners
        title: Writer and reader
        who:
          - {label: Methylates it, groups: [writes], none: no methylation reaction recorded at this residue (IntAct)}
          - {label: Demethylates it, groups: [removes]}
          - {label: Binds it methylated, groups: [binds_methylated], none: no structure or IntAct record with this residue methylated}
        suggest:
          label: Writer suggested
          rules:
            - {attribute: methyl_ip, has: [SDMA], suggests: PRMT5, because: "a peptide carrying it was recovered by the SDMA antibody (symmetric dimethylation, made by PRMT5)"}
            - {attribute: methyl_ip, has: [ADMA], suggests: type I PRMTs, because: "a peptide carrying it was recovered by the ADMA antibody (asymmetric dimethylation, made by type I PRMTs such as PRMT1 and CARM1)"}
            - {attribute: gsk591, has: [decreased], suggests: PRMT5, because: "a peptide carrying it decreased with the PRMT5 inhibitor GSK591, and none increased"}
            - {attribute: ms023, has: [decreased], suggests: type I PRMTs, because: "a peptide carrying it decreased with the type I PRMT inhibitor MS023, and none increased"}
            - {attribute: perturbation, has: ["carm1_ko_mcf7:decreased", "carm1_ko_mdamb231:decreased"], suggests: CARM1, replaces: type I PRMTs,
               because: "a peptide carrying it decreased in CARM1 knockout cells, and none increased"}
          none: "No writer suggested: no peptide carrying it was recovered by the ADMA or SDMA antibodies or decreased with a PRMT inhibitor or knockout"
          sources: [Maron2021]
        partners:                            # a protein_partners table: its partners of some classes
          table: string
          classes: {prmt: "PRMTs associated with {gene}", tudor: "Tudor proteins associated with {gene}"}
          note: STRING physical, whole protein
          none: none at STRING ≥ 0.7
        note: "The suggestion is indirect: the antibodies and the inhibitor and knockout responses measure peptides, and a peptide with several methylarginines answers for any of them; no total-protein correction was made, and a decrease after PRMT loss does not show a direct substrate. STRING associations are to the whole protein and do not show that a partner methylates or reads this arginine; the records at the residue are under \"Who binds it\" above. Several Tudor domains read methyllysine instead."
      sources:             # a source_records table: every report of the site, in the sites table's Evidence row
        table: sources
        attribute: studies                   # the provenance attribute whose values name the sources
        checks:
          same_accession_position_verified: Reported position checked on the canonical sequence
          sequence_position_verified: Reported position is an arginine inside the matching peptide
          sequence_unique_canonical: Peptide fits one place in the canonical sequence
          sequence_unique_candidate: Peptide fits one place (reported on another isoform)
          sequence_closest_supported: Peptide fits several places; the nearest supported position is used
          same_accession_evidence_near_match: Peptide or window not in the current sequence; matched within 2 residues of the reported arginine
          canonical_evidence_near_match: Peptide or window not in the current sequence; matched within 2 residues of the reported arginine
        warn: [sequence_closest_supported, same_accession_evidence_near_match, canonical_evidence_near_match]
        tables: {maron2021_s5: via Maron et al. 2021 Table S5 (compiled sites), prometheusdb_mmc2: ProMetheusDB supplementary table mmc2}
      tables:              # site_table tables shown in the Evidence row, each with its words
        - table: inhibitors
          title: PRMT inhibitor response
          note: "Maron et al. 2021 Table S3, over the peptides carrying this site. A call says a peptide carrying the site changed (adj. p ≤ 0.05); a peptide with several methylarginines changes for any of them, so only the single-site column speaks for this arginine alone. The median is descriptive."
          source: Maron2021
          columns:
            - {column: antibody, label: Methyl-IP}
            - {column: inhibitor, label: Inhibitor}
            - {column: log2_diff_median, label: Median log2 change, format: l2}
            - {column: adj_p_min, label: Lowest adj. p, format: p}
            - {column: n_peptides, label: "Peptides (▼/▲)", with: [n_decreased, n_increased]}
            - {column: call, label: Peptide call, words: calls}
            - {column: call_single_site_peptides, label: Single-site peptides, words: calls}
      cite:                # how to cite a protein's sites: the provenance attribute's values, with a lookup table of the sources
        attribute: studies
        lookup: studies
        notices: {PSP: "PhosphoSitePlus® data (www.phosphosite.org) are licensed under CC BY-NC-SA 3.0: non-commercial use, with attribution, and adaptations shared under the same licence."}
    table:                 # the sites table: its columns (the Columns menu), the explorer's defaults first
      filter: interaction                # buttons that show only the sites of one value of this attribute
      columns:
        - {id: ix, label: Interaction evidence, show: [status, tags], default: true}
        - {id: na, label: RNA/DNA contacts, menu: "RNA/DNA contacts (structures) and crosslinks (cells)", show: [sequences, around], default: true}
        - {id: prmt, label: PRMT perturbation, menu: "PRMT inhibitors, knockouts and knockdowns", show: [calls], default: true}
        - {id: src, label: Reported by, attribute: studies, default: true}
        - {id: af, label: AlphaFold, menu: AlphaFold pLDDT, show: [plddt]}
        - {id: ctx, label: Context, menu: Disorder and domain context, analyses: [disorder, domain_context]}
        - {id: dom, label: Nearest domain, show: [nearest_domain]}
        - {id: nn, label: Nearest methyl-R, show: [nearest]}
        - {id: stev, label: State evidence, menu: "State evidence (Maron IP, Table S2, UniProt)", show: [states]}
        - {id: tcga, label: In cancers, menu: "Changes in tumours (TCGA) and cell lines (DepMap)", show: [changes]}
      nearest_domain: {table: site, name: nearest_domain_name, ref: nearest_domain_interpro, side: domain_side, distance: domain_edge_distance,
                       url: "https://www.ebi.ac.uk/interpro/entry/InterPro/{ref}/", sides: {N_terminal_to_domain: N-term, C_terminal_to_domain: C-term, inside: inside}}
