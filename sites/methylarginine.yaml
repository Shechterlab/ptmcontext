# Site: the human methylarginine sites, rebuilt. Its analyses must equal release v1.4.3 of the Methylarginine Site
# Explorer (reference), row for row. Contract: ptmcontext/schemas/site.schema.json.
schema_version: 1
id: methylarginine
title: Human methylarginine sites
status: working
mark: sites/marks/methylarginine.yaml

snapshot: {input: uniprot_fasta, release: "UniProt 2026_03"}   # quoted: unquoted, YAML reads 2026_03 as 202603
inputs:                # role the layers read: manifest input that fills it
  disorder: mobidb_disorder
  domains: interpro_domains
  reactome: reactome_protein_pathways
  reactome_names: reactome_pathways
  go_bp: go_bp_annotations                       # the network view's cluster names
  go_terms: go_bp_terms
  string_partners: string_physical_v12_5         # the network view's STRING links
  complexes: complex_portal_complexes            # and its curated complexes
  hpa: hpa_locations
  abundance: paxdb_abundance
  eclip_maps: release_eclip_rna_compartments    # where the RNAs of proteins with eCLIP data gather, per map
  panther_classes: panther_protein_classes
  panther_ontology: panther_class_ontology
  uniprot_entries: uniprot_entries
  gene_symbols: orghs_symbol_entrez
  disgenet: disgenet_term_genes
  hdo_term_genes: hdo_term_genes
  hdo_terms: hdo_terms
  accession_history: uniprot_accession_history
  cdcode_membership: cdcode_membership
  cdcode_proteins: cdcode_proteins
  cdcode_condensates: cdcode_condensates
  cdcode_members: cdcode_members_2_3
  hcm: hcm_cell_map
  organelle_ip: organelle_ip
  chromatin: chromatin_probability
  depmap_genes: depmap_gene_effect
  tcga_changes: tcga_arginine_changes
  depmap_changes: depmap_arginine_changes
  # the protein map's own rows (website.protein.map.rows): release tables read for the map only, no test reads them
  residue_evidence: methylarginine_residue_evidence_v1_4_3
  density_windows: density_windows_v1_4_3
  lower_confidence_sites: methylarginine_lower_confidence_sites_v1_4_3
  interpro_entries: interpro_all_entries
  go_bp_annotations: go_bp_annotations         # the Overlap page's GO biological process terms
  go_bp_terms: go_bp_terms
  # interactions and binding (scripts/37_export_interaction_data.py of the release): each role one kind of evidence
  uniprot_disorder: uniprot_disordered_regions
  uniprot_domains: uniprot_domain_regions
  pdb_interfaces: {all_of: [pdbe_kb_interfaces_2026_10_16, pdbe_kb_interfaces_2026_10_20, pdbe_kb_interfaces_2026_10_21,
                            pdbe_kb_interfaces_2026_10_21_2, pdbe_kb_interfaces_2026_10_21_3, pdbe_kb_interfaces_2026_10_25]}
  pdb_observed: sifts_observed_ranges
  predicted_interfaces: protvar_interfaces
  intact_mutations: intact_mutations
  intact_binding_regions: intact_binding_regions
  rna_crosslinks: {all_of: [pepr_crosslinks, pepr_focused]}
  rna_crosslinks_single: {all_of: [pepr_crosslinks_single, pepr_focused_single]}
  rbdmap_fragments: rbdmap_fragments
  rbdmap_measured: rbdmap_measured                  # checksum_only
  rbdmap_measured_bound: rbdmap_measured_bound      # checksum_only
  capri_xl: capri_xl_peptides
  capri_adj: capri_adj_peptides
  capri_measured: capri_measured
  capri_measured_adjacent: capri_measured_adjacent
  # pCLAP's peptides are checksum_only: read from the root when it holds them, else the release's own runs of them on
  # the proteins it has sites on (all the residue tests need)
  pclap_peptides: {first_of: [pclap_peptides, release_pclap_peptides]}
  pclap_lysc_regions: {first_of: [pclap_lysc_regions, release_pclap_lysc_regions]}
  pclap_measured: pclap_measured                    # checksum_only
  rbrid_residues: rbrid_positive
  rbrid_residues_published_rule: rbrid_positive_published_rule
  rbrid_regions: rbrid_regions
  rbrid_quantified: rbrid_quantified
  dna_crosslinks: trendel_dna_crosslinks
  dna_crosslink_candidates: trendel_dna_crosslink_candidates
  dna_crosslinked_peptides: trendel_dna_peptides
  dna_interactome: trendel_dna_interactome
  uniprot_dna_binding: uniprot_dna_binding_regions
  go_binding: quickgo_rna_dna_binding
  # arginines of methylated proteins modeled in a PDB entry with RNA or DNA, each with its side-chain distance to it
  na_rna: release_arginine_rna_distances
  na_dna: release_arginine_dna_distances
  na_any: {all_of: [release_arginine_rna_distances, release_arginine_dna_distances]}

marks:
  # Until this repository builds the site union from the studies, the marks are the release's own sites.
  input: methylarginine_sites_v1_4_3
  accession: uniprot_accession
  position: position
  left_out:            # sites held back: counted on neither side (none of v1.4.3's sites carries this flag; the
    - {column: flags, contains: one_sided_window}   # release keeps them in a separate table)
  residue_mismatch: error
  attributes:          # what the website keeps for each site: to color, filter and explain it (no test reads these)
    state:
      column: methyl_state
      label: Methylation state
      kind: category
      values: {Rme1: Monomethyl (Rme1), Rme2: Dimethyl (Rme2), Rme1_Rme2: Mono- and dimethyl, "": No assigned state}
      colour: true
      filter: true
      help: Methylation state reported for the site. Rme2 is dimethylarginine, asymmetric or symmetric unresolved
    studies:
      column: studies
      provenance: true                       # how the site was found, not what it is
      label: Studies and databases
      kind: list
      separator: "; "
      link: {column: study_dois, url: "https://doi.org/{}"}
      records:             # a database's own record of the protein, rather than its paper
        PSP: "https://www.phosphosite.org/uniprotAccAction?id={acc}"
        UniProt: "https://www.uniprot.org/uniprotkb/{acc}/entry#ptm_processing"
      values:
        Fedoriw2019: Fedoriw 2019
        Fong2019: Fong 2019
        Geoghegan2015: Geoghegan 2015
        Guo2014: Guo 2014
        Hartel2019: Hartel 2019
        IEDB: IEDB
        Larsen2016: Larsen 2016
        Li2021: Li 2021
        Lim2020: Lim 2020
        Lu2024: Lu 2024
        Lu2025: Lu 2025
        Ma2023: Ma 2023
        Maron2021: Maron 2021
        Musiani2019: Musiani 2019
        PSP: PhosphoSitePlus
        ProMetheusDB: ProMetheusDB
        Sylvestersen2014: Sylvestersen 2014
        UniProt: UniProt
        Wei2020: Wei 2020
      filter: true
      help: The studies and databases that report the site
    n_studies:
      column: n_studies
      provenance: true                       # how the site was found, not what it is
      label: Studies reporting it
      kind: number
      colour: true
      filter: true
    interaction:
      column: interaction_status
      label: Interaction evidence
      kind: category
      values: {experimental: Experimental, predicted_only: Predicted only, none: None recorded}
      colours: {experimental: "#334155", predicted_only: "#94A3B8", none: "#D9DEE2"}
      colour: true
      filter: true
      help: "Experimental: an RNA or DNA crosslink at the residue, an RBDmap fragment covering it, or a PDB interface; predicted only: an AlphaFold-Multimer interface or a confident predicted contact"
    localised_by:
      column: localised_by
      provenance: true                       # how the site was found, not what it is
      label: Localized by
      kind: list
      separator: "; "
      values:
        localisation_score: a localization score
        one_methylatable_residue: one methylatable residue on the peptide
        every_arginine_dimethylated: every arginine on the peptide dimethylated
        curated_experimental: UniProt, experimental evidence (curated)
        curated_database: PhosphoSitePlus 2021 (curated)
    flags:
      column: flags
      provenance: true                       # how the site was found, not what it is
      label: Notes
      kind: list
      separator: "; "
      values:
        single_study: reported by one study
        paralog_assigned: assigned to one of several paralogs
        paralog_window: the same window in a paralog
        shared_sequence: the peptide's sequence is shared with another protein
        xenograft_only: seen only in xenograft samples

    # the release's own evidence at each site (human_methylarginine_sites_v1.4.3.tsv; definitions in its README)
    tcga:
      column: tcga_changes
      label: Changes in TCGA tumors
      kind: list
      separator: "; "
      help: "Somatic missense and stop changes of the arginine in TCGA tumors (MC3 public calls from the GDC: 33 projects, 10,294 tumor samples), most tumors first; * is a stop"
    tcga_any:
      column: tcga_changes
      present: true
      label: Mutated in tumors (TCGA)
      kind: category
      values: {"yes": Mutated in tumors, "no": Not mutated}
      colours: {"yes": "#B42318", "no": "#D9DEE2"}
      colour: true
      filter: true
      help: "Whether a TCGA tumor (MC3 public calls) has a missense or stop change at this arginine. This counts every methylarginine; the tumor question compares only the proteins whose gene DepMap screened, so its count is smaller"
    depmap:
      column: depmap_changes
      label: Changes in DepMap cell lines
      kind: list
      separator: "; "
      help: "Missense and stop changes of the arginine in DepMap 24Q4 cell lines (OmicsSomaticMutations, on the canonical UniProt isoform), most lines first"
    depmap_any:
      column: depmap_changes
      present: true
      label: Changed in DepMap cell lines
      kind: category
      values: {"yes": Changed in a cell line, "no": Not changed}
      filter: true
      help: "Whether a DepMap 24Q4 cell line has a missense or stop change at this arginine"
    maron_s2:
      column: maron2021_s2_states
      provenance: true                       # which study measured the site, as much as what it is
      label: Maron 2021 Table S2 call
      kind: list
      separator: "; "
      values: {Rme1: Rme1, Rme2: Rme2, Rme2a: Rme2a, Rme2s: Rme2s, Rme: Rme}
      filter: true
      help: "The degrees of methylation called at the site in Maron et al. 2021 Table S2"
    methyl_ip:
      column: maron2021_s3_antibodies
      provenance: true                       # which study measured the site, as much as what it is
      label: Recovered by methyl-IP (Maron 2021)
      kind: list
      separator: "; "
      values: {MMA: MMA antibody, ADMA: ADMA antibody, SDMA: SDMA antibody}
      filter: true
      help: "Antibodies whose immunoprecipitation recovered the site in Maron et al. 2021 Table S3"
    neutral_loss:
      column: dimethyl_type_neutral_loss
      provenance: true                       # which study measured the site, as much as what it is
      label: Dimethyl type by neutral loss (Hartel 2019)
      kind: list
      separator: "; "
      values: {ADMA: Asymmetric (ADMA), SDMA: Symmetric (SDMA)}
      filter: true
      help: "The dimethylarginine type Hartel et al. 2019 called at the site from neutral losses in the fragment spectra, whatever the antibody"
    gsk591:
      column: maron2021_GSK591_call
      provenance: true                       # which study measured the site, as much as what it is
      label: PRMT5 inhibitor GSK591 (Maron 2021)
      kind: category
      values: {decreased: Decreased, increased: Increased, mixed: Mixed, no_significant_change: No significant change, "": Not measured}
      filter: true
      help: "Response to GSK591 in Maron et al. 2021 Table S3, combined over antibodies (a peptide changes at adjusted p ≤ 0.05): peptide-level evidence"
    ms023:
      column: maron2021_MS023_call
      provenance: true                       # which study measured the site, as much as what it is
      label: Type I PRMT inhibitor MS023 (Maron 2021)
      kind: category
      values: {decreased: Decreased, increased: Increased, mixed: Mixed, no_significant_change: No significant change, "": Not measured}
      filter: true
      help: "Response to MS023 in Maron et al. 2021 Table S3, combined over antibodies (a peptide changes at adjusted p ≤ 0.05): peptide-level evidence"
    perturbation:
      column: perturbations
      provenance: true                       # which study measured the site, as much as what it is
      pair_with: perturbation_calls
      label: PRMT knockouts, knockdowns and inhibitors
      kind: list
      separator: "; "
      control: select
      filter: true
      help: "Each knockout, knockdown or inhibitor that quantified a peptide containing the site, with its call (twofold at q < 0.05, or the published call): peptide-level evidence"
      values:
        "carm1_ko_mcf7:decreased": "CARM1 knockout (MCF7): decreased"
        "carm1_ko_mcf7:increased": "CARM1 knockout (MCF7): increased"
        "carm1_ko_mcf7:mixed": "CARM1 knockout (MCF7): mixed"
        "carm1_ko_mcf7:no_significant_change": "CARM1 knockout (MCF7): no significant change"
        "carm1_ko_mcf7:not_tested": "CARM1 knockout (MCF7): not tested"
        "carm1_ko_mdamb231:decreased": "CARM1 knockout (MDA-MB-231): decreased"
        "carm1_ko_mdamb231:increased": "CARM1 knockout (MDA-MB-231): increased"
        "carm1_ko_mdamb231:mixed": "CARM1 knockout (MDA-MB-231): mixed"
        "carm1_ko_mdamb231:no_significant_change": "CARM1 knockout (MDA-MB-231): no significant change"
        "carm1_ko_mdamb231:not_tested": "CARM1 knockout (MDA-MB-231): not tested"
        "prmt7_ko_hct116:decreased": "PRMT7 knockout (HCT116): decreased"
        "prmt7_ko_hct116:increased": "PRMT7 knockout (HCT116): increased"
        "prmt7_ko_hct116:mixed": "PRMT7 knockout (HCT116): mixed"
        "prmt7_ko_hct116:no_significant_change": "PRMT7 knockout (HCT116): no significant change"
        "prmt7_ko_hct116:not_tested": "PRMT7 knockout (HCT116): not tested"
        "prmt1_kd_hek293t:decreased": "PRMT1 knockdown (HEK293T): decreased"
        "prmt1_kd_hek293t:increased": "PRMT1 knockdown (HEK293T): increased"
        "prmt1_kd_hek293t:mixed": "PRMT1 knockdown (HEK293T): mixed"
        "prmt1_kd_hek293t:no_significant_change": "PRMT1 knockdown (HEK293T): no significant change"
        "prmt1_kd_hek293t:not_tested": "PRMT1 knockdown (HEK293T): not tested"
        "prmt5i_epz015666_hela:decreased": "PRMT5 inhibitor EPZ015666 (HeLa): decreased"
        "prmt5i_epz015666_hela:increased": "PRMT5 inhibitor EPZ015666 (HeLa): increased"
        "prmt5i_epz015666_hela:mixed": "PRMT5 inhibitor EPZ015666 (HeLa): mixed"
        "prmt5i_epz015666_hela:no_significant_change": "PRMT5 inhibitor EPZ015666 (HeLa): no significant change"
        "prmt5i_epz015666_hela:not_tested": "PRMT5 inhibitor EPZ015666 (HeLa): not tested"
        "prmt7_kd_hek293:decreased": "PRMT7 knockdown (HEK293): decreased"
        "prmt7_kd_hek293:increased": "PRMT7 knockdown (HEK293): increased"
        "prmt7_kd_hek293:mixed": "PRMT7 knockdown (HEK293): mixed"
        "prmt7_kd_hek293:no_significant_change": "PRMT7 knockdown (HEK293): no significant change"
        "prmt7_kd_hek293:not_tested": "PRMT7 knockdown (HEK293): not tested"
        "prmt7i_sgc3027_hek293:decreased": "PRMT7 inhibitor SGC3027 (HEK293): decreased"
        "prmt7i_sgc3027_hek293:increased": "PRMT7 inhibitor SGC3027 (HEK293): increased"
        "prmt7i_sgc3027_hek293:mixed": "PRMT7 inhibitor SGC3027 (HEK293): mixed"
        "prmt7i_sgc3027_hek293:no_significant_change": "PRMT7 inhibitor SGC3027 (HEK293): no significant change"
        "prmt7i_sgc3027_hek293:not_tested": "PRMT7 inhibitor SGC3027 (HEK293): not tested"
        "carm1_kd_hek293:decreased": "CARM1 knockdown (HEK293): decreased"
        "carm1_kd_hek293:increased": "CARM1 knockdown (HEK293): increased"
        "carm1_kd_hek293:mixed": "CARM1 knockdown (HEK293): mixed"
        "carm1_kd_hek293:no_significant_change": "CARM1 knockdown (HEK293): no significant change"
        "carm1_kd_hek293:not_tested": "CARM1 knockdown (HEK293): not tested"
        "prmt5_kd_hek293:decreased": "PRMT5 knockdown (HEK293): decreased"
        "prmt5_kd_hek293:increased": "PRMT5 knockdown (HEK293): increased"
        "prmt5_kd_hek293:mixed": "PRMT5 knockdown (HEK293): mixed"
        "prmt5_kd_hek293:no_significant_change": "PRMT5 knockdown (HEK293): no significant change"
        "prmt5_kd_hek293:not_tested": "PRMT5 knockdown (HEK293): not tested"
    nucleic_acid:
      column: bound_nucleic_acid
      label: RNA or DNA contact in PDB structures
      kind: list
      separator: "; "
      values: {rna_at: "RNA, direct (side chain within 4 Å)", dna_at: "DNA, direct (side chain within 4 Å)", rna_proximal: "RNA, proximal (within 8 Å)", dna_proximal: "DNA, proximal (within 8 Å)", rna_near: "RNA, via a residue at i ± 1–5", dna_near: "DNA, via a residue at i ± 1–5"}
      filter: true
      help: "RNA or DNA in direct contact with the site in PDB structures, within 8 Å of its side chain in a complex without direct contact, or in contact via a residue at i ± 1–5 in a complex with neither"
    nucleic_acid_type:
      column: bound_nucleic_acid_types
      label: Type of RNA or DNA in contact
      kind: list
      separator: "; "
      values: {rrna: rRNA, trna: tRNA, snrna: snRNA, mrna: mRNA, other_ncrna: Other ncRNA, viral_rna: Viral RNA, rna_oligo: RNA oligo, other_rna: Other RNA, nucleosomal_dna: Nucleosomal DNA, telomeric_dna: Telomeric DNA, other_dna: Other DNA}
      filter: true
      help: "The types of the RNA and DNA chains in those PDB structures"
    evidence:
      column: interaction_evidence
      label: Interaction evidence at the site
      kind: list
      separator: "; "
      control: select
      filter: true
      presence_only: [rbdmap_fragment, pclap_peptide, pclap_lysc_region]   # a flag at the site only: never the fragment's or peptide's start, end or sequence
      help: "Evidence that the site contacts a partner: crosslinks and RNA-bound peptides in cells, PDB interfaces, predicted complexes and IntAct records"
      values:
        rna_crosslink: RNA-crosslinked residue
        rbdmap_fragment: RBDmap RNA-bound fragment
        capri_xl_peptide: CAPRI RNA-crosslinked peptide (XL)
        capri_adj_peptide: CAPRI RNA-bound peptide (ADJ)
        pclap_peptide: pCLAP RNA-binding peptide
        pclap_lysc_region: pCLAP RNA-binding region
        rbrid_residue: RBR-ID+ residue
        rbrid_residue_published_rule: RBR-ID+ residue (published rule)
        rbrid_region: RBR-ID region
        dna_crosslink: DNA-crosslinked residue
        dna_binding_region: UniProt DNA-binding region (annotation)
        pdb_protein: PDB protein–protein interface
        pdb_rna: PDB protein–RNA interface
        pdb_dna: PDB protein–DNA interface
        pdb_self: PDB interface with another copy of the protein
        predicted_interface: Predicted interface (ProtVar)
        predicted_contact: Contact in a predicted complex
        intact_mutation: IntAct mutation that changes an interaction
        intact_binding_region: IntAct binding region
        intact_methylated: IntAct records it methylated
        pdb_methylated_contact: Modeled as a methylarginine in a PDB entry
    partner_class:
      column: interaction_classes
      label: Interaction records at the site
      kind: list
      separator: "; "
      control: select
      filter: true
      help: "The classes of the interaction records at the site (IntAct, PDB, predicted complexes)"
      values:
        writes: Methylates the site (enzyme)
        removes: Demethylates the site (enzyme)
        binds_methylated: Binds it methylated
        binds_unmodified: Binds it unmodified (PDB)
        binds_other_residue: Binds a mutated or variant residue there (PDB)
        binds_state_not_read: PDB interface, residue not read
        mutation_changes_binding: Mutating it changes binding (IntAct)
        mutation_no_effect: Mutating it leaves binding unchanged (IntAct)
        mutation_unspecified: A mutation tested, effect not stated (IntAct)
        binds_region: Binds a region holding it (IntAct)
        other_reaction: Another reaction on a region holding it
        nucleic_acid: RNA or DNA
        not_a_protein: A partner that is not a protein
        self: Another copy of the same protein
        predicted: A predicted complex only
  tables:              # several rows per site, for the website's count questions (no test reads these): each row names
                       # its site by the marks table's site_id (CONTRACTS.md, Per-mark tables)
    maron_inhibitors:  # each site, methyl-IP antibody and inhibitor of Maron et al. 2021 Table S3
      input: maron2021_inhibitors_v1_4_3
      key: {marks: site_id, table: site_id}
      columns: [inhibitor, antibody, call, log2_diff_median]
    carm1_ko:          # each site and cell line of the CARM1 knockout (Shishkova et al. 2017)
      input: carm1_ko_v1_4_3
      key: {marks: site_id, table: site_id}
      columns: [cell_line, call, log2_ko_over_wt]
    writer_perturbations:   # each site and knockout, knockdown or inhibitor; its calls are the perturbation attribute's
      input: writer_perturbations_v1_4_3
      key: {marks: site_id, table: site_id}
      columns: [perturbation, call, log2_treated_over_control]
analyses:              # each: one statistics row per class, pooled (fisher) and within protein (mantel_haenszel)
  # protein sets: clusterProfiler's enricher, as the release ran it (scripts/release_layers.py, release_tables.py)
  # PANTHER protein classes (scripts/03b_panther_class_enrichment.py): every reviewed protein is the universe and the
  # background; the groups and the top-level classes, with the unclassified proteins, each partition it
  - id: panther_group
    test: protein_sets
    title: Protein classes (PANTHER), grouped
    question: "Which protein classes hold more methylated proteins than expected?"
    sub: "Methylated proteins against the reviewed human proteome, by PANTHER protein class (grouped); every protein is in one group (one-sided hypergeometric test)"
    section: Protein classes and pathways
    sets:
      input: panther_classes
      protein: uniprot_accession
      classes: protein_class_ids
      ontology: {input: panther_ontology, id: class_id, name: name, parent: parent_id, root: PC00000}
      level: top
      groups:                   # the release's overview groups (PTM_Pipeline config/panther_class_groups.json)
          "Transcription, chromatin and DNA": [PC00264, PC00077, PC00009]
          "RNA processing and translation": [PC00031, PC00263]
          "Metabolic enzymes": [PC00262]
          "Protein-modifying enzymes": [PC00260]
          "Signalling: receptors, ligands and modulators": [PC00197, PC00207, PC00095, PC00060]
          "Transport and membrane traffic": [PC00227, PC00219, PC00150]
          "Cytoskeleton, adhesion and matrix": [PC00085, PC00211, PC00069, PC00070, PC00102]
          "Scaffolds, adaptors and chaperones": [PC00226, PC00072]
          "Immunity and defence": [PC00090]
          "Other PANTHER classes": [PC00237, PC00210]
      unclassified: No PANTHER protein class
    universe: snapshot
    whole_universe: true
    background: other reviewed human proteins
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", each PaxDb abundance decile a stratum"}
  - id: panther_class
    test: protein_sets
    title: Protein classes (PANTHER)
    question: "Which PANTHER protein classes hold more methylated proteins than expected?"
    sub: "Methylated proteins against the reviewed human proteome, by top-level PANTHER protein class; every protein is in one class (one-sided hypergeometric test)"
    section: Protein classes and pathways
    sets:
      input: panther_classes
      protein: uniprot_accession
      classes: protein_class_ids
      ontology: {input: panther_ontology, id: class_id, name: name, parent: parent_id, root: PC00000}
      level: top
      unclassified: No PANTHER protein class
    universe: snapshot
    whole_universe: true
    background: other reviewed human proteins
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", each PaxDb abundance decile a stratum"}
  - id: panther_subclass
    test: protein_sets
    title: Protein subclasses (PANTHER)
    question: "Which PANTHER protein subclasses hold more methylated proteins than expected?"
    sub: "Methylated proteins against the reviewed human proteome, every PANTHER class below the top level with 10 or more proteins; subclasses overlap (one-sided hypergeometric test)"
    section: Protein classes and pathways
    sets:
      input: panther_classes
      protein: uniprot_accession
      classes: protein_class_ids
      ontology: {input: panther_ontology, id: class_id, name: name, parent: parent_id, root: PC00000}
      level: below_top
    universe: snapshot
    whole_universe: true
    min_size: 10
    background: other reviewed human proteins
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", each PaxDb abundance decile a stratum"}
  # Disease families (scripts/14_disease_enrichment.py): DisGeNET terms (as DOSE 4.4.0 ships them) gathered into
  # families by name (the release's rules, sites/data/methylarginine_disease_families.yaml); the sets are Entrez genes,
  # each protein's through its UniProt primary gene name (the first of several) and org.Hs.eg.db's symbols. Every
  # reviewed protein's genes are the universe, those with a DisGeNET term the background; the eight audited families
  # and the additional ones are tested apart (BH within each)
  - id: disease_family
    test: protein_sets
    title: Disease families (DisGeNET)
    question: "Which disease gene sets are over-represented?"
    sub: "Genes of methylated proteins vs all reviewed human genes with a DisGeNET term, by disease family: the eight families checked by hand (one-sided hypergeometric test). Association, not causation"
    set_note: "A family of DisGeNET disease terms gathered by name; one of the eight whose rules were checked by hand."
    section: Protein classes and pathways
    identifiers:
      noun: gene
      nouns: genes
      map:
        - {input: uniprot_entries, from: Entry, to: "Gene Names (primary)", separator: ";", take: first}
        - {input: gene_symbols, from: symbol, to: entrez_id}
    sets:
      input: disgenet
      set: term_id
      protein: entrez_id
      families: {rules: sites/data/methylarginine_disease_families.yaml, by: term_name, lists: [audited]}
    universe: snapshot
    background: other reviewed human genes (Entrez) with a DisGeNET term
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, combine: max, label: ", each PaxDb abundance decile a stratum"}
  - id: disease_family_additional
    test: protein_sets
    title: Disease families, additional
    question: "Which of the additional disease families, mostly clinical signs, are over-represented?"
    sub: "Genes of methylated proteins vs all reviewed human genes with a DisGeNET term, by additional disease family: grouped automatically by matching words in the disease terms, not checked by hand, mostly clinical signs; tested apart from the eight families checked by hand (one-sided hypergeometric test). Association, not causation"
    set_note: "A family of DisGeNET disease terms grouped automatically by matching words; not checked by hand."
    section: Protein classes and pathways
    identifiers:
      noun: gene
      nouns: genes
      map:
        - {input: uniprot_entries, from: Entry, to: "Gene Names (primary)", separator: ";", take: first}
        - {input: gene_symbols, from: symbol, to: entrez_id}
    sets:
      input: disgenet
      set: term_id
      protein: entrez_id
      families: {rules: sites/data/methylarginine_disease_families.yaml, by: term_name, lists: [additional]}
    universe: snapshot
    background: other reviewed human genes (Entrez) with a DisGeNET term
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, combine: max, label: ", each PaxDb abundance decile a stratum"}
  # Disease Ontology (scripts/14_disease_enrichment.py): the gene sets DOSE enrichDO tests (each term holds the genes of
  # the terms under it; Human Disease Ontology 2026-09-30), on the genes of the disease families: every reviewed
  # protein's genes are the universe, those with a Disease Ontology term the background, and every term of 10 genes or
  # more with a methylated gene is tested. The release keeps these rows in a supporting table, not in its statistics
  # table, so the run checks them against that table (reference.tables)
  - id: disease_ontology
    test: protein_sets
    title: Disease Ontology
    question: "Which Disease Ontology terms hold more genes of methylated proteins than expected?"
    sub: "Genes of methylated proteins vs all reviewed human genes with a Disease Ontology term, every term of at least 10 genes; a term includes the genes of its child terms (one-sided hypergeometric test, as DOSE's enrichDO). Association, not causation"
    section: Protein classes and pathways
    identifiers:
      noun: gene
      nouns: genes
      map:
        - {input: uniprot_entries, from: Entry, to: "Gene Names (primary)", separator: ";", take: first}
        - {input: gene_symbols, from: symbol, to: entrez_id}
    sets: {input: hdo_term_genes, set: term_id, protein: entrez_id}
    names: {input: hdo_terms, set: term_id, name: name}
    hierarchy: {input: hdo_terms, set: term_id, parents: parents, root: "DOID:4"}
    universe: snapshot
    min_size: 10
    link: "https://disease-ontology.org/?id={}"
    filter: {label: Disease Ontology term (methylated proteins)}
    background: other reviewed human genes (Entrez) with a Disease Ontology term
  # DisGeNET terms one by one (scripts/14_disease_enrichment.py): the terms of the disease families, each tested as
  # DOSE's enrichDGN tests it (terms of 10 to 300 genes), against the same background. In the release's supporting
  # tables, not its statistics table: the run checks them against supporting/disease_terms_tested (reference.tables)
  - id: disease_term
    test: protein_sets
    title: DisGeNET terms
    question: "Which DisGeNET disease terms hold more genes of methylated proteins than expected?"
    sub: "Genes of methylated proteins vs all reviewed human genes with a DisGeNET term, every term of 10 to 300 genes (one-sided hypergeometric test, as DOSE's enrichDGN). Association, not causation"
    section: Protein classes and pathways
    identifiers:
      noun: gene
      nouns: genes
      map:
        - {input: uniprot_entries, from: Entry, to: "Gene Names (primary)", separator: ";", take: first}
        - {input: gene_symbols, from: symbol, to: entrez_id}
    sets: {input: disgenet, set: term_id, protein: entrez_id}
    names: {input: disgenet, set: term_id, name: term_name}
    universe: snapshot
    min_size: 10
    max_size: 300
    link: "https://www.disgenet.com/search?view=DISEASES&idents={}&source=ALL&tab=GDA"
    background: other reviewed human genes (Entrez) with a DisGeNET term
  # Biomolecular condensates (scripts/12_condensate_enrichment.py): CD-CODE's membership (export v2.2), kept for human
  # proteins (its protein table) in human condensates that are not synthetic (its condensate table); a member named by
  # a secondary accession counts as its current entry where the accession history names exactly one, and a member on
  # no reviewed entry is dropped. Every condensate of five or more members is tested against the reviewed proteome
  # (condensate_proteome) and against the proteins in any of these condensates (condensate); the release lists them by
  # fold enrichment, then by methylated members. The release keeps a condensate whose taxon is 9606 or whose species is
  # named Homo sapiens: in this export the name holds for every 9606 condensate and for two more (taxon 9607: RdRp
  # condensates, LANA body), so the name alone keeps the same ones; the protein table's taxon and name always agree.
  # The CD-CODE 2.3 confidence of each membership (0-5) is for the website's filter only.
  - id: condensate_proteome
    test: protein_sets
    title: Biomolecular condensates
    question: "Which biomolecular condensates are over-represented (CD-CODE)?"
    sub: "CD-CODE condensates with a higher fraction of methylated members than the reviewed proteome: every human condensate (not synthetic) with at least five members, its members against all reviewed human proteins (one-sided hypergeometric test). Condensate proteins are about twice as often methylated as proteins in general, so most condensates are enriched relative to the proteome, and few relative to other condensates"
    section: Protein classes and pathways
    sets:
      input: cdcode_membership
      set: condensate_id
      protein: uniprotkb_ac
      where:
        - {column: uniprotkb_ac, input: cdcode_proteins, key: uniprot_id, include: [{column: species_name, equals: Homo sapiens}]}
        - {column: condensate_id, input: cdcode_condensates, key: uid, include: [{column: species_name, equals: Homo sapiens}], exclude: [{column: condensate_type, equals: synthetic}]}
      history: {input: accession_history, from: key, to: accession, include: [{column: kind, equals: secondary}]}
    names: {input: cdcode_condensates, set: uid, name: name}
    universe: snapshot
    whole_universe: true
    min_size: 5
    order: [{by: fold_enrichment, descending: true}, {by: a, descending: true}]
    background: other reviewed human proteins
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", each PaxDb abundance decile a stratum"}
    scores: {input: cdcode_members, set: condensate_uid, protein: uniprot_accession, value: confidence_score, label: Membership confidence (CD-CODE),
             help: "CD-CODE's 0-5 confidence that the protein belongs to the condensate (CD-CODE 2.3)", levels: [2, 3, 4, 5], max: 5}
    filter: {label: CD-CODE condensate (methylated members), any: In any CD-CODE condensate, sets: all}   # every condensate with a methylated member, as the original
  - id: condensate
    test: protein_sets
    title: Biomolecular condensates, compared with other condensate proteins
    question: "Which biomolecular condensates stand out among condensate proteins (CD-CODE)?"
    sub: "CD-CODE condensates with a higher fraction of methylated members than all condensate proteins: every human condensate (not synthetic) with at least five members, its members against the proteins in any of these condensates, about half of which are methylated (one-sided hypergeometric test)"
    section: Protein classes and pathways
    sets:
      input: cdcode_membership
      set: condensate_id
      protein: uniprotkb_ac
      where:
        - {column: uniprotkb_ac, input: cdcode_proteins, key: uniprot_id, include: [{column: species_name, equals: Homo sapiens}]}
        - {column: condensate_id, input: cdcode_condensates, key: uid, include: [{column: species_name, equals: Homo sapiens}], exclude: [{column: condensate_type, equals: synthetic}]}
      history: {input: accession_history, from: key, to: accession, include: [{column: kind, equals: secondary}]}
    names: {input: cdcode_condensates, set: uid, name: name}
    universe: annotated            # the proteins in any of these condensates
    min_size: 5
    order: [{by: fold_enrichment, descending: true}, {by: a, descending: true}]
    background: other human proteins in CD-CODE condensates (export of 2026-03-18)
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", each PaxDb abundance decile a stratum"}
  # Roles in condensates: CD-CODE 2.3 gives each membership its roles (driver, client, regulator, member, or unknown; a
  # membership may have several). A protein is in a role's set when it has that role in any human condensate; each set is
  # tested against the other proteins of the human condensates. Not in the release
  - id: condensate_role
    test: protein_sets
    new: true
    title: Roles in condensates
    question: "Are methylated proteins more often drivers of condensates than clients or other members (CD-CODE)?"
    sub: "Proteins by their role in CD-CODE 2.3 condensates (human, not synthetic): driver, client, regulator, member or unknown, a protein in the role of every membership that lists it. Each role's proteins against the other proteins in these condensates (one-sided hypergeometric test). This export lists drivers, members and unknown roles only"
    section: Protein classes and pathways
    sets:
      input: cdcode_members
      protein: uniprot_accession
      exclusive: false
      where:
        - {column: condensate_uid, input: cdcode_condensates, key: uid, include: [{column: species_name, equals: Homo sapiens}], exclude: [{column: condensate_type, equals: synthetic}]}
      history: {input: accession_history, from: key, to: accession, include: [{column: kind, equals: secondary}]}
      rules:
        - {set: driver, when: [{column: roles, contains: driver}]}
        - {set: client, when: [{column: roles, contains: client}]}
        - {set: regulator, when: [{column: roles, contains: regulator}]}
        - {set: member, when: [{column: roles, contains: member}]}
        - {set: unknown, when: [{column: roles, contains: unknown}]}
    universe: annotated
    min_size: 5
    order: [{by: fold_enrichment, descending: true}]
    labels: {driver: Drivers, client: Clients, regulator: Regulators, member: Other members, unknown: Role unknown}
    help:
      driver: "Proteins that CD-CODE lists as a driver of at least one human condensate: the condensate depends on them to form"
      client: "Proteins that CD-CODE lists as a client of at least one human condensate: they are recruited but do not drive it"
      regulator: "Proteins that CD-CODE lists as a regulator of at least one human condensate"
      member: "Proteins that CD-CODE lists as a member of at least one human condensate, with no further role stated"
      unknown: "Proteins whose role CD-CODE does not state"
    background: other human proteins in CD-CODE 2.3 condensates (export of 2026-10-16)
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", each PaxDb abundance decile a stratum"}
  # Proteins that bind RNA or DNA (scripts/37_export_interaction_data.py): GO annotations, against every reviewed protein;
  # and the proteins each in-cell experiment found binding, each against the proteins that experiment measured where it
  # lists them (else every reviewed protein): one test per set, BH over the sets, again within PaxDb abundance deciles
  - id: go_binding
    test: protein_sets
    title: RNA and DNA binding (GO)
    question: "Are methylated proteins more often annotated to bind RNA or DNA?"
    sub: "Methylated proteins against every reviewed human protein, by Gene Ontology annotation to RNA binding (GO:0003723) or DNA binding (GO:0003677) or a term below them, any evidence or experimental evidence only (one-sided hypergeometric test)"
    section: Interactions and binding
    sets:
      each:
        - {set: rna_binding, name: RNA binding (GO), table: {input: go_binding, protein: uniprot_accession, include: [{column: binding, equals: rna}]}}
        - {set: rna_binding_experimental, name: "RNA binding (GO, experimental evidence)",
           table: {input: go_binding, protein: uniprot_accession, include: [{column: binding, equals: rna}, {column: evidence_code, in: &go_experimental [EXP, IDA, IPI, IMP, IGI, IEP, HTP, HDA, HMP, HGI, HEP]}]}}
        - {set: dna_binding, name: DNA binding (GO), table: {input: go_binding, protein: uniprot_accession, include: [{column: binding, equals: dna}]}}
        - {set: dna_binding_experimental, name: "DNA binding (GO, experimental evidence)",
           table: {input: go_binding, protein: uniprot_accession, include: [{column: binding, equals: dna}, {column: evidence_code, in: *go_experimental}]}}
    universe: snapshot
    whole_universe: true
    background: all reviewed human proteins
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", each PaxDb abundance decile a stratum"}
  - id: binding_protein
    test: protein_sets
    title: Proteins found binding RNA or DNA in cells
    question: "Are methylated proteins among the proteins found binding RNA or DNA in cells?"
    sub: "Methylated proteins among the proteins each in-cell experiment found binding RNA or DNA, against the other proteins the experiment measured where it lists them, else every reviewed human protein (one-sided hypergeometric test)"
    section: Interactions and binding
    order: as_listed
    sets:
      each:
        - {set: rna_xl, name: RNA-crosslinked residue (pepR-MS compendium), units: rna_crosslinks, background: other reviewed human proteins}
        - {set: rna_rbdmap, name: RNA-bound fragment (RBDmap), units: [rbdmap_measured_bound, rbdmap_fragments], universe_units: rbdmap_measured,
           background: other reviewed human proteins the experiment measured}
        - {set: rna_capri, name: Peptide next to an RNA crosslink (CAPRI), units: [capri_measured_adjacent, capri_adj], universe_units: capri_measured,
           background: other reviewed human proteins the experiment measured}
        - {set: rna_pclap, name: RNA-binding peptide (pCLAP), units: pclap_peptides, universe_units: [pclap_measured, pclap_peptides],
           background: other reviewed human proteins the experiment measured}
        - {set: rna_rbrid, name: RBR-ID+ residue (RBR-ID), units: rbrid_residues, universe_units: rbrid_quantified,
           background: other reviewed human proteins the experiment measured}
        - {set: dna_xl, name: DNA-crosslinked residue or peptide (Trendel 2025), units: [dna_crosslink_candidates, dna_crosslinked_peptides],
           background: other reviewed human proteins}
        - {set: dna_interactome, name: DNA interactome protein (Trendel 2025), table: {input: dna_interactome, protein: uniprot_accession},
           background: other reviewed human proteins}
    universe: snapshot
    whole_universe: true
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", each PaxDb abundance decile a stratum"}
  - id: reactome_top_level
    test: protein_sets
    title: Reactome pathways, top level
    question: "Which top-level Reactome pathways hold more methylated proteins than expected?"
    sub: "Methylated proteins against the other proteins with a Reactome pathway, by top-level pathway (one-sided hypergeometric test)"
    section: Protein classes and pathways
    sets: {input: reactome, set: pathway_id, protein: canonical_UniProtAC}
    names: {input: reactome_names, set: pathway_id, name: name, include: [{column: depth, equals: "0"}]}
    background: other reviewed human proteins with at least one Reactome 97 pathway
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", each PaxDb abundance decile a stratum"}
  - id: reactome_pathway
    test: protein_sets
    title: Reactome pathways
    question: "Which Reactome pathways, at any level, hold more methylated proteins than expected?"
    sub: "Methylated proteins against the other proteins with a Reactome pathway, every pathway of 10 to 500 proteins (one-sided hypergeometric test)"
    section: Protein classes and pathways
    sets: {input: reactome, set: pathway_id, protein: canonical_UniProtAC}
    names: {input: reactome_names, set: pathway_id, name: name}
    min_size: 10
    max_size: 500
    background: other reviewed human proteins with at least one Reactome 97 pathway
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", each PaxDb abundance decile a stratum"}
  - id: hpa_location
    test: protein_sets
    title: Where in the cell
    question: "Where in the cell are methylated proteins found more often than other proteins?"
    sub: "Methylated proteins against the other proteins with a Human Protein Atlas location scored Approved or better (one-sided hypergeometric test)"
    section: Where in the cell
    sets: {input: hpa, set: location, protein: canonical_UniProtAC, exclude: [{column: reliability, equals: Uncertain}]}
    whole_universe: true
    background: other proteins with an HPA 25.1 location (Approved or better)
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", each PaxDb abundance decile a stratum"}
  # Where in the cell, beyond the Human Protein Atlas (scripts/cell_maps.py): each map tested against the proteins it
  # places, compartment by compartment (compartments of at least 5 proteins), and again within PaxDb abundance deciles.
  # The regions of the cell: each map's compartments gathered into the nucleus, the cytoplasm and the organelles and
  # membranes (sites/data/methylarginine_cell_regions.yaml), in the three maps that place proteins all over the cell
  - id: cell_region_hpa
    test: protein_sets
    title: Regions of the cell (Human Protein Atlas)
    question: "Where do methylated proteins localize in the cell: the nucleus, the cytoplasm, or the organelles and membranes?"
    sub: "Methylated proteins against the other proteins with a Human Protein Atlas location (Approved or better), with locations grouped into three regions of the cell (cilia and sperm structures are in none) (one-sided hypergeometric test)"
    section: Where in the cell
    sets:
      input: hpa
      set: location
      protein: canonical_UniProtAC
      exclude: [{column: reliability, equals: Uncertain}]
      families: {rules: sites/data/methylarginine_cell_regions.yaml}
    whole_universe: true
    min_size: 5
    background: "other proteins with an HPA 25.1 location (Approved or better). A region is the Human Protein Atlas locations it holds (scripts/cell_maps.py, REGION_OF)"
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", each PaxDb abundance decile a stratum"}
  - id: cell_region_hcm
    test: protein_sets
    title: Regions of the cell (Human Cell Map)
    question: "Where do methylated proteins localize in the cell: the nucleus, the cytoplasm, or the organelles and membranes?"
    sub: "Methylated proteins against the other proteins the Human Cell Map localizes (HEK293 BioID, NMF compartments), its compartments gathered into three regions of the cell (one-sided hypergeometric test)"
    section: Where in the cell
    sets:
      input: hcm
      set: nmf_compartment
      protein: canonical_UniProtAC
      families: {rules: sites/data/methylarginine_cell_regions.yaml}
    whole_universe: true
    min_size: 5
    background: "the other proteins the Human Cell Map localises (HEK293 BioID, NMF compartments). A region is the Human Cell Map compartments it holds (scripts/cell_maps.py, REGION_OF)"
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", each PaxDb abundance decile a stratum"}
  - id: cell_region_organelle_ip
    test: protein_sets
    title: Regions of the cell (organelle IP)
    question: "Where do methylated proteins localize in the cell: the nucleus, the cytoplasm, or the organelles and membranes?"
    sub: "Methylated proteins against the other proteins classified by organelle IP (HEK293T), its clusters gathered into three regions of the cell (one-sided hypergeometric test)"
    section: Where in the cell
    sets:
      input: organelle_ip
      set: compartment
      protein: canonical_UniProtAC
      exclude: [{column: compartment, equals: unclassified}]
      families: {rules: sites/data/methylarginine_cell_regions.yaml}
    whole_universe: true
    min_size: 5
    background: "the other proteins organelle IP classifies (HEK293T). A region is the Organelle IP it holds (scripts/cell_maps.py, REGION_OF)"
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", each PaxDb abundance decile a stratum"}
  - id: cell_hcm_compartment
    test: protein_sets
    title: Human Cell Map compartments
    question: "Where do methylated proteins localize in the cell, by the Human Cell Map's compartments?"
    sub: "Methylated proteins against the other proteins the Human Cell Map localizes (HEK293 BioID from 192 baits; Go et al. 2021), by NMF compartment (one-sided hypergeometric test)"
    section: Where in the cell
    sets: {input: hcm, set: nmf_compartment, protein: canonical_UniProtAC}
    whole_universe: true
    min_size: 5
    background: the other proteins the Human Cell Map localises (HEK293 BioID, NMF compartments)
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", each PaxDb abundance decile a stratum"}
  - id: cell_hcm_domain
    test: protein_sets
    title: Human Cell Map domains
    question: "Where do methylated proteins localize in the cell, by the Human Cell Map's finer domains?"
    sub: "Methylated proteins against the other proteins the Human Cell Map places in a SAFE domain (HEK293 BioID; Go et al. 2021), domain by domain (one-sided hypergeometric test)"
    section: Where in the cell
    sets: {input: hcm, set: safe_domain, protein: canonical_UniProtAC, exclude: [{column: safe_domain, equals: ""}]}
    whole_universe: true
    min_size: 5
    background: the other proteins the Human Cell Map places in a SAFE domain
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", each PaxDb abundance decile a stratum"}
  - id: cell_organelle_ip
    test: protein_sets
    title: Organelle IP
    question: "Which organelles are methylated proteins enriched in, by organelle immunoprecipitation?"
    sub: "Methylated proteins against the other proteins classified by organelle IP (HEK293T; Hein et al. 2025), cluster by cluster (one-sided hypergeometric test)"
    section: Where in the cell
    sets: {input: organelle_ip, set: compartment, protein: canonical_UniProtAC, exclude: [{column: compartment, equals: unclassified}]}
    whole_universe: true
    min_size: 5
    background: the other proteins organelle IP classifies (HEK293T)
    labels: {nucleus: Nucleus, nucleolus: Nucleolus, cytosol: Cytosol, translation: Translation, stress_granule: Stress granules (cell map),
             p-body: P-body, actin_cytoskeleton: Actin cytoskeleton, centrosome: Centrosome, proteasome: Proteasome,
             14-3-3_scaffold: 14-3-3 scaffold, ER: ER, ERGIC: ERGIC, Golgi: Golgi, trans-Golgi: Trans-Golgi,
             early_endosome: Early endosome, recycling_endosome: Recycling endosome, lysosome: Lysosome,
             mitochondrion: Mitochondrion, peroxisome: Peroxisome, plasma_membrane: Plasma membrane}
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", each PaxDb abundance decile a stratum"}
  - id: cell_chromatin
    test: protein_sets
    title: Chromatin probability
    question: "Are methylated proteins on chromatin more often than other proteins?"
    sub: "Methylated proteins against the other proteins with an interphase chromatin probability (chromatin enrichment for proteomics; Kustatscher et al. 2014), in four bins (one-sided hypergeometric test)"
    section: Where in the cell
    sets:
      input: chromatin
      protein: canonical_UniProtAC
      rules:                       # each protein in the first bin it reaches (scripts/cell_maps.py, CHEP_BINS)
        - {set: "ICP >= 0.8 (chromatin)", when: [{column: interphase_chromatin_probability, at_least: 0.8}]}
        - {set: "ICP 0.5-0.8", when: [{column: interphase_chromatin_probability, at_least: 0.5}]}
        - {set: "ICP 0.2-0.5", when: [{column: interphase_chromatin_probability, at_least: 0.2}]}
        - {set: "ICP < 0.2 (not chromatin)"}
    whole_universe: true
    min_size: 5
    background: the other proteins with an interphase chromatin probability
    labels: {"ICP >= 0.8 (chromatin)": "Chromatin (probability ≥ 0.8)", "ICP 0.5-0.8": "Chromatin probability 0.5–0.8", "ICP 0.2-0.5": "Chromatin probability 0.2–0.5",
             "ICP < 0.2 (not chromatin)": "Not chromatin (probability < 0.2)"}
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", each PaxDb abundance decile a stratum"}
  # Where the RNAs bound by proteins with eCLIP data gather (scripts/cell_maps.py, GENE_MAPS): the release's calls per
  # protein and map (supporting/eclip_rna_compartments). The nuclear-body map (Barutcu et al. 2022) stays out
  - id: eclip_rna_apexseq
    test: protein_sets
    title: Bound RNAs by APEX-seq
    question: "Where do the RNAs that methylated proteins bind gather in the cell, by APEX-seq?"
    sub: "Proteins with eCLIP data whose bound RNAs localize to an APEX-seq compartment (HEK293T; Fazal et al. 2019), methylated against the others (one-sided hypergeometric test)"
    section: Where in the cell
    sets: {input: eclip_maps, set: compartment, protein: uniprot_accession, include: [{column: map, equals: apexseq}],
           member_when: [{column: gathers, equals: "true"}]}
    whole_universe: true
    min_size: 5
    background: "the other proteins with eCLIP data that APEX-seq tests (at least 20 bound RNAs placed). A set is the proteins whose bound RNAs gather in the compartment"
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", each PaxDb abundance decile a stratum"}
    sizes: {value: odds_ratio, log2: true, background: "the log2 odds ratio of the bound RNAs of each other protein APEX-seq tests gathering in the compartment, called or not (supporting/eclip_rna_compartments). a and c count the proteins compared"}
  - id: eclip_gene_tsaseq
    test: protein_sets
    title: Genes of bound RNAs by TSA-seq
    question: "Are the RNAs that methylated proteins bind transcribed from genes near nuclear speckles?"
    sub: "Proteins with eCLIP data whose bound RNAs are transcribed from genes near nuclear speckles by TSA-seq (K562; Chen et al. 2018). TSA-seq measures the position of the genes in the nucleus, not of the RNAs, methylated against the others (one-sided hypergeometric test)"
    section: Where in the cell
    sets: {input: eclip_maps, set: compartment, protein: uniprot_accession, include: [{column: map, equals: tsaseq}],
           member_when: [{column: gathers, equals: "true"}]}
    whole_universe: true
    min_size: 5
    background: "the other proteins with eCLIP data that TSA-seq tests (at least 20 bound RNAs placed). A set is the proteins whose bound RNAs gather in the compartment"
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", each PaxDb abundance decile a stratum"}
    sizes: {value: odds_ratio, log2: true, background: "the log2 odds ratio of the bound RNAs of each other protein TSA-seq tests gathering in the compartment, called or not (supporting/eclip_rna_compartments). a and c count the proteins compared"}
  - id: eclip_gene_hic
    test: protein_sets
    title: Genes of bound RNAs by Hi-C subcompartment
    question: "Are the RNAs that methylated proteins bind transcribed from genes in one Hi-C subcompartment?"
    sub: "Proteins with eCLIP data whose bound RNAs are transcribed from genes of a Hi-C subcompartment (GM12878; Rao et al. 2014). Hi-C measures contacts between genomic regions, not the position of the RNAs, methylated against the others (one-sided hypergeometric test)"
    section: Where in the cell
    sets: {input: eclip_maps, set: compartment, protein: uniprot_accession, include: [{column: map, equals: hic}],
           member_when: [{column: gathers, equals: "true"}]}
    whole_universe: true
    min_size: 5
    background: "the other proteins with eCLIP data that Hi-C subcompartments tests (at least 20 bound RNAs placed). A set is the proteins whose bound RNAs gather in the compartment"
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", each PaxDb abundance decile a stratum"}
    sizes: {value: odds_ratio, log2: true, background: "the log2 odds ratio of the bound RNAs of each other protein Hi-C subcompartments tests gathering in the compartment, called or not (supporting/eclip_rna_compartments). a and c count the proteins compared"}
  # Cancer cell lines (scripts/release_layers.py, CANCER): cancer cell genetics beside the sites, not evidence about
  # methylation. The dependency classes partition the entries whose gene DepMap 24Q4 screened (gene_effect)
  - id: depmap_dependency
    test: protein_sets
    title: Cancer cell dependency
    question: "Do cancer cell lines depend on these proteins more than on others? (DepMap CRISPR screens)"
    sub: "DepMap Public 24Q4 dependency classes, methylated proteins vs all screened reviewed proteins (one per gene); the dependency of 1,178 cancer cell lines on them in CRISPR knockout screens. Cancer genetics, not evidence about methylation (one-sided hypergeometric test)"
    section: Disease and cancer
    sets:
      input: depmap_genes
      protein: canonical_UniProtAC
      rules:                       # the share of the screened lines whose dependency probability is at least 0.5
        - {set: common_essential, when: [{column: common_essential, equals: "True"}]}
        - {set: most_lines, when: [{ratio: [dependent_lines, lines_with_probability], at_least: 0.5}]}
        - {set: some_lines, when: [{ratio: [dependent_lines, lines_with_probability], at_least: 0.05}]}
        - {set: few_or_none}
    whole_universe: true
    order: [{categories: [common_essential, most_lines, some_lines, few_or_none]}]
    background: other reviewed human proteins whose gene DepMap 24Q4 screened (CRISPR, Chronos)
    labels: {common_essential: Commonly essential, most_lines: "Most lines (≥ 50%)", some_lines: "Some lines (5–50%)", few_or_none: "Few or none (< 5%)"}
    help:
      common_essential: "DepMap 24Q4 calls the gene commonly essential (CRISPRInferredCommonEssentials: it ranks among the strongest dependencies of at least 90% of lines)"
      most_lines: "not commonly essential, and at least 50% of the screened lines depend on it"
      some_lines: "not commonly essential, and 5% to under 50% of the lines depend on it (selective dependencies)"
      few_or_none: "fewer than 5% of the lines depend on it"
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", each PaxDb abundance decile a stratum"}
    values:                        # each screened protein's numbers, for the website (website.set_views); no test reads them
      columns:
        - {name: median, label: median gene effect, background: true}
        - {name: dependent_lines, label: lines that depend on it}
        - {name: lines_with_probability, label: lines screened}
  # Changes at methylarginines in tumors and cell lines: a missense or stop change in at least one TCGA tumor (MC3) or
  # DepMap cell line, against the other arginines of the methylated proteins whose gene DepMap screened; every mark of
  # those proteins counts, one on a protein with no other arginine too (it adds nothing within proteins)
  - id: cancer_change
    layer: residue_lists
    with:
      flags: {tcga_tumours: tcga_changes, depmap_cell_lines: depmap_changes}
      noun: changed arginine
      title: Changes in tumors and cell lines
      question: "Is a methylated arginine changed in tumors or cancer cell lines more or less often than the other arginines of its protein?"
      sub: "Methylarginines against the other arginines of the methylated proteins whose gene DepMap screened (so its tumor count is smaller than the sites with a change in the Filter, which covers every methylated protein): a missense or stop change in at least one TCGA tumor (MC3) or DepMap 24Q4 cell line. Not adjusted for codon: arginine codons with a CpG (CGN) mutate most in cancers, and the codons of methylated and other arginines may differ"
      section: Disease and cancer
      labels: {tcga_tumours: Mutated in a TCGA tumor, depmap_cell_lines: Mutated in a DepMap cell line}
      help:
        tcga_tumours: "A missense or stop change of the arginine in at least one TCGA tumor (MC3 public calls from the GDC, 33 projects; FILTER PASS, and in OV and LAML also wga alone)"
        depmap_cell_lines: "A missense or stop change of the arginine in at least one DepMap 24Q4 cell line (OmicsSomaticMutations, on the canonical UniProt isoform)"
    proteins: {input: depmap_genes, column: canonical_UniProtAC, label: " whose gene DepMap screened"}
    marks_alone: count
    order: [{categories: [tcga_tumours, depmap_cell_lines]}]
  - {id: motif, layer: motif}
  - {id: disorder, layer: disorder}
  - {id: domain_context, layer: domain_context}
  - {id: domain_class, layer: domain_class, with: {classes: sites/data/domain_classes.json}}
  - {id: structure_context, layer: structure_context}
  - {id: idr_charge, layer: idr_charge, new: true}   # not in the release: CIDER's charge classes of IDRs
  # Stickers: aromatic residues pair with arginine (cation-pi), and methylation weakens those contacts (Hofweber 2018, Qamar
  # 2018; Wang 2018 for the aromatic and arginine stickers of FUS-like proteins). Not in the release: how many aromatic
  # residues lie within 3 or 5 residues of each arginine, in the whole protein and in IDRs alone. The sticker set is the
  # profile's (stickers), or with: residues
  - id: sticker_context_3
    family: Next to aromatic residues
    layer: neighbours
    with: {window: 3, noun: aromatic residue}
    new: true
    title: Next to aromatic residues (within 3)
    question: "Are methylarginines more often next to aromatic residues than the other arginines of their protein?"
    sub: "Methylarginines against the other arginines of the same proteins, by how many aromatic residues (Tyr, Phe, Trp) are within 3 residues on either side. Aromatic residues pair with arginine in condensates (cation–π), and methylation weakens that contact"
    section: Position in the protein
  - id: sticker_context_5
    family: Next to aromatic residues
    layer: neighbours
    with: {window: 5, noun: aromatic residue}
    new: true
    title: Next to aromatic residues (within 5)
    question: "Are methylarginines more often next to aromatic residues than the other arginines of their protein?"
    sub: "Methylarginines against the other arginines of the same proteins, by how many aromatic residues (Tyr, Phe, Trp) are within 5 residues on either side"
    section: Position in the protein
  - id: sticker_context_3_idr
    family: Next to aromatic residues
    layer: neighbours
    with: {window: 3, noun: aromatic residue}
    only_in: idr
    new: true
    title: Next to aromatic residues, in IDRs (within 3)
    question: "Inside disordered regions, are methylarginines more often next to aromatic residues than the other arginines there?"
    sub: "Only arginines inside IDRs of 20 or more residues: methylarginines against the other arginines of the same proteins in IDRs, by how many aromatic residues are within 3 residues on either side"
    section: Position in the protein
  - id: sticker_context_5_idr
    family: Next to aromatic residues
    layer: neighbours
    with: {window: 5, noun: aromatic residue}
    only_in: idr
    new: true
    title: Next to aromatic residues, in IDRs (within 5)
    question: "Inside disordered regions, are methylarginines more often next to aromatic residues than the other arginines there?"
    sub: "Only arginines inside IDRs of 20 or more residues: methylarginines against the other arginines of the same proteins in IDRs, by how many aromatic residues are within 5 residues on either side"
    section: Position in the protein
  # Near other marks: are methylarginines more often within 10 residues of another modification than the other
  # arginines of their proteins? Context marks (context_marks above), not part of the release's analyses
  - id: near_phospho
    layer: near_marks
    with: {marks: phospho, window: 10, noun: phosphosite}
    new: true
    title: Near phosphosites (±10 residues)
    question: "Are methylarginines more often near a phosphosite than the other arginines of their protein?"
    sub: "Methylarginines against the other arginines of the same proteins, by whether a phosphosite (UniProt, iPTMnet and Ochoa 2020, by-similarity records left out) is within 10 residues on either side. Phosphosites are heavily studied, so a protein with many methylarginines is also likely to have more recorded phosphosites; the comparison within each protein limits that, not removes it"
    section: Other modifications
  - id: near_phospho_high
    layer: near_marks
    with: {marks: phospho_high, window: 10, noun: high-score phosphosite}
    new: true
    title: Near high-score phosphosites (±10 residues)
    question: "Are methylarginines more often near a high-score phosphosite than the other arginines of their protein?"
    sub: "Methylarginines against the other arginines of the same proteins, by whether a phosphosite with an Ochoa et al. 2020 functional score of 0.5 or more (about 10,900 sites; the score is a model of how likely a site is functionally important) is within 10 residues on either side. Sites without a score are not counted as high-score. The comparison within each protein limits the effect of heavily studied proteins, not removes it"
    section: Other modifications
  - id: near_methyllysine
    layer: near_marks
    with: {marks: methyllysine, window: 10, noun: methyllysine}
    new: true
    title: Near methyllysines (±10 residues)
    question: "Are methylarginines more often near a methyllysine than the other arginines of their protein?"
    sub: "Methylarginines against the other arginines of the same proteins, by whether a methyllysine (UniProt, iPTMnet, CPLM and Berryhill 2023, by-similarity records left out) is within 10 residues on either side. Few proteins carry a recorded methyllysine"
    section: Other modifications
  - id: near_acetylation
    layer: near_marks
    with: {marks: acetylation, window: 10, noun: "acetylation site", labels: {near: "An acetylation site within ±10", none: "No acetylation site within ±10"}}
    new: true
    title: Near acetylation sites (±10 residues)
    question: "Are methylarginines more often near an acetylation site than the other arginines of their protein?"
    sub: "Methylarginines against the other arginines of the same proteins, by whether an acetylation site (CPLM 4.0, UniProt and iPTMnet, by-similarity records left out) is within 10 residues on either side. Acetylation is among the most studied lysine modifications and heavily studied proteins carry many records of every kind, so the comparison within each protein limits that effect, not removes it"
    section: Other modifications
  - id: near_other_acylation
    layer: near_marks
    with: {marks: other_acylation, window: 10, noun: "other acylation site", labels: {near: "Another lysine acylation within ±10", none: "No other acylation site within ±10"}}
    new: true
    title: Near other acylation sites (±10 residues)
    question: "Are methylarginines more often near another lysine acylation than the other arginines of their protein?"
    sub: "Methylarginines against the other arginines of the same proteins, by whether a lysine acylation other than acetylation (CPLM 4.0, UniProt and iPTMnet, by-similarity records left out; 15 acyl types) is within 10 residues on either side. These modifications (crotonyl, 2-hydroxyisobutyryl, succinyl, malonyl, beta-hydroxybutyryl and others) come from far fewer studies than acetylation; the comparison within each protein limits the effect of heavily studied proteins, not removes it"
    section: Other modifications
  - id: near_ubiquitination
    layer: near_marks
    with: {marks: ubiquitination, window: 10, noun: "ubiquitination site", labels: {near: "A ubiquitination site within ±10", none: "No ubiquitination site within ±10"}}
    new: true
    title: Near ubiquitination sites (±10 residues)
    question: "Are methylarginines more often near a ubiquitination site than the other arginines of their protein?"
    sub: "Methylarginines against the other arginines of the same proteins, by whether a ubiquitination site (CPLM 4.0, Akimov et al. 2018, UniProt and iPTMnet; by-similarity records left out) is within 10 residues on either side"
    section: Other modifications
  - id: near_sumoylation
    layer: near_marks
    with: {marks: sumoylation, window: 10, noun: "SUMOylation site", labels: {near: "A SUMOylation site within ±10", none: "No SUMOylation site within ±10"}}
    new: true
    title: Near SUMOylation sites (±10 residues)
    question: "Are methylarginines more often near a SUMOylation site than the other arginines of their protein?"
    sub: "Methylarginines against the other arginines of the same proteins, by whether a SUMOylation site (CPLM 4.0, Hendriks et al. 2017, UniProt and iPTMnet; by-similarity records left out) is within 10 residues on either side"
    section: Other modifications
  # Taking all factors together: one conditional logistic regression, a stratum per protein (the multi-factor
  # Mantel-Haenszel; Breslow & Day 1980), the whole dataset (a selection is not refitted in the browser)
  - id: which_factor
    test: conditional_logit
    new: true
    title: Which factor matters most?
    question: "Taking all factors together, which ones distinguish a methylarginine from the other arginines of its protein?"
    sub: "One model: each methylarginine against the other arginines of its protein, all five factors at once. Each odds ratio is the factor's effect with the others held fixed; 'on its own' is the same factor in a model by itself"
    section: Position in the protein
    covariates:
      - {name: in_idr, label: In a disordered region, help: "Inside an IDR of 20 or more residues", layer: idr, is: [idr]}
      - {name: aromatic_within_5, label: Aromatic residue within 5, help: "At least one Tyr, Phe or Trp within 5 residues on either side", layer: neighbours, with: {window: 5, noun: aromatic residue}, is: [one, two_plus]}
      - {name: rg_motif, label: In an RG or RGG motif, help: "Gly right after the arginine (RG), alone or as RGG", layer: motif, flags: [RG, RGG]}
      - {name: net_charge, label: "Local net charge (per +1)", help: "Lys and Arg minus Asp and Glu within 7 residues on either side, the arginine itself left out; the odds ratio is for each extra +1", window_sum: {window: 7, weights: {K: 1, R: 1, D: -1, E: -1}}}
      - {name: domain_distal, label: Far from any domain, help: "More than 20 residues from a domain, and not between two domains", layer: domain_context, is: [distal]}
  # Interactions and binding (scripts/37_export_interaction_data.py): each a question of yes-or-no tests, each against
  # the arginines its evidence could have reached (the measured background): the proteins with that evidence, the
  # residues a structure observed or an experiment measured. Every candidate counts in the pooled test, and the
  # within-protein row reports those counts (counting: every_candidate), as the release counts them.
  - id: pdb_interface
    title: PDB interfaces
    question: "Are methylarginines at interfaces in experimental structures?"
    sub: "Methylarginines against the other arginines of the same proteins observed in a PDB structure, at a PDBe-KB interface with RNA, DNA, a protein or any partner; all, ordered (outside UniProt disordered regions) and in domains"
    section: Interactions and binding
    counting: every_candidate
    candidates_from: marks_and_left_out    # the proteins of left-out sites count too, as the release counts them
    background: other arginines of the same proteins observed in a PDB structure
    proteins_with: pdb_interfaces                       # proteins PDBe-KB lists with an interface
    covered_by: pdb_observed                            # residues a PDB chain models (SIFTS)
    tests:
      - {category: rna, inside: {role: pdb_interfaces, where: [{column: class, equals: RNA}]}, label: RNA interface}
      - {category: dna, inside: {role: pdb_interfaces, where: [{column: class, equals: DNA}]}, label: DNA interface}
      - {category: protein, inside: {role: pdb_interfaces, where: [{column: class, matches: "([OPQ][0-9][A-Z0-9]{3}[0-9]|[A-NR-Z][0-9]([A-Z][A-Z0-9]{2}[0-9]){1,2})(-[0-9]+)?"}]}, label: Protein interface}
      - {category: any, inside: {role: pdb_interfaces, where: [{column: class, matches: "RNA|DNA|([OPQ][0-9][A-Z0-9]{3}[0-9]|[A-NR-Z][0-9]([A-Z][A-Z0-9]{2}[0-9]){1,2})(-[0-9]+)?"}]}, label: Any interface}
    strata:
      - {stratum: all}
      - {stratum: ordered, outside_of: uniprot_disorder}
      - {stratum: domain, covered_by: uniprot_domains}
  - id: predicted_interface
    title: Predicted interfaces
    question: "Are methylarginines at predicted protein interfaces?"
    sub: "Methylarginines against the other arginines of the same proteins, at a ProtVar AlphaFold-Multimer interface residue of a heterodimer with pDockQ at or above 0.23 or 0.5; all, ordered and disordered (UniProt). Predicted interfaces lie mostly in ordered regions, so the row of all residues partly restates disorder; the ordered and disordered rows compare like with like"
    section: Interactions and binding
    counting: every_candidate
    candidates_from: marks_and_left_out    # the proteins of left-out sites count too, as the release counts them
    background: other arginines of the same proteins
    tests:
      - {category: pdockq_0.23, inside: {role: predicted_interfaces, where: [{column: class, at_least: 0.23}]},
         proteins_with: {role: predicted_interfaces, where: [{column: class, at_least: 0.23}], on_candidates: true}, label: "pDockQ ≥ 0.23"}
      - {category: pdockq_0.5, inside: {role: predicted_interfaces, where: [{column: class, at_least: 0.5}]},
         proteins_with: {role: predicted_interfaces, where: [{column: class, at_least: 0.5}], on_candidates: true}, label: "pDockQ ≥ 0.5"}
    strata:
      - {stratum: all}
      - {stratum: ordered, outside_of: uniprot_disorder}
      - {stratum: disordered, covered_by: uniprot_disorder}
  - id: crosslink
    title: RNA and DNA crosslinks in cells
    question: "Are methylarginines where RNA or DNA crosslinks to proteins in cells?"
    sub: "Methylarginines against the other arginines of the proteins with each kind of evidence: crosslinked residues, RNA-bound fragments and peptides, RBR-ID residues and regions, DNA crosslinks and DNA-binding regions"
    section: Interactions and binding
    counting: every_candidate
    candidates_from: marks_and_left_out    # the proteins of left-out sites count too, as the release counts them
    background: other arginines of the same proteins (proteins with that evidence)
    tests:
      - {category: rna_crosslink, inside: rna_crosslinks, proteins_with: rna_crosslinks, label: RNA-crosslinked residue}
      - {category: rna_crosslink_single_residue, inside: rna_crosslinks_single, proteins_with: rna_crosslinks_single, label: "RNA crosslink, one residue"}
      - {category: rna_crosslink_within_3, inside: rna_crosslinks, within: 3, proteins_with: rna_crosslinks, label: "≤3 aa from an RNA crosslink"}
      - {category: rbdmap_fragment, inside: rbdmap_fragments, proteins_with: rbdmap_fragments, label: RNA-bound fragment (RBDmap)}
      - {category: dna_crosslink, inside: dna_crosslinks, proteins_with: dna_crosslinks, label: DNA-crosslinked residue}
      - {category: dna_crosslink_or_candidate, inside: dna_crosslink_candidates, proteins_with: dna_crosslink_candidates, label: DNA crosslink or candidate}
      - {category: dna_crosslinked_peptide, inside: dna_crosslinked_peptides, proteins_with: dna_crosslinked_peptides, label: DNA-crosslinked peptide}
      - {category: dna_binding_region, inside: uniprot_dna_binding, proteins_with: uniprot_dna_binding, label: DNA-binding region (UniProt)}
      - {category: rna_crosslink_outside_rg, inside: rna_crosslinks, proteins_with: rna_crosslinks, unless: &rg {any: [{at: 1, in: G}, {at: -1, in: G}]}, label: "RNA crosslink, outside RG/GR"}
      - {category: rbdmap_fragment_outside_rg, inside: rbdmap_fragments, proteins_with: rbdmap_fragments, unless: *rg, label: "RBDmap fragment, outside RG/GR"}
      - {category: capri_xl_peptide, inside: capri_xl, proteins_with: capri_xl, label: CAPRI XL-peptide}
      - {category: capri_adj_peptide, inside: capri_adj, proteins_with: capri_adj, label: CAPRI adjacent peptide}
      - {category: capri_xl_peptide_outside_rg, inside: capri_xl, proteins_with: capri_xl, unless: *rg, label: "CAPRI XL-peptide, outside RG/GR"}
      - {category: capri_adj_peptide_outside_rg, inside: capri_adj, proteins_with: capri_adj, unless: *rg, label: "CAPRI adjacent peptide, outside RG/GR"}
      - {category: pclap_lysc_region, inside: pclap_lysc_regions, proteins_with: pclap_lysc_regions, label: pCLAP RNA-binding region}
      - {category: pclap_lysc_region_outside_rg, inside: pclap_lysc_regions, proteins_with: pclap_lysc_regions, unless: *rg, label: "pCLAP region, outside RG/GR"}
      - {category: pclap_peptide, inside: pclap_peptides, proteins_with: pclap_peptides, label: pCLAP RNA-binding peptide}
      - {category: rbrid_residue, inside: rbrid_residues, proteins_with: rbrid_residues, label: RBR-ID+ residue}
      - {category: rbrid_residue_outside_rg, inside: rbrid_residues, proteins_with: rbrid_residues, unless: *rg, label: "RBR-ID+ residue, outside RG/GR"}
      - {category: rbrid_residue_published_rule, inside: rbrid_residues_published_rule, proteins_with: rbrid_residues_published_rule, label: "RBR-ID+ residue, published rule"}
      - {category: rbrid_region, inside: rbrid_regions, proteins_with: rbrid_regions, label: RBR-ID region}
      - {category: pclap_peptide_among_measured, inside: pclap_peptides, proteins_with: pclap_peptides, covered_by: pclap_measured, label: "pCLAP peptide, among measured"}
      - {category: capri_adj_peptide_among_measured, inside: capri_measured_adjacent, proteins_with: capri_measured_adjacent, covered_by: capri_measured, label: "CAPRI adjacent peptide, among measured"}
      - {category: rbdmap_peptide_among_measured, inside: rbdmap_measured_bound, proteins_with: rbdmap_measured_bound, covered_by: rbdmap_measured, label: "RBDmap peptide, among measured"}
      - {category: rbrid_residue_among_measured, inside: rbrid_residues, proteins_with: rbrid_residues, covered_by: rbrid_quantified, label: "RBR-ID+ residue, among measured"}
  - id: sequence_proximity
    title: Distance along the chain to RNA evidence
    question: "Are methylarginines near RNA-crosslinked residues along the sequence?"
    sub: "Methylarginines against the other arginines of the proteins with each kind of RNA evidence, within 0, 3, 5, 10 or 20 residues of it along the sequence"
    section: Interactions and binding
    counting: every_candidate
    candidates_from: marks_and_left_out    # the proteins of left-out sites count too, as the release counts them
    background: other arginines of the same proteins (proteins with that evidence)
    tests:
      - {category: rna_crosslink, inside: rna_crosslinks, proteins_with: rna_crosslinks, label: RNA-crosslinked residue}
      - {category: rbdmap_fragment, inside: rbdmap_fragments, proteins_with: rbdmap_fragments, label: RBDmap fragment}
      - {category: capri_adj_peptide, inside: capri_adj, proteins_with: capri_adj, label: CAPRI adjacent peptide}
      - {category: capri_xl_peptide, inside: capri_xl, proteins_with: capri_xl, label: CAPRI XL-peptide}
      - {category: pclap_peptide, inside: pclap_peptides, proteins_with: pclap_peptides, label: pCLAP peptide}
      - {category: rbrid_residue, inside: rbrid_residues, proteins_with: rbrid_residues, label: RBR-ID+ residue}
    strata:
      - {stratum: within_0_residues, within: 0}
      - {stratum: within_3_residues, within: 3}
      - {stratum: within_5_residues, within: 5}
      - {stratum: within_10_residues, within: 10}
      - {stratum: within_20_residues, within: 20}
  - id: nucleic_acid_distance
    title: Distance to RNA and DNA in structures
    question: "Are methylarginines closer to RNA or DNA in solved structures?"
    sub: "Methylarginines against the other arginines of the same proteins modeled in a PDB entry with RNA, DNA or either, whose side chain comes within 4 or 8 Å of it"
    section: Interactions and binding
    counting: every_candidate
    candidates_from: marks_and_left_out    # the proteins of left-out sites count too, as the release counts them
    tests:
      - {category: any_within_4a, inside: {role: na_any, where: [{column: class, at_most: 4}]}, covered_by: na_any, label: "RNA or DNA within 4 Å",
         background: other arginines of the same proteins modelled in a PDB entry with RNA or DNA}
      - {category: any_within_8a, inside: {role: na_any, where: [{column: class, at_most: 8}]}, covered_by: na_any, label: "RNA or DNA within 8 Å",
         background: other arginines of the same proteins modelled in a PDB entry with RNA or DNA}
      - {category: dna_within_4a, inside: {role: na_dna, where: [{column: class, at_most: 4}]}, covered_by: na_dna, label: "DNA within 4 Å",
         background: other arginines of the same proteins modelled in a PDB entry with DNA}
      - {category: dna_within_8a, inside: {role: na_dna, where: [{column: class, at_most: 8}]}, covered_by: na_dna, label: "DNA within 8 Å",
         background: other arginines of the same proteins modelled in a PDB entry with DNA}
      - {category: rna_within_4a, inside: {role: na_rna, where: [{column: class, at_most: 4}]}, covered_by: na_rna, label: "RNA within 4 Å",
         background: other arginines of the same proteins modelled in a PDB entry with RNA}
      - {category: rna_within_8a, inside: {role: na_rna, where: [{column: class, at_most: 8}]}, covered_by: na_rna, label: "RNA within 8 Å",
         background: other arginines of the same proteins modelled in a PDB entry with RNA}
  - id: intact
    title: IntAct mutations and binding regions
    question: "Are methylarginines where IntAct maps interactions?"
    sub: "Methylarginines whose mutation changes an interaction, against the other mutated arginines; and inside an IntAct binding region of at most 20 residues, against the other arginines of the proteins with one (all, and in UniProt disordered regions)"
    section: Interactions and binding
    counting: every_candidate
    candidates_from: marks_and_left_out    # the proteins of left-out sites count too, as the release counts them
    tests:
      - {category: mutation_changes_interaction, inside: {role: intact_mutations, where: [{column: class, matches: "(?!MI:2226$).*"}]},
         covered_by: intact_mutations, background: other arginines of the same proteins with an IntAct mutation, label: Mutation changes an interaction}
      - {category: binding_region, inside: intact_binding_regions, proteins_with: intact_binding_regions,
         background: other arginines of the same proteins with an IntAct binding region, label: IntAct binding region}
      - {category: binding_region_disordered, inside: intact_binding_regions, proteins_with: intact_binding_regions, covered_by: uniprot_disorder,
         background: other arginines of the same proteins with an IntAct binding region, label: "Binding region, disordered residues"}

# Controls (CONTRACTS.md, Controls): questions repeated with one change each, shown on each question's page beside its
# result. None changes a row of the release's questions.
controls:
  # High-confidence sites: reported by at least two independent studies. Compilations and databases are not independent
  # evidence and count for nothing: PhosphoSitePlus (it also holds Cell Signaling Technology's own discovery runs),
  # UniProt (curated literature), IEDB (HLA-presented epitopes from other studies) and ProMetheusDB (a compilation of the
  # Bonaldi laboratory's SILAC and heavy-methyl SILAC runs). Studies of one laboratory count once: Larsen 2016 and
  # Sylvestersen 2014 (Nielsen laboratory, HEK293 cells); Lu 2024 and Lu 2025 (one laboratory, HeLa cells; STUDIES.md);
  # Musiani 2019 and Fong 2019 (Musiani, Massignani and Bonaldi are authors of both). Guo 2014 (Cell Signaling
  # Technology), Fedoriw 2019 (GSK) and Lim 2020 (an academic group) share Cell Signaling Technology's antibodies, not a
  # laboratory or samples, and count as three studies.
  - id: hc
    label: high-confidence sites
    note: "Only the sites at least two independent studies report (a laboratory's studies counted once; PhosphoSitePlus, UniProt, IEDB and ProMetheusDB not counted); the other sites are counted on neither side"
    analyses: [motif, disorder, idr_charge, sticker_context_3, sticker_context_3_idr]
    marks_where:
      column: studies
      distinct_at_least: 2
      not_counted: [PSP, UniProt, IEDB, ProMetheusDB]
      groups:
        Nielsen laboratory: [Larsen2016, Sylvestersen2014]
        Lu laboratory: [Lu2024, Lu2025]
        Bonaldi laboratory: [Musiani2019, Fong2019]
    marks_outside: left_out
  # Sites found without a methylarginine antibody: the antibodies were raised against RG and RGG peptides, so a motif
  # result could be the antibody's own preference. Lu 2025 enriched with the SMN Tudor domain, UniProt's annotations are
  # curated from the literature and IEDB's are HLA-presented peptides; every other study enriched with antibodies, and
  # PhosphoSitePlus and ProMetheusDB hold antibody runs too.
  - id: noab
    label: found without antibodies
    note: "Only the sites a source that did not enrich with methylarginine antibodies reports (Lu 2025, SMN Tudor domain; UniProt; IEDB); the other sites are counted on neither side"
    analyses: [motif, disorder]
    marks_where:
      column: studies
      distinct_at_least: 1
      not_counted: [PSP, ProMetheusDB, Larsen2016, Sylvestersen2014, Maron2021, Guo2014, Musiani2019, Fong2019, Li2021, Fedoriw2019, Lim2020, Wei2020, Hartel2019, Geoghegan2015, Ma2023, Lu2024]
    marks_outside: left_out

  - id: inidr
    label: inside IDRs
    note: "Only the arginines inside intrinsically disordered regions (MobiDB) count, methylarginines and other arginines alike, so the result is not a matter of disorder"
    analyses: [near_phospho, near_phospho_high, near_methyllysine, near_acetylation, near_other_acylation, near_ubiquitination, near_sumoylation, idr_charge]
    only_in: idr

reference:
  statistics: methylarginine_statistics_v1_4_3
  # the residue questions' denominators: each protein's other arginines, in all and per class or motif
  background: {input: release_arginine_background, accession: uniprot_accession, analysis: analysis, category: category, others: other_arginines}
  excused:                 # rows the published inputs cannot rebuild, each with why
    - analysis: eclip_rna_apexseq
      method: mann_whitney
      category: Mitochondrial matrix
      why: "the release's supporting table gives each odds ratio to 6 significant digits, and two proteins compared (HNRNPA1, methylated, and LIN28B) share 1.00353 there, a tie the release's exact values did not have; q is compared"
  tables:                  # questions the statistics table does not hold, checked against the release's supporting tables
    disease_ontology:
      input: methylarginine_disease_ontology_v1_4_3
      columns: {set: term_id, a: n_methylated, M: n_genes_term, fold_enrichment: fold_enrichment, p: p, q: q}
    disease_term:          # p_adjust is the Benjamini-Hochberg q (its q is DOSE's q value)
      input: methylarginine_disease_terms_tested_v1_4_3
      columns: {set: term_id, a: n_methylated, M: n_genes_term, fold_enrichment: fold_enrichment, p: p, q: p_adjust}
proteins:                  # the release's protein table: facts of each methylated protein for the website (no test reads these)
  input: methylarginine_proteins_v1_4_3
  accession: uniprot_accession
  attributes:
    arg_enrichment: {column: arg_enrichment_log2, label: Arg enrichment, kind: number, help: "log2 of the shrinkage-estimated methylated share of the protein's arginines over the proteome-wide rate (negative when below it)"}
    arg_enrichment_q: {column: arg_enrichment_q, label: Arginines methylated more than the proteome rate, kind: number, levels: [0.05, 0.01], direction: max, also: {attribute: arg_enrichment, min: 0},
                       help: "Benjamini-Hochberg q of the protein's methylated share of arginines against the proteome-wide rate, with more of them methylated than that rate"}
    dense_window: {column: best_window_aa, label: Densest window (aa), kind: number, help: "the window, in residues, of the protein's most significant cluster of methylarginines"}
    dense_sites: {column: best_window_sites, label: Sites in the densest window, kind: number}
    architecture: {column: architecture_class, label: Clustered architecture, kind: category,
                   values: {"broad across IDR": Broad across an IDR, "domain-distal clustered": Domain-distal clusters, "domain-proximal clustered": Domain-proximal clusters},
                   help: "How the protein's clustered disordered sites (at least 3 within 20 residues) lie relative to its domains"}
    dense_q: {column: best_window_q, label: Protein has a significant dense region, kind: number, levels: [0.05, 0.01], direction: max,
              help: "q of the protein's most significant cluster of methylarginines (permutation test against the protein's own arginines)"}
    string_partners: {column: n_string_partners, label: STRING physical partners, kind: number, help: "STRING physical associations at score 0.7 or more"}
    complexes: {column: n_complexes, label: Complexes with methylated members, kind: number}
    go_rna: {column: go_rna_binding, label: "Binds RNA (Gene Ontology)", kind: category, control: chips,
             values: {experimental: Experimental evidence, other_evidence: Electronic or inferred, none: No GO annotation},
             help: "Gene Ontology RNA binding (GO:0003723 or a term under it), from QuickGO: experimental evidence codes, or electronic and inferred ones"}
    go_dna: {column: go_dna_binding, label: "Binds DNA (Gene Ontology)", kind: category, control: chips,
             values: {experimental: Experimental evidence, other_evidence: Electronic or inferred, none: No GO annotation},
             help: "Gene Ontology DNA binding (GO:0003677 or a term under it), from QuickGO: experimental evidence codes, or electronic and inferred ones"}
    hpa: {column: hpa_locations, label: Locations in the Human Protein Atlas, kind: list}
    # for the Proteins table and its download (website.proteins): the release's own columns
    condensates: {column: condensates, label: CD-CODE condensates, kind: list, help: "CD-CODE condensates (human, not synthetic) the protein is a member of"}
    dense_start: {column: best_window_start, label: Start of the densest window, kind: number}
    dense_end: {column: best_window_end, label: End of the densest window, kind: number}
    disease_families: {column: disease_families, label: Disease families (DisGeNET), kind: list}
    disease_family_terms: {column: disease_family_terms, label: DisGeNET terms per disease family, kind: list}
    als_ftd_gene: {column: als_ftd_family_gene, label: Audited ALS/FTD gene, kind: category}
    panther_group: {column: panther_group, label: PANTHER group, kind: category}
    panther_class: {column: panther_class, label: PANTHER class, kind: category}
variants:                # the same questions on other marks; ptmc run --variant <name>
  with_lower_confidence:
    label: With lower-confidence sites
    description: "The release's lower-confidence sites added: those whose own evidence covers the arginine and leaves the methyl group on an arginine (in_analyses_with_lower_confidence), as statistics_with_lower_confidence_v1.4.3.tsv counts them"
    marks_add:
      - input: methylarginine_lower_confidence_sites_v1_4_3
        include: [{column: in_analyses_with_lower_confidence, equals: "true"}]
        left_out: [{column: in_analyses_with_lower_confidence, equals: "false"}]   # the others are on neither side
    reference:
      statistics: methylarginine_statistics_lower_confidence_v1_4_3
      excused:             # the same tie as the main view's (reference.excused)
        - analysis: eclip_rna_apexseq
          method: mann_whitney
          category: Mitochondrial matrix
          why: "the release's supporting table gives each odds ratio to 6 significant digits, and two proteins compared (HNRNPA1, methylated, and LIN28B) share 1.00353 there, a tie the release's exact values did not have; q is compared"
      tables:              # the view's own disease tables (analyses_with_lower_confidence/disease)
        disease_ontology:
          input: methylarginine_lc_disease_ontology_v1_4_3
          columns: {set: ID, a: k, M: M, fold_enrichment: FoldEnrichment, p: pvalue, q: p.adjust}
        disease_term:      # only the enriched terms are listed (and DOSE's q value also cut them)
          input: methylarginine_lc_disease_terms_v1_4_3
          columns: {set: ID, a: Count, fold_enrichment: FoldEnrichment, p: pvalue, q: p.adjust}
          rows: enriched
    not_compared:          # run, but not checked: their release tables cover the main view's proteins only
      crosslink: "pCLAP's peptides here are the release's runs of them on the main view's proteins"
      sequence_proximity: "pCLAP's peptides here are the release's runs of them on the main view's proteins"
      nucleic_acid_distance: "the release's arginine distances cover the main view's proteins only"
    attributes:
      confidence:
        column: in_analyses_with_lower_confidence
        present: true
        label: Confidence
        kind: category
        values: {"no": Site, "yes": Lower-confidence site}
        colours: {"no": "#334155", "yes": "#C9A227"}
        filter: true
        help: "A lower-confidence site: an arginine a study reports as methylated whose records each fail a site test, counted here because the evidence covers the arginine and leaves the methyl group on an arginine"
      # the site tests of the record that passes most (the release's test_* columns), for the "lower confidence" tag's
      # hover (website.shown_marks.tests); no kind, so neither a filter nor a question of the page
      test_evidence: {column: test_evidence_at_site, label: Evidence at the site, values: {pass: passes, fail: fails, untested: untested}}
      test_named: {column: test_named_entry, label: In a named protein, values: {pass: passes, fail: fails, untested: untested}}
      test_unique: {column: test_unique_in_proteome, label: Unique in the proteome, values: {pass: passes, paralogs: passes under the paralog rule, fail: fails, untested: untested}}
      test_methyl: {column: test_methyl_on_arginine, label: Methyl group on an arginine, values: {pass: passes, fail: fails, untested: untested}}
      test_localised: {column: test_localised, label: Localized, values: {pass: passes, fail: fails, untested: untested}}
      earlier: {column: in_earlier_versions, label: A site of}


# Context marks: other modifications shown beside the methylarginines (CONTRACTS.md, Context marks). The release v1.5.0
# tables; by-similarity rows are dropped (the default). A map row, "Other modifications nearby" on the site card, a filter, table
# columns and downloads follow from these entries; the near_marks questions below test them.
context_marks:
  - id: phospho
    label: Phosphosite
    short: "pS/pT/pY"
    input: context_phosphorylation_sites_v1_5_0
    columns: {accession: canonical_UniProtAC, position: position, residue: residue, state: state, evidence: evidence_class, sources: sources, score: functional_score}
    subset: {id: high, at_least: 0.5, label: score ≥ 0.5}   # shown at first: the sites Ochoa 2020 scores 0.5 or more (about 10,900); a click on the row label shows all. Sites with no score (UniProt or iPTMnet only) are hidden at first too
    replaces_ptm_kinds: [Phospho]   # the live UniProt "Other PTMs" row leaves its Phospho kind out: one source for phosphosites
    colour: "#0891B2"          # cyan: apart from the red and slate of the data, the motif green and the purples of other sites
