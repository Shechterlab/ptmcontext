          title: IntAct
          help: "IntAct features of interaction participants: binding regions mapped for a partner, and mutations that change an interaction"
          after: pdb
          default: "off"
          cards_default: "on"
          from:
            role: residue_evidence
            columns: {accession: uniprot_accession, start: start, end: end, class: evidence_type, value: n_partners, sources: sources}
            include: [{column: evidence_type, in: [intact_binding_region, intact_mutation]}]
          classes:
            intact_binding_region: {label: IntAct binding region, mark: box, opacity: 0.3}
            intact_mutation: {label: IntAct mutation that changes an interaction, mark: diamond}
          value: {one: "{n} record", many: "{n} records"}
          colour: "#0E7490"
          colour_dark: "#3FB5CF"
        - id: predicted
          title: Protein contact (predicted)
          help: "Residues at the partner interface of AlphaFold-Multimer models of human protein pairs (ProtVar, pDockQ ≥ 0.23), darker where more partners share them"
          after: intact
          from:
            role: residue_evidence
            columns: {accession: uniprot_accession, start: start, end: end, value: n_partners, label: "best pDockQ {best_score}", sources: sources}
            include: [{column: evidence_type, equals: predicted_interface}]
          mark: pred
          value: {one: "with up to {n} partner", many: "with up to {n} partners", opacity: [1, 5]}
          key: "Protein contact (predicted; darker with more partners)"
          colour: "#0E7490"
          colour_dark: "#3FB5CF"
        - id: lower_confidence
          title: Lower confidence
          help: "Arginines a study reports as methylated whose records each fail a site test (the release's lower-confidence sites). Not counted as sites"
          after: predicted
          default: "off"
          key: Lower-confidence evidence (not a site)
          from:
            role: lower_confidence_sites
            columns: {accession: uniprot_accession, position: position, label: "{studies}: {reasons}"}
            values:
              reasons: {below_threshold: "localization score below the study's threshold", several_residues: "the methyl group is on one of several residues",
                        search_disagrees: "the study's confident spectra disagree on the residue", no_localising_evidence: "no spectrum or score localizes it",
                        window_fits_several: "the study's window fits several arginines", several_sites: "the same sequence occurs at several sites",
                        other_protein: "the sequence names a site in another protein", not_in_reference: "the sequence is not in the reviewed protein"}
          mark: tick
          colour: "#5F6F78"
          colour_dark: "#93A8B0"
          opacity: 0.75
  pages:
    - id: interactions
      tab: Interactions
      title: Are methylarginines enriched at contacts with RNA, DNA or other proteins?
      sub: "Each methylarginine against the other arginines of its protein that the evidence could reach, in living cells (crosslinks and RNA-bound peptides), in solved structures and in predicted complexes. Also the proteins and partners with such evidence."
      method: |
        Each residue test compares the methylarginines with the other arginines of the same proteins, as the release does, but each against the arginines its evidence could have reached: the proteins with that kind of evidence, the residues a PDB structure observed (SIFTS), or the residues an experiment measured. Within each protein: a Mantel–Haenszel odds ratio with its 95% CI, each protein analyzed on its own; pooled: Fisher's exact test. In these questions every candidate arginine counts in the pooled test, as in the release. q is Benjamini–Hochberg within each question and test.

        The protein-set tests (proteins found binding RNA or DNA in cells; Gene Ontology RNA and DNA binding) count proteins: the methylated proteins in each set against the other proteins each experiment measured, or every reviewed human protein (one-sided hypergeometric test), again within PaxDb abundance deciles.

        pCLAP's and RBDmap's measured peptides may not be republished: the tests that need them run only where the build's root holds those files (otherwise they are left out, and the Method page's parity section says so); pCLAP's RNA-binding peptides and regions are read from the release's own per-residue runs. The tables of this page (who acts, partners, complexes, bound RNA and DNA, binding profiles) are the release's supporting tables, read through the site file's mapping; no test reads them.
      columns:             # how the page shows the tables' columns (a table's own: <table>.<column>)
        interactions.kind: {label: Evidence, values: {rna_crosslink: RNA-crosslinked residue, rbdmap_fragment: RBDmap RNA-bound fragment, capri_xl_peptide: CAPRI XL-peptide, capri_adj_peptide: CAPRI ADJ-peptide, pclap_peptide: pCLAP peptide, pclap_lysc_region: pCLAP region, rbrid_residue: RBR-ID+ residue, dna_crosslink: DNA crosslink, dna_binding_region: UniProt DNA-binding region, pdb_protein: PDB protein interface, pdb_rna: PDB RNA interface, pdb_dna: PDB DNA interface, pdb_self: PDB interface with another copy, predicted_interface: Predicted interface (ProtVar), predicted_contact: Contact in a predicted model, intact_mutation: IntAct mutation, intact_binding_region: IntAct binding region, intact_methylated: IntAct records it methylated}}
        interactions.ids: {label: Structures or models}
        interactions.score: {label: pDockQ, help: "pDockQ of a predicted model"}
        partner_accession: {label: Partner}
        partner: {label: Partner gene}
        records.group: {label: Record, values: {writes: Methylates it, removes: Demethylates it, binds_methylated: Binds it methylated, mutation_changes_binding: Mutating it changes the binding}}
        records.source: {label: Evidence}
        state_detail: {label: The site in it}
        context: {label: What it shows}
        pubmed: {label: Paper}
        window: {label: "Bound sequence ([contact])"}
        contacts.type: {label: Type, values: {rrna: rRNA, trna: tRNA, snrna: snRNA, mrna: mRNA, other_ncrna: Other ncRNA, viral_rna: Viral RNA, rna_oligo: RNA oligo, other_rna: Other RNA, nucleosomal_dna: Nucleosomal DNA, telomeric_dna: Telomeric DNA, other_dna: Other DNA}}
        contacts.name: {label: Molecule}
        contacts.distance: {label: Closest (Å)}
        contacts.entry: {label: PDB, type: pdb}
        rna_distance_a: {label: Distance to RNA (Å), type: number}
        dna_distance_a: {label: Distance to DNA (Å), type: number}
        entries_with_rna: {label: Modeled with RNA, type: number}
        entries_with_dna: {label: Modeled with DNA, type: number}
        string.classes: {label: Partner class, values: {prmt: PRMT, tudor: Tudor domain, wd40: WD40 repeat, phd: PHD finger}}
        complex_id: {label: Complex}
        complex_name: {label: Name}
        curation: {label: Curation, values: {curated: Curated (Complex Portal), predicted: Predicted (hu.MAP 3.0)}}
        n_members: {label: Members, type: number}
        n_members_methylated: {label: Methylated members, type: number}
        methylated_members: {label: Methylated proteins, type: accessions}
        fold_enrichment: {label: Fold, type: number}
        complexes.q: {label: q, type: number}
        top_5mers: {label: Most enriched 5-mers, type: list}
        concentration: {label: Protein}
        encode_experiment: {label: ENCODE experiment}
        consensus: {label: Consensus, type: sequence}
        motif_kind: {label: Kind}
        model_id: {label: Model}
        cell_line: {label: Cells}
        n_peaks: {label: Peaks, type: number}
        top_target_genes: {label: Genes with most peaks, type: list}
        experiment: {label: Experiment}
        name: {label: Name}
        tf_family: {label: Family}
        matrix_id: {label: JASPAR profile}
      answer:
        more: "In living cells, {marks} are found {list} more often than the other {residues} of the same proteins."
        none: "In living cells, {marks} are not enriched at RNA or DNA contacts."
        rows:
          - {analysis: crosslink, category: capri_adj_peptide_among_measured, phrase: in RNA-bound peptides}
          - {analysis: crosslink, category: pclap_peptide_among_measured, phrase: in RNA-bound peptides}
          - {analysis: crosslink, category: rbdmap_peptide_among_measured, phrase: in RNA-bound peptides}
          - {analysis: crosslink, category: dna_crosslink_or_candidate, phrase: at DNA crosslinks}
          - {analysis: crosslink, category: rbrid_residue_among_measured, phrase: in RNA-bound residues}
          - {analysis: crosslink, category: rna_crosslink, phrase: at RNA-crosslinked residues}
      highlights:
        - {rows: [{analysis: crosslink, category: capri_adj_peptide_among_measured}, {analysis: crosslink, category: pclap_peptide_among_measured}, {analysis: crosslink, category: rbdmap_peptide_among_measured}, {analysis: crosslink, category: rbrid_residue_among_measured}],
           label: in RNA-bound peptides and residues, tag: RNA · in living cells, section: ixs-cells, glyph: rna}
        - {rows: [{analysis: crosslink, category: dna_crosslink_or_candidate}], label: at DNA-crosslinked residues, tag: DNA · in living cells, section: ixs-cells, glyph: dna}
        - {rows: [{analysis: crosslink, category: rna_crosslink}], label: at the crosslinked residue itself, tag: RNA · in living cells, section: ixs-cells, glyph: rna}
        - {share: {table: string, of: partner_accession, flag: partner_marked}, label: of their partners are methylated (22% of human proteins), tag: Protein partners, section: ixs-partners, glyph: protein}
        - {counts: [{attribute: nucleic_acid, values: [rna_at]}, {attribute: nucleic_acid, values: [dna_at]}], label: methylarginines in contact with RNA · with DNA, tag: Solved structures · to explore, section: ix-na, glyph: structure}
      overview:
        section: RNA and DNA binding
        title: Interactions and binding
        question: How many sites have interaction evidence, and are they enriched at contacts with RNA, DNA or other proteins? Each test against the other arginines of the same proteins that the evidence could reach (within each protein).
        bar: interaction
        lead: experimental
        checker: [interaction, evidence, nucleic_acid, partner_class]
        findings:          # the explorer's four, each said with its direction, significant or not (the first three on the tile)
          - {lead: In living cells, section: ixs-cells, rows: [{analysis: crosslink, category: rna_crosslink, label: RNA-crosslinked residue, phrase: the residue crosslinked to RNA}]}
          - {lead: In PDB structures, section: ixs-pdb, rows: [{analysis: pdb_interface, category: rna, label: RNA interface, phrase: at RNA interfaces},
                                                               {analysis: pdb_interface, category: protein, label: Protein interface, phrase: at protein interfaces}]}
          - {lead: In predicted complexes, section: ixs-predicted, rows: [{analysis: predicted_interface, category: pdockq_0.23, label: Predicted interface, phrase: "at the interface (AlphaFold-Multimer models, pDockQ ≥ 0.23)"}]}
          - {share: {table: string, of: partner_accession, flag: partner_marked}, label: "of the physical partners of methylated proteins (STRING ≥ 0.7) are themselves methylated (22% of human proteins)", section: ixs-partners}
        rows:
          - {analysis: crosslink, category: rna_crosslink, label: RNA-crosslinked residue, group: In living cells, phrase: the residue crosslinked to RNA}
          - {analysis: crosslink, category: capri_adj_peptide_among_measured, label: "CAPRI peptide (measured)", group: In living cells, phrase: inside a CAPRI RNA-bound peptide (among the arginines CAPRI measured)}
          - {analysis: crosslink, category: pclap_peptide_among_measured, label: "pCLAP peptide (measured)", group: In living cells, phrase: inside a pCLAP RNA-binding peptide (among the arginines pCLAP measured)}
          - {analysis: crosslink, category: rbdmap_peptide_among_measured, label: "RBDmap peptide (measured)", group: In living cells, phrase: inside an RBDmap RNA-bound peptide (among the arginines RBDmap measured)}
          - {analysis: crosslink, category: rbrid_residue_among_measured, label: "RBR-ID+ residue (measured)", group: In living cells, phrase: an RBR-ID+ residue (among the arginines RBR-ID measured)}
          - {analysis: crosslink, category: dna_crosslink_or_candidate, label: DNA-crosslinked residue, group: In living cells, phrase: at a DNA crosslink or one of its candidate residues}
          - {analysis: pdb_interface, category: protein, label: Protein interface (PDB), group: Protein contacts, phrase: at a protein interface in PDB structures}
          - {analysis: predicted_interface, category: pdockq_0.23, label: Predicted interface, group: Protein contacts, phrase: at the interface of a predicted complex}
      groups:
        - name: Summary
          sections:
            - id: ix-nac
              title: RNA and DNA contact tests
              question: Are methylarginines at RNA and DNA contacts more often than the other arginines of the same proteins?
              place: link
              blocks:
                - kind: forest
                  rows:
                    - {analysis: crosslink, category: rna_crosslink, label: RNA-crosslinked residue, group: "In cells: crosslinking mass spectrometry"}
                    - {analysis: crosslink, category: rna_crosslink_single_residue, label: … crosslink localized to it alone, group: "In cells: crosslinking mass spectrometry"}
                    - {analysis: crosslink, category: rna_crosslink_outside_rg, label: … outside RG/GR dipeptides, group: "In cells: crosslinking mass spectrometry"}
                    - {analysis: crosslink, category: rna_crosslink_within_3, label: Within 3 residues of an RNA crosslink, group: "In cells: crosslinking mass spectrometry"}
                    - {analysis: crosslink, category: rbdmap_fragment, label: Inside an RNA-bound fragment (RBDmap), group: "In cells: crosslinking mass spectrometry"}
                    - {analysis: crosslink, category: rbdmap_fragment_outside_rg, label: … outside RG/GR dipeptides, group: "In cells: crosslinking mass spectrometry"}
                    - {analysis: crosslink, category: rbdmap_peptide_among_measured, label: … among arginines RBDmap measured, group: "In cells: crosslinking mass spectrometry"}
                    - {analysis: crosslink, category: capri_adj_peptide, label: Inside an RNA-bound peptide (CAPRI ADJ), group: "In cells: crosslinking mass spectrometry"}
                    - {analysis: crosslink, category: capri_adj_peptide_outside_rg, label: … outside RG/GR dipeptides, group: "In cells: crosslinking mass spectrometry"}
                    - {analysis: crosslink, category: capri_adj_peptide_among_measured, label: … among arginines CAPRI measured, group: "In cells: crosslinking mass spectrometry"}
                    - {analysis: crosslink, category: capri_xl_peptide, label: Inside an RNA-crosslinked peptide (CAPRI XL), group: "In cells: crosslinking mass spectrometry"}
                    - {analysis: crosslink, category: capri_xl_peptide_outside_rg, label: … outside RG/GR dipeptides, group: "In cells: crosslinking mass spectrometry"}
                    - {analysis: crosslink, category: pclap_lysc_region, label: Inside an RNA-binding region (pCLAP), group: "In cells: crosslinking mass spectrometry"}
                    - {analysis: crosslink, category: pclap_lysc_region_outside_rg, label: … outside RG/GR dipeptides, group: "In cells: crosslinking mass spectrometry"}
                    - {analysis: crosslink, category: pclap_peptide, label: Inside an RNA-binding peptide (pCLAP), group: "In cells: crosslinking mass spectrometry"}
                    - {analysis: crosslink, category: pclap_peptide_among_measured, label: … among arginines pCLAP measured, group: "In cells: crosslinking mass spectrometry"}
                    - {analysis: crosslink, category: rbrid_residue, label: An RBR-ID+ residue, group: "In cells: crosslinking mass spectrometry"}
                    - {analysis: crosslink, category: rbrid_residue_outside_rg, label: … outside RG/GR dipeptides, group: "In cells: crosslinking mass spectrometry"}
                    - {analysis: crosslink, category: rbrid_residue_among_measured, label: … among arginines RBR-ID measured, group: "In cells: crosslinking mass spectrometry"}
                    - {analysis: crosslink, category: rbrid_residue_published_rule, label: … by the published rule (sensitivity), group: "In cells: crosslinking mass spectrometry"}
                    - {analysis: crosslink, category: rbrid_region, label: In an RBR-ID region (high score), group: "In cells: crosslinking mass spectrometry"}
                    - {analysis: crosslink, category: dna_crosslink, label: DNA crosslink localized to the residue, group: "In cells: crosslinking mass spectrometry"}
                    - {analysis: crosslink, category: dna_crosslink_or_candidate, label: … or one of its candidate residues, group: "In cells: crosslinking mass spectrometry"}
                    - {analysis: crosslink, category: dna_crosslinked_peptide, label: Inside a DNA-crosslinked peptide, group: "In cells: crosslinking mass spectrometry"}
                    - {analysis: pdb_interface, category: rna, label: At an RNA interface (PDBe-KB), group: "In structures: PDB"}
                    - {analysis: pdb_interface, category: dna, label: At a DNA interface (PDBe-KB), group: "In structures: PDB"}
                    - {analysis: nucleic_acid_distance, category: rna_within_4a, label: Side chain within 4 Å of RNA, group: "In structures: PDB"}
                    - {analysis: nucleic_acid_distance, category: rna_within_8a, label: … within 8 Å of RNA, group: "In structures: PDB"}
                    - {analysis: nucleic_acid_distance, category: dna_within_4a, label: Side chain within 4 Å of DNA, group: "In structures: PDB"}
                    - {analysis: nucleic_acid_distance, category: dna_within_8a, label: … within 8 Å of DNA, group: "In structures: PDB"}
                    - {analysis: crosslink, category: dna_binding_region, label: Inside a UniProt DNA-binding region, group: Annotation}
            - id: ix-evmap
              title: How the evidence fits together
              question: How do crosslink, structure, prediction and IntAct evidence overlap on the sites?
              blocks:
                - {kind: shares, attribute: interaction, title: Interaction evidence at the site}
                - kind: combinations
                  attribute: evidence
                  title: Types of evidence per site
                  sub: "Columns are evidence types, rows are combinations. Click a total or a row to select its sites."
                  values: [rna_crosslink, rbdmap_fragment, capri_adj_peptide, capri_xl_peptide, pclap_peptide, rbrid_residue, dna_crosslink, pdb_rna, pdb_dna, pdb_protein, intact_mutation, intact_binding_region, intact_methylated, predicted_interface, predicted_contact]
                  top: 15
            - id: ix-cm
              title: Which evidence each site has
              question: Do sites with a feature (motif, disorder, methylation class) have a type of evidence more often? Check one site.
              tile: 0
              blocks:
                - kind: matrix
                  attribute: evidence
                  values: [rna_crosslink, rbdmap_fragment, capri_adj_peptide, pclap_peptide, rbrid_residue, dna_crosslink, pdb_rna, pdb_dna, pdb_protein, intact_mutation, intact_binding_region, intact_methylated, predicted_interface]
                  rows:
                    - {filter: "t:methyl_ip", value: SDMA, label: Rme2s IP (SDMA antibody), group: Writer}
                    - {filter: "t:methyl_ip", value: ADMA, label: Rme2a IP (ADMA antibody), group: Writer}
                    - {filter: "t:methyl_ip", value: MMA, label: Rme1 IP (MMA antibody), group: Writer}
                    - {filter: "t:gsk591", value: decreased, label: Down with GSK591, group: Writer}
                    - {filter: "t:ms023", value: decreased, label: Down with MS023, group: Writer}
                    - {filter: "t:state", value: Rme2, label: Rme2 called, group: State}
                    - {filter: "a:motif", value: RGG, label: RGG, group: Motif}
                    - {filter: "a:motif", value: GAR, label: GAR, group: Motif}
                    - {filter: "a:motif", value: RXR, label: RXR, group: Motif}
                    - {filter: "a:motif", value: CARM1_proline_rich, label: Pro ±5, group: Motif}
                    - {filter: "a:disorder", value: disordered, label: In an IDR, group: Context}
                    - {filter: "a:domain_context", value: in_domain, label: In a domain, group: Context}
                - {kind: checker, title: Check one site, attributes: [interaction, evidence, nucleic_acid, nucleic_acid_type, partner_class], tables: [interactions]}
            - id: ix-ex
              title: Evidence map
              question: Evidence along one protein
              place: top
              blocks:
                - {kind: example, protein: HNRNPA1, tracks: [rna_cells, rbrid, dna_cells, intact, predicted]}
        - name: RNA and DNA
          sections:
            - id: ixs-cells
              title: Crosslinking in living cells
              question: Is the methylarginine the residue crosslinked to RNA or DNA, or inside an RNA-bound peptide?
              tile: 1
              blocks:
                - {kind: sets, analysis: binding_protein, title: Proteins that bind RNA or DNA in cells}
                - kind: forest
                  title: The methylarginine against the other arginines of the same proteins
                  rows:
                    - {analysis: crosslink, category: capri_adj_peptide_among_measured, label: CAPRI}
                    - {analysis: crosslink, category: pclap_peptide_among_measured, label: pCLAP}
                    - {analysis: crosslink, category: rbdmap_peptide_among_measured, label: RBDmap}
                    - {analysis: crosslink, category: rbrid_residue_among_measured, label: RBR-ID+}
                    - {analysis: crosslink, category: rna_crosslink, label: RNA-crosslinked residue}
                    - {analysis: crosslink, category: rna_crosslink_single_residue, label: … localized to it alone}
                    - {analysis: crosslink, category: rbdmap_fragment, label: RBDmap fragment}
                    - {analysis: crosslink, category: pclap_peptide, label: pCLAP peptide}
                    - {analysis: crosslink, category: pclap_lysc_region, label: pCLAP region}
                    - {analysis: crosslink, category: rbrid_residue, label: RBR-ID+ residue}
                    - {analysis: crosslink, category: dna_crosslink_or_candidate, label: DNA crosslink or candidate}
                    - {analysis: crosslink, category: dna_crosslinked_peptide, label: DNA-crosslinked peptide}
                - {kind: table, table: interactions, title: The crosslinks and RNA-bound peptides at each site, chips: kind, columns: [accession, kind, detail], limit: 25,
                   where: [{column: kind, in: [rna_crosslink, rbdmap_fragment, capri_xl_peptide, capri_adj_peptide, pclap_peptide, pclap_lysc_region, rbrid_residue, dna_crosslink, dna_binding_region]}]}
            - id: ix-prox
              title: Sequence proximity to RNA-binding residues
              question: How far along the sequence do methylarginines lie from residues that bind RNA in cells, against the other arginines of the same proteins?
              blocks:
                - kind: lines
                  analysis: sequence_proximity
                  series: [rna_crosslink, rbdmap_fragment, capri_adj_peptide, capri_xl_peptide, pclap_peptide, rbrid_residue]
                  x: {within_0_residues: 0, within_3_residues: 3, within_5_residues: 5, within_10_residues: 10, within_20_residues: 20}
                  x_label: within this many residues of the evidence (aa)
            - id: ix-na
              title: Bound RNA and DNA
              question: Which RNA and DNA do methylarginines contact in structures, and how close do they come?
              tile: 1
              blocks:
                - {kind: table, table: contacts, title: RNA and DNA at methylarginines, sub: "Each PDB chain of RNA or DNA within 4 Å of a site’s side chain, with the bound sequence around the closest nucleotide.", chips: type, columns: [accession, window, type, name, distance, entry], sort: distance, descending: false}
                - {kind: histogram, table: distances, value: rna_distance_a, among: entries_with_rna, step: 0.5, max: 8, title: Distance to RNA, x_label: side-chain distance to RNA (Å)}
                - {kind: histogram, table: distances, value: dna_distance_a, among: entries_with_dna, step: 0.5, max: 8, title: Distance to DNA, x_label: side-chain distance to DNA (Å)}
                - kind: forest
                  title: Within 4 and 8 Å
                  rows:
                    - {analysis: nucleic_acid_distance, category: rna_within_4a}
                    - {analysis: nucleic_acid_distance, category: rna_within_8a}
                    - {analysis: nucleic_acid_distance, category: dna_within_4a}
                    - {analysis: nucleic_acid_distance, category: dna_within_8a}
                    - {analysis: nucleic_acid_distance, category: any_within_4a}
                    - {analysis: nucleic_acid_distance, category: any_within_8a}
            - id: ix-pref
              title: Preferred RNA and DNA, by protein
              question: What do these proteins prefer to bind, in vitro and in cells?
              sub: methylated proteins with RNA Bind-n-Seq data
              blocks:
                - {kind: table, table: rbns, title: RNA in vitro (RNA Bind-n-Seq), columns: [accession, top_5mers, concentration, encode_experiment]}
                - {kind: table, table: htr_selex, title: RNA in vitro (HTR-SELEX), columns: [accession, consensus, motif_kind, model_id]}
                - {kind: table, table: ix_eclip, title: RNA in cells (eCLIP), columns: [accession, cell_line, n_peaks, top_target_genes, top_5mers, experiment], sort: n_peaks}
                - {kind: table, table: ix_dna_motifs, title: DNA (JASPAR), columns: [accession, consensus, name, tf_family, matrix_id]}
            - id: ixs-go
              title: RNA- and DNA-binding proteins (Gene Ontology)
              question: Are methylated proteins annotated as RNA- or DNA-binding more often than human proteins?
              blocks:
                - {kind: sets, analysis: go_binding, title: Gene Ontology}
        - name: Structures and models
          sections:
            - id: ixs-pdb
              title: Interfaces in PDB structures
              question: Are methylarginines at protein, RNA or DNA interfaces in experimental structures?
              blocks:
                - kind: forest
                  rows:
                    - {analysis: pdb_interface, category: protein, label: Protein, group: All observed arginines}
                    - {analysis: pdb_interface, category: rna, label: RNA, group: All observed arginines}
                    - {analysis: pdb_interface, category: dna, label: DNA, group: All observed arginines}
                    - {analysis: pdb_interface, category: any, label: Any partner, group: All observed arginines}
                    - {analysis: pdb_interface, category: protein_ordered, label: Protein, group: Ordered regions only}
                    - {analysis: pdb_interface, category: rna_ordered, label: RNA, group: Ordered regions only}
                    - {analysis: pdb_interface, category: dna_ordered, label: DNA, group: Ordered regions only}
                    - {analysis: pdb_interface, category: any_ordered, label: Any partner, group: Ordered regions only}
                    - {analysis: pdb_interface, category: protein_domain, label: Protein, group: Inside domains only}
                    - {analysis: pdb_interface, category: rna_domain, label: RNA, group: Inside domains only}
                    - {analysis: pdb_interface, category: dna_domain, label: DNA, group: Inside domains only}
                    - {analysis: pdb_interface, category: any_domain, label: Any partner, group: Inside domains only}
                - {kind: table, table: interactions, title: The PDB interfaces at each site, chips: kind, columns: [accession, kind, partner_accession, ids, detail], limit: 25,
                   where: [{column: kind, in: [pdb_protein, pdb_rna, pdb_dna, pdb_self]}], partner: partner_accession, label: partner}
            - id: ixs-predicted
              title: Predicted complexes
              question: Are methylarginines at the interfaces of AlphaFold-Multimer models of human protein pairs?
              blocks:
                - kind: forest
                  rows:
                    - {analysis: predicted_interface, category: pdockq_0.23, label: "pDockQ ≥ 0.23", group: All arginines}
                    - {analysis: predicted_interface, category: pdockq_0.5, label: "pDockQ ≥ 0.5", group: All arginines}
                    - {analysis: predicted_interface, category: pdockq_0.23_ordered, label: "pDockQ ≥ 0.23", group: Ordered}
                    - {analysis: predicted_interface, category: pdockq_0.5_ordered, label: "pDockQ ≥ 0.5", group: Ordered}
                    - {analysis: predicted_interface, category: pdockq_0.23_disordered, label: "pDockQ ≥ 0.23", group: Disordered}
                    - {analysis: predicted_interface, category: pdockq_0.5_disordered, label: "pDockQ ≥ 0.5", group: Disordered}
                - {kind: table, table: interactions, title: Contacts in predicted models, sub: "Each site’s contacts in a predicted complex, with the model's pDockQ, the closest distance and the contact (salt bridge, hydrogen bond) with pLDDT.", columns: [accession, partner_accession, score, detail, ids], sort: score, limit: 25,
                   where: [{column: kind, in: [predicted_contact]}], partner: partner_accession, label: partner}
        - name: Partners and complexes
          sections:
            - id: ix-who
              title: Who acts on the methylarginine
              question: Which partners methylate these sites, demethylate them, or bind them methylated, and in which experiments?
              sub: methylarginines with a record
              blocks:
                - {kind: table, table: records, group_by: group, columns: [accession, partner_accession, source, method, state_detail, context, pubmed], partner: partner_accession, label: partner, limit: 40,
                   where: [{column: group, in: [writes, removes, binds_methylated, mutation_changes_binding]}]}
            - id: ixs-partners
              title: Writers, readers and other partners
              question: Which PRMTs and reader-domain proteins bind the methylated proteins?
              blocks:
                - {kind: bars, table: string, label: partner, partner: partner_accession, groups: {column: classes, values: {prmt: Protein arginine methyltransferases, tudor: Tudor-domain proteins, wd40: WD40-repeat proteins, phd: PHD-finger proteins}}, top: 12}
            - id: ix-wr
              title: PRMTs and Tudor proteins with shared partners
              question: Which methylated proteins are bound by both a PRMT and a Tudor-domain protein?
              blocks:
                - {kind: pairs, table: string, label: partner, rows: {column: classes, value: prmt}, cols: {column: classes, value: tudor}, top: 12}
            - id: ixs-complexes
              title: Protein complexes
              question: Which complexes have more methylated members than expected?
              sub: complexes with a methylated member
              blocks:
                - {kind: table, table: complexes, chips: curation, columns: [complex_id, complex_name, n_members, n_members_methylated, fold_enrichment, q, methylated_members], sort: q, descending: false, limit: 15, members: methylated_members}
            - id: ixs-intact
              title: Curated interaction features (IntAct)
              question: Are methylarginines at curated mutation sites and short binding regions more often?
              blocks:
                - kind: forest
                  rows:
                    - {analysis: intact, category: mutation_changes_interaction, label: "Mutated alone, with an effect on binding"}
                    - {analysis: intact, category: binding_region, label: Inside a binding region of ≤ 20 aa}
                    - {analysis: intact, category: binding_region_disordered, label: … disordered arginines only}
                - {kind: table, table: interactions, title: The IntAct records at each site, chips: kind, columns: [accession, kind, partner_accession, detail], limit: 25,
                   where: [{column: kind, in: [intact_mutation, intact_binding_region, intact_methylated]}], partner: partner_accession, label: partner}
