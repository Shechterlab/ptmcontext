      sources:             # each source the rows' items name: its paper (citations and DOIs as the release's site_interaction_records give them)
        pepR-MS: {cite: "Sha, Kuster & Trendel, bioRxiv (2025)", doi: 10.1101/2025.09.05.674461}
        pepR-MS_focused: {label: pepR-MS (focused sites), cite: "Sha, Kuster & Trendel, bioRxiv (2025)", doi: 10.1101/2025.09.05.674461}
        Kramer2014: {label: Kramer 2014, cite: "Kramer et al., Nat Methods 11:1064 (2014), re-analyzed by Sha, Kuster & Trendel, bioRxiv (2025)", doi: 10.1038/nmeth.3092}
