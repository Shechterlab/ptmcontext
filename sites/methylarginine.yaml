# Site: the human methylarginine sites, rebuilt. Its analyses must equal release v1.4.3 of the Methylarginine Site
# Explorer (reference), row for row. Contract: ptmcontext/schemas/site.schema.json.
schema_version: 1
id: methylarginine
title: Human methylarginine sites
status: working
mark: methylarginine

snapshot: {input: uniprot_fasta, release: "UniProt 2026_03"}   # quoted: unquoted, YAML reads 2026_03 as 202603
inputs:                # role the layers read: manifest input that fills it
  disorder: mobidb_disorder
  domains: interpro_domains
  reactome: reactome_protein_pathways
  reactome_names: reactome_pathways
  hpa: hpa_locations
  abundance: paxdb_abundance
  panther_classes: panther_protein_classes
  panther_ontology: panther_class_ontology
  uniprot_entries: uniprot_entries
  gene_symbols: orghs_symbol_entrez
  disgenet: disgenet_term_genes
  accession_history: uniprot_accession_history
  cdcode_membership: cdcode_membership
  cdcode_proteins: cdcode_proteins
  cdcode_condensates: cdcode_condensates
  cdcode_members: cdcode_members_2_3

marks:
  # Until this repository builds the site union from the studies, the marks are the release's own sites.
  input: methylarginine_sites_v1_4_3
  accession: uniprot_accession
  position: position
  left_out:            # sites kept pending: counted on neither side (none of v1.4.3's sites carries this flag; the
    - {column: flags, contains: one_sided_window}   # release keeps them in a separate table)
  residue_mismatch: error
  attributes:          # what the website keeps for each site: to colour, filter and explain it (no test reads these)
    state:
      column: methyl_state
      label: Methylation state
      kind: category
      values: {Rme1: Monomethyl (Rme1), Rme2: Dimethyl (Rme2), Rme1_Rme2: Mono- and dimethyl, "": No assigned state}
      colour: true
      filter: true
      help: The methylation state the studies report for the site; Rme2 is dimethylarginine, asymmetric or symmetric not resolved
    studies:
      column: studies
      provenance: true                       # how the site was found, not what it is
      label: Studies and databases
      kind: list
      separator: "; "
      link: {column: study_dois, url: "https://doi.org/{}"}
      records:             # a database's own record of the protein, rather than its paper
        PSP: "https://www.phosphosite.org/uniprotAccAction?id={acc}"
        UniProt: "https://www.uniprot.org/uniprotkb/{acc}/entry#ptm_processing"
      values:
        Fedoriw2019: Fedoriw 2019
        Fong2019: Fong 2019
        Geoghegan2015: Geoghegan 2015
        Guo2014: Guo 2014
        Hartel2019: Hartel 2019
        IEDB: IEDB
        Larsen2016: Larsen 2016
        Li2021: Li 2021
        Lim2020: Lim 2020
        Lu2024: Lu 2024
        Lu2025: Lu 2025
        Ma2023: Ma 2023
        Maron2021: Maron 2021
        Musiani2019: Musiani 2019
        PSP: PhosphoSitePlus
        ProMetheusDB: ProMetheusDB
        Sylvestersen2014: Sylvestersen 2014
        UniProt: UniProt
        Wei2020: Wei 2020
      filter: true
      help: The studies and databases that report the site
    n_studies:
      column: n_studies
      provenance: true                       # how the site was found, not what it is
      label: Studies reporting it
      kind: number
      colour: true
      filter: true
    interaction:
      column: interaction_status
      label: Interaction evidence
      kind: category
      values: {experimental: Experimental, predicted_only: Predicted only, none: None recorded}
      colours: {experimental: "#334155", predicted_only: "#94A3B8", none: "#D9DEE2"}
      colour: true
      filter: true
      help: "Experimental: an RNA or DNA crosslink at the residue, an RBDmap fragment covering it, or a PDB interface; predicted only: an AlphaFold-Multimer interface or a confident predicted contact"
    localised_by:
      column: localised_by
      provenance: true                       # how the site was found, not what it is
      label: Localised by
      kind: list
      separator: "; "
      values:
        localisation_score: a localisation score
        one_methylatable_residue: one methylatable residue on the peptide
        every_arginine_dimethylated: every arginine on the peptide dimethylated
        curated_experimental: UniProt, experimental evidence (curated)
        curated_database: PhosphoSitePlus 2021 (curated)
    flags:
      column: flags
      provenance: true                       # how the site was found, not what it is
      label: Notes
      kind: list
      separator: "; "
      values:
        single_study: reported by one study
        paralog_assigned: assigned to one of several paralogs
        paralog_window: the same window in a paralog
        shared_sequence: the peptide's sequence is shared with another protein
        xenograft_only: seen only in xenograft samples

analyses:              # each: one statistics row per class, pooled (fisher) and within protein (mantel_haenszel)
  # protein sets: clusterProfiler's enricher, as the release ran it (scripts/release_layers.py, release_tables.py)
  # PANTHER protein classes (scripts/03b_panther_class_enrichment.py): every reviewed protein is the universe and the
  # background; the groups and the top-level classes, with the unclassified proteins, each partition it
  - id: panther_group
    test: protein_sets
    title: Protein classes (PANTHER), grouped
    question: "Which kinds of protein hold more methylated proteins than expected?"
    sub: "Methylated proteins against the reviewed human proteome, by PANTHER protein class (grouped); every protein is in one group (one-sided hypergeometric test)"
    section: Kinds of protein
    sets:
      input: panther_classes
      protein: uniprot_accession
      classes: protein_class_ids
      ontology: {input: panther_ontology, id: class_id, name: name, parent: parent_id, root: PC00000}
      level: top
      groups:                   # the release's overview groups (PTM_Pipeline config/panther_class_groups.json)
          "Transcription, chromatin and DNA": [PC00264, PC00077, PC00009]
          "RNA processing and translation": [PC00031, PC00263]
          "Metabolic enzymes": [PC00262]
          "Protein-modifying enzymes": [PC00260]
          "Signalling: receptors, ligands and modulators": [PC00197, PC00207, PC00095, PC00060]
          "Transport and membrane traffic": [PC00227, PC00219, PC00150]
          "Cytoskeleton, adhesion and matrix": [PC00085, PC00211, PC00069, PC00070, PC00102]
          "Scaffolds, adaptors and chaperones": [PC00226, PC00072]
          "Immunity and defence": [PC00090]
          "Other PANTHER classes": [PC00237, PC00210]
      unclassified: No PANTHER protein class
    universe: snapshot
    whole_universe: true
    background: other reviewed human proteins
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", each PaxDb abundance decile a stratum"}
  - id: panther_class
    test: protein_sets
    title: Protein classes (PANTHER)
    question: "Which PANTHER protein classes hold more methylated proteins than expected?"
    sub: "Methylated proteins against the reviewed human proteome, by top-level PANTHER protein class; every protein is in one class (one-sided hypergeometric test)"
    section: Kinds of protein
    sets:
      input: panther_classes
      protein: uniprot_accession
      classes: protein_class_ids
      ontology: {input: panther_ontology, id: class_id, name: name, parent: parent_id, root: PC00000}
      level: top
      unclassified: No PANTHER protein class
    universe: snapshot
    whole_universe: true
    background: other reviewed human proteins
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", each PaxDb abundance decile a stratum"}
  - id: panther_subclass
    test: protein_sets
    title: Protein subclasses (PANTHER)
    question: "Which PANTHER protein subclasses hold more methylated proteins than expected?"
    sub: "Methylated proteins against the reviewed human proteome, every PANTHER class below the top level with 10 or more proteins; subclasses overlap (one-sided hypergeometric test)"
    section: Kinds of protein
    sets:
      input: panther_classes
      protein: uniprot_accession
      classes: protein_class_ids
      ontology: {input: panther_ontology, id: class_id, name: name, parent: parent_id, root: PC00000}
      level: below_top
    universe: snapshot
    whole_universe: true
    min_size: 10
    background: other reviewed human proteins
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", each PaxDb abundance decile a stratum"}
  # Disease families (scripts/14_disease_enrichment.py): DisGeNET terms (as DOSE 4.4.0 ships them) gathered into
  # families by name (the release's rules, sites/data/methylarginine_disease_families.yaml); the sets are Entrez genes,
  # each protein's through its UniProt primary gene name (the first of several) and org.Hs.eg.db's symbols. Every
  # reviewed protein's genes are the universe, those with a DisGeNET term the background; the eight audited families
  # and the additional ones are tested apart (BH within each)
  - id: disease_family
    test: protein_sets
    title: Disease families (DisGeNET)
    question: "Which disease gene sets are over-represented?"
    sub: "Genes of methylated proteins vs all reviewed human genes with a DisGeNET term, by disease family: the eight audited families (one-sided hypergeometric test). Association, not causation"
    section: Kinds of protein
    identifiers:
      noun: gene
      nouns: genes
      map:
        - {input: uniprot_entries, from: Entry, to: "Gene Names (primary)", separator: ";", take: first}
        - {input: gene_symbols, from: symbol, to: entrez_id}
    sets:
      input: disgenet
      set: term_id
      protein: entrez_id
      families: {rules: sites/data/methylarginine_disease_families.yaml, by: term_name, lists: [audited]}
    universe: snapshot
    background: other reviewed human genes (Entrez) with a DisGeNET term
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, combine: max, label: ", each PaxDb abundance decile a stratum"}
  - id: disease_family_additional
    test: protein_sets
    title: Disease families, additional (rule-based, not audited)
    question: "Which of the additional disease families, mostly clinical signs, are over-represented?"
    sub: "Genes of methylated proteins vs all reviewed human genes with a DisGeNET term, by additional disease family: rule-based and not audited, mostly clinical signs, tested apart from the audited families (one-sided hypergeometric test). Association, not causation"
    section: Kinds of protein
    identifiers:
      noun: gene
      nouns: genes
      map:
        - {input: uniprot_entries, from: Entry, to: "Gene Names (primary)", separator: ";", take: first}
        - {input: gene_symbols, from: symbol, to: entrez_id}
    sets:
      input: disgenet
      set: term_id
      protein: entrez_id
      families: {rules: sites/data/methylarginine_disease_families.yaml, by: term_name, lists: [additional]}
    universe: snapshot
    background: other reviewed human genes (Entrez) with a DisGeNET term
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, combine: max, label: ", each PaxDb abundance decile a stratum"}
  # Biomolecular condensates (scripts/12_condensate_enrichment.py): CD-CODE's membership (export v2.2), kept for human
  # proteins (its protein table) in human condensates that are not synthetic (its condensate table); a member named by
  # a secondary accession counts as its current entry where the accession history names exactly one, and a member on
  # no reviewed entry is dropped. Every condensate of five or more members is tested against the reviewed proteome
  # (condensate_proteome) and against the proteins in any of these condensates (condensate); the release lists them by
  # fold enrichment, then by methylated members. The release keeps a condensate whose taxon is 9606 or whose species is
  # named Homo sapiens: in this export the name holds for every 9606 condensate and for two more (taxon 9607: RdRp
  # condensates, LANA body), so the name alone keeps the same ones; the protein table's taxon and name always agree.
  # The CD-CODE 2.3 confidence of each membership (0-5) is for the website's filter only.
  - id: condensate_proteome
    test: protein_sets
    title: Biomolecular condensates
    question: "Which biomolecular condensates are over-represented (CD-CODE)?"
    sub: "CD-CODE condensates with a higher fraction of methylated members than the reviewed proteome: every human condensate (not synthetic) with at least five members, its members against all reviewed human proteins (one-sided hypergeometric test). Condensate proteins are about twice as often methylated as proteins in general, so most condensates are enriched relative to the proteome, and few relative to other condensates"
    section: Kinds of protein
    sets:
      input: cdcode_membership
      set: condensate_id
      protein: uniprotkb_ac
      where:
        - {column: uniprotkb_ac, input: cdcode_proteins, key: uniprot_id, include: [{column: species_name, equals: Homo sapiens}]}
        - {column: condensate_id, input: cdcode_condensates, key: uid, include: [{column: species_name, equals: Homo sapiens}], exclude: [{column: condensate_type, equals: synthetic}]}
      history: {input: accession_history, from: key, to: accession, include: [{column: kind, equals: secondary}]}
    names: {input: cdcode_condensates, set: uid, name: name}
    universe: snapshot
    whole_universe: true
    min_size: 5
    order: [{by: fold_enrichment, descending: true}, {by: a, descending: true}]
    background: other reviewed human proteins
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", each PaxDb abundance decile a stratum"}
    scores: {input: cdcode_members, set: condensate_uid, protein: uniprot_accession, value: confidence_score, label: Membership confidence (CD-CODE),
             help: "CD-CODE's 0-5 confidence that the protein belongs to the condensate (CD-CODE 2.3)", levels: [2, 3, 4, 5], max: 5}
    filter: {label: CD-CODE condensate (methylated members), any: In any CD-CODE condensate, sets: all}   # every condensate with a methylated member, as the original
  - id: condensate
    test: protein_sets
    title: Biomolecular condensates, against other condensate proteins
    question: "Which biomolecular condensates stand out among condensate proteins (CD-CODE)?"
    sub: "CD-CODE condensates with a higher fraction of methylated members than all condensate proteins: every human condensate (not synthetic) with at least five members, its members against the proteins in any of these condensates, about half of which are methylated (one-sided hypergeometric test)"
    section: Kinds of protein
    sets:
      input: cdcode_membership
      set: condensate_id
      protein: uniprotkb_ac
      where:
        - {column: uniprotkb_ac, input: cdcode_proteins, key: uniprot_id, include: [{column: species_name, equals: Homo sapiens}]}
        - {column: condensate_id, input: cdcode_condensates, key: uid, include: [{column: species_name, equals: Homo sapiens}], exclude: [{column: condensate_type, equals: synthetic}]}
      history: {input: accession_history, from: key, to: accession, include: [{column: kind, equals: secondary}]}
    names: {input: cdcode_condensates, set: uid, name: name}
    universe: annotated            # the proteins in any of these condensates
    min_size: 5
    order: [{by: fold_enrichment, descending: true}, {by: a, descending: true}]
    background: other human proteins in CD-CODE condensates (export of 2026-03-18)
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", each PaxDb abundance decile a stratum"}
  - id: reactome_top_level
    test: protein_sets
    title: Reactome pathways, top level
    question: "Which top-level Reactome pathways hold more methylated proteins than expected?"
    sub: "Methylated proteins against the other proteins with a Reactome pathway, by top-level pathway (one-sided hypergeometric test)"
    section: Kinds of protein
    sets: {input: reactome, set: pathway_id, protein: canonical_UniProtAC}
    names: {input: reactome_names, set: pathway_id, name: name, include: [{column: depth, equals: "0"}]}
    background: other reviewed human proteins with at least one Reactome 97 pathway
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", each PaxDb abundance decile a stratum"}
  - id: reactome_pathway
    test: protein_sets
    title: Reactome pathways
    question: "Which Reactome pathways, at any level, hold more methylated proteins than expected?"
    sub: "Methylated proteins against the other proteins with a Reactome pathway, every pathway of 10 to 500 proteins (one-sided hypergeometric test)"
    section: Kinds of protein
    sets: {input: reactome, set: pathway_id, protein: canonical_UniProtAC}
    names: {input: reactome_names, set: pathway_id, name: name}
    min_size: 10
    max_size: 500
    background: other reviewed human proteins with at least one Reactome 97 pathway
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", each PaxDb abundance decile a stratum"}
  - id: hpa_location
    test: protein_sets
    title: Where in the cell
    question: "Where in the cell are methylated proteins found more often than other proteins?"
    sub: "Methylated proteins against the other proteins with a Human Protein Atlas location scored Approved or better (one-sided hypergeometric test)"
    section: Where in the cell
    sets: {input: hpa, set: location, protein: canonical_UniProtAC, exclude: [{column: reliability, equals: Uncertain}]}
    whole_universe: true
    background: other proteins with an HPA 25.1 location (Approved or better)
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", each PaxDb abundance decile a stratum"}
  - {id: motif, layer: motif}
  - {id: disorder, layer: disorder}
  - {id: domain_context, layer: domain_context}
  - {id: domain_class, layer: domain_class}
  - {id: structure_context, layer: structure_context}
  - {id: idr_charge, layer: idr_charge, new: true}   # not in the release: CIDER's charge classes of IDRs

reference:
  statistics: methylarginine_statistics_v1_4_3

outputs: {folder: out/methylarginine}
citation: sites/methylarginine.citation.cff   # the citation, data sources, version and date: edit there



website:                  # the look and words of the website (ptmc web); layout and behaviour are the kit's
  name: Methylarginine Site Explorer
  tagline: "Human arginine methylation sites from published studies."
  band: ["#155e75", "#0f3b47"]      # the header gradient: teal
  accent: "#c2410c"                 # the orange rule, active tab and links; shared by the lab's sites
  accent_dark: "#fb923c"
  icon: sites/art/methylarginine-icon.svg
  art: sites/art/methylarginine-hero.svg
  lab: {name: Shechter Lab, affiliation: Albert Einstein College of Medicine, url: "https://www.shechterlab.org/", logo: sites/art/shechterlab-logo.svg}
  links:
    - {label: Method, url: "#method"}
    - {label: "Code & data", url: "https://github.com/Shechterlab/ptmcontext"}
    - {label: Research, url: "https://www.shechterlab.org/research/"}
    - {label: Publications, url: "https://www.shechterlab.org/publications/"}
  examples: [FUS, FUS R216, TAF15 EWSR1 FUS, "motif:RGG", "state:Rme2"]
  stats: [marks, proteins, {attribute: studies, label: studies and databases}]
  overview:                # what the Overview opens with: tiles, in sections, each with its most telling classes
    question: "What kinds of proteins are arginine methylated?"
    rows: 7
    sections:
      - name: Kinds of protein
        cards:
          - {analysis: panther_group, title: Protein classes}
          - {analysis: disease_family, title: Disease}
          - {analysis: condensate_proteome, title: Biomolecular condensates}   # the original's default background: the proteome
          - {analysis: hpa_location, title: Where in the cell}
          - {analysis: reactome_top_level, title: Reactome pathways (top level)}
          - {analysis: panther_subclass, title: Protein subclasses}
      - name: Where in the protein
        cards:
          - {analysis: motif, title: Sequence motifs}
          - {analysis: structure_context}
          - {analysis: domain_class, title: Nearest domain class}
          - {analysis: idr_charge}
      - name: In more detail
        cards: [panther_class, {analysis: disease_family_additional, title: Disease families (additional)}, {analysis: condensate, title: "Biomolecular condensates (vs other condensates)"}, {analysis: reactome_pathway, title: Reactome pathways (all levels)}, disorder, domain_context]
  filters:                 # the Filters panel: groups in order, from the questions and the sites' attributes
    - {name: Protein function, analyses: [panther_group, panther_class, disease_family, disease_family_additional, condensate_proteome, hpa_location, reactome_top_level]}
    - {name: Methylation state, attributes: [state]}
    - {name: Sequence motif, analyses: [motif]}
    - {name: Structural context, analyses: [structure_context, idr_charge, domain_class, disorder, domain_context]}
    - {name: Interactions and binding, attributes: [interaction]}
    - {name: Provenance, attributes: [studies, n_studies, localised_by]}
  partners: {species: 9606}         # interaction partners on protein pages, live from STRING (human)
  compare: {stratify: studies}      # "compared with other methylarginines, within studies": the same reporting sources
  sites: {columns: [structure_context]}                            # the Sites tab's context column
  protein: {facts: [{analysis: disorder, classes: [disordered]}]}  # a tile on each protein page
