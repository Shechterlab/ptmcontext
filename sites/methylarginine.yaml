  art: sites/art/methylarginine-hero.svg
  lab: {name: Shechter Lab, affiliation: Albert Einstein College of Medicine, url: "https://www.shechterlab.org/", logo: sites/art/shechterlab-logo.svg}
  links:
    - {label: Documentation, url: "#method"}
    - {label: Download data, url: "#method/download"}
    - {label: "Code & data", url: "https://github.com/Shechterlab/ptmcontext"}
    - {label: Research, url: "https://www.shechterlab.org/research/"}
    - {label: Publications, url: "https://www.shechterlab.org/publications/"}
  examples: [FUS, TAF15 EWSR1 FUS, "disease:als", FUS R216, "motif:RGG"]   # the first three are the chips under the search box
  placeholders: {highlight: "FUS, TDP-43, HNRNPA1 R218", partners: "PRMT5, SMN1", motif: "GXRG, [RK]XR, PRPR", motif_either: "RGG,GAR"}
  default_background: other reviewed human proteins   # examples inside the Highlight and partner boxes
  front:                   # the front block (CONTRACTS.md, 'The front block'): short names, row labels, pathways
    mode: classic
    rows: 5
    cards:
      - key: disease
        title: "Disease"
        short: "Disease"
        note: "Association, not causation: a disease term lists genes linked to it; it does not show that methylation causes or changes the disease."
        chip: "Disease"
        analyses: ["disease_family", "disease_family_additional", "disease_ontology", "disease_term", "cancer_change", "depmap_dependency"]
        facets: [{analysis: disease_family, label: "Families"}, {analysis: disease_family_additional, label: "More groups"}]
        home: {analysis: "disease_family", classes: ["ALS / motor neuron / FTD", "Ataxia / cerebellar degeneration", "Myopathy / muscle / cardiomyopathy", "Alzheimer / tau / dementia", "Cancer / neoplasia"]}
      - key: classes
        title: "Protein classes"
        short: "Protein classes"
        chip: "Protein class"
        analyses: ["panther_group", "panther_class", "panther_subclass"]
        facets: [{analysis: panther_group, label: "Groups"}, {analysis: panther_class, label: "Classes"}]
        home: {analysis: "panther_group"}
      - key: condensates
        title: "Condensates"
        short: "Condensates"
        chip: "Condensate"
        analyses: ["condensate_proteome", "condensate", "condensate_role"]
        facets: [{analysis: condensate_proteome, label: "Condensates"}]
        home: {analysis: "condensate_proteome"}
      - key: cell
        title: "Cell"
        short: "Cell"
        chip: "Cell location"
        cell: true
        analyses: ["where_in_the_cell", "hpa_location", "cell_region_hpa", "cell_region_hcm", "cell_region_organelle_ip", "cell_hcm_compartment", "cell_hcm_domain", "cell_organelle_ip", "cell_chromatin", "eclip_rna_apexseq", "eclip_gene_tsaseq", "eclip_gene_hic"]
        facets: [{analysis: hpa_location, label: "Locations"}]
      - key: position
        title: "Position"
        short: "Position"
        chip: "Position"
        note: "IDR counts differ between questions on purpose: \"In an IDR\" uses MobiDB disorder calls, the structure and interface questions use UniProt disordered regions, and the IDR charge and aromatic questions use IDRs of 20 or more residues. Each question says which."
        analyses: ["disorder", "motif", "domain_context", "domain_class", "structure_context", "idr_charge", "sticker_context_3", "sticker_context_5", "sticker_context_3_idr", "sticker_context_5_idr", "which_factor"]
        facets: [{analysis: disorder, label: "Disorder"}, {analysis: motif, label: "Motifs"}, {analysis: domain_context, label: "Domains"}, {analysis: structure_context, label: "Structure"}]
        home: {analysis: "motif", classes: ["RGG", "RG", "RE"]}
      - key: interactions
        title: "Interactions"
        short: "Interactions"
        chip: "Contact"
        analyses: ["crosslink", "pdb_interface", "predicted_interface", "intact", "sequence_proximity", "nucleic_acid_distance", "binding_protein", "go_binding"]
        facets: [{analysis: crosslink, label: "Crosslinks"}, {analysis: pdb_interface, label: "Structures"}, {analysis: predicted_interface, label: "Predicted"}, {analysis: binding_protein, label: "Binding proteins"}]
        home: {analysis: "crosslink", classes: ["rna_crosslink", "capri_adj_peptide", "rbrid_residue", "dna_binding_region"]}
      - key: pathways
        title: "Pathways"
        short: "Pathways"
        chip: "Pathway"
        analyses: ["reactome_top_level", "reactome_pathway"]
        facets: [{analysis: reactome_top_level, label: "Reactome"}]
        home: {analysis: "reactome_top_level"}
    more: Enzymes and sources
    pathways:                # the Proteins button on the Reactome rows: a pathway's sub-pathways as groups of protein chips (CONTRACTS.md)
      - analyses: [reactome_top_level, reactome_pathway]
        hierarchy: {input: reactome_names, set: pathway_id, parents: parents, name: name}
        members: {input: reactome, set: pathway_id, protein: canonical_UniProtAC}
        source: {name: Reactome, version: "97", licence: "CC BY 4.0", url: "https://reactome.org", link: "https://reactome.org/PathwayBrowser/#/{}"}
    short:
      panther_group: "Protein class groups"
      panther_class: "Protein classes (PANTHER)"
      panther_subclass: "Protein subclasses"
      disease_family: "Disease families (DisGeNET)"
      disease_family_additional: "Disease families, extra"
      disease_ontology: "Disease Ontology"
      disease_term: "DisGeNET terms"
      condensate_proteome: "Condensates"
      condensate: "Condensates, among condensates"
      condensate_role: "Roles in condensates"
      go_binding: "RNA/DNA binding (GO)"
      binding_protein: "RNA/DNA binding in cells"
      reactome_top_level: "Reactome, top level"
      reactome_pathway: "Reactome pathways"
      where_in_the_cell: "Cell drawing and maps"
      hpa_location: "Locations (HPA)"
      cell_region_hpa: "Cell regions (HPA)"
      cell_region_hcm: "Cell regions (Cell Map)"
      cell_region_organelle_ip: "Cell regions (organelle IP)"
      cell_hcm_compartment: "Cell Map compartments"
      cell_hcm_domain: "Cell Map domains"
      cell_organelle_ip: "Organelle IP"
      cell_chromatin: "Chromatin probability"
      eclip_rna_apexseq: "Bound RNAs (APEX-seq)"
      eclip_gene_tsaseq: "Genes of bound RNAs (TSA-seq)"
      eclip_gene_hic: "Genes of bound RNAs (Hi-C)"
      depmap_dependency: "Cancer cell dependency"
      cancer_change: "Tumor and cell-line changes"
      motif: "Sequence motifs"
      disorder: "Disorder context"
      domain_context: "Domain context"
      domain_class: "Nearest domain class"
      structure_context: "Structural context"
      idr_charge: "IDR charge"
      sticker_context_3: "Aromatics within 3"
      sticker_context_5: "Aromatics within 5"
      sticker_context_3_idr: "Aromatics within 3, IDRs"
      sticker_context_5_idr: "Aromatics within 5, IDRs"
      near_phospho: "Near phosphosites"
      near_phospho_high: "Near high-score phosphosites"
      near_methyllysine: "Near methyllysines"
      which_factor: "Which factor matters most?"
      pdb_interface: "PDB interfaces"
      predicted_interface: "Predicted interfaces"
      crosslink: "RNA/DNA crosslinks"
      sequence_proximity: "Distance to RNA evidence"
      nucleic_acid_distance: "Distance to RNA/DNA (PDB)"
      intact: "IntAct mutations and regions"
      reader_classes: "Enzymes and readers"
      perturbations: "PRMT perturbations"
      provenance: "Studies and databases"
    row_labels:                 # a code is unique only within its question; the two stress-granule sets are told apart by source
      condensate: {DEE660B4: "Stress granule (CD-CODE)"}
      condensate_proteome: {DEE660B4: "Stress granule (CD-CODE)"}
      panther_group: {"RNA processing and translation": "RNA processing", "Scaffolds, adaptors and chaperones": "Scaffolds", "Transcription, chromatin and DNA": "Transcription", "Protein-modifying enzymes": "Modifying enzymes", "Cytoskeleton, adhesion and matrix": "Cytoskeleton"}
      disorder: {"disordered": "In an IDR", "ordered": "Ordered"}
      crosslink: {"capri_adj_peptide": "Next to RNA (CAPRI)", "rbrid_residue": "RNA contact (RBR-ID)", "rna_crosslink": "RNA crosslink", "dna_binding_region": "DNA-binding region"}
      pdb_interface: {"protein": "Protein interface (PDB)"}
      reactome_top_level: {"R-HSA-8953854": "RNA metabolism", "R-HSA-4839726": "Chromatin", "R-HSA-74160": "Transcription", "R-HSA-1640170": "Cell cycle"}
    summary_only:          # classes the cards leave to the question's own page
      disorder: ["no_disorder_annotation"]
      domain_context: ["no_domain_annotation"]
      structure_context: ["no_disorder_annotation"]
      crosslink: ["capri_adj_peptide_among_measured", "rbrid_residue_among_measured", "pclap_lysc_region", "pclap_lysc_region_outside_rg", "pclap_peptide", "rbdmap_fragment", "rbdmap_fragment_outside_rg"]
    glossary:
      "IDR": "an intrinsically disordered region, a stretch with no fixed fold."
      "CAPRI": "peptides crosslinked to RNA in living cells (UV crosslinking and mass spectrometry)."
      "RBR-ID": "residues whose peptides drop after UV crosslinking to RNA in cells, a sign of RNA contact."
      "pDockQ": "confidence of a predicted protein-protein interface (AlphaFold); 0.23 is likely, 0.5 confident."
      "pCLAP": "peptides crosslinked to RNA in cells (summary test only)."
      "RBDmap": "protein fragments that stay crosslinked to RNA (summary test only)."
      "methylarginine": "an arginine carrying one methyl group (Rme1, monomethyl) or two (Rme2a asymmetric, Rme2s symmetric), added by PRMT enzymes."
      "RGG": "RGG / RG: arginine-glycine(-glycine) repeats, the motifs PRMTs methylate most; often in disordered regions of RNA-binding proteins."
    examples:
      - {label: "FUS", query: "FUS"}
      - {label: "FUS R216", query: "FUS R216"}
      - {label: "ALS", query: "disease_family:ALS"}
      - {label: "Stress granules", query: "cell_organelle_ip:stress_granule"}
      - {label: "Rme2 in IDRs", query: "state:Rme2 disorder:IDR"}
      - {label: "FUS TAF15 EWSR1 HNRNPA1", query: "FUS TAF15 EWSR1 HNRNPA1"}
  start:                   # the Overview's start panel for a first visit, and the Help page's starts (kit-help.js)
    share: {analysis: disorder, classes: [disordered, disorder_boundary, ordered], labels: {disordered: in disordered regions (IDRs), disorder_boundary: next to an IDR, ordered: in ordered regions}}
    findings: [{analysis: motif, class: RGG}, {analysis: panther_group, class: RNA processing and translation}, {analysis: disorder, class: ordered}]
    protein: FUS
    text: "Human arginine methylation sites from published studies and databases: their positions, proteins and disease links. Each tile is one question, comparing the methylarginines with the other arginines of the same proteins. Search a protein, a gene list or a disease to test your own selection."
    examples:
      - {label: A list of genes, query: TAF15 EWSR1 FUS, help: "Every question is tested again on their methylarginines."}
      - {label: A disease, query: "disease_family:ALS", help: "Methylarginines on proteins linked to a disease family, and how they differ from the other arginines of their proteins."}
      - {label: One methylarginine in its structure, query: FUS R216, help: "Its protein's domain and disorder map, the evidence for the residue, and its structures."}
  stats: [marks, proteins, {attribute: studies, label: studies and databases, opens: provenance}]
  overview:                # what the Overview opens with: tiles, in sections, each with its strongest classes
    statistic_label: true  # each tile names its statistic
    question: "Which proteins are arginine methylated?"
    rows: 7
    random_maps: {n: 3, title: Example proteins}   # a closed fold at the end of the Overview: proteins drawn at random, each end to end (open: true opens it; enabled: false leaves it out)
    starting_points:       # under the sections: proteins to start from, and ready-made selections (the explorer's)
      open: true
      lists:
        - {title: Most sites, by: marks, n: 6, help: Proteins with the most methylarginine sites}
        - {title: Most methylated for their arginine count, by: arg_enrichment, where: {attribute: arg_enrichment_q, max: 0.05}, show: "log2 {arg_enrichment}", n: 6,
           help: "Highest arginine-methylation enrichment, as log2 of the methylated share of the protein's arginines over the proteome-wide rate (3 is 8 times): more of the protein's arginines methylated than its length and arginine count predict"}
        - {title: Densest clusters, by: dense_q, order: asc, where: {attribute: dense_q, max: 0.05}, show: "{dense_sites}/{dense_window} aa", n: 6,
           help: "Most significant clustering of methylarginines (permutation test): sites in the window"}
      quick:
        - {label: sites reported by 2 or more studies or databases, query: "f=n:n_studies~2", view: sites}
        - {label: sites measured with PRMT inhibitors (Maron 2021), query: "f=t:gsk591~decreased|increased|mixed|no_significant_change", view: sites}
        - {label: proteins in condensates, query: "f=p:condensate_proteome~*", view: proteins}
        - {label: proteins with dense clusters, query: "f=r:dense_q~0.05", view: proteins}
    sections:
      - name: Where in the cell
        about: "Where in the cell the methylated proteins localize."
        #  its own section: the drawing of the cell on the Overview (website.cell: the maps of the cell as one question, the explorer's)
        cards:
          - {analysis: where_in_the_cell, title: Where in the cell, drawing: true, wide: true}
      - name: Which proteins
        about: "Protein classes, pathways and condensates of the methylated proteins."
        cards:
          - {analysis: panther_group, title: Protein classes}
          - {analysis: reactome_top_level, title: Reactome pathways (top level), rows: 4}
          - {analysis: panther_subclass, title: Protein subclasses}
          - {analysis: condensate_proteome, title: Biomolecular condensates, order: q}   # the proteome background, by evidence: a small condensate reaches the largest fold when every member is methylated
          - {analysis: condensate_role, title: Roles in condensates}
      - name: Where in the protein
        about: "Where in the protein the methylated arginines are: motifs, folded or disordered parts, domains."
        cards:
          - {analysis: structure_context}
          - {analysis: idr_charge}
          - {analysis: domain_class, title: Nearest domain class}
          - {analysis: motif, title: Sequence motifs}
          - {analysis: sticker_context_3}
          - {analysis: sticker_context_5}
          - {analysis: sticker_context_3_idr}
          - {analysis: sticker_context_5_idr}
          - {analysis: which_factor, wide: true}
      - name: RNA and DNA binding
        about: "Whether methylated arginines touch RNA, DNA or other proteins. The Interactions page has the tests."
        #  the Interactions page's tile (website.pages[].overview)
        cards: []
      - name: Other modifications
        about: "Whether methylated arginines are near other modifications (phosphosites and methyllysines), within 10 residues."
        cards:
          - {analysis: near_phospho}
          - {analysis: near_phospho_high}
          - {analysis: near_methyllysine}
      - name: Interactions and enzymes
        about: "The enzymes that add methyl groups, the proteins that read them, and what happens when the enzymes are blocked. Protein partners are with the RNA and DNA tile above."
        #  counted from the partner classes (website.search.partners), not tested
        cards:
          - reader_classes
          - {analysis: perturbations, wide: true}
      - name: Disease and cancer
        about: "Diseases linked to the methylated proteins."
        show: 1
        more: More on disease
        cards:
          - analysis: disease_family
            title: Disease
            views:               # one question, two vocabularies: a switch on its page
              - label: DisGeNET families
                analysis: disease_family
                more: {analysis: disease_family_additional, label: "Show {n} more families", head: "Additional families"}
                members:
                  analysis: disease_term
                  label: Show the DisGeNET terms
                  noun: term
                  nouns: DisGeNET terms
                  id_label: UMLS CUI
                  none: terms in no family
                  of:
                    - {analysis: disease_family, label: disease families checked by hand}
                    - {analysis: disease_family_additional, label: "additional families, mostly clinical signs"}
              - label: Disease Ontology
                analysis: disease_ontology
                ontology:
                  short: 50
                  compare: 4
                  tree: 100
                  id_label: DOID
                  noun: term
                  nouns: terms
                  glosses:         # the classes under "disease": a plain gloss after the name, and the ontology's own definition
                    "DOID:14566": [cancers and other neoplasms, "A disease that is characterized by abnormally rapid cell division."]
                    "DOID:0080015": [congenital and developmental, "A disease that has_material_basis_in a genetic abnormality, error with embryonic development, infection or compromised intrauterine environment."]
                    "DOID:225": [named sets of signs and symptoms, "A disease characterized by a group of signs and symptoms that occur together and characterize a particular abnormality."]
                    "DOID:150": ["psychiatric, cognitive, developmental", "A disease that involves a psychological or behavioral pattern generally associated with subjective distress or disability that occurs in an individual, and which are not a part of normal development or culture."]
                    "DOID:630": [chromosomal and other genetic variation, "A disease that has_material_basis_in genetic variations in the human genome."]
                    "DOID:7": [by organ system, "A disease that manifests in a defined anatomical structure."]
                    "DOID:0014667": [inherited and acquired metabolic, "A disease that involves errors in metabolic processes of building or degradation of molecules."]
                    "DOID:0050117": ["viral, bacterial, parasitic, fungal"]
          - {analysis: disease_family_additional, title: "More disease families"}
          - {analysis: depmap_dependency, title: Cancer cell dependency}
          - {analysis: cancer_change, title: Changes in tumors and cell lines}
      - name: Evidence and studies
        about: "Which studies and databases reported the sites."
        #  counted, not tested (website.counts)
        cards: [provenance]
      - name: More questions
        about: "Further protein classes, pathways, cell maps and maps of bound RNAs, one question each."
        cards: [panther_class, {analysis: condensate, title: "Biomolecular condensates (vs other condensates)", order: q}, {analysis: reactome_pathway, title: Reactome pathways (all levels)},
                {analysis: hpa_location, title: Human Protein Atlas locations}, cell_hcm_compartment, cell_hcm_domain, cell_organelle_ip, cell_chromatin,
                eclip_rna_apexseq, eclip_gene_tsaseq, eclip_gene_hic, disorder, domain_context]
  cell:                    # "Where in the cell" (kit-cell.js): the maps of the cell as one question, as the explorer's
    id: where_in_the_cell
    title: Where in the cell
    question: "Where do methylated proteins localize in the cell?"
    intro: "Five maps from four studies locate proteins in the cell, by imaging, proximity labeling, organelle pull-down and chromatin fractionation."
    note: "Not shown: the nuclear-body map of Dyakov et al. (bioRxiv 2024), whose license (CC BY-NC-ND) does not allow derived works, and the speckle, lamina and PML-body proteomes of Barutcu et al. 2022 and its nuclear-body RNA map. Where the RNAs bound by proteins with eCLIP data gather (APEX-seq), and where the genes of those RNAs lie in the nucleus (TSA-seq, Hi-C subcompartments), is under More questions."
    maps:                  # each a protein-set question whose sets are compartments: the grids' columns, in order
      - {analysis: hpa_location, regions: cell_region_hpa, name: Human Protein Atlas, short: Protein Atlas, method: Imaging, cells: many cell lines,
         how: "antibody staining in many cell lines; locations of Approved or better reliability with 20 or more proteins",
         ref: HPA 25.1, doi: 10.1126/science.aal3321, url: "https://www.proteinatlas.org/humanproteome/subcellular", licence: CC BY 4.0, min_members: 20}
      - {analysis: cell_hcm_compartment, regions: cell_region_hcm, name: Human Cell Map, short: Cell Map, method: Proximity labeling, cells: HEK293,
         how: "proximity labeling from 192 baits; each protein is assigned to the compartment whose baits label it most",
         ref: Go et al. 2021, doi: 10.1038/s41586-021-03592-2, url: "https://humancellmap.org", licence: CC BY 4.0}
      - {analysis: cell_hcm_domain, name: "Human Cell Map, finer domains", short: Cell Map domains, method: Proximity labeling, cells: HEK293,
         how: "the same map at a finer scale: neighborhoods of proteins that label one another (SAFE domains)",
         ref: Go et al. 2021, doi: 10.1038/s41586-021-03592-2, url: "https://humancellmap.org", licence: CC BY 4.0}
      - {analysis: cell_organelle_ip, regions: cell_region_organelle_ip, name: Organelle IP, short: Organelle IP, method: Organelle pull-down, cells: HEK293T,
         how: "Organelles immunoprecipitated one by one. Each protein is assigned to the organelle it co-purifies with.",
         ref: Hein et al. 2025, doi: 10.1016/j.cell.2024.11.028, url: "https://github.com/czbiohub-sf/Organelle_IP_analyses_and_figures", licence: BSD-3-Clause (analysis repository)}
      - {analysis: cell_chromatin, graded: true, name: Chromatin probability, short: ChEP, method: Fractionation, cells: human cell lines,
         how: "probability that a protein is chromatin-bound, from chromatin enrichment across many conditions",
         ref: Kustatscher et al. 2014, doi: 10.1002/embj.201387614, url: "https://doi.org/10.1002/embj.201387614", licence: CC BY}
    regions:               # the sets of each map's regions question, and the part of the drawings each colors
      - {label: Nucleus, part: nucleus, in_text: the nucleus}
      - {label: Cytoplasm, in_text: the cytoplasm}
      - {label: Organelles and membranes, in_text: the organelles and membranes}
    compartments:          # the grid's rows: each a set in some maps, and the part of the drawings it colors (also: parts
      - group: Nucleus     # it colors when they have no row of their own); the release's groups (data/subcellular.json)
        rows:
          - {label: Chromatin, part: chromatin, also: [periphery, perinucleolar], sets: {cell_hcm_compartment: chromatin, cell_chromatin: "ICP >= 0.8 (chromatin)"}}
          - {label: Nucleoplasm, part: nucleoplasm, also: [nucleus], sets: {cell_hcm_compartment: nucleoplasm, cell_organelle_ip: nucleus, hpa_location: Nucleoplasm}}
          - {label: Nucleolus, part: nucleolus, sets: {cell_hcm_compartment: nucleolus, cell_organelle_ip: nucleolus, hpa_location: Nucleoli}}
          - {label: Nuclear speckles, part: speckles, sets: {cell_hcm_domain: "splicing speckles, nucleolus", hpa_location: Nuclear speckles}}
          - {label: Paraspeckles, part: paraspeckles, sets: {cell_hcm_domain: paraspeckles}}
          - {label: "Nuclear bodies (PML, Cajal …)", name: Nuclear bodies, part: bodies, also: [cajal, pml], sets: {cell_hcm_compartment: nuclear body, hpa_location: Nuclear bodies}}
          - {label: Nuclear envelope and lamina, name: Nuclear envelope, part: envelope, sets: {cell_hcm_compartment: nuclear outer membrane-ER membrane network, hpa_location: Nuclear membrane}}
          - {label: Nuclear pores, part: pores, sets: {cell_hcm_domain: nuclear pore}}
          - {label: Mitotic chromosome, sets: {hpa_location: Mitotic chromosome}}
      - group: Cytoplasm
        rows:
          - {label: "RNA granules (stress granules, P-bodies)", name: "Stress granules (cell map)", part: granules, sets: {cell_hcm_compartment: cytoplasmic ribonucleoprotein granule, cell_hcm_domain: cytoplasmic ribonucleoprotein granule, cell_organelle_ip: stress_granule}}
          - {label: P-bodies, part: pbodies, in_text: P-bodies, sets: {cell_organelle_ip: p-body, cell_hcm_domain: "centrosome enriched, P-body enriched"}}
          - {label: Translation, name: Ribosomes and translation, part: ribosomes, sets: {cell_organelle_ip: translation}}
          - {label: Cytosol, part: cytosol, sets: {cell_hcm_compartment: "actin cytoskeleton, cytosol", cell_organelle_ip: cytosol, hpa_location: Cytosol}}
          - {label: Actin cytoskeleton, name: Actin cortex, part: actin, sets: {cell_organelle_ip: actin_cytoskeleton, cell_hcm_domain: actin cytoskeleton, hpa_location: Actin filaments}}
          - {label: Microtubules, part: microtubules, sets: {cell_hcm_compartment: microtubule cytoskeleton, hpa_location: Microtubules}}
          - {label: Centrosome, part: centrosome, sets: {cell_hcm_compartment: centrosome, cell_organelle_ip: centrosome, hpa_location: Centrosome}}
          - {label: Proteasome, sets: {cell_organelle_ip: proteasome}}
      - group: Organelles and membranes
        rows:
          - {label: Mitochondria, part: mito, sets: {cell_hcm_compartment: mitochondrial matrix, cell_organelle_ip: mitochondrion, hpa_location: Mitochondria}}
          - {label: Endoplasmic reticulum, part: er, in_text: the ER, sets: {cell_hcm_compartment: ER membrane, cell_organelle_ip: ER, hpa_location: Endoplasmic reticulum}}
          - {label: Golgi, name: Golgi apparatus, part: golgi, in_text: the Golgi, sets: {cell_hcm_compartment: Golgi apparatus, cell_organelle_ip: Golgi, hpa_location: Golgi apparatus}}
          - {label: Endosomes and lysosomes, part: endolyso, sets: {cell_hcm_compartment: "endosome, lysosome", cell_organelle_ip: lysosome, hpa_location: Vesicles}}
          - {label: Peroxisomes, part: perox, sets: {cell_hcm_compartment: "mitochondrial outer membrane, peroxisome", cell_organelle_ip: peroxisome}}
          - {label: Plasma membrane, part: pm, sets: {cell_hcm_compartment: plasma membrane, cell_organelle_ip: plasma_membrane, hpa_location: Plasma membrane}}
    drawings:              # the kit's drawings (CONTRACTS.md names their parts), in order
      - {drawing: cell, title: "The cell"}
      - {drawing: nucleus, title: "The nucleus"}
  set_views:               # a protein-set question drawn with its proteins' numbers (kit-values.js): DepMap's dependency
    - analysis: depmap_dependency
      meter: common_essential                   # the class whose share the tile shows
      meter_words: commonly essential in cancer cell lines
      population: screened proteins
      intro: "{n} of {the} {total} {who} were screened (DepMap 24Q4, 1,178 cell lines). A protein's score is its median Chronos gene effect across the lines: 0 is no effect, −1 the median of commonly essential genes, and lower is a stronger dependency."
      box: {value: median, title: Median gene effect of each protein, axis: "median gene effect per protein (Chronos)",
            sub: "DepMap Public 24Q4 CRISPR (Chronos), median gene effect per protein across 1,178 lines. Boxes span the middle half of proteins, whiskers the 5th to 95th percentile. Lower is a stronger dependency"}
      caveat: "Essential proteins are abundant, and mass spectrometry finds abundant proteins most often, so methylated proteins look more essential than the proteome whatever their methylation does. A selection is also compared with the other methylated proteins, which share that bias, and that comparison is fairer."
      chips:
        - {title: Strongest dependencies, value: median, order: ascending}
        - {title: Selective dependencies, note: "not commonly essential; 5% to under half of the lines depend on them, share shown", sets: [some_lines],
           share: [dependent_lines, lines_with_probability], order: descending}
      residue: cancer_change                    # a residue question shown with it (changes at the marks)
      credit: "DepMap Public 24Q4 (doi:10.25452/figshare.plus.27993248; CC BY 4.0; Tsherniak et al. 2017; Chronos, Dempster et al. 2021). Commonly essential: DepMap's list of genes that at least 90% of lines rank among their strongest dependencies. A line depends on a gene when DepMap's dependency probability is at least 0.5. The results on tumors are in whole or part based upon data generated by the TCGA Research Network (https://www.cancer.gov/tcga): MC3 somatic calls (Ellrott et al. 2018)."
  counts:                  # questions answered by counting the sites, not by a test (CONTRACTS.md, count questions)
    reader_classes:
      kind: values
      attribute: bound_by
      title: Methylation enzymes and readers
      question: "Which methylarginines are on proteins that bind a writer, a reader or a cofactor?"
      sub: "Methylarginines on proteins with a STRING physical partner (score 0.7 or more) in each writer, reader or cofactor class"
      distribution: "Classes of partner of each protein carrying a {mark}"
      unit: [class, classes]
      noun: partner classes
      two_or_more: on proteins with partners in two or more classes
      top: 8
      bins: 4
      note: "A class describes the protein's physical partners. STRING associations are to the whole protein, so a count does not show that a partner writes or reads that arginine. Methyllysine readers are in the uncurated Tudor class."
      method: "The partner classes are listed by gene and InterPro id, each with the paper that shows its role. A protein is in a class when one of its STRING physical partners is."
    provenance:
      kind: values
      attribute: studies
      number: n_studies
      title: Studies and databases
      question: "Which studies and databases report the methylarginines?"
      sub: "Methylarginines reported by each study or database"
      distribution: "Studies or databases reporting each {mark}"
      unit: [study or database, studies and databases]
      noun: studies and databases
      two_or_more: reported by two or more
      top: 5
      bins: 5
      note: "Databases such as PhosphoSitePlus compile published studies, so two studies or databases can rest on the same measurement."
      method: "Each methylarginine lists the studies and databases that report it (the release's studies column) and their number (n_studies). A study's count is the methylarginines it reports. Only counts those no other study or database reports. PhosphoSitePlus and ProMetheusDB compile published studies, so a site they share with a study may rest on one measurement."
    perturbations:
      kind: responses
      title: PRMT inhibitors, knockouts and knockdowns
      question: "Which methylarginines have a peptide that decreases when PRMTs are inhibited or knocked out?"
      sub: "Methylarginines that change when a PRMT is inhibited, knocked out or knocked down (Maron et al. 2021; Shishkova et al. 2017; Szewczyk et al. 2020; Hartel et al. 2019; Lu et al. 2024; Li et al. 2021)"
      head: "Methylarginines with a peptide that decreased with each PRMT inhibitor, knockout or knockdown"
      first: Perturbation
      group: Methyl-IP
      calls: {down: decreased, up: increased}
      note: "Rows count the methylarginines an experiment measured and those that changed. A site is decreased when a peptide containing it went down and none went up, and increased for the reverse. A peptide with several methylarginines gives each the same change. Maron rows: sites measured in that methyl-IP, with a peptide changing at adjusted p ≤ 0.05. CARM1 knockout rows: sites measured in that cell line, with a peptide changing at least twofold at BH q < 0.05. Other rows: sites quantified, called at twofold and q < 0.05, or by the published call where the row says so (the PRMT1 knockdown, 2 against 2 samples, and the Li et al. 2021 arms, one SILAC experiment each, untested). The Li et al. PRMT5 knockdown lists only decreased sites. Median change is the median over sites of each site's median log2 change (inhibitor minus DMSO for Maron rows, perturbed over control for the rest)."
      method: "The release's supporting tables give each site's call and change per experiment: maron2021_inhibitors (Maron et al. 2021 Table S3), carm1_ko (Shishkova et al. 2017) and writer_perturbations. The calls of the last two are the site table's perturbation_calls (the perturbation filter). Counts and medians are descriptive. No test is run here."
      rows:
        - {name: GSK591, note: PRMT5 inhibitor, group: Rme1, table: maron_inhibitors, where: {inhibitor: GSK591, antibody: MMA}, change: log2_diff_median}
        - {name: GSK591, note: PRMT5 inhibitor, group: Rme2a, table: maron_inhibitors, where: {inhibitor: GSK591, antibody: ADMA}, change: log2_diff_median}
        - {name: GSK591, note: PRMT5 inhibitor, group: Rme2s, table: maron_inhibitors, where: {inhibitor: GSK591, antibody: SDMA}, change: log2_diff_median}
        - {name: MS023, note: type I PRMT inhibitor, group: Rme1, table: maron_inhibitors, where: {inhibitor: MS023, antibody: MMA}, change: log2_diff_median}
        - {name: MS023, note: type I PRMT inhibitor, group: Rme2a, table: maron_inhibitors, where: {inhibitor: MS023, antibody: ADMA}, change: log2_diff_median}
        - {name: MS023, note: type I PRMT inhibitor, group: Rme2s, table: maron_inhibitors, where: {inhibitor: MS023, antibody: SDMA}, change: log2_diff_median}
        - {name: CARM1 KO, note: MCF7 cells, short: CARM1 KO MCF7, group: Rme2a, attribute: perturbation, value: carm1_ko_mcf7, table: carm1_ko, where: {cell_line: MCF7}, change: log2_ko_over_wt}
        - {name: CARM1 KO, note: MDA-MB-231 cells, short: CARM1 KO MDA-MB-231, group: Rme2a, attribute: perturbation, value: carm1_ko_mdamb231, table: carm1_ko, where: {cell_line: MDA-MB-231}, change: log2_ko_over_wt}
        - {name: "PRMT7 KO, HCT116", note: "Szewczyk et al. 2020 · twofold, q < 0.05", kind: knockout, attribute: perturbation, value: prmt7_ko_hct116, table: writer_perturbations, where: {perturbation: prmt7_ko_hct116}, change: log2_treated_over_control}
        - {name: "PRMT1 KD, HEK293T", note: "Hartel et al. 2019 · published call", kind: knockdown, attribute: perturbation, value: prmt1_kd_hek293t, table: writer_perturbations, where: {perturbation: prmt1_kd_hek293t}, change: log2_treated_over_control}
        - {name: "PRMT5i EPZ015666, HeLa", note: "Lu et al. 2024 · twofold, q < 0.05", kind: inhibitor, attribute: perturbation, value: prmt5i_epz015666_hela, table: writer_perturbations, where: {perturbation: prmt5i_epz015666_hela}, change: log2_treated_over_control}
        - {name: "PRMT7 KD, HEK293", note: "Li WJ et al. 2021 · published call", kind: knockdown, attribute: perturbation, value: prmt7_kd_hek293, table: writer_perturbations, where: {perturbation: prmt7_kd_hek293}, change: log2_treated_over_control}
        - {name: "PRMT7i SGC3027, HEK293", note: "Li WJ et al. 2021 · published call", kind: inhibitor, attribute: perturbation, value: prmt7i_sgc3027_hek293, table: writer_perturbations, where: {perturbation: prmt7i_sgc3027_hek293}, change: log2_treated_over_control}
        - {name: "CARM1 KD, HEK293", note: "Li WJ et al. 2021 · published call", kind: knockdown, attribute: perturbation, value: carm1_kd_hek293, table: writer_perturbations, where: {perturbation: carm1_kd_hek293}, change: log2_treated_over_control}
        - {name: "PRMT5 KD, HEK293", note: "Li WJ et al. 2021 · published call; decreased sites only", kind: knockdown, listed: true, attribute: perturbation, value: prmt5_kd_hek293, table: writer_perturbations, where: {perturbation: prmt5_kd_hek293}, change: log2_treated_over_control}
