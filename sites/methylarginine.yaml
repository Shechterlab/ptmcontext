    lead: "Methylated proteins joined by physical links and complexes, grouped into clusters named by GO biological process."   # the one line under the heading; the section Method has the rest
    controls: [clusters, colour, find]   # the main row (others under More options): label, clusters, colour, find, score, top, minc, sources, preset, claim
    protein_link: true   # a See in network button on every protein page (#network?p=<accession>)
    protein_preview: true   # and a small drawing of it among its cluster under the button
    claim: "Methylated proteins form {n} functional clusters"   # the exported figure's title
    color_by:
      - {id: disordered, name: Share of sites in disordered regions, kind: sequential, column: disorder, values: [disordered]}
      - {id: domain, name: Domain class most sites are in, kind: categorical, column: domain_class}
    tile: {section: "Interactions and enzymes", title: Protein network, text: "The methylated proteins with most sites as one network of physical links and complexes, in clusters named by GO biological process."}
  # The Overlap page: 2 to 4 terms (protein sets, classes, the selection, readers) and how their proteins and sites overlap
  overlap:
    terms_from: [panther_group, panther_class, panther_subclass, disease_family, disease_ontology, disease_term, reactome_top_level, reactome_pathway, hpa_location, cell_region_hpa, cell_region_hcm, cell_region_organelle_ip, cell_hcm_compartment, cell_hcm_domain, cell_organelle_ip, cell_chromatin, condensate, condensate_role, depmap_dependency, condensate_proteome, eclip_rna_apexseq, eclip_gene_tsaseq, eclip_gene_hic, go_binding, binding_protein]
    max_terms: 4
    term_sources:      # GO biological process, propagated over is_a and part_of, 5 to 5,000 proteins; the evidence include below keeps annotations that are not computational-only (remove it to keep every annotation)
      - id: go_bp
        title: GO biological process
        members: {input: go_bp_annotations, protein: uniprot_accession, set: go_id, include: [{column: non_iea, equals: "true"}]}
        names: {input: go_bp_terms, id: go_id, name: go_name}
        min_size: 5
        max_size: 5000
        cite: ["Gene Ontology Consortium, Genetics 224:iyad031 (2023), doi:10.1093/genetics/iyad031", "Ashburner et al., Nat Genet 25:25 (2000), doi:10.1038/75556"]
    leave_out: {binding_protein: [rna_rbdmap, rna_pclap]}   # unpublished peptide data: not offered, not written
    notes: {cell_hcm_compartment: one main location per protein, cell_hcm_domain: one main location per protein, cell_organelle_ip: one main location per protein}
    units: [proteins, sites, readers, enzymes]
    enzymes: {roles: [writer, eraser]}
    readers:           # a protein is a reader when it carries any listed Pfam or InterPro entry (each id checked on InterPro)
      source: interpro_entries
      families:
      - {name: Tudor, ids: [IPR002999, PF00567, IPR010304], note: "Tudor domains, including the SMN and SPF30 (SMNDC1) type; some read methylarginine, others methyllysine"}
  compare: {stratify: studies, min_proteins: 10, min_marks: 30}      # "compared with other methylarginines, within studies": the same reporting sources
  proteins:                # the Proteins page (kit-tables.js): its table's columns after the protein and its sites, in the Columns
                           # menu (default: true shows at first), and its download's columns; the explorer's
    columns:
      - {id: map, label: Site map, show: map, fixed: true, hide: xs}
      - {id: ix, label: Interaction evidence, menu: Interaction evidence (sites), default: true,
         counts: {attribute: interaction, values: {experimental: exp., predicted_only: pred.}, dashed: [predicted_only]},
         help: "Sites in this selection with experimental interaction evidence, and with predicted evidence only"}
      - {id: idr, label: In IDR, classes: {analysis: disorder, classes: [disordered]}, default: true, hide: xs, help: "The share of the protein's sites in an IDR"}
      - {id: cond, label: Condensates, attribute: condensates, format: count, default: true, hide: sm, help: "CD-CODE condensates (human, not synthetic) the protein is a member of"}
      - {id: loc, label: Location (HPA), attribute: hpa, hide: sm,
         help: "Subcellular locations in the Human Protein Atlas (reliability Approved or better)"}
      - {id: density, label: Top cluster window, template: "{dense_sites} in {dense_window} aa", where: {attribute: dense_q, max: 0.05}, sort: dense_sites, default: true, hide: sm,
         help: "The window most significant against the same-protein arginine null (lowest q), not necessarily the densest"}
      - {id: arg, label: Arg enrichment, attribute: arg_enrichment, format: l2, hide: sm,
         help: "log2 of the shrinkage-estimated share of this protein's arginines that are methylated, over the proteome-wide rate"}
      - {id: len, label: Length, show: length}
      - {id: share, label: Share of its arginines, show: share, help: "Methylarginine sites over the protein's arginines"}
    download:              # the explorer's 27 columns but its functional classes (unpublished labels; not shown)
      - {name: gene, value: gene}
      - {name: uniprot_accession, value: accession}
      - {name: uniprot_id, value: entry}
      - {name: protein_name, value: protein}
      - {name: gene_aliases, value: aliases}
      - {name: methyl_r_sites_shown, value: marks_shown}
      - {name: methyl_r_sites_total, value: marks}
      - {name: length, value: length}
      - {name: arginines, value: candidates}
      - {name: shrinkage_log2_enrichment, attribute: arg_enrichment}
      - {name: arg_odds_q, attribute: arg_enrichment_q}
      - {name: sites_in_idr, classes: {analysis: disorder, classes: [disordered]}}
      - {name: condensates, attribute: condensates}
      - {name: disease_families_by_enriched_terms, attribute: disease_families}
      - {name: disease_family_gene_sets, attribute: disease_family_terms}
      - {name: als_ftd_audited_gene, attribute: als_ftd_gene}
      - {name: panther_group, attribute: panther_group}
      - {name: panther_class, attribute: panther_class}
      - {name: best_window_aa, attribute: dense_window}
      - {name: best_window_sites, attribute: dense_sites}
      - {name: best_window_start, attribute: dense_start}
      - {name: best_window_end, attribute: dense_end}
      - {name: best_window_q, attribute: dense_q}
      - {name: architecture_class, attribute: architecture}
      - {name: hpa_locations, attribute: hpa}
  selection_cards:         # "Your selection" for a selection of one set or one source: its words and its link
    condensate_proteome: {eyebrow: CD-CODE condensate, url: "https://cd-code.org/condensates/{set}", link: "CD-CODE {set}"}
    condensate: {eyebrow: CD-CODE condensate, url: "https://cd-code.org/condensates/{set}", link: "CD-CODE {set}"}
    reactome_top_level: {eyebrow: Reactome pathway, url: "https://reactome.org/content/detail/{set}", link: "Reactome {set}"}
    reactome_pathway: {eyebrow: Reactome pathway, url: "https://reactome.org/content/detail/{set}", link: "Reactome {set}"}
    disease_family: {eyebrow: Disease family (DisGeNET)}
    disease_family_additional: {eyebrow: "Disease family (DisGeNET, grouped automatically)"}
    panther_group: {eyebrow: PANTHER protein class group}
    panther_class: {eyebrow: PANTHER protein class}
    panther_subclass: {eyebrow: PANTHER protein subclass}
    "@studies": {eyebrow: Study or database}
  shown_marks:             # the lower-confidence view's sites shown and not counted (variants.with_lower_confidence left_out), as the explorer's "lower confidence" tag
    label: lower confidence
    help: Lower-confidence site, not counted as a site
    row: lower confidence, not counted
    shown_help: Not counted in any statistics
    counted:
      when: [{attribute: confidence, has: ["yes"]}]
      help: Counted in the statistics with lower-confidence sites
    tests:
      label: Tests (the record that passes most)
      attributes: [test_evidence, test_named, test_unique, test_methyl, test_localised]
    also: [earlier]
    note: "{all} lower-confidence sites are shown hatched beside the {others} sites. Counts, charts and tests include the {counted} whose own evidence covers the arginine and leaves the methyl group on it. The other {shown} are shown only."
  sites:                   # the Sites page: the explorer's columns (kit-sites.js)
    quick: [interaction]                   # the quick filters above the table (default: every colored attribute)
    state_label: State
    short: {state: {Rme1: Rme1, Rme2: Rme2, Rme1_Rme2: Rme1 + Rme2, "": No assigned state}, interaction: {none: None}}   # short labels in the table
    site_tags: {attribute: flags, values: {paralog_assigned: paralog}}                       # tags beside the site
    window: {label: motifs, colours: {G: "#15803d"}}                                                         # residues colored in the window
    tags:                  # the motif tags under the window: which, in what order (the CARM1-like proline motifs are not shown)
      motif: {order: [RG, RGG, GRG, GAR, RXR, DR, RD, ER, RE], hide: [CARM1_proline_rich, CARM1_hydrophobic_proline]}
    table:                 # the optional columns (the Columns menu): the explorer's defaults first; site card blocks read website.tables
      - {id: ix, label: Interaction evidence, show: [status, tags], default: true,
         help: "Experimental: an RNA or DNA crosslink at the residue, an RBDmap fragment covering it, or a PDB interface. Predicted only: an AlphaFold-Multimer interface or a confident predicted contact. Click a tag for the tables"}
      - {id: na, label: RNA/DNA contacts, menu: "RNA/DNA contacts (structures) and crosslinks (cells)", show: [sequences, around], sort: [nucleic_acid, evidence], default: true, hide: xs,
         help: "RNA or DNA within 4 Å of the side chain in PDB structures (within 8 Å, or at a residue i ± 1–5, without direct contact), or UV-crosslinked or RNA-bound within i ± 3 in cells. Hover for sequences"}
      - {id: prmt, label: PRMT perturbation, menu: "PRMT inhibitors, knockouts and knockdowns", show: [calls], sort: [gsk591, ms023, perturbation], default: true,
         help: "Change after GSK591 (PRMT5i) or MS023 (type I PRMTi), Maron 2021 Table S3, adj. p ≤ 0.05, or in the release's knockouts, knockdowns and inhibitors by the rule each names"}
      - {id: src, label: Reported by, attribute: studies, default: true, hide: sm}
      - {id: ctx, label: Context, menu: Disorder and domain context, analyses: [disorder, domain_context], hide: xs}
      - {id: nn, label: Nearest methyl‑R, show: [nearest], hide: sm}
      - {id: ip, label: Maron IP, menu: Maron methyl-IP, attribute: methyl_ip, hide: sm}
      - {id: dom, label: Nearest domain, show: [nearest_domain], hide: sm}
      - {id: struct, label: Structural context, analyses: [structure_context], hide: sm}
      - {id: tcga, label: Mutated in tumors (TCGA), attribute: tcga_any, hide: sm}
    download:              # the explorer's 54 columns where the release has them, and its own additions
