    experiments:                         # the Experiments on its methylation card
      input: functional_experiments_v1_4_3
      format: protein_records
      columns: {accession: uniprot_accession, position: position, region: region, perturbation: perturbation, system: system, species: species,
                readout: readout, direction: direction, finding: finding, figure: figure, reference: reference, doi: doi, read_from: read_from, in_release: in_release}
    clusters:                            # the Clustering card
      input: methylarginine_proteins_v1_4_3
      format: protein_records
      columns: {accession: uniprot_accession, spacing_min: nearest_spacing_min, spacing_median: nearest_spacing_median, max_3: max_sites_3aa, max_5: max_sites_5aa,
                max_10: max_sites_10aa, max_20: max_sites_20aa, max_50: max_sites_50aa, window_size: best_window_aa, window_start: best_window_start,
                window_end: best_window_end, window_sites: best_window_sites, window_log2: best_window_log2_obs_null, window_q: best_window_q,
                architecture: architecture_class, clusters: architecture_clusters}
  protein:                 # the protein page
    open_partners: true    # the Interaction partners fold is open when the protein has partners in the site's table
    order: [p-map, p-cc, p-ix, p-na, p-sites, p-score, p-pert, p-exp, p-struct, p-cond, p-dis, p-depmap, p-kinds, p-regions, p-cons, p-cluster, p-ptm, p-seq]   # the explorer's order
    open: [p-map, p-sites, p-cons, p-ix]   # the explorer's folds are all shut; here the map and the sites, and the orthologues and the network once they have data
    cards:                 # the context cards (kit-pcards.js; CONTRACTS.md, Protein page cards), each from the tables above
      location:
        title: Location and condensates
        summary: Human Protein Atlas locations, where the subcellular maps place it, and CD-CODE condensates
        hpa: {table: hpa, analysis: hpa_location, title: Subcellular location, source: Human Protein Atlas 25.1, url: "https://www.proteinatlas.org/search/{acc}", unsure: Uncertain}
        maps: true
        condensates:
          members: condensate_members
          names: condensates
          analysis: condensate_proteome
          title: Condensates
          source: CD-CODE 2.3
          url: "https://cd-code.org/condensates/{id}"
          max_score: 5
          default_type: biomolecular
          pubmed: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esummary.fcgi"
          roles: {member: member, driver: driver, client: client, regulator: regulator, unknown: role not given}
          evidence: {in_vivo: in vivo, in_cellulo: in cellulo, in_vitro: in vitro, frap: FRAP, colocalization: colocalisation, mass_spectrometry: mass spectrometry,
                     emergent properties: emergent properties, others: other}
      dependency:
        title: Cancer cell lines and tumours
        table: dependency
        unit: cancer cell lines
        sub: "Cancer genetics, not evidence about methylation: how much cancer cell lines depend on the gene in DepMap's CRISPR screens, and the protein changes at its arginines in TCGA tumours and DepMap cell lines."
        histogram: {from: -3, to: 1, axis: gene effect per cell line (Chronos); lower is a stronger dependency, marks: [{at: 0, label: no effect}, {at: -1, label: median of common essentials}]}
        url: "https://depmap.org/portal/gene/{gene}?tab=overview"
        note: "Data: DepMap Public 24Q4 (CRISPR, Chronos; CC BY 4.0) and TCGA tumours (MC3 somatic calls from the GDC, open access; based on data generated by the TCGA Research Network). A change counts only at an arginine of the canonical UniProt sequence."
      perturbations:
        title: PRMT inhibitors, knockouts and knockdowns
        sub: "Its sites in PRMT knockouts, knockdowns and inhibitors: did a peptide carrying the site change?"
        note: "A call is a peptide-level change: a site is decreased when a peptide carrying it decreased and none increased (twofold at q < 0.05, or the study's own call for the knockdowns and the PRMT7 inhibitor). Not quantified is left blank."
      experiments:
        title: Experiments on its methylation
        table: experiments
        sub: "Curated from the papers: what was done, what was measured and what changed. Kept apart from the site table and every statistic."
        note: "The table is in the release (supporting/functional_experiments). The curation is small and growing; a protein without rows has not been curated, not shown to lack experiments."
      clustering:
        title: Clustering
        table: clusters
        sub: How closely the methylarginines are spaced, and windows denser than chance.
        windows: [3, 5, 10, 20, 50]
      other_ptms:
        title: Other PTMs
        table: other_ptms
        sub: Other modifications recorded on this protein.
        kinds: {phospho: Phospho, lys_acyl: Lysine acylation, ub_sumo: Ubiquitin and SUMO, lys_methyl: Lysine methylation}
        near: 10
        note: "Not an exhaustive list: it holds only what the cross-PTM table used here contains (an iPTMnet export of HPRD, literature mining and other curated sources, plus UniProt), so modifications reported elsewhere may be missing."
    conservation:          # orthologues live from Ensembl Compara, and the selection's logo (CONTRACTS.md, Conservation across species)
      ensembl: {rest: "https://rest.ensembl.org", xref: Ensembl, source: human}
      species:             # mouse to yeast
        - {id: mus_musculus, label: Mouse}
        - {id: gallus_gallus, label: Chicken}
        - {id: xenopus_tropicalis, label: Frog}
        - {id: danio_rerio, label: Zebrafish}
        - {id: drosophila_melanogaster, label: Fly}
        - {id: caenorhabditis_elegans, label: Worm}
        - {id: saccharomyces_cerevisiae, label: Yeast}
      similar: [K]         # lysine is a conservative change from arginine
      logo: true
      logo_mode: freq      # the logo's first stack is residue frequency, as the explorer's; bits is a switch
    structure:             # the 3D viewer's evidence at the sites (CONTRACTS.md, Structure evidence), through the tables above
      contacts:            # PDBe-KB interfaces at the sites, with the PDB entries that show each
        table: interactions
        include: [{column: kind, in: [pdb_rna, pdb_dna, pdb_protein, pdb_self]}]
        kinds: {pdb_rna: rna, pdb_dna: dna, pdb_protein: protein, pdb_self: self}
        label: PDBe-KB interfaces at the methylarginines
        help: "PDB entries where the methylarginine is at an interface with RNA, DNA, another protein or another copy (PDBe-KB)"
      bound:               # the RNA or DNA each site touches (side chain within 4 Å), entry by entry
        table: contacts
        label: RNA and DNA bound at the methylarginine
        help: "Nucleotides within 4 Å of the side chain (CD, NE, CZ, NH1, NH2) in each PDB entry analysed"
      predicted:           # partners of predicted complexes with the site at the interface
        table: interactions
        include: [{column: kind, in: [predicted_interface, predicted_contact]}]
        label: Predicted complexes with the methylarginine at the interface
        help: "ProtVar (AlphaFold-Multimer, pDockQ at least 0.23) and AlphaFold DB complexes, as the release lists them"
      residues:
        table: chain_evidence
        colourings:
          - id: crosslinks
            label: RNA/DNA crosslinks (cells)
            none: No crosslink recorded
            help: "Residues crosslinked to RNA or DNA in living cells, and the fragments and peptides found bound"
            classes:
              - {id: both, label: Crosslinked to RNA and to DNA, colour: ev, all: [rna, dna]}
              - {id: rna, label: RNA-crosslinked residue, colour: rna, where: [{column: kind, contains: "rna_crosslink;"}]}
              - {id: dna, label: DNA-crosslinked residue, colour: dna, where: [{column: kind, equals: "dna_crosslink; at_residue"}]}
              - {id: rna_bound, label: "RNA-bound fragment or peptide (RBDmap, CAPRI, RBR-ID)", colour: rna_pale,
                 where: [{column: kind, in: ["rbdmap_fragment; in_fragment", "capri_xl_peptide; in_peptide", "capri_adj_peptide; in_fragment", "rbrid_residue; in_region", "rbrid_region; in_region"]}]}
              - {id: dna_bound, label: "DNA crosslink candidate, crosslinked peptide or DNA-binding region", colour: dna_pale,
                 where: [{column: kind, in: ["dna_crosslink; candidate_residue", "dna_crosslink; in_peptide", "dna_binding_region; in_region"]}]}
          - id: interfaces
            label: Interfaces in the PDB (PDBe-KB)
            none: At no interface in the PDB
            help: "Residues at an interface in a PDB entry (PDBe-KB) with RNA, DNA, another protein or another copy"
            classes:
              - {id: rna, label: RNA interface, colour: rna, where: [{column: kind, equals: "pdb_rna; at_residue"}]}
              - {id: dna, label: DNA interface, colour: dna, where: [{column: kind, equals: "pdb_dna; at_residue"}]}
              - {id: protein, label: Protein interface, colour: protein, where: [{column: kind, equals: "pdb_protein; at_residue"}]}
              - {id: self, label: Interface with another copy of the protein, colour: self, where: [{column: kind, equals: "pdb_self; at_residue"}]}
    sets:                  # cards of the protein's own sets, each linked to its page and selecting its proteins
      - id: p-dis
        title: Disease associations
        summary: "UniProt, Open Targets, Disease Ontology, DisGeNET terms and disease families"
        analyses: [disease_ontology, disease_term, disease_family, disease_family_additional]
        term_groups: {terms: disease_term, families: [disease_family, disease_family_additional]}
        live: {uniprot: true, open_targets: {graphql: "https://api.platform.opentargets.org/api/v4/graphql", size: 12, page: "https://platform.opentargets.org/target/{id}/associations"}}
    numbering:             # proteins numbered as papers do: histones without the initiator methionine (H3R2 is UniProt R3)
      - genes: "^(H1-\\d+|H2A[A-Z0-9-]*|H2B[A-Z0-9-]*|H3C\\d+|H3-\\d+[A-Z]?|H3Y\\d|H4C\\d+|H4-\\d+|MACROH2A\\d|CENPA)$"
        names: "^(putative |core )?histone (h1|h2a|h2b|h3|h4|macro-h2a)\\b|^testis-specific h1 histone|^histone h3-like centromeric"
        offset: -1
        label: histone numbering
        note: "Histone numbering, without the initiator methionine"
    facts:                 # the headline cards under the map: each opens its section, with a hover
      - {count: marks, of: candidates, label: "{residues} methylated", kind: Sites, glyph: pins, opens: p-seq,
         tip: {values: [{attribute: arg_enrichment, label: "Arginine methylation enrichment: log2", format: l2}, {attribute: arg_enrichment_q, label: q, format: p}]}}
      - {analysis: motif, best: true, label: "in {class} motifs", kind: Sequence motif, glyph: letters, opens: p-score}
      - {analysis: disorder, classes: [disordered], label: in disordered regions, kind: Position in the protein, glyph: wave, opens: p-regions}
      - {attribute: evidence, values: [rna_crosslink, rbdmap_fragment, capri_xl_peptide, capri_adj_peptide, pclap_peptide, pclap_lysc_region, rbrid_residue, rbrid_residue_published_rule, rbrid_region],
         label: in RNA-bound regions, kind: RNA · in living cells, glyph: squiggle, opens: p-sites,
         tip: "Methylarginines crosslinked to RNA in living cells, or inside an RNA-bound peptide or fragment (RBDmap, CAPRI, pCLAP) or an RBR-ID+ peptide"}
      - {analysis: condensate_proteome, best: true, label: "CD-CODE condensates, with {class}", kind: Condensates, glyph: drops, opens: p-kinds}
      - {analysis: disease_family, label: disease families, kind: Disease, glyph: cross, opens: p-kinds}
    card:                  # the site card: its blocks, each reading an attribute or a table above (a block without its data is absent)
      labels: {states: Methylation state, calls: PRMT perturbation, changes: In cancers, reported: Reported by}
      hide: [perturbation, nucleic_acid, nucleic_acid_type]   # attributes the blocks show in full (calls, bound sequences)
      evidence:            # interaction evidence: a badge, tags, PDB entries, bound RNA and DNA, crosslinks near it, the whole protein
        title: Interaction evidence
        status: interaction                  # the category attribute the badge shows
        sentences:
          experimental: This arginine has experimental interaction evidence.
          experimental_pred: This arginine has experimental interaction evidence and is also at a predicted interface.
          predicted_only: Predicted to sit at a protein interface; no experimental interaction evidence recorded yet.
          none: No interaction evidence is recorded at this residue. Most proteins were never crystallised, crosslinked or mutated, so this does not show there is none.
        tags:
          attribute: evidence
          short: {rna_crosslink: RNA xl, rbdmap_fragment: RBDmap, capri_xl_peptide: CAPRI, capri_adj_peptide: CAPRI, pclap_peptide: pCLAP, pclap_lysc_region: pCLAP,
                  rbrid_residue: RBR-ID, rbrid_residue_published_rule: RBR-ID, rbrid_region: RBR-ID, dna_crosslink: DNA xl, dna_binding_region: DNA-binding domain,
                  pdb_rna: RNA, pdb_dna: DNA, pdb_protein: protein, pdb_self: another copy, intact_mutation: mutation alters binding,
                  intact_binding_region: binding region, intact_methylated: methylated (IntAct), pdb_methylated_contact: PDB methyl-R, predicted_interface: pred., predicted_contact: pred.}
          tone: {rna_crosslink: a, rbdmap_fragment: a, capri_xl_peptide: a, capri_adj_peptide: a, pclap_peptide: a, pclap_lysc_region: a, rbrid_residue: a,
                 rbrid_residue_published_rule: a, rbrid_region: a, pdb_rna: a, dna_crosslink: b, dna_binding_region: b, pdb_dna: b,
                 pdb_protein: c, pdb_self: c, intact_mutation: c, intact_binding_region: c, intact_methylated: c, pdb_methylated_contact: c,
                 predicted_interface: pred, predicted_contact: pred}
          predicted: [predicted_interface, predicted_contact]     # values that alone make a status "predicted only" (the badge says "+ pred.")
          partners: interactions             # a site_evidence table: the partner named in a predicted tag, the rest in its hover
        entries:                             # the site's entries in structures, by kind (a site_evidence table)
          table: interactions
          kinds: {pdb_rna: RNA, pdb_dna: DNA, pdb_protein: "", pdb_self: another copy}   # "": the partner's name
          url: "https://www.rcsb.org/structure/{id}"
        sequences:                           # bound_windows tables: the RNA and DNA in contact in structures
          title: RNA and DNA contacts of {site}
          tables: [contacts, contacts_near]
          kinds: {rna: RNA, dna: DNA}
          types: {rrna: rRNA, trna: tRNA, snrna: snRNA, mrna: mRNA, other_ncrna: Other ncRNA, viral_rna: Viral RNA, rna_oligo: RNA oligo, other_rna: Other RNA,
                  nucleosomal_dna: Nucleosomal DNA, telomeric_dna: Telomeric DNA, other_dna: Other DNA}
          designed: {preparation: Synthetically obtained, label: oligo}
          ends: ["5′", "3′"]
          max: 5
        around:                              # a residue_evidence table: crosslinks and RNA-bound stretches at or near the site
          table: residues
          span: 3
          labels: {rna_crosslink: UV-crosslinked to RNA in living cells, dna_crosslink: UV-crosslinked to DNA in living cells,
                   rbdmap_fragment: inside RBDmap RNA-bound fragment, capri_xl_peptide: inside CAPRI RNA-crosslinked peptide,
                   capri_adj_peptide: inside CAPRI RNA-bound peptide (ADJ), rbrid_residue: under an RBR-ID+ peptide, rbrid_region: inside an RBR-ID region,
                   dna_binding_region: inside a UniProt DNA-binding region}
        protein:                             # the whole protein (proteins.attributes), labelled so it is not read as site evidence
          title: "Whole protein (not specific to {site})"
          values:
            - {attribute: string_partners, label: "STRING physical associations (≥ 0.7)"}
            - {attribute: complexes, label: complexes with methylated members}
            - {attribute: go_rna, label: GO RNA binding, flag: true}
            - {attribute: go_dna, label: GO DNA binding, flag: true}
            - {attribute: hpa, label: "HPA:", before: true}
          opens: p-ix
          opens_label: Interaction partners of {gene}
      states:              # the methylation state as each source gives it (a site_values table, or an attribute)
        - {table: site, column: methyl_states_reported, label: Source records}
        - {table: site, column: maron2021_s2_states, label: Maron 2021 Table S2, source: Maron2021}
        - {table: site, column: uniprot_states, label: UniProt, url: "https://www.uniprot.org/uniprotkb/{acc}/entry#ptm_processing"}
        - {attribute: neutral_loss, label: "Hartel 2019, neutral loss", source: Hartel2019}
        - {table: site, column: states_by_study_design, label: a study that looked for one state only}
      changes:             # changes of the residue, with how many tumours or lines carry each (counts: a site_values column in step)
        - {attribute: tcga, table: site, counts: tcga_change_tumours, unit: [tumour, tumours], label: TCGA}
        - {attribute: depmap, table: site, counts: depmap_change_lines, unit: [cell line, cell lines], label: DepMap}
      calls:               # a mark per decrease or increase: site_measurements tables and category attributes
        tables: [perturbations]
        attributes: {gsk591: GSK591, ms023: MS023}
        conditions: {carm1_ko_mcf7: CARM1 KO (MCF7), carm1_ko_mdamb231: CARM1 KO (MDA-MB-231), prmt7_ko_hct116: PRMT7 KO, prmt1_kd_hek293t: PRMT1 KD,
                     prmt5i_epz015666_hela: PRMT5i EPZ015666, prmt7_kd_hek293: PRMT7 KD, prmt7i_sgc3027_hek293: PRMT7i SGC3027, carm1_kd_hek293: CARM1 KD,
                     prmt5_kd_hek293: PRMT5 KD}
        marks: {decreased: "▼", increased: "▲", mixed: "↕"}
        words: {decreased: decreased, increased: increased, mixed: mixed, no_significant_change: no significant change}
        quiet: n.s.                          # the word for "measured, no change"
        skip: [not_tested, ""]
      records:             # a site_records table: who binds it, and how it was found
        title: Who binds it, and how it was found
        table: records
        groups: partner_class                # the attribute whose values name the groups
        help:
          writes: IntAct methylation reactions that curate this residue, or where mutating it changes the reaction
          removes: IntAct demethylation reactions with the methylarginine curated at this residue
          binds_methylated: "the residue is a methylarginine in the experiment, modelled as one in a structure (2MR, DA2, NMM) or curated as methylated in IntAct"
          mutation_changes_binding: "IntAct: mutating this residue (alone or with up to two neighbours) decreased, disrupted or increased binding"
          mutation_no_effect: "IntAct: a mutation of this residue had no effect on the binding"
          binds_unmodified: structures that model an unmodified arginine here (PDBe-KB interface)
          binds_other_residue: "structures with another residue here: a mutated construct or a natural variant"
          binds_state_not_read: PDBe-KB places an interface here, but the entry's sequence could not be matched to the site
          binds_region: IntAct binding regions of at most 20 residues; whether the site was methylated is not recorded
          other_reaction: IntAct reactions that IntAct does not place at this residue
          nucleic_acid: contacts in structures, crosslinks and RNA-bound peptides in cells, UniProt DNA-binding regions
          not_a_protein: "IntAct: a gene locus in chromatin immunoprecipitation, or a small molecule"
          self: homo-oligomer contacts in structures
          predicted: complex models (ProtVar, AlphaFold DB), not observations
        open: [writes, removes, binds_methylated, mutation_changes_binding, binds_region, other_reaction, not_a_protein]
        not_papers: [predicted]              # groups whose records are not counted among the papers
        kinds: {self: another copy, rna: RNA, dna: DNA, gene: Gene locus, small_molecule: Small molecule, peptide: Peptide or complex}
        species: Homo sapiens                # partners of another species are named with theirs
        urls: {PDB: "https://www.rcsb.org/structure/{id}", IntAct: "https://www.ebi.ac.uk/intact/details/interaction/{id}"}
        states: {arginine: R (unmodified), not_recorded: not recorded, not_read: not read, other_residue: variant, mutated: mutated}
      writer:              # writer and reader: who acts on it (site_records groups), a suggestion from the attributes, partners
        title: Writer and reader
        who:
          - {label: Methylates it, groups: [writes], none: no methylation reaction recorded at this residue (IntAct)}
          - {label: Demethylates it, groups: [removes]}
          - {label: Binds it methylated, groups: [binds_methylated], none: no structure or IntAct record with this residue methylated}
        suggest:
          label: Writer suggested
          rules:
            - {attribute: methyl_ip, has: [SDMA], suggests: PRMT5, because: "a peptide carrying it was recovered by the SDMA antibody (symmetric dimethylation, made by PRMT5)"}
            - {attribute: methyl_ip, has: [ADMA], suggests: type I PRMTs, because: "a peptide carrying it was recovered by the ADMA antibody (asymmetric dimethylation, made by type I PRMTs such as PRMT1 and CARM1)"}
            - {attribute: gsk591, has: [decreased], suggests: PRMT5, because: "a peptide carrying it decreased with the PRMT5 inhibitor GSK591, and none increased"}
            - {attribute: ms023, has: [decreased], suggests: type I PRMTs, because: "a peptide carrying it decreased with the type I PRMT inhibitor MS023, and none increased"}
            - {attribute: perturbation, has: ["carm1_ko_mcf7:decreased", "carm1_ko_mdamb231:decreased"], suggests: CARM1, replaces: type I PRMTs,
               because: "a peptide carrying it decreased in CARM1 knockout cells, and none increased"}
          none: "No writer suggested: no peptide carrying it was recovered by the ADMA or SDMA antibodies or fell with a PRMT inhibitor or knockout"
          sources: [Maron2021]
        partners:                            # a protein_partners table: its partners of some classes
          table: string
          classes: {prmt: "PRMTs associated with {gene}", tudor: "Tudor proteins associated with {gene}"}
          note: STRING physical, whole protein
          none: none at STRING ≥ 0.7
        note: "The suggestion is indirect. Antibodies, inhibitors and knockouts measure peptides, and a peptide with several methylarginines answers for any of them. No total-protein correction was made, and a decrease after PRMT loss does not show a direct substrate. STRING associations are to the whole protein and do not show that a partner methylates or reads this arginine. The records at the residue are under \"Who binds it\" above. Several Tudor domains read methyllysine instead."
      sources:             # a source_records table: every report of the site, in the sites table's Evidence row
        table: sources
        attribute: studies                   # the provenance attribute whose values name the sources
        checks:
          same_accession_position_verified: Reported position checked on the canonical sequence
          sequence_position_verified: Reported position is an arginine inside the matching peptide
          sequence_unique_canonical: Peptide fits one place in the canonical sequence
          sequence_unique_candidate: Peptide fits one place (reported on another isoform)
          sequence_closest_supported: Peptide fits several places; the nearest supported position is used
          same_accession_evidence_near_match: Peptide or window not in the current sequence; matched within 2 residues of the reported arginine
          canonical_evidence_near_match: Peptide or window not in the current sequence; matched within 2 residues of the reported arginine
        warn: [sequence_closest_supported, same_accession_evidence_near_match, canonical_evidence_near_match]
        tables: {maron2021_s5: via Maron et al. 2021 Table S5 (compiled sites), prometheusdb_mmc2: ProMetheusDB supplementary table mmc2}
      tables:              # site_table tables shown in the Evidence row, each with its words
        - table: inhibitors
          title: PRMT inhibitor response
          note: "Maron et al. 2021 Table S3, over the peptides carrying this site. A call means a peptide carrying the site changed (adj. p ≤ 0.05). A peptide with several methylarginines changes for any of them, so only the single-site column speaks for this arginine alone. The median is descriptive."
          source: Maron2021
          columns:
            - {column: antibody, label: Methyl-IP}
            - {column: inhibitor, label: Inhibitor}
            - {column: log2_diff_median, label: Median log2 change, format: l2}
            - {column: adj_p_min, label: Lowest adj. p, format: p}
            - {column: n_peptides, label: "Peptides (▼/▲)", with: [n_decreased, n_increased]}
            - {column: call, label: Peptide call, words: calls}
            - {column: call_single_site_peptides, label: Single-site peptides, words: calls}
      cite:                # how to cite a protein's sites: the provenance attribute's values, with a lookup table of the sources
        attribute: studies
        lookup: studies
        notices: {PSP: "PhosphoSitePlus® data (www.phosphosite.org) are licensed under CC BY-NC-SA 3.0: non-commercial use, with attribution, and adaptations shared under the same licence."}
    table:                 # the sites table: its columns (the Columns menu), the explorer's defaults first
      filter: interaction                # buttons that show only the sites of one value of this attribute
      columns:
        - {id: ix, label: Interaction evidence, show: [status, tags], default: true}
        - {id: na, label: RNA/DNA contacts, menu: "RNA/DNA contacts (structures) and crosslinks (cells)", show: [sequences, around], default: true}
        - {id: prmt, label: PRMT perturbation, menu: "PRMT inhibitors, knockouts and knockdowns", show: [calls], default: true}
        - {id: src, label: Reported by, attribute: studies, default: true}
        - {id: af, label: AlphaFold, menu: AlphaFold pLDDT, show: [plddt]}
        - {id: ctx, label: Context, menu: Disorder and domain context, analyses: [disorder, domain_context]}
        - {id: dom, label: Nearest domain, show: [nearest_domain]}
        - {id: nn, label: Nearest methyl-R, show: [nearest]}
        - {id: stev, label: State evidence, menu: "State evidence (Maron IP, Table S2, UniProt)", show: [states]}
        - {id: tcga, label: In cancers, menu: "Changes in tumours (TCGA) and cell lines (DepMap)", show: [changes]}
      nearest_domain: {table: site, name: nearest_domain_name, ref: nearest_domain_interpro, side: domain_side, distance: domain_edge_distance,
                       url: "https://www.ebi.ac.uk/interpro/entry/InterPro/{ref}/", sides: {N_terminal_to_domain: N-term, C_terminal_to_domain: C-term, inside: inside}}
    map:                   # the protein map: more ways to colour the sites, and rows of the release's own evidence
      colour_by:           # in this order; the original explorer's modes, from the sites' attributes
        - state
        - id: methyl_ip
          label: Maron methyl-IP
          help: "The antibodies whose immunoprecipitation recovered the site in Maron et al. 2021 (Table S3)"
          classes:
            - {label: Rme1 IP only, colour: "#2A78D6", colour_dark: "#3987E5", when: [{attribute: methyl_ip, has: [MMA]}, {attribute: methyl_ip, lacks: [ADMA, SDMA]}]}
            - {label: "Rme2a IP (no Rme2s)", colour: "#EB6834", colour_dark: "#D95926", when: [{attribute: methyl_ip, has: [ADMA]}, {attribute: methyl_ip, lacks: [SDMA]}]}
            - {label: Rme2s IP, colour: "#A23B12", colour_dark: "#F4A26B", when: [{attribute: methyl_ip, has: [SDMA]}]}
          otherwise: {label: Not in Maron IP, colour: "#A3AEB3", colour_dark: "#6D7D84"}
        - id: prmt_inhibitor
          label: PRMT inhibitor response
          help: "Maron et al. 2021: decreased with the PRMT5 inhibitor GSK591 or the type I inhibitor MS023 (a peptide down, none up), coloured by the methylation the enzyme makes (PRMT5 symmetric, type I asymmetric). Hollow: measured, not decreased"
          classes:
            - {label: "↓ GSK591 (PRMT5i)", colour: "#A23B12", colour_dark: "#F4A26B", when: [{attribute: gsk591, has: [decreased]}, {attribute: ms023, lacks: [decreased]}]}
            - {label: "↓ MS023 (type I PRMTi)", colour: "#EB6834", colour_dark: "#D95926", when: [{attribute: ms023, has: [decreased]}, {attribute: gsk591, lacks: [decreased]}]}
            - {label: "↓ both", colour: ink, when: [{attribute: gsk591, has: [decreased]}, {attribute: ms023, has: [decreased]}]}
            - {label: "Measured, not decreased", colour: "#A3AEB3", colour_dark: "#6D7D84", hollow: true, when: [{attribute: gsk591, empty: false}]}
          otherwise: {label: Not measured, colour: "#A3AEB3", colour_dark: "#6D7D84"}
        - id: carm1_ko
          label: CARM1 knockout
          help: "Shishkova et al. 2017: decreased in CARM1 knockout cells (twofold at q < 0.05 in either line). Hollow: measured, not decreased"
          classes:
            - {label: "↓ in CARM1 KO", colour: "#EB6834", colour_dark: "#D95926", when: [{attribute: perturbation, matches: "^carm1_ko_[^:]+:decreased$"}]}
            - {label: "Measured, not decreased", colour: "#A3AEB3", colour_dark: "#6D7D84", hollow: true, when: [{attribute: perturbation, matches: "^carm1_ko_[^:]+:(increased|mixed|no_significant_change)$"}]}
          otherwise: {label: Not measured, colour: "#A3AEB3", colour_dark: "#6D7D84"}
        - n_studies
        - interaction
        - tcga_any
        - confidence       # the lower-confidence view's (variants.with_lower_confidence.attributes)
      hatch: [{attribute: confidence, has: ["yes"]}]   # the lower-confidence view's added sites, hatched as the explorer drew them
      sources:             # each source the rows' items name: its paper (citations and DOIs as the release's site_interaction_records give them)
        pepR-MS: {cite: "Sha, Kuster & Trendel, bioRxiv (2025)", doi: 10.1101/2025.09.05.674461}
        pepR-MS_focused: {label: pepR-MS (focused sites), cite: "Sha, Kuster & Trendel, bioRxiv (2025)", doi: 10.1101/2025.09.05.674461}
        Kramer2014: {label: Kramer 2014, cite: "Kramer et al., Nat Methods 11:1064 (2014), re-analysed by Sha, Kuster & Trendel, bioRxiv (2025)", doi: 10.1038/nmeth.3092}
        XRNAX: {cite: "Trendel et al., Cell 176:391 (2019), re-analysed by Sha, Kuster & Trendel, bioRxiv (2025)", doi: 10.1016/j.cell.2018.11.004}
        RBS-ID: {cite: "Bae et al., Nat Struct Mol Biol 27:678 (2020), re-analysed by Sha, Kuster & Trendel, bioRxiv (2025)", doi: 10.1038/s41594-020-0436-2}
        pRBS-ID: {cite: "Bae et al., Nat Commun 12:6026 (2021), re-analysed by Sha, Kuster & Trendel, bioRxiv (2025)", doi: 10.1038/s41467-021-26317-5}
        RBDmap: {cite: "Castello et al., Mol Cell 63:696 (2016)", doi: 10.1016/j.molcel.2016.06.029}
        CAPRI: {cite: "Panhale et al., Nat Commun 10:2682 (2019)", doi: 10.1038/s41467-019-10585-3}
        pCLAP: {cite: "Mullari et al., J Proteome Res 16:2762 (2017)", doi: 10.1021/acs.jproteome.7b00042}
        RBR-ID: {cite: "Oksuz et al., Mol Cell 83:2449 (2023)", doi: 10.1016/j.molcel.2023.06.012}
        Trendel2025: {label: Trendel 2025, cite: "Trendel et al., Cell 188:4424 (2025)", doi: 10.1016/j.cell.2025.04.037}
        UniProt: {cite: "UniProt Consortium, Nucleic Acids Res 53:D609 (2025)", doi: 10.1093/nar/gkae1010}
        ProtVar: {cite: "Burke et al., Nat Struct Mol Biol 30:216 (2023); Stephenson et al., Nucleic Acids Res 52:W140 (2024)", doi: 10.1038/s41594-022-00910-8}
        IntAct: {cite: "IntAct curated interaction features", url: "https://www.ebi.ac.uk/intact/"}
      rows:                # each read from a release table, mapped to the map-row format (CONTRACTS.md, Map rows)
        - id: dense
          title: Dense methyl-R windows
          help: "Windows holding more methylarginines than the protein's arginines predict (release supporting/density_windows: shuffled-site null, q ≤ 0.05)"
          place: backbone
          from:
            role: density_windows
            columns: {accession: uniprot_accession, start: start, end: end, value: sites,
                      label: "{sites} sites in {window_aa} aa, log2 observed/null {log2_obs_over_null:.2f}, q {q:.2g}"}
          colour: "#111827"
          colour_dark: "#E8EFF2"
          opacity: 0.07
        - id: interpro_families
          title: InterPro families
          help: "Families and homologous superfamilies from InterPro 108.0: each entry's member-database hits merged"
          after: uni_dom
          default: "off"
          from:
            role: interpro_entries
            columns: {accession: canonical_UniProtAC, start: fragment_start, end: fragment_end, label: interpro_name, ref: interpro_accession, class: interpro_type}
          classes:
            family: {label: Family (InterPro)}
            homologous_superfamily: {label: Homologous superfamily (InterPro)}
          mark: named
          merge: true
          colour: "#ECE4CF"
          colour_dark: "#40391F"
          ink: "#4D4123"
          ink_dark: "#F0E6C8"
        - id: rg
          title: RG/RGG-rich
          help: "At least 3 RG dipeptides, consecutive ones at most 12 residues apart; RGG-rich when 2 or more are RGG"
          after: composition
          sequence: {motif: "RGG?", min: 3, gap: 12, label: RG-rich, words: "{n} RG dipeptides, {strong} RGG", strong: {motif: "^RGG$", min: 2, label: RGG-rich}}
          mark: named
          colour: "#F5D6DE"
          colour_dark: "#5A2C3A"
          ink: "#7A2E45"
          ink_dark: "#F6C9D6"
        - id: tcga
          title: Tumours (TCGA)
          help: "Somatic missense and stop changes of the site's arginine in TCGA tumours (MC3 public calls from the GDC, 33 projects); a taller tick means more tumours (tcga_changes, tcga_change_tumours)"
          after: mutagen
          from: {marks: true, columns: {label: tcga_changes, value: tcga_change_tumours}, split: "; "}
          mark: tick
          labels: marks
          value: {one: "in {n} tumour", many: "in {n} tumours", size: true}
          key: Change in tumours (TCGA)
        - id: depmap
          title: Cell lines (DepMap)
          help: "Missense and stop changes of the site's arginine in DepMap 24Q4 cancer cell lines; a taller tick means more lines (depmap_changes, depmap_change_lines)"
          after: tcga
          from: {marks: true, columns: {label: depmap_changes, value: depmap_change_lines}, split: "; "}
          mark: tick
          labels: marks
          value: {one: "in {n} cell line", many: "in {n} cell lines", size: true}
          key: Change in cell lines (DepMap)
        - id: rna_cells
          title: RNA in cells
          help: "Residues UV-crosslinked to RNA in living cells (pepR-MS compendium: Kramer 2014 re-analysis, XRNAX, RBS-ID, pRBS-ID, pepR-MS), RBDmap RNA-bound fragments (Castello et al. 2016, HeLa) and CAPRI RNA-bound peptides (Panhale et al. 2019, HEK293; paler for ADJ-peptides next to a crosslink). pCLAP (Mullari et al. 2017) is a flag at sites inside its peptides only"
          after: ptm
          from:
            - role: residue_evidence
              columns: {accession: uniprot_accession, start: start, end: end, class: evidence_type, sources: sources}
              include: [{column: evidence_type, in: [rna_crosslink, rbdmap_fragment, capri_xl_peptide, capri_adj_peptide]}]
            - {marks: true, columns: {class: interaction_evidence}, split: "; ", classes: [pclap_peptide, pclap_lysc_region]}   # the site table's pCLAP flags: no extents
          classes:
            capri_adj_peptide: {label: "CAPRI RNA-bound peptide (ADJ)", mark: box, opacity: 0.16, help: "a Lys-C peptide released next to an RNA crosslink (Panhale et al. 2019, HEK293)"}
            rbdmap_fragment: {label: RBDmap RNA-bound fragment, mark: box, opacity: 0.28, help: "an RNA-bound proteolytic fragment (Castello et al. 2016, HeLa)"}
            capri_xl_peptide: {label: "CAPRI RNA-crosslinked peptide (XL)", mark: box, opacity: 0.45, help: "identified with an RNA adduct (Panhale et al. 2019, HEK293)"}
            pclap_lysc_region: {label: "In a pCLAP RNA-binding region (site only)", mark: dot, opacity: 0.4, sources: [pCLAP], help: "the site lies in the Lys-C peptide around a pCLAP RNA-binding peptide (Mullari et al. 2017, HEK293); the region is not shown"}
            pclap_peptide: {label: "In a pCLAP RNA-binding peptide (site only)", mark: dot, opacity: 0.85, sources: [pCLAP], help: "the site lies in a peptide enriched from UV-crosslinked RNA-protein complexes (Mullari et al. 2017, HEK293); the peptide is not shown"}
            rna_crosslink: {label: RNA-crosslinked residue, mark: tick, help: "a residue UV-crosslinked to RNA in living cells"}
          colour: "#7B4FBF"
          colour_dark: "#A98BE0"
        - id: rbrid
          title: RBR-ID
          help: "RBR-ID (Oksuz et al. 2023, K562 nuclei): residues under a peptide depleted when RNA is 4SU-labelled and crosslinked, and regions whose smoothed score reaches the release's threshold"
          after: rna_cells
          from:
            role: residue_evidence
            columns: {accession: uniprot_accession, start: start, end: end, class: evidence_type, sources: sources}
            include: [{column: evidence_type, in: [rbrid_region, rbrid_residue]}]
          classes:
            rbrid_region: {label: RBR-ID region, mark: box, opacity: 0.18}
            rbrid_residue: {label: RBR-ID+ residues, mark: box, opacity: 0.55}
          colour: "#7B4FBF"
          colour_dark: "#A98BE0"
        - id: dna_cells
          title: DNA in cells
          help: "Residues UV-crosslinked to DNA in MCF7 cells, alone or as candidates, and crosslinked peptides (Trendel et al. 2025), plus UniProt DNA-binding regions"
          after: rbrid
          from:
            role: residue_evidence
            columns: {accession: uniprot_accession, start: start, end: end, class: [evidence_type, localisation], sources: sources}
            include: [{column: evidence_type, in: [dna_crosslink, dna_binding_region]}]
          classes:
            "dna_binding_region:in_region": {label: UniProt DNA-binding region, mark: box, opacity: 0.22, help: "an annotation, not evidence of contact"}
            "dna_crosslink:in_peptide": {label: DNA-crosslinked peptide, mark: box, opacity: 0.45}
            "dna_crosslink:candidate_residue": {label: DNA crosslink candidate, mark: box, opacity: 0.75, help: "one of several candidate residues of the crosslink"}
            "dna_crosslink:at_residue": {label: DNA-crosslinked residue, mark: tick}
          colour: "#B7791F"
          colour_dark: "#D9A548"
        - id: intact
          title: IntAct
          help: "IntAct features of interaction participants: binding regions mapped for a partner, and mutations that change an interaction"
          after: pdb
          default: "off"
          from:
            role: residue_evidence
            columns: {accession: uniprot_accession, start: start, end: end, class: evidence_type, value: n_partners, sources: sources}
            include: [{column: evidence_type, in: [intact_binding_region, intact_mutation]}]
          classes:
            intact_binding_region: {label: IntAct binding region, mark: box, opacity: 0.3}
            intact_mutation: {label: IntAct mutation that changes an interaction, mark: diamond}
          value: {one: "{n} record", many: "{n} records"}
          colour: "#0E7490"
          colour_dark: "#3FB5CF"
        - id: predicted
          title: Protein contact (predicted)
          help: "Residues at the partner interface of AlphaFold-Multimer models of human protein pairs (ProtVar, pDockQ ≥ 0.23), darker where more partners share them"
          after: intact
          from:
            role: residue_evidence
            columns: {accession: uniprot_accession, start: start, end: end, value: n_partners, label: "best pDockQ {best_score}", sources: sources}
            include: [{column: evidence_type, equals: predicted_interface}]
          mark: pred
          value: {one: "with up to {n} partner", many: "with up to {n} partners", opacity: [1, 5]}
          key: "Protein contact (predicted; darker: more partners)"
          colour: "#0E7490"
          colour_dark: "#3FB5CF"
        - id: lower_confidence
          title: Lower confidence
          help: "Arginines a study reports as methylated whose records each fail a site test (the release's lower-confidence sites). Not counted as sites"
          after: predicted
          default: "off"
          key: Lower-confidence evidence (not a site)
          from:
            role: lower_confidence_sites
            columns: {accession: uniprot_accession, position: position, label: "{studies}: {reasons}"}
            values:
              reasons: {below_threshold: "localisation score below the study's threshold", several_residues: "the methyl group is on one of several residues",
                        search_disagrees: "the study's confident spectra disagree on the residue", no_localising_evidence: "no spectrum or score localises it",
                        window_fits_several: "the study's window fits several arginines", several_sites: "the same sequence occurs at several sites",
                        other_protein: "the sequence names a site in another protein", not_in_reference: "the sequence is not in the reviewed protein"}
          mark: tick
          colour: "#5F6F78"
          colour_dark: "#93A8B0"
          opacity: 0.75
