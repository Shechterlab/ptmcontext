    - {label: What changed, url: "https://github.com/Shechterlab/PTM_Pipeline/blob/b0d9049835fbd2527075629f00a4ebab154221bf/releases/v1.4.3/CHANGES.md", format: Markdown, note: "the changes since the previous release"}
  legacy_params:            # the explorer's filter parameters (?states=2&motifs=1), in its own codes
    states: {key: "t:state", values: {"1": Rme1, "2": Rme2, "3": Rme1_Rme2, "0": ""}}
    ips: {key: "t:methyl_ip", values: {"0": MMA, "1": ADMA, "2": SDMA}}
    s2: {key: "t:maron_s2", values: {"0": Rme1, "1": Rme2}}
    motifs: {key: "a:motif", values: {"0": RG, "1": RGG, "2": GRG, "3": GAR, "4": RXR, "5": CARM1_proline_rich, "6": CARM1_hydrophobic_proline, "7": DR, "8": RD, "9": ER, "10": RE}}
    disorder: {key: "a:disorder", values: {"0": disordered, "1": disorder_boundary, "2": ordered}}
    sctx: {key: "a:structure_context", values: {"0": domain_folded, "1": domain_disordered, "2": ordered_outside_domain, "3": idr_near_domain, "4": idr_mid_domain, "5": idr_far_from_domain}}
    minRep: {key: "n:n_studies"}
    minSites: {key: "r:marks"}
    argEnriched: {key: "r:arg_enrichment_q", value: "0.05"}
    dense: {key: "r:dense_q", value: "0.05"}
    anyCond: {key: "p:condensate_proteome", value: "*"}
    lc: {variant: with_lower_confidence}
  search:                  # the search's words beyond genes and the questions' keys (kit-select.js, kit-search.js, kit-near.js)
    shorthand: {H4: P62805, H3: P68431, "H3.1": P68431, "H3.3": P84243}   # names papers use for a protein (H4R3, H3 R2)
    patterns:                # the motif finder: a pattern of residues on the sites' sequence windows
      at: motif              # motif:GXRG covers the site (motif families keep their names: motif:RGG)
      near: window           # window:PRPR anywhere within the span
      span: 15
    terms:                   # the explorer's other search words, as this site's filters
      go:
        label: Binds (Gene Ontology)
        help: "Gene Ontology binding: rna or dna"
        values:
          rna: {"r:go_rna": [experimental, other_evidence]}
          dna: {"r:go_dna": [experimental, other_evidence]}
      interaction:
        label: Interaction evidence
        help: "Interaction evidence at the site: experimental, predicted, predicted-only, any or none"
        values:
          experimental: {"t:interaction": [experimental]}
          predicted: {"t:evidence": [predicted_interface, predicted_contact]}
          predicted-only: {"t:interaction": [predicted_only]}
          any: {"t:interaction": [experimental, predicted_only]}
          none: {"t:interaction": [none]}
    spacing: {label: "Another methylarginine within", within: [2, 3, 5, 10, 20]}
    nearby:                  # a residue of another table within some residues of the site (residue_evidence tables)
      other_ptms:
        key: ptm
        label: Other PTM nearby
        help: "Another modification near the site, from the PTM master table (iPTMnet export, not exhaustive)"
        kinds: {phospho: "Phospho (S, T, Y)", lys_acyl: Lys acylation, ub_sumo: "Ub or SUMO (K)", lys_methyl: Lys methylation}
        within: [2, 5, 10, 20]
      residues:
        key: incell
        label: Crosslinked residue at the site or nearby
        help: "A residue UV-crosslinked to RNA or DNA in living cells, or a bound region, at or near the site"
        kinds: {rna_crosslink: RNA-crosslinked residue, dna_crosslink: DNA-crosslinked residue, rbdmap_fragment: RBDmap RNA-bound fragment,
                capri_xl_peptide: CAPRI XL peptide, capri_adj_peptide: CAPRI ADJ peptide, rbrid_residue: RBR-ID+ residue, rbrid_region: RBR-ID+ region,
                dna_binding_region: UniProt DNA-binding region}
        within: [0, 3, 5]
    partners:                # the proteins' physical partners (a protein_partners table)
      table: string
      key: binds
      label: Has a physical partner that is
      gene_label: Binds a specific protein
      score_label: STRING physical confidence
      help: "STRING 12.5 physical associations of the methylated protein (score 0.7 or more)"
      interpro: interpro_entries           # the InterPro entry intervals the classes' interpro ids are read from
      attribute: {id: bound_by, label: Partner classes of the protein, help: "The classes of the physical partners of the methylated protein"}
      classes:             # who is in each class: genes and InterPro ids; every PMID was read on PubMed
        writer_prmt:
          label: a PRMT (writer)
          role: writer
          reads: makes aDMA, sDMA and MMA
          genes: [PRMT1, PRMT2, PRMT3, CARM1, PRMT5, PRMT6, PRMT7, PRMT8, PRMT9]
          pmid: "37013969"
          help: "The protein arginine methyltransferases (Wang et al. 2023, review)"
        cofactor_prmt:
          label: a PRMT cofactor
          role: cofactor
          genes: [WDR77, CLNS1A, RIOK1]
          pmid: "23071334"
          help: "WDR77 (MEP50) is in the PRMT5 complex, and pICln (CLNS1A) and RIOK1 are PRMT5 substrate adaptors. They are not readers (Antonysamy et al. 2012; Guderian et al. 2011)"
        reader_tudor:
          label: a methylarginine-reading Tudor protein
          role: reader
          reads: sDMA (SMN, SPF30, SND1); aDMA and sDMA (TDRD3)
          genes: [SMN1, SMN2, SMNDC1, TDRD3, SND1]
          pmid: "22363433"
          help: "Tudor domains shown to bind methylarginine: SMN, SPF30 (SMNDC1) and TDRD3 (Liu et al. 2012), TDRD3 on histone tails (Yang et al. 2010), and the extended Tudor of SND1 (Liu et al. 2010)"
        tudor_other:
          label: another Tudor-domain protein
          role: reader
          reads: mostly methyllysine
          interpro: [IPR002999]
          except: [reader_tudor]
          pmid: "37013969"
          help: "Tudor domain (IPR002999) proteins without a curated methylarginine reading. Many read methyllysine, so these are not all arginine readers (Wang et al. 2023, review)"
        reader_spindlin:
          label: Spindlin1 (reader)
          role: reader
          reads: aDMA (H3R8me2a)
          genes: [SPIN1]
          pmid: "24589551"
          help: "Spindlin1 reads H3K4me3 together with H3R8me2a through its Tudor-like Spin/Ssty repeats (Su et al. 2014)"
        reader_wdr5:
          label: WDR5 (reader)
          role: reader
          reads: sDMA (H3R2me2s)
          genes: [WDR5]
          pmid: "22231400"
          help: "WDR5 binds H3R2me2s and not H3R2me2a (Migliori et al. 2012)"
        reader_sart3:
          label: SART3 (reader)
          role: reader
          reads: sDMA on GAR motifs
          genes: [SART3]
          pmid: "38985674"
          help: "SART3 reads methylarginine in glycine- and arginine-rich motifs through its HAT repeats (Wang et al. 2024)"
        antireader_uhrf1:
          label: UHRF1 (blocked by methylation)
          role: anti-reader
          reads: unmodified H3R2
          genes: [UHRF1]
          pmid: "21777816"
          help: "The PHD finger of UHRF1 binds unmodified H3R2 and is blocked by its methylation (Rajakumara et al. 2011)"
      marked: another methylated protein
      other: any other protein
      scores: [0.7, 0.9]
