            rbdmap_fragment: {label: "In an RBDmap RNA-bound fragment (site only)", mark: dot, opacity: 0.5, sources: [RBDmap], help: "the site lies in an RNA-bound proteolytic fragment (Castello et al. 2016, HeLa); the fragment is not shown"}
            capri_xl_peptide: {label: "CAPRI RNA-crosslinked peptide (XL)", mark: box, opacity: 0.45, help: "identified with an RNA adduct (Panhale et al. 2019, HEK293)"}
            pclap_lysc_region: {label: "In a pCLAP RNA-binding region (site only)", mark: dot, opacity: 0.4, sources: [pCLAP], help: "the site lies in the Lys-C peptide around a pCLAP RNA-binding peptide (Mullari et al. 2017, HEK293); the region is not shown"}
            pclap_peptide: {label: "In a pCLAP RNA-binding peptide (site only)", mark: dot, opacity: 0.85, sources: [pCLAP], help: "the site lies in a peptide enriched from UV-crosslinked RNA-protein complexes (Mullari et al. 2017, HEK293); the peptide is not shown"}
            rna_crosslink: {label: RNA-crosslinked residue, mark: tick, help: "a residue UV-crosslinked to RNA in living cells"}
          colour: "#7B4FBF"
          colour_dark: "#A98BE0"
        - id: rbrid
          title: RBR-ID
          help: "RBR-ID (Oksuz et al. 2023, K562 nuclei): residues under a peptide depleted when RNA is 4SU-labeled and crosslinked, and regions whose smoothed score reaches the release's threshold"
          after: rna_cells
          from:
            role: residue_evidence
