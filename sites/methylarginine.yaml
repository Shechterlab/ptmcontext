          colour_dark: "#A98BE0"
        - id: dna_cells
          title: DNA in cells
          help: "Residues UV-crosslinked to DNA in MCF7 cells, alone or as candidates, and crosslinked peptides (Trendel et al. 2025), plus UniProt DNA-binding regions"
          after: rbrid
          from:
            role: residue_evidence
            columns: {accession: uniprot_accession, start: start, end: end, class: [evidence_type, localisation], sources: sources}
            include: [{column: evidence_type, in: [dna_crosslink, dna_binding_region]}]
          classes:
            "dna_binding_region:in_region": {label: UniProt DNA-binding region, mark: box, opacity: 0.22, help: "an annotation, not evidence of contact"}
            "dna_crosslink:in_peptide": {label: DNA-crosslinked peptide, mark: box, opacity: 0.45}
            "dna_crosslink:candidate_residue": {label: DNA crosslink candidate, mark: box, opacity: 0.75, help: "one of several candidate residues of the crosslink"}
