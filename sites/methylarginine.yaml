  tables:                  # tables the protein pages show (no test reads them), each in a format of CONTRACTS.md ("Tables
                           # the protein pages show"); here the release's own tables, their columns mapped to the format's
    site:
      input: methylarginine_sites_v1_4_3
      format: site_values
      columns: {site: site_id}
      values: [methyl_states_reported, maron2021_s2_states, uniprot_states, states_by_study_design, tcga_change_tumours, depmap_change_lines,
               reported_positions, nearest_domain_interpro, nearest_domain_name, domain_side, domain_edge_distance,
               window_31, disorder_edge_distance, carm1_ko_call, curated_only, bound_sequence, bound_sequence_offset, shared_with_paralogs]   # the last: the Sites download
    proteins:                            # other names a search or an old link may use (#TDP-43); the facts are proteins.attributes
      input: methylarginine_proteins_v1_4_3
      format: protein_values
      columns: {accession: uniprot_accession, aliases: [gene_synonyms, reported_genes]}
    studies:
      input: methylarginine_studies_v1_4_3
      format: lookup
      columns: {key: study_id}
      values: [label, citation, doi, licence]
    interactions:
      input: methylarginine_site_interactions_v1_4_3
      format: site_evidence
      columns: {site: site_id, kind: evidence_type, partner: partner_gene, partner_accession: partner_accession, ids: structures, score: score, detail: detail}
    contacts:
      input: methylarginine_nucleic_acid_contacts_v1_4_3
      format: bound_windows
      columns: {site: site_id, window: window_marked, kind: nucleic_acid, type: nucleic_acid_type, name: molecule_name, entry: pdb_id,
                distance: closest_distance_a, preparation: sample_preparation, chain: chain, nucleotides: contacted_nucleotides,
                numbers: contacted_author_numbers, distances: contacted_distances_a}
    contacts_near:
      input: methylarginine_nucleic_acid_near_sites_v1_4_3
      format: bound_windows
      columns: {site: site_id, window: window_marked, kind: nucleic_acid, type: nucleic_acid_type, name: molecule_name, entry: pdb_id,
                entries: n_entries, offset: residue_offset, preparation: sample_preparation}
    residues:
      input: methylarginine_residue_evidence_v1_4_3
      format: residue_evidence
      columns: {accession: uniprot_accession, start: start, end: end, kind: evidence_type, source: sources}
      include: [{column: evidence_type, in: [rna_crosslink, dna_crosslink, capri_xl_peptide, capri_adj_peptide, rbrid_residue, rbrid_region, dna_binding_region]}]
    chain_evidence:        # the 3D viewer's colorings along the chain: each run's kind with where it falls (RBDmap and pCLAP left out:
      input: methylarginine_residue_evidence_v1_4_3      # their extents may not be republished: marks.attributes.evidence.presence_only)
      format: residue_evidence
      columns: {accession: uniprot_accession, start: start, end: end, kind: [evidence_type, localisation], source: sources}
      include: [{column: evidence_type, in: [rna_crosslink, dna_crosslink, capri_xl_peptide, capri_adj_peptide, rbrid_residue, rbrid_region,
                                             dna_binding_region, pdb_rna, pdb_dna, pdb_protein, pdb_self]}]
    records:
      input: methylarginine_site_interaction_records_v1_4_3
      format: site_records
      columns: {site: site_id, group: record_class, partner: partner_gene, partner_name: partner_name, partner_accession: partner_accession,
                partner_kind: partner_kind, species: partner_species, source: source, id: source_id, method: method, context: context,
                state: site_state, state_detail: state_detail, other_marks: other_marks, pubmed: pubmed, doi: doi, citation: citation,
                title: paper_title}
    perturbations:
      input: methylarginine_writer_perturbations_v1_4_3
      format: site_measurements
      columns: {site: site_id, condition: perturbation, call: call, n: n_peptides, n_down: n_decreased, n_up: n_increased,
                value: log2_treated_over_control, q: q, rule: call_criteria}
    inhibitors:
      input: methylarginine_maron2021_inhibitors_v1_4_3
      format: site_table
      columns: {site: site_id}
      values: [antibody, inhibitor, log2_diff_median, adj_p_min, n_peptides, n_decreased, n_increased, call, call_single_site_peptides]
    sources:
      input: methylarginine_source_records_v1_4_3
      format: source_records
      columns: {site: placed_site, source: study, doi: study_doi, reference: reference_text, pubmed: pmid, source_table: source_table,
                peptide: evidence_sequence, state: reported_methyl_state, enzyme: reported_enzyme, sample: reported_sample, detail: reported_detail,
                reported_accession: reported_accession, reported_position: reported_position, check: placement_code}
    string:
      input: methylarginine_protein_partners_v1_4_3
      format: protein_partners
      columns: {accession: uniprot_accession, partner_accession: partner_accession, partner: partner_gene, score: string_score,
                partner_marked: partner_methylated, classes: partner_classes}
    other_ptms:                          # other modifications on the methylated proteins: the Filters panel's "other PTM nearby"
      input: methylarginine_other_ptm_sites_v1_4_3
      format: residue_evidence
      exclude: [{column: ptm_type, in: [phospho, lys_methyl]}]   # phosphosites and methyllysines are the context marks (v1.5.0)
      columns: {accession: uniprot_accession, start: position, end: position, kind: ptm_type, source: evidence}
    nucleic_regions:       # runs of residues within 4 Å of RNA or DNA in PDB structures (the RNA and DNA interactions card)
      input: methylarginine_nucleic_acid_regions_v1_4_3
      format: protein_records
      columns: {accession: uniprot_accession}
      values: [start, end, nucleic_acid, n_entries, methylarginines]
    dna_motifs:            # JASPAR profiles of the protein
      input: methylarginine_dna_motifs_v1_4_3
      format: protein_records
      columns: {accession: uniprot_accession}
      values: [matrix_id, name, tf_class, tf_family, consensus]
    rna_bind_n_seq:        # ENCODE RNA Bind-n-Seq, in vitro
      input: methylarginine_rna_bind_n_seq_v1_4_3
      format: protein_records
      columns: {accession: uniprot_accession}
      values: [encode_experiment, concentration, top_5mers, top_5mer_R]
    eclip:                 # ENCODE and ENCORE eCLIP, in cells
      input: methylarginine_eclip_v1_4_3
      format: protein_records
      columns: {accession: uniprot_accession}
      values: [source, experiment, cell_line, n_peaks, peaks_CDS, peaks_UTR3, peaks_UTR5, peaks_noncoding_exon, peaks_intron, peaks_intergenic,
               top_target_genes, top_target_peaks, top_5mers, top_5mer_ratios, same_data_as]
    hpa:                                 # the Location and condensates card (CONTRACTS.md, Protein page cards)
      input: hpa_locations
      format: protein_records
      columns: {accession: canonical_UniProtAC, location: location, main: main, reliability: reliability}
    condensate_members:                  # every CD-CODE membership of the protein, with its confidence, roles, evidence and papers
      input: cdcode_members_2_3
      format: protein_records
      columns: {accession: uniprot_accession, condensate: condensate_uid, score: confidence_score, roles: roles, evidence: experimental_evidence, pmids: pmids}
    condensates:
      input: cdcode_condensates
      format: lookup
      sep: ","
      columns: {key: uid}
      values: [name, condensate_type]
    dependency:                          # the Cancer cell lines and tumors card
      input: depmap_gene_effect
      format: protein_records
      columns: {accession: canonical_UniProtAC, lines: lines, dependent: dependent_lines, median: median, common_essential: common_essential, histogram: histogram, lineages: most_dependent_lineages}
    experiments:                         # the Experiments on its methylation card
      input: functional_experiments_v1_4_3
      format: protein_records
      columns: {accession: uniprot_accession, position: position, region: region, perturbation: perturbation, system: system, species: species,
                readout: readout, direction: direction, finding: finding, figure: figure, reference: reference, doi: doi, read_from: read_from, in_release: in_release}
    clusters:                            # the Clustering card
      input: methylarginine_proteins_v1_4_3
      format: protein_records
      columns: {accession: uniprot_accession, spacing_min: nearest_spacing_min, spacing_median: nearest_spacing_median, max_3: max_sites_3aa, max_5: max_sites_5aa,
                max_10: max_sites_10aa, max_20: max_sites_20aa, max_50: max_sites_50aa, window_size: best_window_aa, window_start: best_window_start,
                window_end: best_window_end, window_sites: best_window_sites, window_log2: best_window_log2_obs_null, window_q: best_window_q,
                architecture: architecture_class, clusters: architecture_clusters}
    # tables only the Interactions page reads (website.pages)
    distances:             # every arginine of a methylated protein modeled with RNA or DNA, and its distance to each
      input: release_arginine_rna_distances
      format: site_table
      columns: {accession: uniprot_accession, position: position}
      values: [rna_distance_a, dna_distance_a, entries_with_rna, entries_with_dna]
    complexes:
      input: release_complexes
      format: page_rows
      columns: {}
      values: [complex_id, complex_name, curation, n_members, n_members_methylated, methylated_members, fold_enrichment, q]
    rbns:
      input: release_rna_bind_n_seq
      format: protein_values
      columns: {accession: uniprot_accession}
      values: [encode_experiment, concentration, top_5mers]
    htr_selex:
      input: release_htr_selex
      format: protein_values
      columns: {accession: uniprot_accession}
      values: [model_id, motif_kind, consensus]
    ix_dna_motifs:
      input: release_dna_motifs
      format: protein_values
      columns: {accession: uniprot_accession}
      values: [matrix_id, name, tf_family, consensus]
    ix_eclip:
      input: release_eclip
      format: protein_values
      columns: {accession: uniprot_accession}
      values: [experiment, source, cell_line, n_peaks, top_target_genes, top_5mers]
  protein:                 # the protein page
    open_partners: true    # the Interaction partners fold is open when the protein has partners in the site's table
    order: [p-map, p-cell, p-cc, p-ix, p-na, p-sites, p-cons, p-score, p-pert, p-exp, p-struct, p-cond, p-dis, p-depmap, p-kinds, p-regions, p-cluster, p-ptm, p-seq]   # the explorer's order, with the orthologs after the sites
    groups:                # about five headings, each holding its folds (website.protein.groups)
      - {id: g-overview, title: Overview and map, folds: [p-map, p-cell, p-kinds]}
      - {id: g-sites, title: Sites, folds: [p-sites, p-cons, p-score, p-pert, p-exp, p-cluster, p-ptm]}
      - {id: g-binding, title: Binding and contacts, folds: [p-cc, p-ix, p-na]}
      - {id: g-context, title: "Context: location, condensates, disease, cancer", switch: true, folds: [p-cond, p-dis, p-depmap]}
      - {id: g-structure, title: Structure and sequence, folds: [p-struct, p-regions, p-seq]}
    headings:              # the cards front end's folds under labeled headings, each fold in its group; "switch" adds the This protein / Dataset context switch
      - {id: h-ix, title: Interactions, folds: [p-cc, p-na]}
      - {id: h-sites, title: Sites and structure, folds: [p-score, p-pert, p-exp]}
      - {id: h-context, title: Protein context, switch: true, folds: [p-cond, p-dis, p-depmap, p-kinds, p-regions, p-cons]}
      - {id: h-seq, title: Sequence features, folds: [p-cluster, p-ptm, p-seq]}
    context:               # the sets a fold lists for the protein, each tested across the dataset (the Dataset context view)
      p-cond: [condensate_proteome, hpa_location]
      p-dis: [disease_family]
    open: [p-map, p-cell]   # the map and where in the cell open, every other fold shut
    cards:                 # the context cards (kit-pcards.js; CONTRACTS.md, Protein page cards), each from the tables above
      location:
        title: Location and condensates
        summary: Human Protein Atlas locations, where the subcellular maps find it, and CD-CODE condensates
        hpa: {table: hpa, analysis: hpa_location, title: Subcellular location, source: Human Protein Atlas 25.1, url: "https://www.proteinatlas.org/search/{acc}", unsure: Uncertain}
        maps: true
        rna_maps: [eclip_rna_apexseq, eclip_gene_tsaseq, eclip_gene_hic]
        condensates:
          members: condensate_members
          names: condensates
          analysis: condensate_proteome
          title: Condensates
          source: CD-CODE 2.3
          url: "https://cd-code.org/condensates/{id}"
          max_score: 5
          default_type: biomolecular
          pubmed: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esummary.fcgi"
          roles: {member: member, driver: driver, client: client, regulator: regulator, unknown: role not given}
          evidence: {in_vivo: in vivo, in_cellulo: in cellulo, in_vitro: in vitro, frap: FRAP, colocalization: colocalization, mass_spectrometry: mass spectrometry,
                     emergent properties: emergent properties, others: other}
      dependency:
        title: Cancer cell lines and tumors
        table: dependency
        unit: cancer cell lines
        sub: "Cancer genetics, not evidence about methylation: how much cancer cell lines depend on the gene in DepMap's CRISPR screens, and the protein changes at its arginines in TCGA tumors and DepMap cell lines."
        histogram: {from: -3, to: 1, axis: gene effect per cell line (Chronos); lower is a stronger dependency, marks: [{at: 0, label: no effect}, {at: -1, label: median of common essentials}]}
        url: "https://depmap.org/portal/gene/{gene}?tab=overview"
        note: "Data: DepMap Public 24Q4 (CRISPR, Chronos; CC BY 4.0) and TCGA tumors (MC3 somatic calls from the GDC, open access; based on data generated by the TCGA Research Network). A change counts only at an arginine of the canonical UniProt sequence."
      perturbations:
        title: PRMT inhibitors, knockouts and knockdowns
        sub: "Did a peptide containing the site change in PRMT knockouts, knockdowns or inhibitors?"
        note: "A call is a peptide-level change: a site is decreased when a peptide containing it decreased and none increased (twofold at q < 0.05, or the study's own call for the knockdowns and the PRMT7 inhibitor). Not quantified is left blank."
      experiments:
        title: Experiments on its methylation
        table: experiments
        sub: "Curated from the papers: what was done, what was measured and what changed. Kept apart from the site table and every statistic."
        note: "The table is in the release (supporting/functional_experiments). The curation is small and growing. A protein without rows is not yet curated, which does not mean it lacks experiments."
      clustering:
        title: Clustering
        table: clusters
        sub: How closely the methylarginines are spaced, and windows denser than chance.
        windows: [3, 5, 10, 20, 50]
      other_ptms:
        title: Other PTMs
        table: other_ptms
        sub: "Modifications recorded on this protein other than these (phosphosites and methyllysines, shown on the protein map and the site card)."
        kinds: {lys_acyl: Lysine acylation, ub_sumo: Ubiquitin and SUMO}
        near: 10
        note: "Not an exhaustive list: it holds only what the cross-PTM table used here contains (an iPTMnet export of HPRD, literature mining and other curated sources, plus UniProt), so modifications reported elsewhere may be missing."
    nucleic:               # the RNA and DNA interactions card (CONTRACTS.md, RNA and DNA interactions)
      title: RNA and DNA interactions
      kinds: {rna: RNA, dna: DNA}
      near: {table: contacts_near, label: "in contact through a neighboring residue"}
      regions:
        table: nucleic_regions
        kinds: {rna: rna, dna: dna}
        fields: {start: start, end: end, kind: nucleic_acid, entries: n_entries, sites: methylarginines}
      crosslinks:          # single residues only: no peptide or fragment is listed
        table: residues
        span: 5
        kinds: {rna_crosslink: rna, dna_crosslink: dna}
      flags:               # per-site flags only: the marks inside an RNA-bound peptide or fragment, never its sequence or extent
        attribute: evidence
        kind: rna
        values: {rbdmap_fragment: RBDmap, capri_xl_peptide: CAPRI, capri_adj_peptide: CAPRI, pclap_peptide: pCLAP, pclap_lysc_region: pCLAP, rbrid_residue: RBR-ID, rbrid_region: RBR-ID}
      motifs:
        table: dna_motifs
        kind: dna
        url: "https://jaspar.elixir.no/matrix/{id}/"
        fields: {id: matrix_id, name: name, class: tf_class, family: tf_family, consensus: consensus}
      rbns:
        table: rna_bind_n_seq
        kind: rna
        url: "https://www.encodeproject.org/experiments/{id}/"
        fields: {id: encode_experiment, conc: concentration, kmers: top_5mers, scores: top_5mer_R}
      eclip:
        table: eclip
        kind: rna
        url: {ENCODE: "https://www.encodeproject.org/experiments/{id}/", ENCORE: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE315407"}
        fields: {id: experiment, source: source, cell: cell_line, peaks: n_peaks, genes: top_target_genes, gene_peaks: top_target_peaks, kmers: top_5mers, ratios: top_5mer_ratios, same: same_data_as,
                 regions: {CDS: peaks_CDS, "3′ UTR": peaks_UTR3, "5′ UTR": peaks_UTR5, "non-coding exon": peaks_noncoding_exon, intron: peaks_intron, intergenic: peaks_intergenic}}
    conservation:          # orthologs live from Ensembl Compara, and the selection's logo (CONTRACTS.md, Conservation across species)
      reference: Human
      ensembl: {rest: "https://rest.ensembl.org", xref: Ensembl, source: human}
      species:             # every species a set below can name, with the label shown (all in Ensembl Compara's vertebrate set)
        - {id: mus_musculus, label: Mouse}
        - {id: rattus_norvegicus, label: Rat}
        - {id: canis_lupus_familiaris, label: Dog}
        - {id: bos_taurus, label: Cow}
        - {id: macaca_mulatta, label: Macaque}
        - {id: monodelphis_domestica, label: Opossum}
        - {id: gallus_gallus, label: Chicken}
        - {id: anolis_carolinensis, label: Lizard}
        - {id: xenopus_tropicalis, label: Frog}
        - {id: danio_rerio, label: Zebrafish}
        - {id: callorhinchus_milii, label: Elephant shark}
        - {id: ciona_intestinalis, label: Sea squirt}
        - {id: drosophila_melanogaster, label: Fly}
        - {id: caenorhabditis_elegans, label: Worm}
        - {id: saccharomyces_cerevisiae, label: Yeast}
      presets:             # the reader's choice, remembered in the browser; each set spans a range that still aligns well
        - {id: mammals, label: Mammals, species: [mus_musculus, rattus_norvegicus, canis_lupus_familiaris, bos_taurus, macaca_mulatta, monodelphis_domestica],
           note: "close relatives: almost every site aligns"}
        - {id: vertebrates, label: Vertebrates, species: [mus_musculus, gallus_gallus, anolis_carolinensis, xenopus_tropicalis, danio_rerio, callorhinchus_milii],
           note: "from mouse to the elephant shark"}
        - {id: animals, label: Animals, species: [mus_musculus, gallus_gallus, xenopus_tropicalis, danio_rerio, ciona_intestinalis, drosophila_melanogaster, caenorhabditis_elegans],
           note: "vertebrates, a sea squirt, the fly and the worm"}
        - {id: to_yeast, label: To yeast, species: [mus_musculus, gallus_gallus, xenopus_tropicalis, danio_rerio, drosophila_melanogaster, caenorhabditis_elegans, saccharomyces_cerevisiae],
           note: "the explorer's set: mouse to budding yeast; few proteins have a yeast relative"}
      default: to_yeast
      similar: [K]         # lysine is a conservative change from arginine
      logo: true
      logo_mode: freq      # the logo's first stack is residue frequency, as the explorer's; bits is a switch
    structure:             # the 3D viewer's evidence at the sites (CONTRACTS.md, Structure evidence), through the tables above
      contacts:            # PDBe-KB interfaces at the sites, with the PDB entries that show each
        table: interactions
        include: [{column: kind, in: [pdb_rna, pdb_dna, pdb_protein, pdb_self]}]
        kinds: {pdb_rna: rna, pdb_dna: dna, pdb_protein: protein, pdb_self: self}
        label: PDBe-KB interfaces at the methylarginines
        help: "PDB entries where the methylarginine is at an interface with RNA, DNA, another protein or another copy (PDBe-KB)"
      bound:               # the RNA or DNA each site touches (side chain within 4 Å), entry by entry
        table: contacts
        label: RNA and DNA bound at the methylarginine
        help: "Nucleotides within 4 Å of the side chain (CD, NE, CZ, NH1, NH2) in each PDB entry analyzed"
      predicted:           # partners of predicted complexes with the site at the interface
        table: interactions
        include: [{column: kind, in: [predicted_interface, predicted_contact]}]
        label: Predicted complexes with the methylarginine at the interface
        help: "ProtVar (AlphaFold-Multimer, pDockQ at least 0.23) and AlphaFold DB complexes, as the release lists them"
      residues:
        table: chain_evidence
        colourings:
          - id: crosslinks
            label: RNA/DNA crosslinks (cells)
            none: No crosslink recorded
            help: "Residues crosslinked to RNA or DNA in living cells, and the fragments and peptides found bound"
            classes:
              - {id: both, label: Crosslinked to RNA and to DNA, colour: ev, all: [rna, dna]}
              - {id: rna, label: RNA-crosslinked residue, colour: rna, where: [{column: kind, contains: "rna_crosslink;"}]}
              - {id: dna, label: DNA-crosslinked residue, colour: dna, where: [{column: kind, equals: "dna_crosslink; at_residue"}]}
              - {id: rna_bound, label: "RNA-bound peptide or region (CAPRI, RBR-ID)", colour: rna_pale,
                 where: [{column: kind, in: ["capri_xl_peptide; in_peptide", "capri_adj_peptide; in_fragment", "rbrid_residue; in_region", "rbrid_region; in_region"]}]}
              - {id: dna_bound, label: "DNA-bound peptide or region (crosslink, DNA-binding)", colour: dna_pale,
                 where: [{column: kind, in: ["dna_crosslink; candidate_residue", "dna_crosslink; in_peptide", "dna_binding_region; in_region"]}]}
          - id: interfaces
            label: Interfaces in the PDB (PDBe-KB)
            none: At no interface in the PDB
            help: "Residues at an interface in a PDB entry (PDBe-KB) with RNA, DNA, another protein or another copy"
            classes:
              - {id: rna, label: RNA interface, colour: rna, where: [{column: kind, equals: "pdb_rna; at_residue"}]}
              - {id: dna, label: DNA interface, colour: dna, where: [{column: kind, equals: "pdb_dna; at_residue"}]}
              - {id: protein, label: Protein interface, colour: protein, where: [{column: kind, equals: "pdb_protein; at_residue"}]}
              - {id: self, label: Interface with another copy of the protein, colour: self, where: [{column: kind, equals: "pdb_self; at_residue"}]}
    sets:                  # cards of the protein's own sets, each linked to its page and selecting its proteins
      - id: p-dis
        title: Disease associations
        summary: "UniProt, Open Targets, Disease Ontology, DisGeNET terms and disease families"
        analyses: [disease_ontology, disease_term, disease_family, disease_family_additional]
        term_groups: {terms: disease_term, families: [disease_family, disease_family_additional]}
        live: {uniprot: true, open_targets: {graphql: "https://api.platform.opentargets.org/api/v4/graphql", size: 12, page: "https://platform.opentargets.org/target/{id}/associations"}}
    numbering:             # proteins numbered as papers do: histones without the initiator methionine (H3R2 is UniProt R3)
      - genes: "^(H1-\\d+|H2A[A-Z0-9-]*|H2B[A-Z0-9-]*|H3C\\d+|H3-\\d+[A-Z]?|H3Y\\d|H4C\\d+|H4-\\d+|MACROH2A\\d|CENPA)$"
        names: "^(putative |core )?histone (h1|h2a|h2b|h3|h4|macro-h2a)\\b|^testis-specific h1 histone|^histone h3-like centromeric"
        offset: -1
        label: histone numbering
        note: "Histone numbering, without the initiator methionine"
    facts:                 # the headline cards under the map: each opens its section, with a hover
      - {count: marks, of: candidates, label: "{residues} methylated", kind: Sites, glyph: pins, opens: p-seq,
         tip: {values: [{attribute: arg_enrichment, label: "Arginine methylation enrichment: log2", format: l2}, {attribute: arg_enrichment_q, label: q, format: p}]}}
      - {analysis: motif, best: true, label: "in {class} motifs", kind: Sequence motif, glyph: letters, opens: p-score}
      - {analysis: disorder, classes: [disordered], label: in disordered regions, kind: Position in the protein, glyph: wave, opens: p-regions}
      - {attribute: evidence, values: [rna_crosslink, rbdmap_fragment, capri_xl_peptide, capri_adj_peptide, pclap_peptide, pclap_lysc_region, rbrid_residue, rbrid_residue_published_rule, rbrid_region],
         label: in RNA-bound fragments or peptides, kind: "Seen in cells, not a direct contact", glyph: squiggle, opens: p-sites,
         tip: "Methylarginines crosslinked to RNA in living cells, or inside an RNA-bound peptide or fragment (RBDmap, CAPRI, pCLAP) or an RBR-ID+ peptide. This is where RNA binds in cells, not a structural contact: the RNA and DNA interactions section counts the sites whose side chain is within 4 Å of a nucleic acid in a PDB structure"}
      - {analysis: condensate_proteome, best: true, label: "CD-CODE condensates, with {class}", kind: Condensates, glyph: drops, opens: p-kinds}
      - {analysis: disease_family, label: disease families, kind: Disease, glyph: cross, opens: p-kinds, hide_in: cards}
    card:                  # the site card: its blocks, each reading an attribute or a table above (a block without its data is absent)
      labels: {states: Methylation state, calls: PRMT perturbation, changes: In cancers, reported: Reported by}
      hide: [perturbation, nucleic_acid, nucleic_acid_type, n_studies, partner_class]   # attributes the blocks show in full (calls, bound sequences; the study count the Reported by list gives; the partner classes the Writer and reader block gives)
      hide_questions: [cancer_change]        # questions whose row repeats a block (the changes in cancers, under Variants)
      primary_questions: [motif, disorder, domain_class, idr_charge]    # the question rows shown at once; the rest are behind "All site features"
      merge:                                 # the same question asked at several windows: one row, equal answers once
        - label: Aromatic residues nearby
          analyses: [sticker_context_3, sticker_context_5, sticker_context_3_idr, sticker_context_5_idr]
          parts: ["±3", "±5", "±3 in IDRs", "±5 in IDRs"]
          strip: " within ±\\d+$"
          primary: true
      evidence:            # interaction evidence: a badge, tags, PDB entries, bound RNA and DNA, crosslinks near it, the whole protein
        title: Interaction evidence
        status: interaction                  # the category attribute the badge shows
        sentences:
          experimental: This arginine has experimental interaction evidence.
          experimental_pred: This arginine has experimental interaction evidence and is also at a predicted interface.
          predicted_only: Predicted to lie at a protein interface. No experimental interaction evidence recorded yet.
          none: No interaction evidence is recorded at this residue. Most proteins were never crystallized, crosslinked or mutated, so this does not show there is none.
        tags:
          attribute: evidence
          short: {rna_crosslink: RNA xl, rbdmap_fragment: RBDmap, capri_xl_peptide: CAPRI, capri_adj_peptide: CAPRI, pclap_peptide: pCLAP, pclap_lysc_region: pCLAP,
                  rbrid_residue: RBR-ID, rbrid_residue_published_rule: RBR-ID, rbrid_region: RBR-ID, dna_crosslink: DNA xl, dna_binding_region: DNA-binding domain,
                  pdb_rna: RNA, pdb_dna: DNA, pdb_protein: protein, pdb_self: another copy, intact_mutation: mutation alters binding,
                  intact_binding_region: binding region, intact_methylated: methylated (IntAct), pdb_methylated_contact: PDB methyl-R, predicted_interface: pred., predicted_contact: pred.}
          tone: {rna_crosslink: a, rbdmap_fragment: a, capri_xl_peptide: a, capri_adj_peptide: a, pclap_peptide: a, pclap_lysc_region: a, rbrid_residue: a,
                 rbrid_residue_published_rule: a, rbrid_region: a, pdb_rna: a, dna_crosslink: b, dna_binding_region: b, pdb_dna: b,
                 pdb_protein: c, pdb_self: c, intact_mutation: c, intact_binding_region: c, intact_methylated: c, pdb_methylated_contact: c,
                 predicted_interface: pred, predicted_contact: pred}
          predicted: [predicted_interface, predicted_contact]     # values that alone make a status "predicted only" (the badge says "+ pred.")
          partners: interactions             # a site_evidence table: the partner named in a predicted tag, the rest in its hover
          named: [pdb_protein]               # a tag of these kinds names the partner and the PDB entries that show it ("TNPO1 4FDD, 4FQ3 +4")
        entries:                             # the site's entries in structures, by kind (a site_evidence table)
          table: interactions
          kinds: {pdb_rna: RNA, pdb_dna: DNA, pdb_protein: "", pdb_self: another copy}   # "": the partner's name
          url: "https://www.rcsb.org/structure/{id}"
        sequences:                           # bound_windows tables: the RNA and DNA in contact in structures
          title: RNA and DNA contacts of {site}
          tables: [contacts, contacts_near]
          kinds: {rna: RNA, dna: DNA}
          types: {rrna: rRNA, trna: tRNA, snrna: snRNA, mrna: mRNA, other_ncrna: Other ncRNA, viral_rna: Viral RNA, rna_oligo: RNA oligo, other_rna: Other RNA,
                  nucleosomal_dna: Nucleosomal DNA, telomeric_dna: Telomeric DNA, other_dna: Other DNA}
          designed: {preparation: Synthetically obtained, label: oligo}
          ends: ["5′", "3′"]
          max: 5
        around:                              # a residue_evidence table: crosslinks and RNA-bound stretches at or near the site
          table: residues
          span: 3
          labels: {rna_crosslink: UV-crosslinked to RNA in living cells, dna_crosslink: UV-crosslinked to DNA in living cells,
                   capri_xl_peptide: inside CAPRI RNA-crosslinked peptide,
                   capri_adj_peptide: inside CAPRI RNA-bound peptide (ADJ), rbrid_residue: under an RBR-ID+ peptide, rbrid_region: inside an RBR-ID region,
                   dna_binding_region: inside a UniProt DNA-binding region}
        protein:                             # the whole protein (proteins.attributes), labeled so it is not read as site evidence
          title: "Whole protein (not specific to {site})"
          values:
            - {attribute: string_partners, label: "STRING physical associations (≥ 0.7)"}
            - {attribute: complexes, label: complexes with methylated members}
            - {attribute: go_rna, label: GO RNA binding, flag: true}
            - {attribute: go_dna, label: GO DNA binding, flag: true}
            - {attribute: hpa, label: "HPA:", before: true}
          opens: p-ix
          opens_label: Interaction partners of {gene}
      states:              # the methylation state as each source gives it (a site_values table, or an attribute)
        - {table: site, column: methyl_states_reported, label: Source records}
        - {table: site, column: maron2021_s2_states, label: Maron 2021 Table S2, source: Maron2021}
        - {table: site, column: uniprot_states, label: UniProt, url: "https://www.uniprot.org/uniprotkb/{acc}/entry#ptm_processing"}
        - {attribute: neutral_loss, label: "Hartel 2019, neutral loss", source: Hartel2019}
        - {table: site, column: states_by_study_design, label: a study that looked for one state only}
      changes:             # changes of the residue, with how many tumors or lines carry each (counts: a site_values column in step)
        - {attribute: tcga, table: site, counts: tcga_change_tumours, unit: [tumor, tumors], label: TCGA}
        - {attribute: depmap, table: site, counts: depmap_change_lines, unit: [cell line, cell lines], label: DepMap}
      calls:               # a mark per decrease or increase: site_measurements tables and category attributes
        tables: [perturbations]
        attributes: {gsk591: GSK591, ms023: MS023}
        conditions: {carm1_ko_mcf7: CARM1 KO (MCF7), carm1_ko_mdamb231: CARM1 KO (MDA-MB-231), prmt7_ko_hct116: PRMT7 KO, prmt1_kd_hek293t: PRMT1 KD,
                     prmt5i_epz015666_hela: PRMT5i EPZ015666, prmt7_kd_hek293: PRMT7 KD, prmt7i_sgc3027_hek293: PRMT7i SGC3027, carm1_kd_hek293: CARM1 KD,
                     prmt5_kd_hek293: PRMT5 KD}
        marks: {decreased: "▼", increased: "▲", mixed: "↕"}
        words: {decreased: decreased, increased: increased, mixed: mixed, no_significant_change: no significant change}
        quiet: n.s.                          # the word for "measured, no change"
        skip: [not_tested, ""]
      records:             # a site_records table: who binds it, and how it was found
        title: Who binds it, and how it was found
        table: records
        groups: partner_class                # the attribute whose values name the groups
        help:
          writes: IntAct methylation reactions that curate this residue, or where mutating it changes the reaction
          removes: IntAct demethylation reactions with the methylarginine curated at this residue
          binds_methylated: "the residue is a methylarginine in the experiment, modeled as one in a structure (2MR, DA2, NMM) or curated as methylated in IntAct"
          mutation_changes_binding: "IntAct: mutating this residue (alone or with up to two neighbors) decreased, disrupted or increased binding"
          mutation_no_effect: "IntAct: a mutation of this residue had no effect on the binding"
          binds_unmodified: structures that model an unmodified arginine here (PDBe-KB interface)
          binds_other_residue: "structures with another residue here: a mutated construct or a natural variant"
          binds_state_not_read: PDBe-KB places an interface here, but the entry's sequence could not be matched to the site
          binds_region: IntAct binding regions of at most 20 residues. Whether the site was methylated is not recorded
          other_reaction: IntAct reactions that IntAct does not place at this residue
          nucleic_acid: contacts in structures, crosslinks and RNA-bound peptides in cells, UniProt DNA-binding regions
          not_a_protein: "IntAct: a gene locus in chromatin immunoprecipitation, or a small molecule"
          self: homo-oligomer contacts in structures
          predicted: complex models (ProtVar, AlphaFold DB), not observations
        open: [writes, removes, binds_methylated, mutation_changes_binding, binds_region, other_reaction, not_a_protein]
        not_papers: [predicted]              # groups whose records are not counted among the papers
        kinds: {self: another copy, rna: RNA, dna: DNA, gene: Gene locus, small_molecule: Small molecule, peptide: Peptide or complex}
        species: Homo sapiens                # partners of another species are named with theirs
        urls: {PDB: "https://www.rcsb.org/structure/{id}", IntAct: "https://www.ebi.ac.uk/intact/details/interaction/{id}"}
        states: {arginine: R (unmodified), not_recorded: not recorded, not_read: not read, other_residue: variant, mutated: mutated}
      writer:              # writer and reader: who acts on it (site_records groups), a suggestion from the attributes, partners
        title: Writer and reader
        who:
          - {label: Methylates it, groups: [writes], none: no methylation reaction recorded at this residue (IntAct)}
          - {label: Demethylates it, groups: [removes]}
          - {label: Binds it methylated, groups: [binds_methylated], none: no structure or IntAct record with this residue methylated}
        suggest:
          label: Writer suggested
          rules:
            - {attribute: methyl_ip, has: [SDMA], suggests: PRMT5, because: "a peptide containing it was recovered by the SDMA antibody (symmetric dimethylation, made by PRMT5)"}
            - {attribute: methyl_ip, has: [ADMA], suggests: type I PRMTs, because: "a peptide containing it was recovered by the ADMA antibody (asymmetric dimethylation, made by type I PRMTs such as PRMT1 and CARM1)"}
            - {attribute: gsk591, has: [decreased], suggests: PRMT5, because: "a peptide containing it decreased with the PRMT5 inhibitor GSK591, and none increased"}
            - {attribute: ms023, has: [decreased], suggests: type I PRMTs, because: "a peptide containing it decreased with the type I PRMT inhibitor MS023, and none increased"}
            - {attribute: perturbation, has: ["carm1_ko_mcf7:decreased", "carm1_ko_mdamb231:decreased"], suggests: CARM1, replaces: type I PRMTs,
               because: "a peptide containing it decreased in CARM1 knockout cells, and none increased"}
          none: "No writer suggested: no peptide containing it was recovered by the ADMA or SDMA antibodies or fell with a PRMT inhibitor or knockout"
          sources: [Maron2021]
        partners:                            # a protein_partners table: its partners of some classes
          table: string
          classes: {prmt: "PRMTs associated with {gene}", tudor: "Tudor proteins associated with {gene}"}
          note: STRING physical, whole protein
          none: none at STRING ≥ 0.7
        note: "The suggestion is indirect. Antibodies, inhibitors and knockouts measure peptides, and a peptide with several methylarginines answers for any of them. No total-protein correction was made, and a decrease after PRMT loss does not show a direct substrate. STRING associations are to the whole protein and do not show that a partner methylates or reads this arginine. The records at the residue are under \"Who binds it\" above. Several Tudor domains read methyllysine instead."
      sources:             # a source_records table: every report of the site, in the sites table's Evidence row
        table: sources
        attribute: studies                   # the provenance attribute whose values name the sources
        checks:
          same_accession_position_verified: Reported position checked on the canonical sequence
          sequence_position_verified: Reported position is an arginine inside the matching peptide
          sequence_unique_canonical: Peptide fits one place in the canonical sequence
          sequence_unique_candidate: Peptide fits one place (reported on another isoform)
          sequence_closest_supported: Peptide fits several places. The nearest supported position is used
          same_accession_evidence_near_match: Peptide or window not in the current sequence. Matched within 2 residues of the reported arginine
          canonical_evidence_near_match: Peptide or window not in the current sequence. Matched within 2 residues of the reported arginine
        warn: [sequence_closest_supported, same_accession_evidence_near_match, canonical_evidence_near_match]
        tables: {maron2021_s5: from Maron et al. 2021 Table S5 (compiled sites), prometheusdb_mmc2: ProMetheusDB supplementary table mmc2}
      tables:              # site_table tables shown in the Evidence row, each with its words
        - table: inhibitors
          title: PRMT inhibitor response
          note: "Maron et al. 2021 Table S3, over the peptides containing this site. A call means a peptide containing the site changed (adj. p ≤ 0.05). A peptide with several methylarginines changes for any of them, so only the single-site column speaks for this arginine alone. The median is descriptive."
          source: Maron2021
          columns:
            - {column: antibody, label: Methyl-IP}
            - {column: inhibitor, label: Inhibitor}
            - {column: log2_diff_median, label: Median log2 change, format: l2}
            - {column: adj_p_min, label: Lowest adj. p, format: p}
            - {column: n_peptides, label: "Peptides (▼/▲)", with: [n_decreased, n_increased]}
            - {column: call, label: Peptide call, words: calls}
            - {column: call_single_site_peptides, label: Single-site peptides, words: calls}
      cite:                # how to cite a protein's sites: the provenance attribute's values, with a lookup table of the sources
        attribute: studies
        lookup: studies
        notices: {PSP: "PhosphoSitePlus® data (www.phosphosite.org) are licensed under CC BY-NC-SA 3.0: non-commercial use, with attribution, and adaptations shared under the same license."}
    table:                 # the sites table: its columns (the Columns menu), the explorer's defaults first
      filter: interaction                # buttons that show only the sites of one value of this attribute
      columns:
        - {id: ix, label: Interaction evidence, show: [status, tags], default: true}
        - {id: na, label: RNA/DNA contacts, menu: "RNA/DNA contacts (structures) and crosslinks (cells)", show: [sequences, around], default: true}
        - {id: prmt, label: PRMT perturbation, menu: "PRMT inhibitors, knockouts and knockdowns", show: [calls], default: true}
        - {id: src, label: Reported by, attribute: studies, default: true}
        - {id: af, label: AlphaFold, menu: AlphaFold pLDDT, show: [plddt]}
        - {id: ctx, label: Context, menu: Disorder and domain context, analyses: [disorder, domain_context]}
        - {id: dom, label: Nearest domain, show: [nearest_domain]}
        - {id: nn, label: Nearest methyl-R, show: [nearest]}
        - {id: stev, label: State evidence, menu: "State evidence (Maron IP, Table S2, UniProt)", show: [states]}
        - {id: tcga, label: In cancers, menu: "Changes in tumors (TCGA) and cell lines (DepMap)", show: [changes]}
      nearest_domain: {table: site, name: nearest_domain_name, ref: nearest_domain_interpro, side: domain_side, distance: domain_edge_distance,
                       url: "https://www.ebi.ac.uk/interpro/entry/InterPro/{ref}/", sides: {N_terminal_to_domain: N-term, C_terminal_to_domain: C-term, inside: inside}}
    map:                   # the protein map: more ways to color the sites, and rows of the release's own evidence
      combined_marks: {default: folded}   # one "All modifications" block (a thin lane for each modification, the site's own first); the rows of the context marks fold behind it
      default_off: [ptm]                  # the grey live UniProt row (glycosylation, lipidation, cross-links, other) starts off: the Rows menu turns it on
      hover:                # the hovers on the map: a concise card; the rest is on the pinned card and the site card
        site: [name, chips, nearby, click]
        chips: [studies]
        context: [mark, residue, detail, source, click]
      colour_by:           # in this order; the original explorer's modes, from the sites' attributes
        - state
        - id: methyl_ip
          label: Maron methyl-IP
          help: "The antibodies whose immunoprecipitation recovered the site in Maron et al. 2021 (Table S3)"
          classes:
            - {label: Rme1 IP only, colour: "#2A78D6", colour_dark: "#3987E5", when: [{attribute: methyl_ip, has: [MMA]}, {attribute: methyl_ip, lacks: [ADMA, SDMA]}]}
            - {label: "Rme2a IP (no Rme2s)", colour: "#EB6834", colour_dark: "#D95926", when: [{attribute: methyl_ip, has: [ADMA]}, {attribute: methyl_ip, lacks: [SDMA]}]}
            - {label: Rme2s IP, colour: "#A23B12", colour_dark: "#F4A26B", when: [{attribute: methyl_ip, has: [SDMA]}]}
          otherwise: {label: Not in Maron IP, colour: "#A3AEB3", colour_dark: "#6D7D84"}
        - id: prmt_inhibitor
          label: PRMT inhibitor response
          help: "Maron et al. 2021: decreased with the PRMT5 inhibitor GSK591 or the type I inhibitor MS023 (a peptide down, none up), colored by the methylation the enzyme makes (PRMT5 symmetric, type I asymmetric). Hollow: measured, not decreased"
          classes:
            - {label: "↓ GSK591 (PRMT5i)", colour: "#A23B12", colour_dark: "#F4A26B", when: [{attribute: gsk591, has: [decreased]}, {attribute: ms023, lacks: [decreased]}]}
            - {label: "↓ MS023 (type I PRMTi)", colour: "#EB6834", colour_dark: "#D95926", when: [{attribute: ms023, has: [decreased]}, {attribute: gsk591, lacks: [decreased]}]}
            - {label: "↓ both", colour: ink, when: [{attribute: gsk591, has: [decreased]}, {attribute: ms023, has: [decreased]}]}
            - {label: "Measured, not decreased", colour: "#A3AEB3", colour_dark: "#6D7D84", hollow: true, when: [{attribute: gsk591, empty: false}]}
