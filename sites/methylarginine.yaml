      columns: {accession: uniprot_accession, start: start, end: end, kind: [evidence_type, localisation], source: sources}
      include: [{column: evidence_type, in: [rna_crosslink, dna_crosslink, rbdmap_fragment, capri_xl_peptide, capri_adj_peptide, rbrid_residue, rbrid_region,
                                             dna_binding_region, pdb_rna, pdb_dna, pdb_protein, pdb_self]}]
    records:
