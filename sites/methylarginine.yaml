            include: [{column: evidence_type, in: [rbrid_region, rbrid_residue]}]
          classes:
            rbrid_region: {label: RBR-ID region, mark: box, opacity: 0.18}
            rbrid_residue: {label: RBR-ID+ residues, mark: box, opacity: 0.55}
