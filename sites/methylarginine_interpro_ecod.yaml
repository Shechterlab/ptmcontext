# Site: the methylarginine analyses with InterPro's domains, and ECOD domains (SHEPHARD's human file: DomainMapper on
# hmmscan hits against ECOD's HMMs) for the proteins InterPro leaves without any. One line differs from
# methylarginine.yaml: the input that fills the domains role. A robustness check of every domain-dependent result,
# not a release: a protein InterPro annotates keeps InterPro's domains exactly, so only proteins it leaves bare change.
schema_version: 1
id: methylarginine_interpro_ecod
title: Human methylarginine sites, InterPro domains then ECOD
status: working
mark: sites/marks/methylarginine.yaml
manifest: sites/methylarginine_ecod.inputs.json

snapshot: {input: uniprot_fasta, release: "UniProt 2026_03"}
inputs:
  disorder: mobidb_disorder
  domains:                            # was: interpro_domains
    first_of: [interpro_domains, human_shephard_ecod_domains]

marks:
  input: methylarginine_sites_v1_4_3
  accession: uniprot_accession
  position: position
  left_out:                                       # kept pending: counted on neither side
    - {column: flags, contains: one_sided_window}
  residue_mismatch: error

analyses:
  - {id: domain_context, layer: domain_context}
  - {id: domain_class, layer: domain_class, with: {classes: sites/data/domain_classes.json}}
  - {id: structure_context, layer: structure_context}

outputs: {folder: out/methylarginine_interpro_ecod}
