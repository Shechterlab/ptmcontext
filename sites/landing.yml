# The landing page of `ptmc pages` (read from beside the first site file, or --landing FILE): the page's own words and
# the cards of sites not built yet. Each built site's card comes from its site file (website.name, band, accent, art,
# landing.tagline / question / cta, stats) and its build (the numbers, the strongest result). CONTRACTS.md, "The landing page".
title: Human protein modification sites
description: "Explore where human proteins carry each modification, and what sets those places apart."
lede: Where human proteins are modified, and what sets those places apart.
intro:
  - "Pick a modification: arginine methylation, lysine methylation, other lysine modifications (acetylation, ubiquitination, SUMOylation and more) or phosphorylation. Each explorer gathers sites from published studies and databases and places them on the same human reference proteome, so they can be compared side by side."
  - "When we ask where in a protein a modification sits, we compare modified residues with the unmodified ones in the same protein, so a long or disordered protein can't produce a result by itself. When we ask which proteins carry it, we compare them with other proteins of similar abundance, where abundance data exist."
logo: sites/art/ptmcontext_logo.svg
switcher: {label: PTM}
cta: "Explore {marks} →"
soon_label: Coming soon
soon_cta: In preparation
order: [methylarginine, methyllysine, lysine, phospho]
groups:                    # a card goes in the group its site file names (website.landing.group), else the first
  - {id: human, title: null}
  - {id: other, title: Other organisms, compact: true}
footer:
  links:
    - {label: Cite ptmcontext, url: "https://github.com/Shechterlab/ptmcontext/blob/main/CITATION.cff"}
    - {label: Code, url: "https://github.com/Shechterlab/ptmcontext"}
    - {label: Shechter Lab, url: "https://www.shechterlab.org/"}
