        equals: 'true'
    whole_universe: true
    min_size: 5
    background: the other proteins with eCLIP data that TSA-seq tests (at least 20 bound RNAs placed). A set is the proteins whose bound RNAs gather in the compartment
    abundance:
      input: abundance
      protein: canonical_UniProtAC
      value: percentile
      label: ', each PaxDb abundance decile a stratum'
    sizes:
      value: odds_ratio
      log2: true
      background: the log2 odds ratio of the bound RNAs of each other protein TSA-seq tests gathering in the compartment, called or not (supporting/eclip_rna_compartments). a and c count the proteins compared
    new: true
  - id: eclip_gene_hic
    test: protein_sets
    title: Genes of bound RNAs by Hi-C subcompartment
    question: Are the RNAs that phosphorylated proteins bind transcribed from genes in one Hi-C subcompartment?
    sub: Proteins with eCLIP data whose bound RNAs are transcribed from genes of a Hi-C subcompartment (GM12878; Rao et al. 2014). Hi-C measures contacts between genomic regions, not the position of the RNAs, phosphorylated against the others (one-sided hypergeometric test)
    section: Location, chromatin and condensates
    sets:
      input: eclip_maps
      set: compartment
      protein: uniprot_accession
      include:
      - column: map
        equals: hic
      member_when:
      - column: gathers
        equals: 'true'
    whole_universe: true
    min_size: 5
    background: the other proteins with eCLIP data that Hi-C subcompartments tests (at least 20 bound RNAs placed). A set is the proteins whose bound RNAs gather in the compartment
    abundance:
      input: abundance
      protein: canonical_UniProtAC
      value: percentile
      label: ', each PaxDb abundance decile a stratum'
    sizes:
      value: odds_ratio
      log2: true
      background: the log2 odds ratio of the bound RNAs of each other protein Hi-C subcompartments tests gathering in the compartment, called or not (supporting/eclip_rna_compartments). a and c count the proteins compared
    new: true
controls:
  - id: inidr
    label: inside IDRs
    when: "only serines, threonines and tyrosines inside disordered regions are compared"
    note: "Only the serines, threonines and tyrosines inside intrinsically disordered regions (MobiDB) count, phosphosites and other serines, threonines and tyrosines alike, so the comparison shows whether the result holds inside disordered regions"
    analyses: [near_methylarginine, near_methyllysine, near_acetylation, near_other_acylation, near_ubiquitination, near_sumoylation, idr_charge]
    only_in: idr
  - id: detect
    label: in detectable peptides
    when: "only serines, threonines and tyrosines in detectable tryptic peptides are compared"
    note: "Only the serines, threonines and tyrosines that lie in a tryptic peptide of 7 to 35 residues count, phosphosites and other serines, threonines and tyrosines alike: the protein cut in silico after K and R (not before P), the residue itself left uncut as a modified one would be. Within each protein, protein abundance is already the same on both sides; this sets aside the residues a peptide-based study could hardly have reported"
    analyses: [disorder, structure_context, domain_class, idr_charge]
    only_in:
      digest: {after: KR, not_before: P, min_length: 7, max_length: 35}
  # High-confidence residues: reported by at least two independent studies. Only experimental records count (by-similarity,
  # unspecified and text-mined records give nothing). A study is a PubMed ID in the record's pmids, or a direct dataset
  # (Berryhill 2023, Ochoa 2020, Hendriks 2017 as its PubMed ID 28112733, Akimov 2018 as 29967540, so a database citing
  # the same paper is not counted twice). UniProt and iPTMnet count only through the papers they cite. Ochoa 2020 is
  # one study, however many of its observations there are. A residue's studies are pooled over all its rows.
  - id: hc
    label: high-confidence sites
    when: "only the serines, threonines and tyrosines at least two independent studies report are compared"
    note: "Only the serines, threonines and tyrosines at least two independent studies report (each paper counted once, whether it comes from a database citing it or from the study's own data; Ochoa 2020 counted once; records by similarity, unspecified or text-mined count for nothing); the other sites are counted on neither side"
    analyses: [disorder, idr_charge]
    marks_where:
      distinct_units_at_least: 2
      units:
        columns: [pmids]
        separator: ";"
        direct:
          column: sources
          map: {Berryhill 2023: Berryhill 2023, Ochoa 2020: Ochoa 2020, Hendriks 2017: "28112733", Akimov 2018: "29967540"}
        only_where: {column: evidence_class, equals: experimental}
    marks_outside: left_out

variants:                # the same questions on other marks; ptmc run --variant <name>
  with_lower_confidence:
    label: With lower-confidence sites
    description: "The residues UniProt reports only by similarity to another species (ECO:0000250 and other records without an experimental code) counted too, from the same table"
    marks_select: {exclude: []}
    attributes: {}

# Context marks: other modifications of the same proteins, shown beside the phosphosites (CONTRACTS.md, Context marks):
# methylarginine (the sites table of release v1.7.0, the methylarginine site's own marks) and methyllysine (the sites table
# of release v1.7.0). A map row, "Other modifications nearby" on the site card, a filter, table columns and downloads follow from
# these entries; the near_marks questions test them. Both tables are in sites/phospho.inputs.json.
