# Site: the human phosphosites, from UniProt, iPTMnet and Ochoa et al. 2020 (release v1.5.0 of PTM_Pipeline). The same code and the same
# generic inputs as the methylarginine and methyllysine sites; its own marks, focus, words and colors. There is no earlier
# release to match, so every statistic is new (no reference). Contract: ptmcontext/schemas/site.schema.json.
# The marks table carries Ochoa et al. 2020's functional score (and its mass-spectrometry evidence) beside UniProt and iPTMnet:
# the attributes, filters and tiles that read the score are `optional`, so the same file also serves an earlier table.
schema_version: 1
id: phospho
title: Human phosphosites
status: working
mark: sites/marks/phospho.yaml
manifest: sites/phospho.inputs.json
snapshot: {input: uniprot_fasta, release: "UniProt 2026_03"}   # quoted: unquoted, YAML reads 2026_03 as 202603
inputs:                # role the layers read: manifest input that fills it
  disorder: mobidb_disorder
  domains: interpro_domains
  reactome: reactome_protein_pathways
  reactome_names: reactome_pathways
  hpa: hpa_locations
  abundance: paxdb_abundance
  panther_classes: panther_protein_classes
  panther_ontology: panther_class_ontology
  uniprot_entries: uniprot_entries
  gene_symbols: orghs_symbol_entrez
  disgenet: disgenet_term_genes
  hdo_term_genes: hdo_term_genes
  hdo_terms: hdo_terms
  accession_history: uniprot_accession_history
  cdcode_membership: cdcode_membership
  cdcode_proteins: cdcode_proteins
  cdcode_condensates: cdcode_condensates
  cdcode_members: cdcode_members_2_3
  hcm: hcm_cell_map
  organelle_ip: organelle_ip
  chromatin: chromatin_probability
  depmap_genes: depmap_gene_effect
  string_partners: string_physical_v12_5         # the partner classes' test reads the STRING table whole (the page reads it by its manifest name)
  interpro_entries: interpro_all_entries         # the readers' protein sets, by InterPro entry
  # interactions (the methylarginine site's roles, less the RNA and DNA evidence and its release tables)
  uniprot_disorder: uniprot_disordered_regions
  uniprot_domains: uniprot_domain_regions
  pdb_interfaces: {all_of: [pdbe_kb_interfaces_2026_10_16, pdbe_kb_interfaces_2026_10_20, pdbe_kb_interfaces_2026_10_21,
                            pdbe_kb_interfaces_2026_10_21_2, pdbe_kb_interfaces_2026_10_21_3, pdbe_kb_interfaces_2026_10_25]}
  pdb_observed: sifts_observed_ranges
  predicted_interfaces: protvar_interfaces
  intact_mutations: intact_mutations
  intact_binding_regions: intact_binding_regions
  complexes: complex_portal_complexes

marks:
  # The release's own table: a row per phosphorylated residue. The main view counts the residues with an experimental
  # record (UniProt, iPTMnet, or Ochoa 2020's mass spectrometry), a text-mined or an unspecified one; the residues UniProt reports only by similarity (ECO:0000250 and other records
  # without an experimental code) are the lower-confidence variant, as on the methylarginine and methyllysine sites.
  input: phosphorylation_sites_v1_5_0
  accession: canonical_UniProtAC
  position: position
  exclude:
    - {column: evidence_class, equals: by-similarity}     # in the main view their residues count as other residues
  residue_mismatch: error
  attributes:          # what the website keeps for each site: to color, filter and explain it (no test reads these)
    residue:
      column: residue
      label: Residue
      kind: category
      values: {S: Serine (Sph), T: Threonine (Tph), Y: Tyrosine (Yph)}
      colours: {S: "#0e7490", T: "#1d4ed8", Y: "#b45309"}
      colour: true
      filter: true
      help: The phosphorylated residue. Serine and threonine are phosphorylated by serine/threonine kinases, tyrosine by tyrosine kinases (and dual-specificity kinases). Sph, Tph and Yph name the phosphorylated residue as in the Brno nomenclature for modified histones (Turner, Nat Struct Mol Biol 12:110-112, 2005, doi:10.1038/nsmb0205-110)
    evidence_class:
      column: evidence_class
      provenance: true                       # how the site was found, not what it is
      label: Evidence
      kind: category
      values: {experimental: Experimental, text-mined: "Text-mined (iPTMnet, RLIMS-P)", unspecified: "Unspecified (iPTMnet's copy of UniProt)", by-similarity: By similarity}
      filter: true
      help: "The best class of the records at the site. Experimental: UniProt ECO:0000269 or ECO:0007744, or an iPTMnet record curated from an experiment. Text-mined: an iPTMnet record found by text mining of the literature only. Unspecified: only iPTMnet's copy of UniProt, which has no ECO code. By similarity: UniProt's annotation by similarity to another species (the lower-confidence view)"
    sources:
      column: sources
      provenance: true
      label: Databases
      kind: list
      separator: "; "
      records:             # a database's own record of the protein
        UniProt: "https://www.uniprot.org/uniprotkb/{acc}/entry#ptm_processing"
        iPTMnet: "https://research.bioinformatics.udel.edu/iptmnet/entry/{acc}/"
      values: {UniProt: UniProt, iPTMnet: iPTMnet, "Ochoa 2020": "Ochoa 2020"}
      filter: true
      help: "The databases that report the residue (Ochoa 2020: the mass-spectrometry phosphoproteome of Ochoa et al., Nat Biotechnol 38:365)"
    iptmnet_sources:
      column: iptmnet_sources
      provenance: true
      label: iPTMnet's upstream databases
      kind: list
      separator: "; "
      filter: true
      help: The databases iPTMnet collected the record from (unip is its copy of UniProt)
    pmids:
      column: pmids
      label: PubMed IDs
      kind: list
      separator: ";"
      link: {column: pmids, url: "https://pubmed.ncbi.nlm.nih.gov/{}/"}
      help: The papers the records cite
    # Ochoa et al. 2020's functional score (0 to 1), merged into the table. `optional`: where the column is absent (an earlier
    # table) none of what follows (the attribute, its bands, its filters, its tiles) appears.
    functional_score:
      column: functional_score
      optional: true
      label: Functional score
      kind: number
      filter: true
      help: "Ochoa et al. 2020 functional score of the phosphosite (0 to 1): a model of how likely the site is functionally important, from its conservation, structure, kinase and other features"
    functional_band:
      column: functional_score
      optional: true
      bands: [0.2, 0.5]
      label: Functional score band
      kind: category
      values: {b0: "Below 0.2", b1: "0.2 to 0.5", b2: "0.5 or more"}
      colours: {b0: "#cbd5e1", b1: "#38bdf8", b2: "#1e40af"}
      filter: true
      help: The functional score in three bands (below 0.2, from 0.2 to below 0.5, 0.5 or more)
    best_localization_probability:
      column: best_localization_probability
      optional: true
      provenance: true
      label: Localization probability
      kind: number
      filter: true
      help: "Ochoa 2020: the best probability that the phosphate sits on this residue and not on a neighbor, over the experiments that saw it (0 to 1; a low value means the position within the peptide is uncertain)"
    best_pep:
      column: best_pep
      optional: true
      provenance: true
      label: Best PEP
      kind: number
      help: "Ochoa 2020: the best posterior error probability of a peptide spectrum match for the site (lower is more certain)"
    biological_samples:
      column: biological_samples
      optional: true
      provenance: true
      label: Biological samples
      kind: number
      filter: true
      help: "Ochoa 2020: the number of biological samples (cell lines, tissues, conditions) in which the site was seen"
    spectral_counts:
      column: spectral_counts
      optional: true
      provenance: true
      label: Spectral counts
      kind: number
      help: "Ochoa 2020: the number of spectra that identified the site"
    iptmnet_score:
      column: iptmnet_score
      optional: true
      provenance: true
      label: iPTMnet score
      kind: number
      help: "iPTMnet's own confidence score for the site, where it gave one"
analyses:              # each: one statistics row per class, pooled (fisher) and within protein (mantel_haenszel); all new: no release to match
  # Which kinases? Kinase motif classes: patterns of the sequence around the site, each a class tested against the other
  # serines, threonines and tyrosines of the same proteins. Positions are relative to the site (0); the residue itself
  # must lie inside the pattern. These are sequence classes that kinases prefer, not assignments of a kinase to a site:
  # most kinases have a class of preferences, and many sites fit several classes or none (Johnson et al. 2023, Nature
  # 613:759, doi:10.1038/s41586-022-05575-3, map each Ser/Thr kinase's full motif; its supplementary scores are not used
  # here: see the report). Sources: proline-directed (CDKs, MAP kinases, GSK3): Kennelly & Krebs 1991, J Biol Chem
  # 266:15555; Songyang et al. 1994, Curr Biol 4:973; Songyang et al. 1996, Mol Cell Biol 16:6486. Basophilic (PKA, PKC,
  # AKT, CaMKII, with Arg at -3 or -2): Kennelly & Krebs 1991; Alessi et al. 1996, FEBS Lett 399:333 (AKT: R-x-R-x-x-S/T).
  # Acidophilic (CK2, and CK1 after a priming phosphate): Meggio & Pinna 2003, FASEB J 17:349 (S/T-x-x-E/D); Songyang et
  # al. 1996. Each class has `among`: the residues it is tested among (a class is compared with the other residues of its
  # own type, not with a background that mixes S, T and Y). Tyrosine has no class here: every Yph is a tyrosine kinase
  # site, so against the other tyrosines it would be 1 by construction.
  - id: kinase_motifs
    layer: motif_families
    new: true
    with:
      flank: 10
      noun: kinase motif
      title: Kinase motif classes
      question: "Which kinase motif classes do phosphosites follow, against the residues of their own type in their proteins?"
      sub: "Each class is tested against residues of its own type, in the same proteins: the serine and threonine classes against the other serines and threonines, (a class tested against tyrosines too would partly show the residue type: Yph alone is 0.39x of all residues). Tyrosine has no class of its own here, since every Yph is a tyrosine kinase site; the Yph motifs are in the reader motifs, tested against the other tyrosines. The sequence class a kinase family prefers: proline-directed, basophilic (Arg at -3 or -2) and acidophilic. A class is a sequence pattern, not a kinase assignment; a site may fit several"
      section: Which kinases?
      families:
        - {name: proline_directed, label: "S/T-P (proline-directed)", pattern: "[ST]P", start: 0, among: ST,
           help: "Ser or Thr followed by Pro at +1: the sequence preferred by CDKs, MAP kinases and GSK3 (Kennelly & Krebs 1991; Songyang et al. 1994, 1996)"}
        - {name: basophilic_m3, label: "R-x-x-S/T (basic at -3)", pattern: "R..[ST]", start: -3, among: ST,
           help: "Arg at -3 of the Ser or Thr: the core of the PKA, PKC, AKT and CaMKII preference (Kennelly & Krebs 1991; Alessi et al. 1996)"}
        - {name: basophilic_m2, label: "R-x-S/T (basic at -2)", pattern: "R.[ST]", start: -2, among: ST,
           help: "Arg at -2 of the Ser or Thr: a basophilic preference of PKC and other AGC kinases (Songyang et al. 1994)"}
        - {name: acidophilic_p3, label: "S/T-x-x-D/E (acidic at +3)", pattern: "[ST]..[DE]", start: 0, among: ST,
           help: "Asp or Glu at +3 of the Ser or Thr: the acidophilic preference of CK2 (Meggio & Pinna 2003; Songyang et al. 1996)"}
  # Is it functional? Reader motifs: sequences that phosphopeptide-binding domains recognize once the site is phosphorylated.
  # 14-3-3: mode 1 R-S-x-Sph-x-P and mode 2 R-x-(Y/F)-x-Sph-x-P (Muslin et al. 1996, Cell 84:889; Yaffe et al. 1997, Cell
  # 91:961), and the relaxed mode 1 R-x-x-Sph-x-P. Polo-box domain of PLK1: S-Sph/Tph-P (Elia et al. 2003, Science 299:1228).
  # Pin1 WW domain (Sph/Tph-P: Lu et al. 1999, Science 283:1325; Yaffe et al. 1997, Science 278:1957) reads the sequence of
  # the proline-directed kinase class (28,149 identical sites), so it has no family of its own. Phosphodegron of
  # beta-TrCP: D-Sph-G-x-x-Sph, either serine (Wu et al. 2003, Mol Cell 11:1445, beta-catenin D-Sph-G-I-H-Sph). SH2 domains:
  # Yph with hydrophobic residues at +1 and +3 (Src family), Yph-x-N (Grb2), Yph-[M/V]-x-M (PI3K p85) (Songyang et al. 1993,
  # Cell 72:767). FHA domains: Tph-x-x-D (Durocher et al. 2000, Mol Cell 6:1169). BRCT domains: Sph-x-x-F (Manke et al. 2003,
  # Science 302:636). A site that fits a reader motif is a candidate for binding, not shown to bind.
  - id: reader_motifs
    layer: motif_families
    new: true
    with:
      flank: 10
      noun: reader motif
      title: Reader motifs
      question: "Are phosphosites in the motifs that phosphopeptide-binding domains recognize more often than other residues of the same type in their proteins?"
      sub: "Phosphosites against the other residues of their own type (serines and threonines, threonines, serines or tyrosines, as the motif has it) in the same proteins, by the sequence a reader domain binds when the site is phosphorylated: 14-3-3, polo-box, the beta-TrCP phosphodegron, SH2, FHA and BRCT. Pin1 binds Sph/Tph-P, the proline-directed class of the kinase motifs, so it has no row of its own. A motif is a candidate binding site, not shown to bind"
      section: Is it functional?
      families:
        - {name: ytt_mode1, label: "14-3-3 mode 1 (R-S-x-Sph-x-P)", pattern: "RS.[ST].P", start: -3, among: ST,
           help: "Arg at -3, Ser at -2 and Pro at +2: the first 14-3-3 binding mode (Muslin et al. 1996; Yaffe et al. 1997)"}
        - {name: ytt_mode1_relaxed, label: "14-3-3, relaxed (R-x-x-Sph-x-P)", pattern: "R..[ST].P", start: -3, among: ST,
           help: "Arg at -3 and Pro at +2, with any residue at -2: the relaxed form of mode 1"}
        - {name: ytt_mode2, label: "14-3-3 mode 2 (R-x-Y/F-x-Sph-x-P)", pattern: "R.[FY].[ST].P", start: -4, among: ST,
           help: "Arg at -4, Tyr or Phe at -2 and Pro at +2: the second 14-3-3 binding mode (Yaffe et al. 1997)"}
        - {name: polo_box, label: "Polo-box (S-Sph/Tph-P)", pattern: "S[ST]P", start: -1, among: ST,
           help: "Ser at -1 and Pro at +1: the motif the polo-box domain of PLK1 binds (Elia et al. 2003)"}
        - name: phosphodegron_btrcp
          label: "beta-TrCP phosphodegron (D-Sph-G-x-x-Sph)"
          among: S
          patterns: [{pattern: "DSG..S", start: -1}, {pattern: "DSG..S", start: -5}]
          help: "Either serine of D-S-G-x-x-S, the degron beta-TrCP binds once both serines are phosphorylated (Wu et al. 2003)"
        - {name: sh2_hydrophobic, label: "SH2 (Yph-x-x-I/L/V/M)", pattern: "Y..[ILVM]", start: 0, among: Y,
           help: "Tyr with a hydrophobic residue at +3: the SH2 preference of Src-family kinases (Yph-E-E-I) (Songyang et al. 1993)"}
        - {name: sh2_grb2, label: "SH2 Grb2 (Yph-x-N)", pattern: "Y.N", start: 0, among: Y,
           help: "Tyr with Asn at +2: the Grb2 SH2 preference (Songyang et al. 1993)"}
        - {name: sh2_pi3k, label: "SH2 PI3K (Yph-M/V-x-M)", pattern: "Y[MV].M", start: 0, among: Y,
           help: "Tyr, then Met or Val, then any residue and Met: the PI3K p85 SH2 preference (Songyang et al. 1993)"}
        - {name: fha, label: "FHA (Tph-x-x-D)", pattern: "T..D", start: 0, among: T,
           help: "Thr with Asp at +3: the preference of FHA domains such as Rad53's (Durocher et al. 2000)"}
        - {name: brct, label: "BRCT (Sph-x-x-F)", pattern: "S..F", start: 0, among: S,
           help: "Ser with Phe at +3: the preference of the BRCT repeats of BRCA1 (Manke et al. 2003)"}
  # Crosstalk: are phosphosites more often within 10 residues of another modification than the other serines,
  # threonines and tyrosines of their protein? Context marks (context_marks below), not part of any release's analyses
  - id: near_methylarginine
    layer: near_marks
    with: {marks: methylarginine, window: 10, noun: methylarginine}
    new: true
    title: Near methylarginines (±10 residues)
    question: "Are phosphosites more often near a methylarginine than the other serines, threonines and tyrosines of their protein?"
    sub: "Phosphosites against the other serines, threonines and tyrosines of the same proteins, by whether a methylarginine (the methylarginine site's release v1.4.3) is within 10 residues on either side. Both modifications are best studied on abundant, much-studied proteins, so the within-protein comparison is the fairer one"
    section: Other modifications
  - id: near_methyllysine
    layer: near_marks
    with: {marks: methyllysine, window: 10, noun: methyllysine}
    new: true
    title: Near methyllysines (±10 residues)
    question: "Are phosphosites more often near a methyllysine than the other serines, threonines and tyrosines of their protein?"
    sub: "Phosphosites against the other serines, threonines and tyrosines of the same proteins, by whether a methyllysine (the methyllysine site's release v1.5.0, by-similarity records left out) is within 10 residues on either side"
    section: Other modifications
  - id: near_acetylation
    layer: near_marks
    with: {marks: acetylation, window: 10, noun: "acetylation site", labels: {near: "An acetylation site within ±10", none: "No acetylation site within ±10"}}
    new: true
    title: Near acetylation sites (±10 residues)
    question: "Are phosphosites more often near an acetylation site than the other serines, threonines and tyrosines of their protein?"
    sub: "Phosphosites against the other serines, threonines and tyrosines of the same proteins, by whether an acetylation site (UniProt and iPTMnet, by-similarity records left out) is within 10 residues on either side. Acetylation is among the most studied lysine modifications and heavily studied proteins carry many records of every kind, so the comparison within each protein limits that effect, not removes it"
    section: Other modifications
  - id: near_other_acylation
    layer: near_marks
    with: {marks: other_acylation, window: 10, noun: "other acylation site", labels: {near: "Another lysine acylation within ±10", none: "No other acylation site within ±10"}}
    new: true
    title: Near other acylation sites (±10 residues)
    question: "Are phosphosites more often near another lysine acylation than the other serines, threonines and tyrosines of their protein?"
    sub: "Phosphosites against the other serines, threonines and tyrosines of the same proteins, by whether a lysine acylation other than acetylation (UniProt and iPTMnet, by-similarity records left out; 12 acyl types) is within 10 residues on either side. These modifications (succinyl, 2-hydroxyisobutyryl, beta-hydroxybutyryl, lactoyl, glutaryl, crotonyl and others) come from far fewer studies than acetylation; the comparison within each protein limits the effect of heavily studied proteins, not removes it"
    section: Other modifications
  - id: near_ubiquitination
    layer: near_marks
    with: {marks: ubiquitination, window: 10, noun: "ubiquitination site", labels: {near: "A ubiquitination site within ±10", none: "No ubiquitination site within ±10"}}
    new: true
    title: Near ubiquitination sites (±10 residues)
    question: "Are phosphosites more often near a ubiquitination site than the other serines, threonines and tyrosines of their protein?"
    sub: "Phosphosites against the other serines, threonines and tyrosines of the same proteins, by whether a ubiquitination site (by-similarity records left out) is within 10 residues on either side"
    section: Other modifications
  - id: near_sumoylation
    layer: near_marks
    with: {marks: sumoylation, window: 10, noun: "SUMOylation site", labels: {near: "A SUMOylation site within ±10", none: "No SUMOylation site within ±10"}}
    new: true
    title: Near SUMOylation sites (±10 residues)
    question: "Are phosphosites more often near a SUMOylation site than the other serines, threonines and tyrosines of their protein?"
    sub: "Phosphosites against the other serines, threonines and tyrosines of the same proteins, by whether a SUMOylation site (by-similarity records left out) is within 10 residues on either side"
    section: Other modifications
  # The arginine of a basophilic motif that is itself methylated: R-x-x-S/T (or R-x-S/T) with the Arg a methylarginine
  # of the methylarginine site (PRMT substrates and AGC-kinase motifs share the arginine). A pattern that holds with a
  # context mark at an offset (CONTRACTS.md, Motif families).
  - id: shared_arginine
    layer: motif_families
    new: true
    with:
      flank: 10
      noun: shared arginine
      title: Shared arginine
      question: "Are phosphosites more often in a basophilic motif whose arginine is methylated than the other serines and threonines of their protein?"
      sub: "Phosphosites against the other serines, threonines and tyrosines of the same proteins: the Ser or Thr has an Arg at -3 (R-x-x-S/T) or -2 (R-x-S/T) that is a methylarginine of release v1.4.3. Methylation of the Arg could change the kinase's access to the site"
      section: Other modifications
      families:
        - {name: methylated_R_m3, label: "R-x-x-S/T, the Arg methylated", pattern: "R..[ST]", start: -3, marks: [{mark: methylarginine, at: -3}],
           help: "Arg at -3 of the Ser or Thr, and that Arg is a methylarginine of the methylarginine site (release v1.4.3)"}
        - {name: methylated_R_m2, label: "R-x-S/T, the Arg methylated", pattern: "R.[ST]", start: -2, marks: [{mark: methylarginine, at: -2}],
           help: "Arg at -2 of the Ser or Thr, and that Arg is a methylarginine of the methylarginine site (release v1.4.3)"}
  # Interactions: each a question of yes-or-no tests, each against the serines, threonines and tyrosines its evidence could have reached: the
  # residues a structure observed or a model covers. Every candidate counts in the pooled test, and the within-protein
  # row reports those counts (counting: every_candidate).
  - id: pdb_interface
    new: true
    title: PDB interfaces
    question: "Are phosphosites at interfaces in experimental structures?"
    sub: "Phosphosites against the other serines, threonines and tyrosines of the same proteins observed in a PDB structure, at a PDBe-KB interface with RNA, DNA, a protein or any partner; all, ordered (outside UniProt disordered regions) and in domains"
    section: Protein interactions
    counting: every_candidate
    background: other Ser/Thr/Tyr residues of the same proteins observed in a PDB structure
    proteins_with: pdb_interfaces                       # proteins PDBe-KB lists with an interface
    covered_by: pdb_observed                            # residues a PDB chain models (SIFTS)
    tests:
      - {category: protein, inside: {role: pdb_interfaces, where: [{column: class, matches: "([OPQ][0-9][A-Z0-9]{3}[0-9]|[A-NR-Z][0-9]([A-Z][A-Z0-9]{2}[0-9]){1,2})(-[0-9]+)?"}]}, label: Protein interface}
      - {category: any, inside: {role: pdb_interfaces, where: [{column: class, matches: "RNA|DNA|([OPQ][0-9][A-Z0-9]{3}[0-9]|[A-NR-Z][0-9]([A-Z][A-Z0-9]{2}[0-9]){1,2})(-[0-9]+)?"}]}, label: Any interface}
    strata:
      - {stratum: all}
      - {stratum: ordered, outside_of: uniprot_disorder, suffix: ", ordered regions"}
      - {stratum: domain, covered_by: uniprot_domains, suffix: ", in domains"}
  - id: predicted_interface
    new: true
    title: Predicted interfaces
    question: "Are phosphosites at predicted protein interfaces?"
    sub: "Phosphosites against the other serines, threonines and tyrosines of the same proteins, at a ProtVar AlphaFold-Multimer interface residue of a heterodimer with pDockQ at or above 0.23 or 0.5; all, ordered and disordered (UniProt)"
    section: Protein interactions
    counting: every_candidate
    background: other Ser/Thr/Tyr residues of the same proteins
    tests:
      - {category: pdockq_0.23, inside: {role: predicted_interfaces, where: [{column: class, at_least: 0.23}]},
         proteins_with: {role: predicted_interfaces, where: [{column: class, at_least: 0.23}], on_candidates: true}, label: "pDockQ ≥ 0.23"}
      - {category: pdockq_0.5, inside: {role: predicted_interfaces, where: [{column: class, at_least: 0.5}]},
         proteins_with: {role: predicted_interfaces, where: [{column: class, at_least: 0.5}], on_candidates: true}, label: "pDockQ ≥ 0.5"}
    strata:
      - {stratum: all}
      - {stratum: ordered, outside_of: uniprot_disorder, suffix: ", ordered regions"}
      - {stratum: disordered, covered_by: uniprot_disorder, suffix: ", disordered regions"}
  - id: intact
    new: true
    title: IntAct mutations and binding regions
    question: "Are phosphosites where IntAct maps interactions?"
    sub: "Phosphosites whose mutation changes an interaction, against the other mutated serines, threonines and tyrosines; and inside an IntAct binding region of at most 20 residues, against the other serines, threonines and tyrosines of the proteins with one (all, and in UniProt disordered regions)"
    section: Protein interactions
    counting: every_candidate
    tests:
      - {category: mutation_changes_interaction, inside: {role: intact_mutations, where: [{column: class, matches: "(?!MI:2226$).*"}]},
         covered_by: intact_mutations, background: other Ser/Thr/Tyr residues of the same proteins with an IntAct mutation, label: Mutation changes an interaction}
      - {category: binding_region, inside: intact_binding_regions, proteins_with: intact_binding_regions,
         background: other Ser/Thr/Tyr residues of the same proteins with an IntAct binding region, label: IntAct binding region}
      - {category: binding_region_disordered, inside: intact_binding_regions, proteins_with: intact_binding_regions, covered_by: uniprot_disorder,
         background: other Ser/Thr/Tyr residues of the same proteins with an IntAct binding region, label: "Binding region, disordered residues"}

  # Complexes: Complex Portal's curated human complexes, each a set of its members
  - id: complex
    test: protein_sets
    new: true
    title: Protein complexes
    question: "Which complexes have more phosphorylated members than expected?"
    sub: "Phosphorylated proteins against the proteins in Complex Portal's curated human complexes, by complex of at least 3 members (one-sided hypergeometric test); a protein in several complexes is in each"
    section: Protein interactions
    sets:
      input: complexes
      set: complex_id
      protein: uniprot_accession
      include: [{column: curation, equals: curated}]
    names: {input: complexes, set: complex_id, name: complex_name}
    universe: annotated
    min_size: 3
    background: other proteins in a curated Complex Portal complex
    link: "https://www.ebi.ac.uk/complexportal/complex/{}"
    collapse_similar: {jaccard: 0.9}      # variants with (nearly) the same phosphorylated members are one row on the website, "X (+n similar)"; the statistics keep every row
  # Are phosphorylated proteins more often partners of a class than other proteins with partners? The sets are the site's
  # partner classes (website.search.partners): a protein is in a class's set when one of its STRING physical partners
  # (score 0.7 or more) is in the class. The background is the proteins STRING lists with at least one such partner,
  # not the proteome: a protein with no physical partner cannot be in any set, and well-studied proteins have both
  # partners and phosphorylated, so the proteome would show that and not the class.
  - id: partner_class_test
    test: protein_sets
    new: true
    title: Partner classes
    question: "Are phosphorylated proteins more often partners of kinases, phosphatases and readers than other proteins that have physical partners?"
    sub: "Phosphorylated proteins against the proteins with a STRING physical partner (score 0.7 or more), by whether one of their partners is in each kinase, phosphatase or reader class (one-sided hypergeometric test). A protein with a partner in several classes is in each. The partner is a partner of the whole protein, so a class says what the protein binds, not what acts on the site; and well-studied proteins have more partners and more sites, so every class is expected to look enriched to some degree"
    section: Kinases, phosphatases and readers
    sets: {input: string_partners, partner_classes: string}
    universe: annotated
    background: other human proteins with a STRING physical partner (score 0.7 or more)
