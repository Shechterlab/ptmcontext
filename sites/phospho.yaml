    background: other reviewed human genes (Entrez) with a Disease Ontology term
  # DisGeNET terms one by one (scripts/14_disease_enrichment.py): the terms of the disease families, each tested as
  # DOSE's enrichDGN tests it (terms of 10 to 300 genes), against the same background. In the release's supporting
  # tables, not its statistics table: the run checks them against supporting/disease_terms_tested (reference.tables)
  - id: disease_term
    new: true
    test: protein_sets
    title: DisGeNET terms
    question: "Which DisGeNET disease terms hold more genes of phosphorylated proteins than expected?"
    sub: "Genes of phosphorylated proteins vs all reviewed human genes with a DisGeNET term, every term of 10 to 300 genes (one-sided hypergeometric test, as DOSE's enrichDGN). Association, not causation"
    section: Disease and cancer
    identifiers:
      noun: gene
      nouns: genes
      map:
        - {input: uniprot_entries, from: Entry, to: "Gene Names (primary)", separator: ";", take: first}
        - {input: gene_symbols, from: symbol, to: entrez_id}
    sets: {input: disgenet, set: term_id, protein: entrez_id}
    names: {input: disgenet, set: term_id, name: term_name}
    universe: snapshot
    min_size: 10
    max_size: 300
    link: "https://www.disgenet.com/search?view=DISEASES&idents={}&source=ALL&tab=GDA"
    background: other reviewed human genes (Entrez) with a DisGeNET term
  # Cancer cell lines (scripts/release_layers.py, CANCER): cancer cell genetics beside the sites, not evidence about
  # phosphorylation. The dependency classes partition the entries whose gene DepMap 24Q4 screened (gene_effect)
  - id: depmap_dependency
    new: true
    test: protein_sets
    title: Cancer cell dependency
    question: "Do cancer cell lines depend on these proteins more than on others? (DepMap CRISPR screens)"
    sub: "DepMap Public 24Q4 dependency classes, phosphorylated proteins vs all screened reviewed proteins (one per gene); the dependency of 1,178 cancer cell lines on them in CRISPR knockout screens. Cancer genetics, not evidence about phosphorylation (one-sided hypergeometric test)"
    section: Disease and cancer
    sets:
      input: depmap_genes
      protein: canonical_UniProtAC
      rules:                       # the share of the screened lines whose dependency probability is at least 0.5
        - {set: common_essential, when: [{column: common_essential, equals: "True"}]}
        - {set: most_lines, when: [{ratio: [dependent_lines, lines_with_probability], at_least: 0.5}]}
        - {set: some_lines, when: [{ratio: [dependent_lines, lines_with_probability], at_least: 0.05}]}
        - {set: few_or_none}
    whole_universe: true
    order: [{categories: [common_essential, most_lines, some_lines, few_or_none]}]
    background: other reviewed human proteins whose gene DepMap 24Q4 screened (CRISPR, Chronos)
    labels: {common_essential: Commonly essential, most_lines: "Most lines (≥ 50%)", some_lines: "Some lines (5–50%)", few_or_none: "Few or none (< 5%)"}
    help:
      common_essential: "DepMap 24Q4 calls the gene commonly essential (CRISPRInferredCommonEssentials: it ranks among the strongest dependencies of at least 90% of lines)"
      most_lines: "not commonly essential, and at least 50% of the screened lines depend on it"
      some_lines: "not commonly essential, and 5% to under 50% of the lines depend on it (selective dependencies)"
      few_or_none: "fewer than 5% of the lines depend on it"
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", with each abundance decile analyzed separately"}
    values:                        # each screened protein's numbers, for the website (website.set_views); no test reads them
      columns:
        - {name: median, label: median gene effect, background: true}
        - {name: dependent_lines, label: lines that depend on it}
        - {name: lines_with_probability, label: lines screened}
  # Does the disorder effect differ by kinase motif class? The disorder question again on the sites of one class: only the
  # residues of the class count, marks and other candidates alike (only_in: residues, motif), so that each class is compared
  # with the other residues of its own type in the same protein. Yph is the tyrosines, against the other tyrosines.
  - {id: disorder, layer: disorder, new: true, title: Disorder context, family: Disorder context, family_label: All sites}
  - id: disorder_proline_directed
    layer: disorder
    new: true
    title: "Disorder context, proline-directed sites"
    family: Disorder context
    family_label: "Proline-directed (S/T-P)"
    question: "Are proline-directed phosphosites found in disordered regions more often than the other residues that fit the same pattern in their proteins?"
    sub: "Phosphosites of the proline-directed class (S/T-P) against the other serines and threonines of the same proteins that fit the same pattern, by MobiDB disorder class; read the disordered row against the all-sites question for the difference"
    only_in: {residues: ST, motif: {pattern: "[ST]P", start: 0}}
  - id: disorder_basophilic
    layer: disorder
    new: true
    title: "Disorder context, basophilic sites"
    family: Disorder context
    family_label: "Basophilic (Arg at -3 or -2)"
    question: "Are basophilic phosphosites found in disordered regions more often than the other residues that fit the same pattern in their proteins?"
    sub: "Phosphosites of the basophilic class (R-x-x-S/T or R-x-S/T) against the other serines and threonines of the same proteins that fit the same pattern, by MobiDB disorder class; read the disordered row against the all-sites question for the difference"
    only_in: {residues: ST, motif: {patterns: [{pattern: "R..[ST]", start: -3}, {pattern: "R.[ST]", start: -2}]}}
  - id: disorder_acidophilic
    layer: disorder
    new: true
    title: "Disorder context, acidophilic sites"
    family: Disorder context
    family_label: "Acidophilic (acidic at +3)"
    question: "Are acidophilic phosphosites found in disordered regions more often than the other residues that fit the same pattern in their proteins?"
    sub: "Phosphosites of the acidophilic class (S/T-x-x-D/E) against the other serines and threonines of the same proteins that fit the same pattern, by MobiDB disorder class; read the disordered row against the all-sites question for the difference"
    only_in: {residues: ST, motif: {pattern: "[ST]..[DE]", start: 0}}
  - id: disorder_tyrosine
    layer: disorder
    new: true
    title: "Disorder context, tyrosine sites"
    family: Disorder context
    family_label: "Yph (tyrosine kinases)"
    question: "Are phosphotyrosines found in disordered regions more often than the other tyrosines of their proteins?"
    sub: "Phosphotyrosines against the other tyrosines of the same proteins, by MobiDB disorder class: the residue's own background, as a tyrosine kinase class has no sequence pattern of its own here"
    only_in: {residues: Y}
  - {id: domain_context, layer: domain_context, new: true}
  - {id: domain_class, layer: domain_class, with: {classes: sites/data/domain_classes.json}, new: true}
  - {id: structure_context, layer: structure_context, new: true}
  - {id: idr_charge, layer: idr_charge, new: true}   # not in the release: CIDER's charge classes of IDRs
variants:                # the same questions on other marks; ptmc run --variant <name>
  with_lower_confidence:
    label: With lower-confidence sites
    description: "The residues UniProt reports only by similarity to another species (ECO:0000250 and other records without an experimental code) counted too, from the same table"
    marks_select: {exclude: []}
    attributes: {}

# Context marks: other modifications of the same proteins, shown beside the phosphosites (CONTRACTS.md, Context marks):
# methylarginine (the sites table of release v1.4.3, the methylarginine site's own marks) and methyllysine (the sites table
# of release v1.5.0). A map row, "Other modifications nearby" on the site card, a filter, table columns and downloads follow from
# these entries; the near_marks questions test them. Both tables are in sites/phospho.inputs.json.
context_marks:
  - id: methylarginine
    label: Methylarginine
    input: context_methylarginine_sites_v1_4_3
    columns: {accession: uniprot_accession, position: position, residue: residue, state: methyl_state}
    replaces_ptm_kinds: [Methyl]   # the live UniProt "Other PTMs" row would repeat the methylations: one source for them
    drop_evidence: []          # the v1.4.3 table has no evidence column: every row is kept
    colour: "#C2410C"          # the methylarginine site's orange accent
    colour_dark: "#FB923C"
    citation:
      short: Methylarginine Site Explorer
      cite: "Methylarginine sites of the human reviewed proteome, release v1.4.3 of PTM_Pipeline: DeAngelo et al., Cell Chem Biol 33:1404-1421 (2026), doi:10.1016/j.chembiol.2026.09.011"
      doi: 10.1016/j.chembiol.2026.09.011
      licence: CC BY-NC-SA 4.0
  - id: methyllysine
    label: Methyllysine
    input: context_methyllysine_sites_v1_5_0
    columns: {accession: canonical_UniProtAC, position: position, residue: residue, state: state, evidence: evidence_class, sources: sources}
    colour: "#7c3aed"          # violet, the methyllysine site's color
    colour_dark: "#a78bfa"
    citation:
      short: UniProt, iPTMnet, CPLM and Berryhill 2023
      cite: "Lysine methylation sites of the human reviewed proteome, release v1.5.0 of PTM_Pipeline: UniProt Consortium, Nucleic Acids Res 53:D609-D617 (2025), doi:10.1093/nar/gkae1010; Huang et al., Nucleic Acids Res 46:D542-D550 (2018), doi:10.1093/nar/gkx1104; Zhang et al., Nucleic Acids Res 50:D451-D459 (2022), doi:10.1093/nar/gkab849 (CPLM 4.0 states no license); Berryhill et al., Sci Rep 13:377 (2023), doi:10.1038/s41598-022-27175-x"
      licence: "CC BY-NC-SA 4.0; CPLM 4.0 states no license; Berryhill 2023 article CC BY 4.0"
    sources:
      UniProt: {cite: "UniProt Consortium, Nucleic Acids Res 53:D609 (2025)", doi: 10.1093/nar/gkae1010}
      iPTMnet: {cite: "Huang et al., Nucleic Acids Res 46:D542 (2018)", doi: 10.1093/nar/gkx1104}
      CPLM: {cite: "Zhang et al., Nucleic Acids Res 50:D451 (2022)", doi: 10.1093/nar/gkab849}
      Berryhill 2023: {cite: "Berryhill et al., Sci Rep 13:377 (2023)", doi: 10.1038/s41598-022-27175-x}
  - id: acetylation
    label: Acetylation
    noun: acetylation site
    plural: Acetylation sites
    input: context_acetylation_sites_v1_5_0
    columns: {accession: canonical_UniProtAC, position: position, residue: residue, evidence: evidence_class, sources: sources}
    replaces_ptm_kinds: [Lys acyl]   # the live UniProt "Other PTMs" row would repeat the lysine acylations: one source for them
    colour: "#15803d"          # green: apart from the orange, violet, cyan and olive of the other marks (5.0:1 on white)
    colour_dark: "#4ade80"     # 9.3:1 on the dark surface
    citation:
      short: UniProt and iPTMnet
      cite: "Lysine acetylation sites of the human reviewed proteome, release v1.5.0 of PTM_Pipeline: UniProt Consortium, Nucleic Acids Res 53:D609-D617 (2025), doi:10.1093/nar/gkae1010; Huang et al., Nucleic Acids Res 46:D542-D550 (2018), doi:10.1093/nar/gkx1104"
      licence: CC BY-NC-SA 4.0
    sources:
      UniProt: {cite: "UniProt Consortium, Nucleic Acids Res 53:D609 (2025)", doi: 10.1093/nar/gkae1010}
      iPTMnet: {cite: "Huang et al., Nucleic Acids Res 46:D542 (2018)", doi: 10.1093/nar/gkx1104}
  - id: other_acylation
    label: Other acylations
    noun: non-acetyl acylation site
    plural: Other acylation sites
    input: context_lysine_acylation_sites_v1_5_0
    columns: {accession: canonical_UniProtAC, position: position, residue: residue, state: acyl_type, evidence: evidence_class, sources: sources}
    exclude: [{column: acyl_type, in: [acetyl]}]   # acetylation is its own mark above; the rest, as one group, 12 acyl types
    colour: "#8a7a1c"          # olive: 4.3:1 on white
    colour_dark: "#ddd06a"     # 10.3:1 on the dark surface
    citation:
      short: UniProt and iPTMnet
      cite: "Lysine acylation sites (succinyl, 2-hydroxyisobutyryl, beta-hydroxybutyryl, lactoyl, glutaryl, crotonyl, methacryl, isonicotinyl, benzoyl, butyryl, malonyl, propionyl) of the human reviewed proteome, release v1.5.0 of PTM_Pipeline: UniProt Consortium, Nucleic Acids Res 53:D609-D617 (2025), doi:10.1093/nar/gkae1010; Huang et al., Nucleic Acids Res 46:D542-D550 (2018), doi:10.1093/nar/gkx1104"
      licence: CC BY-NC-SA 4.0
    sources:
      UniProt: {cite: "UniProt Consortium, Nucleic Acids Res 53:D609 (2025)", doi: 10.1093/nar/gkae1010}
      iPTMnet: {cite: "Huang et al., Nucleic Acids Res 46:D542 (2018)", doi: 10.1093/nar/gkx1104}
  - id: ubiquitination
    label: Ubiquitination
    noun: ubiquitination site
    plural: Ubiquitination sites
    input: context_ubiquitination_sites_v1_5_0
    columns: {accession: canonical_UniProtAC, position: position, residue: residue, evidence: evidence_class, sources: sources}
    replaces_ptm_kinds: [Ubiquitin]   # the live UniProt "Other PTMs" row would repeat the ubiquitination sites: one source for them
    colour: "#be185d"          # rose: 6.0:1 on white
    colour_dark: "#f9a8d4"     # 9.0:1 on the dark surface
    citation:
      short: CPLM, UniProt and iPTMnet
      cite: "Lysine ubiquitination sites of the human reviewed proteome, release v1.5.0 of PTM_Pipeline: Zhang et al., Nucleic Acids Res 50:D451-D459 (2022), doi:10.1093/nar/gkab849 (CPLM 4.0 states no license); UniProt Consortium, Nucleic Acids Res 53:D609-D617 (2025), doi:10.1093/nar/gkae1010; Huang et al., Nucleic Acids Res 46:D542-D550 (2018), doi:10.1093/nar/gkx1104"
      licence: "CC BY-NC-SA 4.0; CPLM 4.0 states no license"
    sources:
      CPLM: {cite: "Zhang et al., Nucleic Acids Res 50:D451 (2022)", doi: 10.1093/nar/gkab849}
      UniProt: {cite: "UniProt Consortium, Nucleic Acids Res 53:D609 (2025)", doi: 10.1093/nar/gkae1010}
      iPTMnet: {cite: "Huang et al., Nucleic Acids Res 46:D542 (2018)", doi: 10.1093/nar/gkx1104}
  - id: sumoylation
    label: SUMOylation
    noun: SUMOylation site
    plural: SUMOylation sites
    input: context_sumoylation_sites_v1_5_0
    columns: {accession: canonical_UniProtAC, position: position, residue: residue, evidence: evidence_class, sources: sources}
    replaces_ptm_kinds: [SUMO]   # the live UniProt "Other PTMs" row would repeat the SUMOylation sites: one source for them
    colour: "#0369a1"          # blue: 5.9:1 on white
    colour_dark: "#7dd3fc"     # 9.8:1 on the dark surface
    citation:
      short: CPLM, UniProt and iPTMnet
      cite: "Lysine SUMOylation sites of the human reviewed proteome, release v1.5.0 of PTM_Pipeline: Zhang et al., Nucleic Acids Res 50:D451-D459 (2022), doi:10.1093/nar/gkab849 (CPLM 4.0 states no license); UniProt Consortium, Nucleic Acids Res 53:D609-D617 (2025), doi:10.1093/nar/gkae1010; Huang et al., Nucleic Acids Res 46:D542-D550 (2018), doi:10.1093/nar/gkx1104"
