    sub: "Genes of phosphorylated proteins vs all reviewed human genes with a DisGeNET term, by additional disease family: grouped automatically by matching words in the disease terms, not checked by hand, mostly clinical signs; tested apart from the eight families checked by hand (one-sided hypergeometric test). Association, not causation"
    set_note: "A family of DisGeNET disease terms grouped automatically by matching words; not checked by hand."
    section: Disease and cancer
    identifiers:
      noun: gene
      nouns: genes
      map:
        - {input: uniprot_entries, from: Entry, to: "Gene Names (primary)", separator: ";", take: first}
        - {input: gene_symbols, from: symbol, to: entrez_id}
    sets:
      input: disgenet
      set: term_id
      protein: entrez_id
      families: {rules: sites/data/methylarginine_disease_families.yaml, by: term_name, lists: [additional]}
    universe: snapshot
    background: other reviewed human genes (Entrez) with a DisGeNET term
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, combine: max, label: ", with each abundance decile analyzed separately"}
  # Disease Ontology (scripts/14_disease_enrichment.py): the gene sets DOSE enrichDO tests (each term holds the genes of
  # the terms under it; Human Disease Ontology 2026-09-30), on the genes of the disease families: every reviewed
  # protein's genes are the universe, those with a Disease Ontology term the background, and every term of 10 genes or
  # more with a phosphorylated gene is tested. The release keeps these rows in a supporting table, not in its statistics
  # table, so the run checks them against that table (reference.tables)
  - id: disease_ontology
    new: true
    test: protein_sets
    title: Disease Ontology
    question: "Which Disease Ontology terms hold more genes of phosphorylated proteins than expected?"
    sub: "Genes of phosphorylated proteins vs all reviewed human genes with a Disease Ontology term, every term of at least 10 genes; a term includes the genes of its child terms (one-sided hypergeometric test, as DOSE's enrichDO). Association, not causation"
    section: Disease and cancer
    identifiers:
      noun: gene
      nouns: genes
      map:
        - {input: uniprot_entries, from: Entry, to: "Gene Names (primary)", separator: ";", take: first}
        - {input: gene_symbols, from: symbol, to: entrez_id}
    sets: {input: hdo_term_genes, set: term_id, protein: entrez_id}
    names: {input: hdo_terms, set: term_id, name: name}
    hierarchy: {input: hdo_terms, set: term_id, parents: parents, root: "DOID:4"}
    universe: snapshot
    min_size: 10
    link: "https://disease-ontology.org/?id={}"
    filter: {label: Disease Ontology term (phosphorylated proteins)}
    background: other reviewed human genes (Entrez) with a Disease Ontology term
  # DisGeNET terms one by one (scripts/14_disease_enrichment.py): the terms of the disease families, each tested as
  # DOSE's enrichDGN tests it (terms of 10 to 300 genes), against the same background. In the release's supporting
  # tables, not its statistics table: the run checks them against supporting/disease_terms_tested (reference.tables)
  - id: disease_term
    new: true
    test: protein_sets
    title: DisGeNET terms
    question: "Which DisGeNET disease terms hold more genes of phosphorylated proteins than expected?"
    sub: "Genes of phosphorylated proteins vs all reviewed human genes with a DisGeNET term, every term of 10 to 300 genes (one-sided hypergeometric test, as DOSE's enrichDGN). Association, not causation"
    section: Disease and cancer
    identifiers:
      noun: gene
      nouns: genes
      map:
        - {input: uniprot_entries, from: Entry, to: "Gene Names (primary)", separator: ";", take: first}
        - {input: gene_symbols, from: symbol, to: entrez_id}
    sets: {input: disgenet, set: term_id, protein: entrez_id}
    names: {input: disgenet, set: term_id, name: term_name}
    universe: snapshot
    min_size: 10
    max_size: 300
    link: "https://www.disgenet.com/search?view=DISEASES&idents={}&source=ALL&tab=GDA"
    background: other reviewed human genes (Entrez) with a DisGeNET term
  # Cancer cell lines (scripts/release_layers.py, CANCER): cancer cell genetics beside the sites, not evidence about
  # phosphorylation. The dependency classes partition the entries whose gene DepMap 24Q4 screened (gene_effect)
  - id: depmap_dependency
    new: true
    test: protein_sets
    title: Cancer cell dependency
    question: "Do cancer cell lines depend on these proteins more than on others? (DepMap CRISPR screens)"
    sub: "DepMap Public 24Q4 dependency classes, phosphorylated proteins vs all screened reviewed proteins (one per gene); the dependency of 1,178 cancer cell lines on them in CRISPR knockout screens. Cancer genetics, not evidence about phosphorylation (one-sided hypergeometric test)"
    section: Disease and cancer
    sets:
      input: depmap_genes
      protein: canonical_UniProtAC
      rules:                       # the share of the screened lines whose dependency probability is at least 0.5
        - {set: common_essential, when: [{column: common_essential, equals: "True"}]}
        - {set: most_lines, when: [{ratio: [dependent_lines, lines_with_probability], at_least: 0.5}]}
        - {set: some_lines, when: [{ratio: [dependent_lines, lines_with_probability], at_least: 0.05}]}
        - {set: few_or_none}
    whole_universe: true
    order: [{categories: [common_essential, most_lines, some_lines, few_or_none]}]
    background: other reviewed human proteins whose gene DepMap 24Q4 screened (CRISPR, Chronos)
    labels: {common_essential: Commonly essential, most_lines: "Most lines (≥ 50%)", some_lines: "Some lines (5–50%)", few_or_none: "Few or none (< 5%)"}
    help:
      common_essential: "DepMap 24Q4 calls the gene commonly essential (CRISPRInferredCommonEssentials: it ranks among the strongest dependencies of at least 90% of lines)"
      most_lines: "not commonly essential, and at least 50% of the screened lines depend on it"
      some_lines: "not commonly essential, and 5% to under 50% of the lines depend on it (selective dependencies)"
      few_or_none: "fewer than 5% of the lines depend on it"
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", with each abundance decile analyzed separately"}
    values:                        # each screened protein's numbers, for the website (website.set_views); no test reads them
      columns:
        - {name: median, label: median gene effect, background: true}
        - {name: dependent_lines, label: lines that depend on it}
        - {name: lines_with_probability, label: lines screened}
  # Changes at the phosphosites in tumors and cell lines: a missense or stop change in at least one TCGA tumor (MC3) or DepMap
  # cell line, against the other serines, threonines and tyrosines of the phosphorylated proteins whose gene DepMap screened (the arginine question's
  # design); every mark of those proteins counts, one on a protein with no other candidate too (it adds nothing within proteins)
  - id: cancer_change
    new: true
    layer: residue_lists
    with:
      flags: {tcga_tumours: tcga_changes, depmap_cell_lines: depmap_changes}
      noun: changed serine, threonine or tyrosine
      title: Changes in tumors and cell lines
      question: "Is a phosphosite changed in tumors or cancer cell lines more or less often than the other serines, threonines and tyrosines of its protein?"
      sub: "Phosphosites against the other serines, threonines and tyrosines of the phosphorylated proteins whose gene DepMap screened: a missense or stop change in at least one TCGA tumor (MC3) or DepMap 24Q4 cell line. Not adjusted for codon or sequence context, which may differ between the phosphosites and the other serines, threonines and tyrosines"
      section: Disease and cancer
      labels: {tcga_tumours: Changed in a TCGA tumor, depmap_cell_lines: Changed in a DepMap cell line}
      help:
        tcga_tumours: "A missense or stop change of the residue in at least one TCGA tumor (MC3 public calls from the GDC, 33 projects; FILTER PASS, and in OV and LAML also wga alone)"
        depmap_cell_lines: "A missense or stop change of the residue in at least one DepMap 24Q4 cell line (OmicsSomaticMutations, on the canonical UniProt isoform)"
    proteins: {input: depmap_genes, column: canonical_UniProtAC, label: " whose gene DepMap screened"}
    marks_alone: count
    order: [{categories: [tcga_tumours, depmap_cell_lines]}]
  # Germline variants at the phosphosites: a ClinVar single-residue substitution or stop with a pathogenic or likely pathogenic record,
  # or a gnomAD v4.1 exome variant, against the other serines, threonines and tyrosines of the same proteins; every mark counts, as for the
  # tumor and cell-line question above
  - id: clinvar_plp
    new: true
    layer: residue_lists
    with:
      flags: {clinvar_plp: clinvar_plp}
      noun: residue with a pathogenic ClinVar variant
      title: ClinVar pathogenic variants
      question: "Does a phosphosite carry a pathogenic or likely pathogenic ClinVar variant more or less often than the other serines, threonines and tyrosines of its protein?"
      sub: "Phosphosites against the other serines, threonines and tyrosines of the same proteins: a ClinVar single-residue substitution or stop classified pathogenic or likely pathogenic. ClinVar lists the genes and regions that clinical testing covers, so a well-studied protein has more variants at every residue; the comparison within each protein reduces that effect but does not remove it. Not adjusted for codon or sequence context, which may differ between the phosphosites and the other serines, threonines and tyrosines"
      section: Disease and cancer
      labels: {clinvar_plp: Pathogenic or likely pathogenic in ClinVar}
      help:
        clinvar_plp: "A single-residue substitution or stop whose ClinVar germline classification is pathogenic or likely pathogenic (including Pathogenic/Likely pathogenic; conflicting classifications are not counted), on a RefSeq protein UniProt assigns to the entry"
    marks_alone: count
    order: [{categories: [clinvar_plp]}]
  - id: gnomad_variant
    new: true
    layer: residue_lists
    with:
      flags: {gnomad_variant: gnomad_variants}
      noun: residue with a gnomAD variant
      title: gnomAD variants
      question: "Does a phosphosite carry a gnomAD variant more or less often than the other serines, threonines and tyrosines of its protein?"
      sub: "Phosphosites against the other serines, threonines and tyrosines of the same proteins: a missense or stop-gained variant in gnomAD v4.1 exomes (730,947 exomes; FILTER PASS), at any allele frequency. Most are rare. A variant seen in healthy adults does not show that it is harmless, and a residue without one may only be rare in the sample. Not adjusted for codon or sequence context, which may differ between the phosphosites and the other serines, threonines and tyrosines"
      section: Disease and cancer
      labels: {gnomad_variant: Variant in gnomAD}
      help:
        gnomad_variant: "A missense or stop-gained change of the residue in at least one gnomAD v4.1 exome variant that passed the filters (VEP consequence on a transcript UniProt assigns to the entry)"
    marks_alone: count
    order: [{categories: [gnomad_variant]}]
  # Does the disorder effect differ by kinase motif class? The disorder question again on the sites of one class: only the
  # residues of the class count, marks and other candidates alike (only_in: residues, motif), so that each class is compared
  # with the other residues of its own type in the same protein. Yph is the tyrosines, against the other tyrosines.
  - {id: disorder, layer: disorder, new: true, title: Disorder context, family: Disorder context, family_label: All sites}
  - id: disorder_proline_directed
    layer: disorder
    new: true
    title: "Disorder context, proline-directed sites"
    family: Disorder context
    family_label: "Proline-directed (S/T-P)"
    question: "Are proline-directed phosphosites found in disordered regions more often than the other residues that fit the same pattern in their proteins?"
    sub: "Phosphosites of the proline-directed class (S/T-P) against the other serines and threonines of the same proteins that fit the same pattern, by MobiDB disorder class; read the disordered row against the all-sites question for the difference"
    only_in: {residues: ST, motif: {pattern: "[ST]P", start: 0}}
  - id: disorder_basophilic
    layer: disorder
    new: true
    title: "Disorder context, basophilic sites"
    family: Disorder context
    family_label: "Basophilic (Arg at -3 or -2)"
    question: "Are basophilic phosphosites found in disordered regions more often than the other residues that fit the same pattern in their proteins?"
    sub: "Phosphosites of the basophilic class (R-x-x-S/T or R-x-S/T) against the other serines and threonines of the same proteins that fit the same pattern, by MobiDB disorder class; read the disordered row against the all-sites question for the difference"
    only_in: {residues: ST, motif: {patterns: [{pattern: "R..[ST]", start: -3}, {pattern: "R.[ST]", start: -2}]}}
  - id: disorder_acidophilic
    layer: disorder
    new: true
    title: "Disorder context, acidophilic sites"
    family: Disorder context
    family_label: "Acidophilic (acidic at +3)"
    question: "Are acidophilic phosphosites found in disordered regions more often than the other residues that fit the same pattern in their proteins?"
    sub: "Phosphosites of the acidophilic class (S/T-x-x-D/E) against the other serines and threonines of the same proteins that fit the same pattern, by MobiDB disorder class; read the disordered row against the all-sites question for the difference"
    only_in: {residues: ST, motif: {pattern: "[ST]..[DE]", start: 0}}
  - id: disorder_tyrosine
    layer: disorder
    new: true
    title: "Disorder context, tyrosine sites"
    family: Disorder context
    family_label: "Yph (tyrosine kinases)"
    question: "Are phosphotyrosines found in disordered regions more often than the other tyrosines of their proteins?"
    sub: "Phosphotyrosines against the other tyrosines of the same proteins, by MobiDB disorder class: the residue's own background, as a tyrosine kinase class has no sequence pattern of its own here"
    only_in: {residues: Y}
  - {id: domain_context, layer: domain_context, new: true}
  - {id: domain_class, layer: domain_class, with: {classes: sites/data/domain_classes.json}, new: true}
  - {id: structure_context, layer: structure_context, new: true}
  - {id: idr_charge, layer: idr_charge, new: true}   # not in the release: CIDER's charge classes of IDRs
# Controls (CONTRACTS.md, Controls): questions repeated with one change each, shown on each question's page beside its
# result (not as Overview tiles)
  # RNA and DNA binding in cells and the cells' RNA maps, and aromatic neighbors: the methylarginine site's questions on this site's residues
  # (no RBDmap, pCLAP or RG/GR tests: the release has no such data for these residues; no distance test: the release
  # measures side-chain distances at the site set's own sites only, so there is no background of other residues)
  - id: go_binding
    test: protein_sets
    title: RNA and DNA binding (GO)
    question: Are phosphorylated proteins more often annotated to bind RNA or DNA?
    sub: Phosphorylated proteins against every reviewed human protein, by Gene Ontology annotation to RNA binding (GO:0003723) or DNA binding (GO:0003677) or a term below them, any evidence or experimental evidence only (one-sided hypergeometric test)
    section: RNA and DNA
    sets:
      each:
      - set: rna_binding
        name: RNA binding (GO)
        table:
          input: go_binding
          protein: uniprot_accession
          include:
          - column: binding
            equals: rna
      - set: rna_binding_experimental
        name: RNA binding (GO, experimental evidence)
        table:
          input: go_binding
          protein: uniprot_accession
          include:
          - column: binding
            equals: rna
          - column: evidence_code
            in:
            - EXP
            - IDA
            - IPI
            - IMP
            - IGI
            - IEP
            - HTP
            - HDA
            - HMP
            - HGI
            - HEP
      - set: dna_binding
        name: DNA binding (GO)
        table:
          input: go_binding
          protein: uniprot_accession
          include:
          - column: binding
            equals: dna
      - set: dna_binding_experimental
        name: DNA binding (GO, experimental evidence)
        table:
          input: go_binding
          protein: uniprot_accession
          include:
          - column: binding
            equals: dna
          - column: evidence_code
            in:
            - EXP
            - IDA
            - IPI
            - IMP
            - IGI
            - IEP
            - HTP
            - HDA
            - HMP
            - HGI
            - HEP
    universe: snapshot
    whole_universe: true
    background: all reviewed human proteins
    abundance:
      input: abundance
      protein: canonical_UniProtAC
      value: percentile
      label: ', each PaxDb abundance decile a stratum'
    new: true
  - id: binding_protein
    test: protein_sets
    title: Proteins found binding RNA or DNA in cells
    question: Are phosphorylated proteins among the proteins found binding RNA or DNA in cells?
    sub: Phosphorylated proteins among the proteins each in-cell experiment found binding RNA or DNA, against the other proteins the experiment measured where it lists them, else every reviewed human protein (one-sided hypergeometric test)
    section: RNA and DNA
    order: as_listed
    sets:
      each:
      - set: rna_xl
        name: RNA-crosslinked residue (pepR-MS compendium)
        units: rna_crosslinks
        background: other reviewed human proteins
      - set: rna_capri
        name: Peptide next to an RNA crosslink (CAPRI)
        units:
        - capri_measured_adjacent
        - capri_adj
        universe_units: capri_measured
        background: other reviewed human proteins the experiment measured
      - set: rna_rbrid
        name: RBR-ID+ residue (RBR-ID)
        units: rbrid_residues
        universe_units: rbrid_quantified
        background: other reviewed human proteins the experiment measured
      - set: dna_xl
        name: DNA-crosslinked residue or peptide (Trendel 2025)
        units:
        - dna_crosslink_candidates
        - dna_crosslinked_peptides
        background: other reviewed human proteins
      - set: dna_interactome
        name: DNA interactome protein (Trendel 2025)
        table:
          input: dna_interactome
          protein: uniprot_accession
        background: other reviewed human proteins
    universe: snapshot
    whole_universe: true
    abundance:
      input: abundance
      protein: canonical_UniProtAC
      value: percentile
      label: ', each PaxDb abundance decile a stratum'
    new: true
  - id: crosslink
    title: RNA and DNA crosslinks in cells
    question: Are phosphorylation sites where RNA or DNA crosslinks to proteins in cells?
    sub: 'Phosphorylation sites against the other serines, threonines and tyrosines of the proteins with each kind of evidence: crosslinked residues, RNA-bound peptides, RBR-ID residues and regions, DNA crosslinks and DNA-binding regions'
    section: RNA and DNA
    counting: every_candidate
    candidates_from: marks_and_left_out
    background: other serines, threonines and tyrosines of the same proteins (proteins with that evidence)
    tests:
    - category: rna_crosslink
      inside: rna_crosslinks
      proteins_with: rna_crosslinks
      label: RNA-crosslinked residue
    - category: rna_crosslink_single_residue
      inside: rna_crosslinks_single
      proteins_with: rna_crosslinks_single
      label: RNA crosslink, one residue
    - category: rna_crosslink_within_3
      inside: rna_crosslinks
      within: 3
      proteins_with: rna_crosslinks
      label: ≤3 aa from an RNA crosslink
    - category: dna_crosslink
      inside: dna_crosslinks
      proteins_with: dna_crosslinks
      label: DNA-crosslinked residue
    - category: dna_crosslink_or_candidate
      inside: dna_crosslink_candidates
      proteins_with: dna_crosslink_candidates
      label: DNA crosslink or candidate
    - category: dna_crosslinked_peptide
      inside: dna_crosslinked_peptides
      proteins_with: dna_crosslinked_peptides
      label: DNA-crosslinked peptide
    - category: dna_binding_region
      inside: uniprot_dna_binding
      proteins_with: uniprot_dna_binding
      label: DNA-binding region (UniProt)
    - category: capri_xl_peptide
      inside: capri_xl
      proteins_with: capri_xl
      label: CAPRI XL-peptide
    - category: capri_adj_peptide
      inside: capri_adj
      proteins_with: capri_adj
      label: CAPRI adjacent peptide
    - category: rbrid_residue
      inside: rbrid_residues
      proteins_with: rbrid_residues
      label: RBR-ID+ residue
    - category: rbrid_residue_published_rule
      inside: rbrid_residues_published_rule
      proteins_with: rbrid_residues_published_rule
      label: RBR-ID+ residue, published rule
    - category: rbrid_region
      inside: rbrid_regions
      proteins_with: rbrid_regions
      label: RBR-ID region
    - category: capri_adj_peptide_among_measured
      inside: capri_measured_adjacent
      proteins_with: capri_measured_adjacent
      covered_by: capri_measured
      label: CAPRI adjacent peptide, among measured
    - category: rbrid_residue_among_measured
      inside: rbrid_residues
      proteins_with: rbrid_residues
      covered_by: rbrid_quantified
      label: RBR-ID+ residue, among measured
    new: true
  - id: sequence_proximity
    title: Distance along the chain to RNA evidence
    question: Are phosphorylation sites near RNA-crosslinked residues along the sequence?
    sub: Phosphorylation sites against the other serines, threonines and tyrosines of the proteins with each kind of RNA evidence, within 0, 3, 5, 10 or 20 residues of it along the sequence
    section: RNA and DNA
    counting: every_candidate
    candidates_from: marks_and_left_out
    background: other serines, threonines and tyrosines of the same proteins (proteins with that evidence)
    tests:
    - category: rna_crosslink
      inside: rna_crosslinks
      proteins_with: rna_crosslinks
      label: RNA-crosslinked residue
    - category: capri_adj_peptide
      inside: capri_adj
      proteins_with: capri_adj
      label: CAPRI adjacent peptide
    - category: capri_xl_peptide
      inside: capri_xl
      proteins_with: capri_xl
      label: CAPRI XL-peptide
    - category: rbrid_residue
      inside: rbrid_residues
      proteins_with: rbrid_residues
      label: RBR-ID+ residue
    strata:
    - stratum: within_0_residues
      within: 0
    - stratum: within_3_residues
      within: 3
    - stratum: within_5_residues
      within: 5
    - stratum: within_10_residues
      within: 10
    - stratum: within_20_residues
      within: 20
    new: true
  - id: sticker_context_3
    family: Next to aromatic residues
    layer: neighbours
    with:
