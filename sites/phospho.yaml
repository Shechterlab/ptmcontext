    replaces_ptm_kinds: [Ubiquitin]   # the live UniProt "Other PTMs" row would repeat the ubiquitination sites: one source for them
    colour: "#be185d"          # rose: 6.0:1 on white
    colour_dark: "#f9a8d4"     # 9.0:1 on the dark surface
    citation:
      short: Akimov 2018, UniProt and iPTMnet
      cite: "Lysine ubiquitination sites of the human reviewed proteome, release v1.7.0 of PTM_Pipeline: Akimov V et al., Nat Struct Mol Biol 25:631–640 (2018), doi:10.1038/s41594-018-0084-y; UniProt Consortium, Nucleic Acids Res 53:D609-D617 (2025), doi:10.1093/nar/gkae1010; Huang et al., Nucleic Acids Res 46:D542-D550 (2018), doi:10.1093/nar/gkx1104"
      licence: "CC BY-NC-SA 4.0; Akimov 2018 included"
