outputs: {folder: out/phospho}
citation: sites/phospho.citation.cff   # the citation, data sources, version and date: edit there

website:                  # the look and words of the website (ptmc web); layout and behavior are the kit's
  context_window: 10       # residues either side of a site that count as near a context mark (card, filter, columns, questions)
  name: Phosphosite Explorer
  tagline: "Human protein phosphorylation sites from public databases."
  # published at /ptmcontext/phospho/; listed on the landing page and in the sites' header menu
  landing:
    from_section: Where in the cell   # the card's strongest result is chosen from the section the Overview opens with
    tagline: "Human protein phosphorylation sites from public databases."
    question: "Where are phosphosites in human proteins, which kinase motifs do they match, and which are likely functional?"
    in_switcher: true
  band: ["#1e40af", "#172554"]      # the header gradient: blue
  accent: "#0e7490"                 # the cyan rule, active tab and links
  accent_dark: "#22d3ee"
  logo: sites/art/phospho_logo.svg
  switcher: {label: PTM}            # the site switcher reads "PTM: <site> ▾"
  art: sites/art/phospho-hero.svg
  lab: {name: Shechter Lab, affiliation: Albert Einstein College of Medicine, url: "https://www.shechterlab.org/", logo: sites/art/shechterlab-logo.svg}
  links:
    - {label: Documentation, url: "#method"}
    - {label: Download data, url: "#method/download"}
    - {label: "Code & data", url: "https://github.com/Shechterlab/ptmcontext"}
    - {label: Research, url: "https://www.shechterlab.org/research/"}
    - {label: Publications, url: "https://www.shechterlab.org/publications/"}
  examples: [TP53, "AKT1 MAPK1 EGFR", "kinase_motifs:proline_directed", "TP53 S15", "AKT1 S473"]   # the first three are the chips under the search box
  placeholders: {highlight: "TP53 S15, AKT1 S473, EGFR Y1068", partners: "AKT1, CDK1, YWHAZ", motif: "SPXK, RXXS, DSGXXS", motif_either: "SP,TP"}
  default_background: other reviewed human proteins   # examples inside the Highlight and partner boxes
  start:                   # the Overview's start panel for a first visit, and the Help page's starts (kit-help.js)
    protein: TP53
    text: "Human phosphorylation sites from UniProt and iPTMnet: their positions, proteins and partners. Each tile is one question, comparing the phosphosites with the other serines, threonines and tyrosines of the same proteins. Search a protein or a gene list to test your own selection."
    examples:
      - {label: A tumor suppressor, query: TP53, help: "p53's phosphosites, with its kinase motifs and readers."}
      - {label: A list of genes, query: AKT1 MAPK1 EGFR, help: "Every question is tested again on their phosphosites."}
      - {label: One site in its structure, query: TP53 S15, help: "Its protein's domain and disorder map, the evidence for the site, and its structures."}
  stats: [marks, proteins, {attribute: sources, label: databases, opens: provenance}]
  overview:                # what the Overview opens with: tiles, in sections, each with its most telling classes
    statistic_label: true  # each tile names its statistic
    question: "Which proteins are phosphorylated?"
    rows: 7
    random_maps: {n: 3, title: Example proteins}   # a closed fold at the end of the Overview: proteins drawn at random, each end to end
    sections:
      - name: Where in the cell
        about: "Where in the cell the phosphorylated proteins localize, and how much is on chromatin."
        #  the drawing of the cell on the Overview (website.cell: the maps of the cell as one question)
        cards:
          - {analysis: where_in_the_cell, title: Where in the cell, drawing: true, wide: true}
          - {analysis: cell_chromatin, title: Chromatin probability}
      - name: Which proteins
        about: "Protein classes, pathways and condensates of the phosphorylated proteins."
        cards:
          - {analysis: panther_group, title: Protein classes}
          - {analysis: reactome_top_level, title: Reactome pathways (top level), rows: 4}
          - {analysis: panther_subclass, title: Protein subclasses}
          - {analysis: condensate_proteome, title: Biomolecular condensates, order: q}
          - {analysis: condensate_role, title: Roles in condensates}
      - name: Where in the protein
        about: "Where in the protein the phosphosites are: folded or disordered parts, domains, the charge of disordered regions."
        cards:
          - {analysis: disorder}
          - {analysis: idr_charge}
          - {analysis: structure_context}
          - {analysis: domain_class, title: Nearest domain class}
      - name: Which kinases?
        about: "Kinase motif classes: the sequence around the site that proline-directed, basophilic and acidophilic kinases prefer, each tested against residues of its own type."
        cards:
          - {analysis: kinase_motifs, title: Kinase motif classes}
      - name: Is it functional?
        about: "Reader motifs that bind the phosphorylated site (14-3-3, polo-box, the beta-TrCP degron, SH2, FHA, BRCT) and, where the table has it, the functional score."
        cards:
          - {analysis: reader_motifs, title: Reader motifs}
          - functional_scores
      - name: Other modifications
        about: "Whether phosphosites are near other modifications (methylarginines and methyllysines), within 10 residues, and in a basophilic motif whose arginine is methylated."
        cards:
          - {analysis: near_methylarginine}
          - {analysis: near_methyllysine}
          - {analysis: shared_arginine}
      - name: Interactions and enzymes
        about: "Whether phosphosites are where a protein touches another (PDB and predicted interfaces, IntAct features, complexes), and the kinases, phosphatases and readers that add, remove and bind the modification."
        #  the partner classes are counted (website.search.partners), and the test of the same classes is a card of its own
        cards:
          - {analysis: pdb_interface, title: Interfaces in PDB structures}
          - {analysis: predicted_interface, title: Predicted interfaces}
          - {analysis: intact, title: IntAct binding regions and mutations}
          - {analysis: complex, title: Protein complexes}
          - partner_classes
          - {analysis: partner_class_test}
      - name: Disease and cancer
        about: "Diseases linked to the phosphorylated proteins, and cancer cell dependency."
        show: 1
        more: More on disease
        cards:
          - analysis: disease_family
            title: Disease
            views:               # one question, two vocabularies: a switch on its page
              - label: DisGeNET families
                analysis: disease_family
                more: {analysis: disease_family_additional, label: "Show {n} more families", head: "Additional families"}
                members:
                  analysis: disease_term
                  label: Show the DisGeNET terms
                  noun: term
                  nouns: DisGeNET terms
                  id_label: UMLS CUI
                  none: terms in no family
                  of:
                    - {analysis: disease_family, label: disease families checked by hand}
                    - {analysis: disease_family_additional, label: "additional families, mostly clinical signs"}
              - label: Disease Ontology
                analysis: disease_ontology
                ontology: {short: 50, compare: 4, tree: 100, id_label: DOID, noun: term, nouns: terms}
          - {analysis: depmap_dependency, title: Cancer cell dependency}
      - name: Evidence and studies
        about: "How well supported the phosphosites are, and which residues and databases they come from."
        #  counted, not tested (website.counts)
        cards: [residues, evidence]
      - name: More questions
        about: "Further pathways, cell maps, protein classes and domains, one question each."
        cards: [panther_class, {analysis: reactome_pathway, title: Reactome pathways (all levels)}, {analysis: hpa_location, title: Human Protein Atlas locations},
                cell_hcm_compartment, cell_hcm_domain, cell_organelle_ip, {analysis: condensate, title: "Biomolecular condensates (vs other condensates)", order: q},
                domain_context]
  cell:                    # "Where in the cell" (kit-cell.js): the maps of the cell as one question, as the explorer's
    id: where_in_the_cell
    title: Where in the cell
    question: "Where do phosphorylated proteins localize in the cell?"
    intro: "Five maps from four studies place proteins in the cell, by imaging, proximity labeling, organelle pull-down and chromatin fractionation."
    note: "Not shown: the nuclear-body map of Dyakov et al. (bioRxiv 2024), whose license (CC BY-NC-ND) does not allow derived works, and the speckle, lamina and PML-body proteomes of Barutcu et al. 2022 and its nuclear-body RNA map. Where the RNAs bound by proteins with eCLIP data gather (APEX-seq, TSA-seq, Hi-C subcompartments) is under In more detail."
    maps:                  # each a protein-set question whose sets are compartments: the grids' columns, in order
      - {analysis: hpa_location, regions: cell_region_hpa, name: Human Protein Atlas, short: Protein Atlas, method: Imaging, cells: many cell lines,
         how: "antibody staining in many cell lines; locations of Approved or better reliability with 20 or more proteins",
         ref: HPA 25.1, doi: 10.1126/science.aal3321, url: "https://www.proteinatlas.org/humanproteome/subcellular", licence: CC BY 4.0, min_members: 20}
      - {analysis: cell_hcm_compartment, regions: cell_region_hcm, name: Human Cell Map, short: Cell Map, method: Proximity labeling, cells: HEK293,
         how: "proximity labeling from 192 baits; each protein is assigned to the compartment whose baits label it most",
         ref: Go et al. 2021, doi: 10.1038/s41586-021-03592-2, url: "https://humancellmap.org", licence: CC BY 4.0}
      - {analysis: cell_hcm_domain, name: "Human Cell Map, finer domains", short: Cell Map domains, method: Proximity labeling, cells: HEK293,
         how: "the same map at a finer scale: neighborhoods of proteins that label one another (SAFE domains)",
         ref: Go et al. 2021, doi: 10.1038/s41586-021-03592-2, url: "https://humancellmap.org", licence: CC BY 4.0}
      - {analysis: cell_organelle_ip, regions: cell_region_organelle_ip, name: Organelle IP, short: Organelle IP, method: Organelle pull-down, cells: HEK293T,
         how: "Organelles immunoprecipitated one by one. Each protein is assigned to the organelle it co-purifies with.",
         ref: Hein et al. 2025, doi: 10.1016/j.cell.2024.11.028, url: "https://github.com/czbiohub-sf/Organelle_IP_analyses_and_figures", licence: BSD-3-Clause (analysis repository)}
      - {analysis: cell_chromatin, graded: true, name: Chromatin probability, short: ChEP, method: Fractionation, cells: human cell lines,
         how: "probability that a protein is chromatin-bound, from chromatin enrichment across many conditions",
         ref: Kustatscher et al. 2014, doi: 10.1002/embj.201387614, url: "https://doi.org/10.1002/embj.201387614", licence: CC BY}
    regions:               # the sets of each map's regions question, and the part of the drawings each colors
      - {label: Nucleus, part: nucleus, in_text: the nucleus}
      - {label: Cytoplasm, in_text: the cytoplasm}
      - {label: Organelles and membranes, in_text: the organelles and membranes}
    compartments:          # the grid's rows: each a set in some maps, and the part of the drawings it colors (also: parts
      - group: Nucleus     # it colors when they have no row of their own); the release's groups (data/subcellular.json)
        rows:
          - {label: Chromatin, part: chromatin, also: [periphery, perinucleolar], sets: {cell_hcm_compartment: chromatin, cell_chromatin: "ICP >= 0.8 (chromatin)"}}
          - {label: Nucleoplasm, part: nucleoplasm, also: [nucleus], sets: {cell_hcm_compartment: nucleoplasm, cell_organelle_ip: nucleus, hpa_location: Nucleoplasm}}
          - {label: Nucleolus, part: nucleolus, sets: {cell_hcm_compartment: nucleolus, cell_organelle_ip: nucleolus, hpa_location: Nucleoli}}
          - {label: Nuclear speckles, part: speckles, sets: {cell_hcm_domain: "splicing speckles, nucleolus", hpa_location: Nuclear speckles}}
          - {label: Paraspeckles, part: paraspeckles, sets: {cell_hcm_domain: paraspeckles}}
          - {label: "Nuclear bodies (PML, Cajal …)", name: Nuclear bodies, part: bodies, also: [cajal, pml], sets: {cell_hcm_compartment: nuclear body, hpa_location: Nuclear bodies}}
          - {label: Nuclear envelope and lamina, name: Nuclear envelope, part: envelope, sets: {cell_hcm_compartment: nuclear outer membrane-ER membrane network, hpa_location: Nuclear membrane}}
          - {label: Nuclear pores, part: pores, sets: {cell_hcm_domain: nuclear pore}}
          - {label: Mitotic chromosome, sets: {hpa_location: Mitotic chromosome}}
      - group: Cytoplasm
        rows:
          - {label: "RNA granules (stress granules, P-bodies)", name: "Stress granules (cell map)", part: granules, sets: {cell_hcm_compartment: cytoplasmic ribonucleoprotein granule, cell_hcm_domain: cytoplasmic ribonucleoprotein granule, cell_organelle_ip: stress_granule}}
          - {label: P-bodies, part: pbodies, in_text: P-bodies, sets: {cell_organelle_ip: p-body, cell_hcm_domain: "centrosome enriched, P-body enriched"}}
          - {label: Translation, name: Ribosomes and translation, part: ribosomes, sets: {cell_organelle_ip: translation}}
          - {label: Cytosol, part: cytosol, sets: {cell_hcm_compartment: "actin cytoskeleton, cytosol", cell_organelle_ip: cytosol, hpa_location: Cytosol}}
          - {label: Actin cytoskeleton, name: Actin cortex, part: actin, sets: {cell_organelle_ip: actin_cytoskeleton, cell_hcm_domain: actin cytoskeleton, hpa_location: Actin filaments}}
          - {label: Microtubules, part: microtubules, sets: {cell_hcm_compartment: microtubule cytoskeleton, hpa_location: Microtubules}}
          - {label: Centrosome, part: centrosome, sets: {cell_hcm_compartment: centrosome, cell_organelle_ip: centrosome, hpa_location: Centrosome}}
          - {label: Proteasome, sets: {cell_organelle_ip: proteasome}}
      - group: Organelles and membranes
        rows:
          - {label: Mitochondria, part: mito, sets: {cell_hcm_compartment: mitochondrial matrix, cell_organelle_ip: mitochondrion, hpa_location: Mitochondria}}
          - {label: Endoplasmic reticulum, part: er, in_text: the ER, sets: {cell_hcm_compartment: ER membrane, cell_organelle_ip: ER, hpa_location: Endoplasmic reticulum}}
          - {label: Golgi, name: Golgi apparatus, part: golgi, in_text: the Golgi, sets: {cell_hcm_compartment: Golgi apparatus, cell_organelle_ip: Golgi, hpa_location: Golgi apparatus}}
          - {label: Endosomes and lysosomes, part: endolyso, sets: {cell_hcm_compartment: "endosome, lysosome", cell_organelle_ip: lysosome, hpa_location: Vesicles}}
          - {label: Peroxisomes, part: perox, sets: {cell_hcm_compartment: "mitochondrial outer membrane, peroxisome", cell_organelle_ip: peroxisome}}
          - {label: Plasma membrane, part: pm, sets: {cell_hcm_compartment: plasma membrane, cell_organelle_ip: plasma_membrane, hpa_location: Plasma membrane}}
    drawings:              # the kit's drawings (CONTRACTS.md names their parts), in order
      - {drawing: cell, title: "The cell"}
      - {drawing: nucleus, title: "The nucleus"}
  set_views:               # a protein-set question drawn with its proteins' numbers (kit-values.js): DepMap's dependency
    - analysis: depmap_dependency
      meter: common_essential                   # the class whose share the tile shows
      meter_words: commonly essential in cancer cell lines
      population: screened proteins
      intro: "{n} of {the} {total} {who} were screened (DepMap 24Q4, 1,178 cell lines). A protein's score is its median Chronos gene effect across the lines: 0 is no effect, −1 the median of commonly essential genes, and lower is a stronger dependency."
      box: {value: median, title: Median gene effect of each protein, axis: "median gene effect per protein (Chronos)",
            sub: "DepMap Public 24Q4 CRISPR (Chronos), median gene effect per protein across 1,178 lines. Boxes span the middle half of proteins, whiskers the 5th to 95th percentile. Lower is a stronger dependency"}
      caveat: "Essential proteins are abundant, and mass spectrometry finds abundant proteins most often, so phosphorylated proteins look more essential than the proteome whatever their phosphorylation does. A selection is also compared with the other phosphorylated proteins, which share that bias, and that comparison is fairer."
      chips:
        - {title: Strongest dependencies, value: median, order: ascending}
        - {title: Selective dependencies, note: "not commonly essential; 5% to under half of the lines depend on them, share shown", sets: [some_lines],
           share: [dependent_lines, lines_with_probability], order: descending}
      credit: "DepMap Public 24Q4 (doi:10.25452/figshare.plus.27993248; CC BY 4.0; Tsherniak et al. 2017; Chronos, Dempster et al. 2021). Commonly essential: DepMap's list of genes that at least 90% of lines rank among their strongest dependencies. A line depends on a gene when DepMap's dependency probability is at least 0.5. The results on tumors are in whole or part based upon data generated by the TCGA Research Network (https://www.cancer.gov/tcga): MC3 somatic calls (Ellrott et al. 2018)."
  counts:                  # questions answered by counting the sites, not by a test (CONTRACTS.md, count questions)
    partner_classes:
      kind: values
      attribute: bound_by
      tested_by: partner_class_test        # the table under the bars: is each class enriched among the partners of the proteins?
      title: Kinases, phosphatases and readers
      question: "Which phosphosites are on proteins that bind a kinase, a phosphatase or a reader?"
      sub: "Phosphosites on proteins with a STRING physical partner (score 0.7 or more) in each kinase, phosphatase or reader class"
      unit: [class, classes]
      noun: partner classes
      top: 8
      note: "A class describes the protein's physical partners. STRING associations are to the whole protein, so a count does not show that a partner phosphorylates, dephosphorylates or reads that site. The kinase and phosphatase sets are UniProt keyword sets (candidates, including pseudokinases); the reader sets are InterPro domain entries and include proteins whose domain does not bind phosphopeptides. The sets are of human proteins in UniProt 2026_04."
      method: "The site file lists the partner classes (website.search.partners.classes) by InterPro entry or by a file of UniProt accessions with the query that made it. A protein is in a class when one of its STRING physical partners is. The share of all reviewed human proteins in each class is the baseline to compare with. What is counted: each bar is the number of sites lying on a protein that has a STRING physical partner (score 0.7 or more) in the class; a protein with partners in several classes is in each bar. The table under the bars tests whether phosphorylated proteins are more often partners of a class than the other proteins that have physical partners (one-sided hypergeometric test, q by Benjamini-Hochberg); the bar counts sites, the test counts proteins."
    residues:
      kind: values
      attribute: residue
      title: Residue
      question: "Which residues are phosphorylated?"
      sub: "Phosphosites by residue: serine (Sph), threonine (Tph) or tyrosine (Yph)"
      unit: [residue, residues]
      noun: residues
      top: 3
      note: "A tyrosine is a small share of the residues of a proteome and of the phosphosites; the questions compare each site with the other serines, threonines and tyrosines of its own protein, so the residue's share does not explain their results."
      method: "The release's residue column, one row per phosphorylated residue."
    evidence:
      kind: values
      attribute: evidence_class
      title: Evidence
      question: "How well supported are the phosphosites?"
      sub: "Phosphosites by the best class of their records: experimental, text-mined, or unspecified (iPTMnet's copy of UniProt, with no evidence code)"
      unit: [class, classes]
      noun: evidence classes
      top: 3
      note: "The sites counted here have an experimental, text-mined or unspecified record. The sites UniProt reports only by similarity to another species are the lower-confidence variant (the switch at the top)."
      method: "The release's evidence_class column: experimental is UniProt ECO:0000269 or ECO:0007744, or an iPTMnet record curated from an experiment; text-mined is an iPTMnet record from text mining only; unspecified is iPTMnet's copy of UniProt, which has no ECO code."
    provenance:
      kind: values
      attribute: sources
      title: Data sources
      question: "Which databases report the phosphosites?"
      sub: "Phosphosites reported by each database"
      unit: [database, databases]
      noun: databases
      top: 2
      note: "iPTMnet carries a copy of UniProt: 11,692 phosphorylation rows have unip as their only upstream database, so both databases agreeing is not always two measurements."
      method: "Each phosphosite lists the databases that report it (the release's sources column). A database's count is the phosphosites it reports."
    functional_scores:     # only where the marks table has a functional_score column (marks.attributes.functional_band is optional)
      kind: values
      attribute: functional_band
      title: Functional score
      question: "How many phosphosites have a high functional score?"
      sub: "Phosphosites by functional score band (Ochoa et al. 2020): below 0.2, 0.2 to 0.5, 0.5 or more"
      unit: [band, bands]
      noun: score bands
      top: 3
      note: "The score is a model's estimate of how likely a site is to matter for the cell, not a measurement of its function; it is highest for sites that are conserved, in structured regions, or have a known kinase."
      method: "The functional_score column of the sites table (Ochoa et al. 2020), cut at 0.2 and 0.5."
  filters:                 # the Filters panel: groups in order, from the questions and the sites' attributes
    - {name: Kinase motifs, analyses: [kinase_motifs]}
    - {name: Reader motifs, analyses: [reader_motifs]}
    - {name: Residue and evidence, attributes: [residue, evidence_class]}
    - {name: Functional score, attributes: [functional_score, functional_band]}
    - {name: Structural context, analyses: [structure_context, idr_charge, domain_class, disorder, domain_context]}
    - {name: Protein interactions, analyses: [pdb_interface, predicted_interface, intact, complex], keys: ["b:class", "b:gene", "b:score"]}
    - {name: Protein class, analyses: [panther_group, panther_class, reactome_top_level], proteins: [marks]}
    - {name: Where in the cell, analyses: [cell_region_hpa, cell_region_hcm, cell_region_organelle_ip, hpa_location, cell_hcm_compartment, cell_hcm_domain, cell_organelle_ip, cell_chromatin, condensate_proteome]}
    - {name: Disease and cancer, analyses: [disease_family, disease_family_additional, disease_ontology, depmap_dependency]}
    - {name: Sequence motif, keys: ["m:at", "m:near"]}
    - {name: Data sources, attributes: [sources, iptmnet_sources]}
  dataset: {label: PTM_Pipeline data release, version: v1.5.0 at bdb5b86, date: "2026-11-10", url: "https://github.com/Shechterlab/PTM_Pipeline/tree/bdb5b86cb7e64e30a44512fde917f59dfe5135ca/releases/v1.5.0"}
  download_terms: "The release's tables are under CC BY-NC-SA 4.0 (iPTMnet 6.2; UniProt data are CC BY 4.0). The phosphosites and functional scores of Ochoa et al., Nat Biotechnol 38:365 (2020), doi:10.1038/s41587-019-0344-3 (rows whose databases name Ochoa 2020) come from an article that is not open access, and its supplementary table carries no license: they are included and cited, and the CC BY-NC-SA 4.0 gives no rights in them beyond what the authors allow. The methyllysine rows shown beside the phosphosites include CPLM 4.0 (Zhang et al., Nucleic Acids Res 50:D451, 2022), which states no license. Cite the paper, the archive and the databases that report the sites you use (How to cite)."
  downloads:               # the release's files, at the commit the site was built from
    - {label: Sites, url: "https://raw.githubusercontent.com/Shechterlab/PTM_Pipeline/bdb5b86cb7e64e30a44512fde917f59dfe5135ca/releases/v1.5.0/human_phosphorylation_sites_v1.5.0.tsv", format: TSV, note: "every phosphorylation record: one row per residue, with its evidence class, sources, Ochoa 2020 functional score and mass-spectrometry evidence (Ochoa 2020 rows included, not open access)"}
    - {label: Data dictionary, url: "https://raw.githubusercontent.com/Shechterlab/PTM_Pipeline/bdb5b86cb7e64e30a44512fde917f59dfe5135ca/releases/v1.5.0/data_dictionary.tsv", format: TSV, note: "every column of every file, with its codes"}
    - {label: README, url: "https://github.com/Shechterlab/PTM_Pipeline/blob/bdb5b86cb7e64e30a44512fde917f59dfe5135ca/releases/v1.5.0/README.md", format: Markdown, note: "how the release was made, its sources and what was dropped"}
    - {label: What changed, url: "https://github.com/Shechterlab/PTM_Pipeline/blob/bdb5b86cb7e64e30a44512fde917f59dfe5135ca/releases/v1.5.0/CHANGES.md", format: Markdown, note: "the changes since the previous release"}
  search:                  # the search's words beyond genes and the questions' keys (kit-select.js, kit-search.js, kit-near.js)
    patterns:                # the motif finder: a pattern of residues on the sites' sequence windows
      at: motif              # motif:SPXK covers the site
      near: window           # window:RXXS anywhere within the span
      span: 15
      near_examples:         # the suggestions after window:
        - {pattern: "RXXS", label: "Arg at -3 of the site (basophilic)"}
        - {pattern: "SPXX", label: "Pro just after a Ser"}
        - {pattern: "DXXD", label: "two acidic residues 3 apart"}
    spacing: {label: "Another phosphosite within", within: [2, 3, 5, 10, 20]}
    partners:                # the proteins' physical partners (a protein_partners table)
      table: string
      key: binds
      label: Has a physical partner that is
      gene_label: Binds a specific protein
      score_label: STRING physical confidence
      help: "STRING 12.5 physical associations of the phosphorylated protein (score 0.7 or more)"
      interpro: interpro_entries           # the InterPro entry intervals the classes' interpro ids are read from
      attribute: {id: bound_by, label: Partner classes of the protein, help: "The classes of the physical partners of the phosphorylated protein"}
      # Each set is a query on open data, recorded with its source and release. Kinases and phosphatases are UniProt
      # keyword queries of 2026-11-10 against UniProt release 2026_04 (reviewed human entries, organism 9606), saved with
      # their query in sites/data/phospho_*.tsv: KW-0723 Serine/threonine-protein kinase, KW-0829 Tyrosine-protein
      # kinase, KW-0904 Protein phosphatase. InterPro entries are read from the InterPro 108.0 entry intervals this
      # site's manifest holds (https://www.ebi.ac.uk/interpro/api/entry/interpro/IPRxxxxxx/, checked 2026-11-10;
      # members of the entry on the reviewed human proteome).
      classes:
        writer_stk:
          label: a serine/threonine kinase (writer)
          role: writer
          reads: phosphorylates Ser or Thr
          genes_file: sites/data/phospho_ser_thr_kinases.tsv
          help: "UniProt keyword KW-0723, serine/threonine-protein kinase (reviewed human entries, UniProt 2026_04): candidates, which include pseudokinases and dual-specificity kinases"
        writer_ptk:
          label: a tyrosine kinase (writer)
          role: writer
          reads: phosphorylates Tyr
          genes_file: sites/data/phospho_tyr_kinases.tsv
          help: "UniProt keyword KW-0829, tyrosine-protein kinase (reviewed human entries, UniProt 2026_04): candidates, which include pseudokinases and dual-specificity kinases"
        eraser_pp:
          label: a protein phosphatase (eraser)
          role: eraser
          reads: removes phosphate from Sph, Tph or Yph
          genes_file: sites/data/phospho_phosphatases.tsv
          help: "UniProt keyword KW-0904, protein phosphatase (reviewed human entries, UniProt 2026_04)"
        reader_1433:
          label: a 14-3-3 protein (reader)
          role: reader
          reads: Sph or Tph in R-S-x-Sph-x-P and R-x-Y/F-x-Sph-x-P
          interpro: [IPR000308]
          help: "14-3-3 protein family (IPR000308, InterPro 108.0): the seven human 14-3-3 isoforms"
        reader_sh2:
          label: an SH2-domain protein (reader)
          role: reader
          reads: Yph in its sequence context
          interpro: [IPR000980]
          help: "SH2 domain (IPR000980, InterPro 108.0). Not every SH2 domain needs phosphotyrosine"
        reader_fha:
          label: an FHA-domain protein (reader)
          role: reader
          reads: Tph (Tph-x-x-D)
          interpro: [IPR000253]
          help: "Forkhead-associated domain (IPR000253, InterPro 108.0)"
        reader_ww:
          label: a WW-domain protein (reader)
          role: reader
          reads: some bind Sph-Pro or Tph-Pro (Pin1)
          interpro: [IPR001202]
          help: "WW domain (IPR001202, InterPro 108.0). Most WW domains bind proline-rich peptides without phosphate; Pin1's reads Sph/Tph-P"
        reader_brct:
          label: a BRCT-domain protein (reader)
          role: reader
          reads: Sph (Sph-x-x-F) in some
          interpro: [IPR001357]
          help: "BRCT domain (IPR001357, InterPro 108.0). Some BRCT repeats bind phosphopeptides, others DNA or protein"
        reader_polo:
          label: a polo-box protein (reader)
          role: reader
          reads: Sph or Tph (S-Sph/Tph-P)
          interpro: [IPR000959]
          help: "POLO box domain (IPR000959, InterPro 108.0): PLK1, PLK2, PLK3, PLK4 and PLK5"
      marked: another phosphorylated protein
      other: any other protein
      scores: [0.7, 0.9]
  tabs:                    # the top tabs' words (the addresses #statistics and #method stay; #idrs opens its question)
    overview: {label: Overview, hint: "Click a class row to select its sites, or a tile's title to open the question."}
    proteins: {label: Proteins, hint: "One row per protein with phosphosites. Filter, sort and download."}
    sites: {label: Sites, hint: "One row per phosphosite, with its residue and evidence. Filter, sort and download."}
    idrs: {label: Disordered regions, hint: "Disordered regions (IDRs) of phosphorylated proteins, and the phosphosites in them.", as: section, question: idr_charge}
    statistics: {label: All tests, hint: "Every test on the site, one row per class, with odds ratio, interval and q value."}
    method: {label: Methods & data, hint: "How each question was tested, the data behind it, and downloads."}
    help: {label: Help, hint: "Searching, filters, selections and keyboard keys."}
  partners: {species: 9606}         # interaction partners on protein pages, live from STRING (human)
  compare: {min_proteins: 10, min_marks: 30}
  tables:                  # tables the protein pages show (no test reads them), each in a format of CONTRACTS.md
    string:                # STRING v12.5 physical links, each pair listed once and read both ways, at score 0.7 or more
      input: string_physical_v12_5
      format: protein_partners
      columns: {accession: protein_a, partner_accession: protein_b, partner: gene_b, score: combined_score}
      both_ways: {partner: gene_a}
      include: [{column: combined_score, at_least: 700}]
  sites:                   # the Sites tab
    table:                 # the optional columns (the Columns menu): the same set on every site, where the data has it
      - {id: src, label: Reported by, attribute: sources, default: true, hide: sm}
      - {id: ctx, label: Context, menu: Disorder and domain context, analyses: [disorder, domain_context], hide: xs}
      - {id: struct, label: Structural context, analyses: [structure_context], hide: sm}
  protein:                 # the protein page
    open_partners: true
    map:
      combined_marks: {default: folded}   # one "All marks" row (the site's marks and every context mark, a shape and color each); the context marks' rows fold behind it
      hover:                # the hovers on the map: a concise card; the rest is on the pinned card and the site card
        site: [name, chips, nearby, click]
        chips: [sources, {attribute: pmids, count: PMIDs}, functional_score]
        context: [mark, residue, detail, source, click]
      marks_view: {attribute: functional_score, at_least: 0.5, label: score ≥ 0.5}   # at first only the sites Ochoa 2020 scores 0.5 or more (sites without a score are hidden too); a click on the row label shows all
      hide_ptm_kinds: [Phospho]   # the live UniProt "Other PTMs" row would repeat the phosphosites: one source for them
