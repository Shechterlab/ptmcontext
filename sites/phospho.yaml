    question: Are phosphorylation sites more often next to aromatic residues than the other serines, threonines and tyrosines of their protein?
    sub: Phosphorylation sites against the other serines, threonines and tyrosines of the same proteins, by how many aromatic residues (Tyr, Phe, Trp) are within 5 residues on either side
