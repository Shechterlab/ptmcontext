  - id: cell_organelle_ip
    new: true
    test: protein_sets
    title: Organelle IP
    question: "Which organelles are phosphorylated proteins enriched in, by organelle immunoprecipitation?"
    sub: "Phosphorylated proteins against the other proteins classified by organelle IP (HEK293T; Hein et al. 2025), cluster by cluster (one-sided hypergeometric test)"
    section: Location, chromatin and condensates
    sets: {input: organelle_ip, set: compartment, protein: canonical_UniProtAC, exclude: [{column: compartment, equals: unclassified}]}
    whole_universe: true
    min_size: 5
