    sub: 'Only serines, threonines and tyrosines inside IDRs of 20 or more residues: phosphorylation sites against the other serines, threonines and tyrosines of the same proteins in IDRs, by how many aromatic residues are within 3 residues on either side'
    section: Position in the protein
  - id: sticker_context_5_idr
    family: Next to aromatic residues
    layer: neighbours
    with:
      window: 5
      noun: aromatic residue
      residues: [Y, F, W]
    only_in: idr
    new: true
    title: Next to aromatic residues, in IDRs (within 5)
    question: Inside disordered regions, are phosphorylation sites more often next to aromatic residues than the other serines, threonines and tyrosines there?
    sub: 'Only serines, threonines and tyrosines inside IDRs of 20 or more residues: phosphorylation sites against the other serines, threonines and tyrosines of the same proteins in IDRs, by how many aromatic residues are within 5 residues on either side'
    section: Position in the protein
  - id: eclip_rna_apexseq
    test: protein_sets
    title: Bound RNAs by APEX-seq
    question: Where do the RNAs that phosphorylated proteins bind gather in the cell, by APEX-seq?
