    test: protein_sets
    title: Regions of the cell (Human Cell Map)
    question: "Where do phosphorylated proteins localize in the cell, by Human Cell Map compartments: the nucleus, the cytoplasm, or the organelles and membranes?"
    sub: "Phosphorylated proteins against the other proteins the Human Cell Map localises (HEK293 BioID, NMF compartments), its compartments gathered into three regions of the cell (one-sided hypergeometric test)"
    section: Location, chromatin and condensates
    sets:
