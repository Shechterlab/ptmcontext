outputs: {folder: out/phospho}
citation: sites/phospho.citation.cff   # the citation, data sources, version and date: edit there

website:                  # the look and words of the website (ptmc web); layout and behavior are the kit's
  ci: {order: 3, audit: {workers: 2, budget: 100, proteins: "P04637,P31749", selection: "f=p:kinase_motifs~proline_directed"}}   # CI: published by pages.yml, in this order; the audits' parameters (CONTRACTS.md, Site CI parameters)
  context_window: 10       # residues either side of a site that count as near a context mark (card, filter, columns, questions)
  name: Phosphorylation Site Explorer
  tagline: "Human protein phosphorylation sites from databases."
  # published at /ptmcontext/phospho/; listed on the landing page and in the sites' header menu
  landing:
    from_section: Localization   # the card's strongest result is chosen from the section the Overview opens with
    tagline: "Human protein phosphorylation sites from databases."
    question: "Where are phosphosites in human proteins, which kinase motifs do they match, and which have a high predicted functional score?"
    in_switcher: true
  band: ["#1e40af", "#172554"]      # the header gradient: blue
  accent: "#0e7490"                 # the cyan rule, active tab and links
  accent_dark: "#22d3ee"
  logo: sites/art/phospho_logo.svg
  favicon: sites/art/phospho_favicon.svg
  switcher: {label: PTM}            # the site switcher reads "PTM: <site> ▾"
  art: sites/art/phospho-hero.svg
  lab: {name: Shechter Lab, affiliation: Albert Einstein College of Medicine, url: "https://www.shechterlab.org/", logo: sites/art/shechterlab-logo.svg}
  links:
    - {label: Download data, url: "#method/download"}
    - {label: "Source code ↗", url: "https://github.com/Shechterlab/ptmcontext"}
    - {label: Research, url: "https://www.shechterlab.org/research/"}
    - {label: Publications, url: "https://www.shechterlab.org/publications/"}
  examples: [TP53, "AKT1 MAPK1 EGFR", "motif:[ST]P", "TP53 S15", "AKT1 S473"]   # the first three are the chips under the search box
  placeholders: {highlight: "TP53 S15, AKT1 S473, EGFR Y1068", partners: "AKT1, CDK1, YWHAZ", motif: "SPXK, RXXS, DSGXXS", motif_either: "SP,TP"}
  default_background: other reviewed human proteins   # examples inside the Highlight and partner boxes
  start:                   # the Overview's start panel for a first visit, and the Help page's starts (kit-help.js)
    protein: TP53
    text: "Human phosphorylation sites from UniProt and iPTMnet. Each tile compares the phosphosites with the other serines, threonines and tyrosines of the same proteins. Search a protein or gene list to test your own selection."
    examples:
      - {label: A tumor suppressor, query: TP53, help: "p53's phosphosites, with its kinase motifs and readers."}
      - {label: A list of genes, query: AKT1 MAPK1 EGFR, help: "Every question is tested again on their phosphosites."}
      - {label: One phosphosite in its structure, query: TP53 S15, help: "Its protein's domain and disorder map, the evidence for the residue, and its structures."}
  stats: [marks, proteins, {attribute: sources, label: databases, opens: provenance}]
  overview:                # what the Overview opens with: tiles, in sections, each with its strongest classes
    statistic_label: true  # each tile names its statistic
    question: "Which proteins are phosphorylated?"
    rows: 5
    random_maps: {n: 3, title: Example proteins}   # a closed fold at the end of the Overview: proteins drawn at random, each end to end
    sections:
      - name: Localization
        about: "Where in the cell the phosphorylated proteins localize, and how much is on chromatin."
        #  the drawing of the cell on the Overview (website.cell: the maps of the cell as one question)
        cards:
          - {analysis: where_in_the_cell, title: Localization, drawing: true, wide: true}
          - {analysis: cell_chromatin, title: Chromatin probability}
      - name: Classes and pathways
        about: "Protein classes, pathways and condensates of the phosphorylated proteins."
        cards:
          - {analysis: panther_group, title: "Protein classes (PANTHER), grouped"}
          - {analysis: reactome_top_level, title: Reactome pathways (top level), rows: 4}
          - {analysis: panther_subclass, title: Protein subclasses}
          - {analysis: condensate_proteome, title: Biomolecular condensates, order: q}
          - {analysis: condensate_role, title: Driver or client in condensates}
      - name: Position in the protein
        about: "Where in the protein the phosphosites are: folded or disordered parts, domains, the charge of disordered regions."
        cards:
          - {analysis: disorder}
          - {analysis: idr_charge}
          - {analysis: structure_context}
          - {analysis: domain_class, title: Nearest domain class}
      - name: Which kinases?
        about: "Kinase motif classes: the sequence around the site that proline-directed, basophilic and acidophilic kinases prefer, each tested against residues of its own type."
        cards:
          - {analysis: kinase_motifs, title: Kinase motif classes}
      - name: Reader motifs and functional scores
        about: "Reader motifs that bind the phosphorylated site (14-3-3, polo-box, the beta-TrCP degron, SH2, FHA, BRCT) and, where the table has it, the functional score."
        cards:
          - {analysis: reader_motifs, title: Reader motifs}
          - functional_scores
      - name: Other modifications
        about: "Whether phosphosites are near other modifications (methylarginines and methyllysines), within 10 residues, and in a basophilic motif whose arginine is methylated."
        cards:
          - {analysis: near_methylarginine}
          - {analysis: near_methyllysine}
          - {analysis: shared_arginine}
      - name: Interactions and enzymes
        about: "Whether phosphosites are where a protein touches another (PDB and predicted interfaces, IntAct features, complexes), and the kinases, phosphatases and readers that add, remove and bind the modification."
        #  the partner classes are counted (website.search.partners), and the test of the same classes is a card of its own
        cards:
          - {analysis: pdb_interface, title: Interfaces in PDB structures}
          - {analysis: predicted_interface, title: Predicted interfaces}
          - {analysis: intact, title: IntAct binding regions and mutations}
          - {analysis: complex, title: Protein complexes}
          - partner_classes
          - {analysis: partner_class_test}
      - name: Disease and cancer
        about: "Diseases linked to the phosphorylated proteins, and cancer cell dependency."
        show: 1
        more: More on disease
        cards:
          - analysis: disease_family
            title: Disease
            views:               # one question, two vocabularies: a switch on its page
              - label: DisGeNET families
                analysis: disease_family
                more: {analysis: disease_family_additional, label: "Show {n} more families", head: "Additional families"}
                members:
                  analysis: disease_term
                  label: Show the DisGeNET terms
                  noun: term
                  nouns: DisGeNET terms
                  id_label: UMLS CUI
                  none: terms in no family
                  of:
                    - {analysis: disease_family, label: disease families checked by hand}
                    - {analysis: disease_family_additional, label: "additional families, mostly clinical signs"}
              - label: Disease Ontology
                analysis: disease_ontology
                ontology: {short: 50, compare: 4, tree: 100, id_label: DOID, noun: term, nouns: terms}
          - {analysis: depmap_dependency, title: Cancer cell dependency}
          - {analysis: cancer_change, title: Changes in tumors and cell lines}
          - {analysis: clinvar_plp, title: ClinVar pathogenic variants}
          - {analysis: gnomad_variant, title: gnomAD variants}
      - name: Evidence and studies
        about: "How well supported the phosphosites are, and which residues and databases they come from."
        #  counted, not tested (website.counts)
        cards: [residues, evidence]
      - name: More questions
        about: "Further pathways, cell maps, protein classes and domains, one question each."
        cards: [panther_class, {analysis: reactome_pathway, title: Reactome pathways (all levels)}, {analysis: hpa_location, title: Human Protein Atlas locations},
                cell_hcm_compartment, cell_hcm_domain, cell_organelle_ip, {analysis: condensate, title: "Biomolecular condensates (vs other condensates)", order: q},
                domain_context]
  cell:                    # "Where in the cell" (kit-cell.js): the maps of the cell as one question, as the explorer's
    id: where_in_the_cell
    default_view: average        # what the maps color by on opening: percent (share of proteins with a mark), average (each share against the share among all mapped proteins) or fold
    dispersion: false        # the average view: no overdispersion adjustment across compartments (they are not expected to be alike)
    abundance: true          # its test is within abundance deciles (Mantel-Haenszel), Fisher's exact test where a map has none
    min_h: 0.2               # filled only where the effect is at least small (Cohen's h); significant but smaller is outlined
    title: Where in the cell
    question: "Where do phosphorylated proteins localize in the cell?"
    intro: "Five maps from four studies locate proteins in the cell, by imaging, proximity labeling, organelle pull-down and chromatin fractionation."
    note: "Not shown: the nuclear-body map of Dyakov et al. (bioRxiv 2024), whose license (CC BY-NC-ND) does not allow derived works, and the speckle, lamina and PML-body proteomes of Barutcu et al. 2022 and its nuclear-body RNA map. The nuclear position of the genes of RNAs bound by proteins with eCLIP data (APEX-seq, TSA-seq, Hi-C subcompartments) is not shown."
    maps:                  # each a protein-set question whose sets are compartments: the grids' columns, in order
      - {analysis: hpa_location, regions: cell_region_hpa, name: Human Protein Atlas, short: Protein Atlas, method: Imaging, cells: many cell lines,
         how: "antibody staining in many cell lines; locations of Approved or better reliability with 20 or more proteins",
         ref: HPA 25.1, doi: 10.1126/science.aal3321, url: "https://www.proteinatlas.org/humanproteome/subcellular", licence: CC BY 4.0, min_members: 20}
      - {analysis: cell_hcm_compartment, regions: cell_region_hcm, name: Human Cell Map, short: Cell Map, method: Proximity labeling, cells: HEK293,
         how: "proximity labeling from 192 baits; each protein is assigned to the compartment whose baits label it most",
         ref: Go et al. 2021, doi: 10.1038/s41586-021-03592-2, url: "https://humancellmap.org", licence: CC BY 4.0}
      - {analysis: cell_hcm_domain, name: "Human Cell Map, finer domains", short: Cell Map domains, method: Proximity labeling, cells: HEK293,
         how: "the same map at a finer scale: neighborhoods of proteins that label one another (SAFE domains)",
         ref: Go et al. 2021, doi: 10.1038/s41586-021-03592-2, url: "https://humancellmap.org", licence: CC BY 4.0}
      - {analysis: cell_organelle_ip, regions: cell_region_organelle_ip, name: Organelle IP, short: Organelle IP, method: Organelle pull-down, cells: HEK293T,
         how: "Organelles immunoprecipitated one by one. Each protein is assigned to the organelle it co-purifies with.",
         ref: Hein et al. 2025, doi: 10.1016/j.cell.2024.11.028, url: "https://github.com/czbiohub-sf/Organelle_IP_analyses_and_figures", licence: BSD-3-Clause (analysis repository)}
      - {analysis: cell_chromatin, graded: true, name: Chromatin probability, short: ChEP, method: Fractionation, cells: human cell lines,
         how: "probability that a protein is chromatin-bound, from chromatin enrichment across many conditions",
         ref: Kustatscher et al. 2014, doi: 10.1002/embj.201387614, url: "https://doi.org/10.1002/embj.201387614", licence: CC BY}
    regions:               # the sets of each map's regions question, and the part of the drawings each colors
      - {label: Nucleus, part: nucleus, in_text: the nucleus}
      - {label: Cytoplasm, in_text: the cytoplasm}
      - {label: Organelles and membranes, in_text: the organelles and membranes}
    compartments:          # the grid's rows: each a set in some maps, and the part of the drawings it colors (also: parts
      - group: Nucleus     # it colors when they have no row of their own); the release's groups (data/subcellular.json)
        rows:
          - {label: Chromatin, part: chromatin, also: [periphery, perinucleolar], sets: {cell_hcm_compartment: chromatin, cell_chromatin: "ICP >= 0.8 (chromatin)"}}
          - {label: Nucleoplasm, part: nucleoplasm, also: [nucleus], sets: {cell_hcm_compartment: nucleoplasm, cell_organelle_ip: nucleus, hpa_location: Nucleoplasm}}
          - {label: Nucleolus, part: nucleolus, sets: {cell_hcm_compartment: nucleolus, cell_organelle_ip: nucleolus, hpa_location: Nucleoli}}
          - {label: Nuclear speckles, part: speckles, sets: {cell_hcm_domain: "splicing speckles, nucleolus", hpa_location: Nuclear speckles}}
          - {label: Paraspeckles, part: paraspeckles, sets: {cell_hcm_domain: paraspeckles}}
          - {label: "Nuclear bodies (PML, Cajal …)", name: Nuclear bodies, part: bodies, also: [cajal, pml], sets: {cell_hcm_compartment: nuclear body, hpa_location: Nuclear bodies}}
          - {label: Nuclear envelope and lamina, name: Nuclear envelope, part: envelope, sets: {cell_hcm_compartment: nuclear outer membrane-ER membrane network, hpa_location: Nuclear membrane}}
          - {label: Nuclear pores, part: pores, sets: {cell_hcm_domain: nuclear pore}}
          - {label: Mitotic chromosome, sets: {hpa_location: Mitotic chromosome}}
      - group: Cytoplasm
        rows:
          - {label: "RNA granules (stress granules, P-bodies)", name: "Stress granules (cell map)", part: granules, sets: {cell_hcm_compartment: cytoplasmic ribonucleoprotein granule, cell_hcm_domain: cytoplasmic ribonucleoprotein granule, cell_organelle_ip: stress_granule}}
          - {label: P-bodies, name: "P-bodies (cell map)", part: pbodies, in_text: P-bodies, sets: {cell_organelle_ip: p-body, cell_hcm_domain: "centrosome enriched, P-body enriched"}}
          - {label: Translation, name: Ribosomes and translation, part: ribosomes, sets: {cell_organelle_ip: translation}}
          - {label: Cytosol, part: cytosol, sets: {cell_hcm_compartment: "actin cytoskeleton, cytosol", cell_organelle_ip: cytosol, hpa_location: Cytosol}}
          - {label: Actin cytoskeleton, name: Actin cortex, part: actin, sets: {cell_organelle_ip: actin_cytoskeleton, cell_hcm_domain: actin cytoskeleton, hpa_location: Actin filaments}}
          - {label: Microtubules, part: microtubules, sets: {cell_hcm_compartment: microtubule cytoskeleton, hpa_location: Microtubules}}
          - {label: Centrosome, part: centrosome, sets: {cell_hcm_compartment: centrosome, cell_organelle_ip: centrosome, hpa_location: Centrosome}}
          - {label: Proteasome, sets: {cell_organelle_ip: proteasome}}
      - group: Organelles and membranes
        rows:
          - {label: Mitochondria, part: mito, sets: {cell_hcm_compartment: mitochondrial matrix, cell_organelle_ip: mitochondrion, hpa_location: Mitochondria}}
          - {label: Endoplasmic reticulum, part: er, in_text: the ER, sets: {cell_hcm_compartment: ER membrane, cell_organelle_ip: ER, hpa_location: Endoplasmic reticulum}}
          - {label: Golgi, name: Golgi apparatus, part: golgi, in_text: the Golgi, sets: {cell_hcm_compartment: Golgi apparatus, cell_organelle_ip: Golgi, hpa_location: Golgi apparatus}}
          - {label: Endosomes and lysosomes, part: endolyso, sets: {cell_hcm_compartment: "endosome, lysosome", cell_organelle_ip: lysosome, hpa_location: Vesicles}}
          - {label: Peroxisomes, part: perox, sets: {cell_hcm_compartment: "mitochondrial outer membrane, peroxisome", cell_organelle_ip: peroxisome}}
          - {label: Plasma membrane, part: pm, sets: {cell_hcm_compartment: plasma membrane, cell_organelle_ip: plasma_membrane, hpa_location: Plasma membrane}}
    drawings:              # the kit's drawings (CONTRACTS.md names their parts), in order
      - {drawing: cell, title: "The cell"}
      - {drawing: nucleus, title: "The nucleus"}
  set_views:               # a protein-set question drawn with its proteins' numbers (kit-values.js): DepMap's dependency
    - analysis: depmap_dependency
      meter: common_essential                   # the class whose share the tile shows
      meter_words: commonly essential in cancer cell lines
      population: screened proteins
      intro: "{n} of {the} {total} {who} were screened (DepMap 24Q4, 1,178 cell lines). A protein's score is its median Chronos gene effect across the lines: 0 is no effect, −1 the median of commonly essential genes, and lower is a stronger dependency."
      box: {value: median, title: Median gene effect of each protein, axis: "median gene effect per protein (Chronos)",
            sub: "DepMap Public 24Q4 CRISPR (Chronos), median gene effect per protein across 1,178 lines. Boxes span the middle half of proteins, whiskers the 5th to 95th percentile. Lower is a stronger dependency"}
      caveat: "Essential proteins are abundant, and mass spectrometry finds abundant proteins most often, so phosphorylated proteins look more essential than the proteome whatever their phosphorylation does. A selection is also compared with the other phosphorylated proteins, which share that bias, and that comparison is fairer."
      chips:
        - {title: Strongest dependencies, value: median, order: ascending}
        - {title: Selective dependencies, note: "not commonly essential; 5% to under half of the lines depend on them, share shown", sets: [some_lines],
           share: [dependent_lines, lines_with_probability], order: descending}
      residue: cancer_change                    # a residue question shown with it (changes at the marks)
      credit: "DepMap Public 24Q4 (doi:10.25452/figshare.plus.27993248; CC BY 4.0; Tsherniak et al. 2017; Chronos, Dempster et al. 2021). Commonly essential: DepMap's list of genes that at least 90% of lines rank among their strongest dependencies. A line depends on a gene when DepMap's dependency probability is at least 0.5. The results on tumors are in whole or part based upon data generated by the TCGA Research Network (https://www.cancer.gov/tcga): MC3 somatic calls (Ellrott et al. 2018)."
  counts:                  # questions answered by counting the sites, not by a test (CONTRACTS.md, count questions)
    partner_classes:
      kind: values
      attribute: bound_by
      tested_by: partner_class_test        # the table under the bars: is each class enriched among the partners of the proteins?
      title: Kinases, phosphatases and readers
      question: "Which phosphosites are on proteins with a STRING partner that is a kinase, a phosphatase or a reader?"
      sub: "Phosphosites on proteins with a STRING physical partner (score 0.7 or more) in each kinase, phosphatase or reader class"
      unit: [class, classes]
      noun: partner classes
      top: 8
      note: "A class describes the protein's physical partners. STRING associations are to the whole protein, so a count does not show that a partner phosphorylates, dephosphorylates or reads that site. The kinase and phosphatase sets are UniProt keyword sets (candidates, including pseudokinases); the reader sets are InterPro domain entries and include proteins whose domain does not bind phosphopeptides. The sets are of human proteins in UniProt 2026_04."
      method: "The site file lists the partner classes (website.search.partners.classes) by InterPro entry or by a file of UniProt accessions with the query that made it. A protein is in a class when one of its STRING physical partners is. The share of all reviewed human proteins in each class is the baseline to compare with. What is counted: each bar is the number of sites lying on a protein that has a STRING physical partner (score 0.7 or more) in the class; a protein with partners in several classes is in each bar. The table under the bars tests whether phosphorylated proteins are more often partners of a class than the other proteins that have physical partners (one-sided hypergeometric test, q by Benjamini-Hochberg); the bar counts sites, the test counts proteins."
    residues:
      kind: values
      attribute: residue
      title: Residue
      question: "Which residues are phosphorylated?"
      sub: "Phosphosites by residue: serine (Sph), threonine (Tph) or tyrosine (Yph)"
      unit: [residue, residues]
      noun: residues
      top: 3
      note: "Tyrosine is a small share of proteome residues and of phosphosites. The questions compare each site with the other serines, threonines and tyrosines of its own protein, so the residue's share does not explain their results."
      method: "The release's residue column, one row per phosphorylated residue."
    evidence:
      kind: values
      attribute: evidence_class
      title: Evidence
      question: "How well supported are the phosphosites?"
      sub: "Phosphosites by the best class of their records: experimental, text-mined, or unspecified (iPTMnet's copy of UniProt, with no evidence code)"
      unit: [class, classes]
      noun: evidence classes
      top: 3
      note: "Counted here: sites with an experimental, text-mined or unspecified record. Sites UniProt reports only by similarity to another species are in the lower-confidence variant (the switch at the top)."
      method: "The release's evidence_class column: experimental is UniProt ECO:0000269 or ECO:0007744, or an iPTMnet record curated from an experiment; text-mined is an iPTMnet record from text mining only; unspecified is iPTMnet's copy of UniProt, which has no ECO code."
    provenance:
      kind: values
      attribute: sources
      title: Databases
      question: "Which databases report the phosphosites?"
      sub: "Phosphosites reported by each database"
      unit: [database, databases]
      noun: databases
      top: 2
      note: "iPTMnet contains a copy of UniProt: 11,692 phosphorylation rows have unip as their only upstream database, so both databases agreeing is not always two measurements."
      method: "Each phosphosite lists the databases that report it (the release's sources column). A database's count is the phosphosites it reports."
    functional_scores:     # only where the marks table has a functional_score column (marks.attributes.functional_band is optional)
      kind: values
      attribute: functional_band
      title: Functional score
      question: "How many phosphosites have a high functional score?"
      sub: "Phosphosites by functional score band (Ochoa et al. 2020): below 0.2, 0.2 to 0.5, 0.5 or more"
      unit: [band, bands]
      noun: score bands
      top: 3
      note: "The score is a model's estimate of how likely a site is to matter for the cell, not a measurement of its function. It is highest for sites that are conserved, in structured regions, or have a known kinase."
      method: "The functional_score column of the sites table (Ochoa et al. 2020), cut at 0.2 and 0.5."
  filters:                 # the Filters panel: groups in order, from the questions and the sites' attributes
    - {name: Kinase motifs, analyses: [kinase_motifs]}
    - {name: Reader motifs, analyses: [reader_motifs]}
    - {name: Residue and evidence, attributes: [residue, evidence_class]}
    - {name: Functional score, attributes: [functional_score, functional_band]}
    - {name: Structural context, analyses: [structure_context, idr_charge, domain_class, disorder, domain_context, sticker_context_3, sticker_context_5, sticker_context_3_idr, sticker_context_5_idr]}
    - {name: Protein interactions, analyses: [pdb_interface, predicted_interface, intact, complex], keys: ["b:class", "b:gene", "b:score"]}
    - {name: Protein class, analyses: [panther_group, panther_class, reactome_top_level], proteins: [marks]}
    - {name: Localization, analyses: [cell_region_hpa, cell_region_hcm, cell_region_organelle_ip, hpa_location, cell_hcm_compartment, cell_hcm_domain, cell_organelle_ip, cell_chromatin, condensate_proteome, eclip_rna_apexseq, eclip_gene_tsaseq, eclip_gene_hic]}
    - {name: Disease and cancer, analyses: [disease_family, disease_family_additional, disease_ontology, depmap_dependency, cancer_change, clinvar_plp, gnomad_variant]}
    - {name: RNA and DNA, analyses: [go_binding, binding_protein, crosslink, sequence_proximity]}
    - {name: Sequence motif, keys: ["m:at", "m:near"]}
    - {name: Databases, attributes: [sources, iptmnet_sources]}
  dataset: {label: PTM_Pipeline, version: v1.7.0, date: "2026-11-21", doi: "10.5281/zenodo.24429699", url: "https://github.com/Shechterlab/PTM_Pipeline/tree/v1.7.0/releases/v1.7.0"}
  methods_note: "Sequences use UniProt 2026_03 and the other modifications UniProt 2026_04. The later release's positions are mapped onto the 2026_03 sequences the tests use, so each site keeps the position it was analyzed at."
  license: "Data: CC BY-NC-SA 4.0 (non-commercial, share-alike); UniProt data CC BY 4.0. For commercial use, contact info@shechterlab.org."
  download_terms: "The release's tables are under CC BY-NC-SA 4.0 (iPTMnet 6.2; UniProt data are CC BY 4.0). The phosphosites and functional scores of Ochoa et al., Nat Biotechnol 38:365 (2020), doi:10.1038/s41587-019-0344-3 (rows whose databases name Ochoa 2020) come from an article that is not open access, and its supplementary table has no license: they are included and cited, and the CC BY-NC-SA 4.0 gives no rights in them beyond what the authors allow. Cite the paper, the archive and the databases that report the sites you use (How to cite)."
  whats_new:               # the data releases' notes, newest first (the Help page; the same list as the landing page's)
    title: What’s new in each data release
    releases:
      - title: PTM_Pipeline v1.7.0 data release (2026-11-21)
        items:
        - "Mutation propensity: O/E and q for every serine, threonine and tyrosine in TCGA, DepMap and gnomAD from the release, and a descriptive O/E for ClinVar."
        - "Protein cards now draw lollipops. Stick height is the count, circle size is O/E, and a ring marks q below 0.05. They replace the flag for counts at least 3 times the protein's average."
        - "A Disease variants page: Ranked sites (TCGA, DepMap, gnomAD), Cancer: tumors (an oncoprint of the top sites in TCGA tumors), Inherited disease (ClinVar variants by disease family), a chart of all sites behind Show all sites as a chart, and a box for pasting a list of sites to test."
        - "Hypermutated tumors (more than 10 coding calls per Mb) are left out by default. Choose With hypermutated to include them."
        doi: "10.5281/zenodo.24429699"
      - title: PTM_Pipeline v1.6.0 data release (2026-11-20)
        items:
        - "Cancer changes at every candidate residue (TCGA tumors, DepMap cell lines) and germline variants (ClinVar, gnomAD), with the gene named for proteins that several genes encode."
        - "A count of the changes the cards do not show, with a download of those rows."
        - "Histones and proteins without their initiator methionine are numbered as papers number them. A protein that several genes encode has one short name (H4), and search finds old gene names too."
        - "The four human sites show the same protein-page cards, wherever the data have the residue."
        - "Network clusters are named against the annotated human proteome, with a tooltip of each cluster's best terms and a Highlight a term box."
        doi: "10.5281/zenodo.24406688"
  downloads:               # the release's files, at the commit the site was built from
    - {label: Sites, url: "https://raw.githubusercontent.com/Shechterlab/PTM_Pipeline/v1.7.0/releases/v1.7.0/human_phosphorylation_sites_v1.7.0.tsv", format: TSV, note: "every phosphorylation record: one row per residue, with its evidence class, sources, Ochoa 2020 functional score and mass-spectrometry evidence (Ochoa 2020 rows included, not open access)"}
    - {label: Data dictionary, url: "https://raw.githubusercontent.com/Shechterlab/PTM_Pipeline/v1.7.0/releases/v1.7.0/data_dictionary.tsv", format: TSV, note: "every column of every file, with its codes"}
    - {label: README, url: "https://github.com/Shechterlab/PTM_Pipeline/blob/v1.7.0/releases/v1.7.0/README.md", format: Markdown, note: "how the release was made, its sources and what was dropped"}
    - {label: What changed, url: "https://github.com/Shechterlab/PTM_Pipeline/blob/v1.7.0/releases/v1.7.0/CHANGES.md", format: Markdown, note: "the changes since the previous release"}
  search:                  # the search's words beyond genes and the questions' keys (kit-select.js, kit-search.js, kit-near.js)
    patterns:                # the motif finder: a pattern of residues on the sites' sequence windows
      at: motif              # motif:SPXK covers the site
      near: window           # window:RXXS anywhere within the span
      span: 15
      near_examples:         # the suggestions after window:
        - {pattern: "RXXS", label: "Arg at -3 of the site (basophilic)"}
        - {pattern: "SPXX", label: "Pro just after a Ser"}
        - {pattern: "DXXD", label: "two acidic residues 3 apart"}
    spacing: {label: "Another phosphosite within", within: [2, 3, 5, 10, 20]}
    partners:                # the proteins' physical partners (a protein_partners table)
      table: string
      key: binds
      label: Has a physical partner that is
      gene_label: Binds a specific protein
      score_label: STRING physical confidence
      help: "STRING 12.5 physical associations of the phosphorylated protein (score 0.7 or more)"
      interpro: interpro_entries           # the InterPro entry intervals the classes' interpro ids are read from
      attribute: {id: bound_by, label: Partner classes of the protein, help: "The classes of the physical partners of the phosphorylated protein"}
      # Each set is a query on open data, recorded with its source and release. Kinases and phosphatases are UniProt
      # keyword queries of 2026-11-10 against UniProt release 2026_04 (reviewed human entries, organism 9606), saved with
      # their query in sites/data/phospho_*.tsv: KW-0723 Serine/threonine-protein kinase, KW-0829 Tyrosine-protein
      # kinase, KW-0904 Protein phosphatase. InterPro entries are read from the InterPro 108.0 entry intervals this
      # site's manifest holds (https://www.ebi.ac.uk/interpro/api/entry/interpro/IPRxxxxxx/, checked 2026-11-10;
      # members of the entry on the reviewed human proteome).
      classes:
        writer_stk:
          label: a serine/threonine kinase (writer)
          role: writer
          reads: phosphorylates Ser or Thr
          genes_file: sites/data/phospho_ser_thr_kinases.tsv
          help: "UniProt keyword KW-0723, serine/threonine-protein kinase (reviewed human entries, UniProt 2026_04): candidates, which include pseudokinases and dual-specificity kinases"
        writer_ptk:
          label: a tyrosine kinase (writer)
          role: writer
          reads: phosphorylates Tyr
          genes_file: sites/data/phospho_tyr_kinases.tsv
          help: "UniProt keyword KW-0829, tyrosine-protein kinase (reviewed human entries, UniProt 2026_04): candidates, which include pseudokinases and dual-specificity kinases"
        eraser_pp:
          label: a protein phosphatase (eraser)
          role: eraser
          reads: removes phosphate from Sph, Tph or Yph
          genes_file: sites/data/phospho_phosphatases.tsv
          help: "UniProt keyword KW-0904, protein phosphatase (reviewed human entries, UniProt 2026_04)"
        reader_1433:
          label: a 14-3-3 protein (reader)
          role: reader
          reads: pS or pT in R-S-x-pS-x-P and R-x-Y/F-x-pS-x-P
          interpro: [IPR000308]
          help: "14-3-3 protein family (IPR000308, InterPro 108.0): the seven human 14-3-3 isoforms"
        reader_sh2:
          label: an SH2-domain protein (reader)
          role: reader
          reads: Yph in its sequence context
          interpro: [IPR000980]
          help: "SH2 domain (IPR000980, InterPro 108.0). Not every SH2 domain needs phosphotyrosine"
        reader_fha:
          label: an FHA-domain protein (reader)
          role: reader
          reads: pT (pT-x-x-D)
          interpro: [IPR000253]
          help: "Forkhead-associated domain (IPR000253, InterPro 108.0)"
        reader_ww:
          label: a WW-domain protein (reader)
          role: reader
          reads: some bind pS-Pro or pT-Pro (Pin1)
          interpro: [IPR001202]
          help: "WW domain (IPR001202, InterPro 108.0). Most WW domains bind proline-rich peptides without phosphate; Pin1's reads pS/pT-P"
        reader_brct:
          label: a BRCT-domain protein (reader)
          role: reader
          reads: pS (pS-x-x-F) in some
          interpro: [IPR001357]
          help: "BRCT domain (IPR001357, InterPro 108.0). Some BRCT repeats bind phosphopeptides, others DNA or protein"
        reader_polo:
          label: a polo-box protein (reader)
          role: reader
          reads: pS or pT (S-pS/pT-P)
          interpro: [IPR000959]
          help: "POLO box domain (IPR000959, InterPro 108.0): PLK1, PLK2, PLK3, PLK4 and PLK5"
      marked: another phosphorylated protein
      other: any other protein
      scores: [0.7, 0.9]
  tabs:                    # the top tabs' words (the addresses #method stay; #idrs opens its question)
    overview: {label: Overview, hint: "Click a class row to select its sites, or a tile's title to open the question."}
    proteins: {label: Proteins, hint: "One row per protein with phosphosites. Filter, sort and download."}
    sites: {label: Sites, hint: "One row per phosphosite, with its residue and evidence. Filter, sort and download."}
    interactions: {label: Interactions, hint: "Where phosphosites meet RNA, DNA and other proteins: crosslinks and RNA-bound peptides in cells, interfaces and bound RNA and DNA in PDB structures, and who binds each site."}
    idrs: {label: Disordered regions, hint: "Disordered regions (IDRs) of phosphorylated proteins, and the phosphosites in them.", as: section, question: idr_charge}
    method: {label: Methods, hint: "How each question was tested, every test, the controls, the sources and how to cite."}
    help: {label: Help, hint: "Searching, filters, selections and keyboard keys."}
  partners: {species: 9606}         # interaction partners on protein pages, live from STRING (human)
  network:                 # the Network view (kit-network.js): the proteins with sites as one network, clustered, each cluster named by its most enriched term
    title: Network
    about: "Phosphorylated proteins as one network. STRING physical links and curated complexes join them, communities are the clusters, and each cluster is named by its most enriched GO biological process or Reactome pathway. Node size is sites per 100 serines, threonines and tyrosines, or the number of sites."
    edges:
      - {id: string_physical, kind: pairs, label: STRING physical, input: string_partners, min_score: 700, channels: [{id: experiments, label: experiments, column: experiments}, {id: databases, label: curated databases, column: database}], cite: "STRING v12.5: Szklarczyk et al., Nucleic Acids Res 53:D730 (2025), doi:10.1093/nar/gkae1113", url: "https://string-db.org"}
      - {id: complex_portal, kind: groups, label: Complex Portal complexes, input: complexes, name: complex_name, where: {curation: curated}, max_size: 40, weight: 700, cite: "Complex Portal (curated complexes, CC0): Meldal et al., Nucleic Acids Res 50:D578 (2022), doi:10.1093/nar/gkab991", url: "https://www.ebi.ac.uk/complexportal"}
      # the optional functional layer (STRING functional links, dashed and faint, off until chosen): left out while the release has no such table
      - {id: string_functional, kind: functional, label: STRING functional, input: string_functional, optional: true, default: false, min_score: 700, weight: 400, cite: "STRING v12.5: Szklarczyk et al., Nucleic Acids Res 53:D730 (2025), doi:10.1093/nar/gkae1113", url: "https://string-db.org"}
    label_from:             # the first source names the clusters; the others are in the Label by menu
      - id: go_bp
        label: GO biological process
        input: go_bp
        set: go_id
        protein: uniprot_accession
        names: {input: go_terms, set: go_id, name: go_name, depth: depth_min, size: n_proteins}
        min_depth: 3            # a term must lie at least three steps below the root
        max_size: 1500          # and annotate at most this many proteins of the whole proteome
        non_iea: true           # count only annotations with evidence other than IEA (false: all)
        cite: "Gene Ontology Consortium, Genetics 224:iyad031 (2023), doi:10.1093/genetics/iyad031; Ashburner et al., Nat Genet 25:25 (2000), doi:10.1038/75556; GOA human annotations of 2026-11-04"
        url: "https://geneontology.org"
      - id: reactome
        label: Reactome
        input: reactome
        set: pathway_id
        protein: canonical_UniProtAC
        names: {input: reactome_names, set: pathway_id, name: name, depth: depth}
        cite: "Reactome release 97: Ragueneau et al., Nucleic Acids Res 54:D673 (2026), doi:10.1093/nar/gkaf1223"
        url: "https://reactome.org"
    top: 300
    min_cluster: 5
    cluster: louvain
    min_coverage: 0.25   # a term names a cluster if it holds for this share of the cluster
    thin_term: best      # else the best significant term, written with its share ("..." · 18%); genes: its three busiest proteins
    background: proteome  # the terms are tested against the annotated human proteome (site: every protein the network can draw; drawn: the view's own proteins)
    clusters: {default: auto, min: 4, max: 16}   # the page's Clusters menu: auto (Louvain at its default resolution) or a target number
    lead: "Phosphorylated proteins linked by physical interactions and complexes, clustered and named by GO biological process."   # the one line under the heading; the section Method has the rest
    controls: [clusters, colour, size, outline, find]   # the main row (others under More options): label, clusters, colour, size, outline, find, score, minc, sources, claim
    protein_link: true   # a See in network button on every protein page (#network?p=<accession>)
    protein_preview: true   # and a small drawing of it among its cluster under the button
    claim: "Phosphorylated proteins form {n} functional clusters"   # the exported figure's title
    size: {default: density}   # node size: density (sites per 100 of the protein's own candidate residues) or sites
    color_by:
      - {id: disordered, name: Share of sites in disordered regions, kind: sequential, column: disorder, values: [disordered]}
      - {id: domain, name: Domain class most sites are in, kind: categorical, column: domain_class}
      - {id: kinase, name: Main kinase motif class, kind: categorical, column: kinase_motifs}
      - {id: reader, name: Main reader-domain motif, kind: categorical, column: reader_motifs}
      - {id: abundance, name: PaxDb abundance decile, kind: decile, analysis: panther_group}   # the decile the statistics use as strata
    outline: {id: enzyme_role, name: Enzyme role, kind: role, none: "No enzyme or reader role"}   # a ring on the writers, erasers and readers (website.search.partners classes), with any color
    tile: {section: "Interactions and enzymes", title: Protein network, text: "The phosphorylated proteins with most sites, linked by physical interactions and complexes and clustered by GO biological process."}
  # The Compare sets page (#overlap): 2 to 4 terms (protein sets, classes, the selection, readers) and how their proteins and sites overlap
  overlap:
    terms_from: [panther_group, panther_class, panther_subclass, disease_family, disease_ontology, disease_term, reactome_top_level, reactome_pathway, hpa_location, cell_region_hpa, cell_region_hcm, cell_region_organelle_ip, cell_hcm_compartment, cell_hcm_domain, cell_organelle_ip, cell_chromatin, condensate, condensate_role, depmap_dependency, complex, condensate_proteome]
    max_terms: 4
    groups:            # the headings the picker lists terms under
      - {name: GO, from: [go_bp, go_binding]}
      - {name: Cell compartment, from: [hpa_location, cell_region_hpa, cell_region_hcm, cell_region_organelle_ip, cell_hcm_compartment, cell_hcm_domain, cell_organelle_ip, cell_chromatin]}
      - {name: Disease, from: [disease_family, disease_ontology, disease_term]}
      - {name: Pathway, from: [reactome_top_level, reactome_pathway]}
      - {name: Protein class, from: [panther_group, panther_class, panther_subclass]}
      - {name: Condensate, from: [condensate, condensate_role, condensate_proteome]}
      - {name: RNA and DNA binding, from: [eclip_rna_apexseq, eclip_gene_tsaseq, eclip_gene_hic, binding_protein]}
      - {name: Complex or histone, from: [complex, histone]}
      - {name: Cancer dependency, from: [depmap_dependency]}
    names: {writer_stk: Serine/threonine kinases, writer_ptk: Tyrosine kinases, eraser_pp: Protein phosphatases}
    term_sources:      # GO biological process, propagated over is_a and part_of, 5 to 5,000 proteins; the evidence include below keeps annotations that are not computational-only (remove it to keep every annotation)
      - id: go_bp
        title: GO biological process
        members: {input: go_bp_annotations, protein: uniprot_accession, set: go_id, include: [{column: non_iea, equals: "true"}]}
        names: {input: go_bp_terms, id: go_id, name: go_name}
        min_size: 5
        max_size: 5000
        cite: ["Gene Ontology Consortium, Genetics 224:iyad031 (2023), doi:10.1093/genetics/iyad031", "Ashburner et al., Nat Genet 25:25 (2000), doi:10.1038/75556"]
    notes: {cell_hcm_compartment: one main location per protein, cell_hcm_domain: one main location per protein, cell_organelle_ip: one main location per protein}
    units: [proteins, sites, readers, enzymes]
    enzymes: {roles: [writer, eraser]}
    readers:           # a protein is a reader when it carries any listed Pfam or InterPro entry (each id checked on InterPro)
      source: interpro_entries
      families:
      - {name: 14-3-3, ids: [IPR000308, IPR023410, PF00244]}
      - {name: SH2, ids: [IPR000980, PF00017]}
      - {name: BRCT, ids: [IPR001357, PF00533]}
  compare: {min_proteins: 10, min_marks: 30}
  tables:                  # tables the protein pages show (no test reads them), each in a format of CONTRACTS.md
    # changes at every candidate residue (TCGA MC3 tumors, DepMap 24Q4 cell lines): one table a source and residue, counted per site and new residue
    tcga_changes_S:
      input: tcga_changes_S
      format: residue_changes
      columns: {accession: canonical_UniProtAC, position: position, alt: alt, gene: gene}
    tcga_changes_T:
      input: tcga_changes_T
      format: residue_changes
      columns: {accession: canonical_UniProtAC, position: position, alt: alt, gene: gene}
    tcga_changes_Y:
      input: tcga_changes_Y
      format: residue_changes
      columns: {accession: canonical_UniProtAC, position: position, alt: alt, gene: gene}
    depmap_changes_S:
      input: depmap_changes_S
      format: residue_changes
      columns: {accession: canonical_UniProtAC, position: position, alt: alt, gene: gene}
    depmap_changes_T:
      input: depmap_changes_T
      format: residue_changes
      columns: {accession: canonical_UniProtAC, position: position, alt: alt, gene: gene}
    depmap_changes_Y:
      input: depmap_changes_Y
      format: residue_changes
      columns: {accession: canonical_UniProtAC, position: position, alt: alt, gene: gene}
    cancer_background:     # per protein and residue: how many candidates it has and the changes at them, the base of its average
      input: cancer_change_background
      format: protein_records
      columns: {accession: canonical_UniProtAC, residue: residue, residues: residues}
      values: [tcga_changes, depmap_changes]
      include: [{column: residue, in: [S, T, Y]}]
    # germline variants at every candidate residue (ClinVar, gnomAD v4.1): one row per variant, read beside the site
    clinvar_S:
      input: clinvar_changes_S
      format: site_table
      columns: {accession: canonical_UniProtAC, position: position}
      values: [alt, variation_id, germline_classification, clinsig_simple, review_stars, conditions, gene]
    clinvar_T:
      input: clinvar_changes_T
      format: site_table
      columns: {accession: canonical_UniProtAC, position: position}
      values: [alt, variation_id, germline_classification, clinsig_simple, review_stars, conditions, gene]
    clinvar_Y:
      input: clinvar_changes_Y
      format: site_table
      columns: {accession: canonical_UniProtAC, position: position}
      values: [alt, variation_id, germline_classification, clinsig_simple, review_stars, conditions, gene]
    gnomad_S:
      input: gnomad_changes_S
      format: site_table
      columns: {accession: canonical_UniProtAC, position: position}
      values: [alt, variant_id, af, nhomalt, grpmax, gene]
    gnomad_T:
      input: gnomad_changes_T
      format: site_table
      columns: {accession: canonical_UniProtAC, position: position}
      values: [alt, variant_id, af, nhomalt, grpmax, gene]
    gnomad_Y:
      input: gnomad_changes_Y
      format: site_table
      columns: {accession: canonical_UniProtAC, position: position}
      values: [alt, variant_id, af, nhomalt, grpmax, gene]
    clinvar_background:       # per protein and residue: how many candidates it has and the variants at them, the base of its average
      input: clinvar_background
      format: protein_records
      columns: {accession: canonical_UniProtAC, residue: residue, residues: residues}
      values: [clinvar_variants]
      include: [{column: residue, in: [S, T, Y]}]
    gnomad_background:       # per protein and residue: how many candidates it has and the variants at them, the base of its average
      input: gnomad_background
      format: protein_records
      columns: {accession: canonical_UniProtAC, residue: residue, residues: residues}
      values: [gnomad_variants]
      include: [{column: residue, in: [S, T, Y]}]
    # changes the sources list that the cards do not show (the source's residue differs from UniProt's, or lies past its end): read whole, in files of their own
    excluded_cancer:
      input: variant_changes_excluded
      format: site_table
      columns: {accession: canonical_UniProtAC, position: position}
      values: [source, source_id, gene, source_ref, canonical_ref, alt, reason]
      include: [{column: source, in: [tcga_mc3, depmap_24q4]}]
      include_any: [{column: source_ref, in: [S, T, Y]}, {column: canonical_ref, in: [S, T, Y]}]      # the source or UniProt names one of the site's residues
    excluded_germline:
      input: variant_changes_excluded
      format: site_table
      columns: {accession: canonical_UniProtAC, position: position}
      values: [source, source_id, gene, source_ref, canonical_ref, alt, reason]
      include: [{column: source, in: [clinvar, gnomad_v4_1]}]
      include_any: [{column: source_ref, in: [S, T, Y]}, {column: canonical_ref, in: [S, T, Y]}]
    dependency:            # the Cancer cell lines and tumors card
      input: depmap_gene_effect
      format: protein_records
      columns: {accession: canonical_UniProtAC, lines: lines, dependent: dependent_lines, median: median, common_essential: common_essential, histogram: histogram, lineages: most_dependent_lineages}
    hpa:                   # the Location and condensates card: Human Protein Atlas locations
      input: hpa_locations
      format: protein_records
      columns: {accession: canonical_UniProtAC, location: location, main: main, reliability: reliability}
    condensate_members:    # CD-CODE 2.3 members of each condensate, with the confidence score and the evidence
      input: cdcode_members_2_3
      format: protein_records
      columns: {accession: uniprot_accession, condensate: condensate_uid, score: confidence_score, roles: roles, evidence: experimental_evidence, pmids: pmids}
    condensates:           # CD-CODE condensate names and types
      input: cdcode_condensates
      format: lookup
      sep: ","
      columns: {key: uid}
      values: [name, condensate_type]
    # the RNA and DNA interactions card and the Interactions page: protein-level tables of the v1.7.0 release (no residue of a kind is named in them)
    nucleic_regions:       # runs of residues within 4 Å of RNA or DNA in PDB structures (the RNA and DNA interactions card)
      input: nucleic_acid_regions
      format: protein_records
      columns: {accession: uniprot_accession}
      values: [start, end, nucleic_acid, n_entries]
    dna_motifs:            # JASPAR profiles of the protein
      input: dna_motifs
      format: protein_records
      columns: {accession: uniprot_accession}
      values: [matrix_id, name, tf_class, tf_family, consensus]
    rna_bind_n_seq:        # ENCODE RNA Bind-n-Seq, in vitro
      input: rna_bind_n_seq
      format: protein_records
      columns: {accession: uniprot_accession}
      values: [encode_experiment, concentration, top_5mers, top_5mer_R]
    eclip:                 # ENCODE and ENCORE eCLIP, in cells
      input: eclip
      format: protein_records
      columns: {accession: uniprot_accession}
      values: [source, experiment, cell_line, n_peaks, peaks_CDS, peaks_UTR3, peaks_UTR5, peaks_noncoding_exon, peaks_intron, peaks_intergenic,
               top_target_genes, top_target_peaks, top_5mers, top_5mer_ratios, same_data_as]
    rbns:
      input: rna_bind_n_seq
      format: protein_values
      columns: {accession: uniprot_accession}
      values: [encode_experiment, concentration, top_5mers]
    htr_selex:
      input: htr_selex
      format: protein_values
      columns: {accession: uniprot_accession}
      values: [model_id, motif_kind, consensus]
    ix_dna_motifs:
      input: dna_motifs
      format: protein_values
      columns: {accession: uniprot_accession}
      values: [matrix_id, name, tf_family, consensus]
    ix_eclip:
      input: eclip
      format: protein_values
      columns: {accession: uniprot_accession}
      values: [experiment, source, cell_line, n_peaks, top_target_genes, top_5mers]
    string:                # STRING v12.5 physical links, each pair listed once and read both ways, at score 0.7 or more
      input: string_physical_v12_5
      format: protein_partners
      columns: {accession: protein_a, partner_accession: protein_b, partner: gene_b, score: combined_score}
      both_ways: {partner: gene_a}
      include: [{column: combined_score, at_least: 700}]
    interactions:          # PTM_Pipeline release v1.7.0: each site's evidence (PDB interfaces, crosslinks, RNA-bound peptides, DNA-binding regions)
      input: phospho_site_interactions_v1_5_1
      format: site_evidence
      columns: {site: site_id, kind: evidence_type, partner: partner_gene, partner_accession: partner_accession, ids: structures, score: score, detail: detail}
      include: [{column: evidence_type, in: [pdb_protein, pdb_rna, pdb_dna, pdb_self, rna_crosslink, dna_crosslink, capri_xl_peptide, capri_adj_peptide, rbrid_residue, dna_binding_region]}]
    contacts:
      input: phospho_nucleic_acid_contacts_v1_5_1
      format: bound_windows
      columns: {site: site_id, window: window_marked, kind: nucleic_acid, type: nucleic_acid_type, name: molecule_name, entry: pdb_id,
                distance: closest_distance_a, preparation: sample_preparation, chain: chain, nucleotides: contacted_nucleotides,
                numbers: contacted_author_numbers, distances: contacted_distances_a}
    contacts_near:
      input: phospho_nucleic_acid_near_sites_v1_5_1
      format: bound_windows
      columns: {site: site_id, window: window_marked, kind: nucleic_acid, type: nucleic_acid_type, name: molecule_name, entry: pdb_id,
                entries: n_entries, offset: residue_offset, preparation: sample_preparation}
    residues:
      input: phospho_residue_evidence_v1_5_1
      format: residue_evidence
      columns: {accession: uniprot_accession, start: start, end: end, kind: evidence_type, source: sources}
      include: [{column: evidence_type, in: [rna_crosslink, dna_crosslink, capri_xl_peptide, capri_adj_peptide, rbrid_residue, rbrid_region, dna_binding_region]}]
    chain_evidence:        # the 3D viewer's colorings along the chain: each run's kind with where it falls
      input: phospho_residue_evidence_v1_5_1
      format: residue_evidence
      columns: {accession: uniprot_accession, start: start, end: end, kind: [evidence_type, localisation], source: sources}
      include: [{column: evidence_type, in: [rna_crosslink, dna_crosslink, capri_xl_peptide, capri_adj_peptide, rbrid_residue, rbrid_region,
                                             dna_binding_region, pdb_rna, pdb_dna, pdb_protein, pdb_self]}]
    records:
      input: phospho_site_interaction_records_v1_5_1
      format: site_records
      columns: {site: site_id, group: record_class, partner: partner_gene, partner_name: partner_name, partner_accession: partner_accession,
                partner_kind: partner_kind, species: partner_species, source: source, id: source_id, method: method, context: context,
                state: site_state, state_detail: state_detail, other_marks: other_marks, pubmed: pubmed, doi: doi, citation: citation,
                title: paper_title}
  sites:                   # the Sites tab
    table:                 # the optional columns (the Columns menu): the same set on every site, where the data has it
      - {id: na, label: RNA/DNA contacts, menu: "RNA/DNA contacts (structures) and crosslinks (cells)", show: [sequences, around], default: true}
      - {id: src, label: Reported by, attribute: sources, default: true, hide: sm}
      - {id: writer, label: Writer (UniProt), menu: "Writers: the records’ writers, then those UniProt names for the residue", show: [writer], default: true, hide: sm}
      - {id: ctx, label: Context, menu: Disorder and domain context, analyses: [disorder, domain_context], hide: xs}
      - {id: nn, label: "Nearest other mark", menu: "Distance to the nearest other mark", show: [nearest], hide: sm}
      - {id: struct, label: Structural context, analyses: [structure_context], hide: sm}
      - {id: tcga, label: Changes in cancers, menu: "Changes in tumors (TCGA) and cell lines (DepMap)", show: [changes], hide: sm}
  # Mutation propensity (CONTRACTS.md, "Mutation propensity"): for every candidate residue, the changes seen in each source against
  # the changes its codon predicts (PTM_Pipeline v1.7.0 supporting tables, joined on accession and position). It draws the lollipops
  # on the protein cards, the line on the site card and the Disease variants page (ranked sites, tumors, inherited disease and the waterfall).
  propensity:
    residues: [S, T, Y]
    sources:
      - {id: tcga, set_source: tcga_mc3, label: TCGA, long: "TCGA tumors (MC3)", kind: somatic, table: site_propensity_tcga_mc3, frequency_source: tcga_mc3, card: tcga, unit: [tumor, tumors]}
      - {id: depmap, set_source: depmap_24q4, label: DepMap, long: "DepMap 24Q4 cell lines", kind: somatic, table: site_propensity_depmap_24q4, frequency_source: depmap_24q4, card: depmap, unit: [cell line, cell lines]}
      - {id: clinvar, set_source: clinvar, label: ClinVar, long: "ClinVar variations", kind: germline, table: site_propensity_clinvar, card: clinvar, unit: [variant, variants]}
      - {id: gnomad, set_source: gnomad_v4_1, label: gnomAD, long: "gnomAD v4.1 exomes", kind: germline, table: site_propensity_gnomad_v4_1, card: gnomad, unit: [variant, variants], lower_tail: true}
    frequency: site_frequency_by_group
    denominators: group_denominators
    burden: sample_burden
    changes: [tcga_changes_S, tcga_changes_T, tcga_changes_Y]
    germline_changes: [gnomad_changes_S, gnomad_changes_T, gnomad_changes_Y]   # gnomAD change tables: the germline waterfall's tooltip sums each residue's allele frequencies
    clinvar_changes: [clinvar_changes_S, clinvar_changes_T, clinvar_changes_Y]   # ClinVar change tables: the Disease variants page\'s inherited view counts the pathogenic and likely pathogenic variants
    clinvar_pathogenic: {column: germline_classification, matches: &plp "(Pathogenic|Likely pathogenic)([;,/].*)?"}   # which of them count: the same rule as the cards\' P/LP highlight (aliased there)
    disease_families: disease_families   # the release's disease family rules, read as text and never run: a family for each ClinVar condition
    site_sets: site_set_propensity
    controls: propensity_controls
    validation: propensity_validation
  protein:                 # the protein page
    complex_names:         # complexes and families a writer name must never resolve to one protein (they link to a UniProt search)
      [AMPK, CK2, CK1, IKK, PKA, PKC, CaMKII, CDK, MAPK, ERK, PP2A, PP1]
    conservation:          # orthologs live from Ensembl Compara, and the selection's logo (CONTRACTS.md, Conservation across species)
      reference: Human
      ensembl: {rest: "https://rest.ensembl.org", xref: Ensembl, source: human}
      species:             # every species a set below can name, with the label shown (all in Ensembl Compara's vertebrate set)
        - {id: mus_musculus, label: Mouse}
        - {id: rattus_norvegicus, label: Rat}
        - {id: canis_lupus_familiaris, label: Dog}
        - {id: bos_taurus, label: Cow}
        - {id: macaca_mulatta, label: Macaque}
        - {id: monodelphis_domestica, label: Opossum}
        - {id: gallus_gallus, label: Chicken}
        - {id: anolis_carolinensis, label: Lizard}
        - {id: xenopus_tropicalis, label: Frog}
        - {id: danio_rerio, label: Zebrafish}
        - {id: callorhinchus_milii, label: Elephant shark}
        - {id: ciona_intestinalis, label: Sea squirt}
        - {id: drosophila_melanogaster, label: Fly}
        - {id: caenorhabditis_elegans, label: Worm}
        - {id: saccharomyces_cerevisiae, label: Yeast}
      presets:             # the reader's choice, remembered in the browser; each set spans a range that still aligns well
        - {id: mammals, label: Mammals, species: [mus_musculus, rattus_norvegicus, canis_lupus_familiaris, bos_taurus, macaca_mulatta, monodelphis_domestica],
           note: "close relatives: almost every site aligns"}
        - {id: vertebrates, label: Vertebrates, species: [mus_musculus, gallus_gallus, anolis_carolinensis, xenopus_tropicalis, danio_rerio, callorhinchus_milii],
           note: "from mouse to the elephant shark"}
        - {id: animals, label: Animals, species: [mus_musculus, gallus_gallus, xenopus_tropicalis, danio_rerio, ciona_intestinalis, drosophila_melanogaster, caenorhabditis_elegans],
           note: "vertebrates, a sea squirt, the fly and the worm"}
        - {id: to_yeast, label: To yeast, species: [mus_musculus, gallus_gallus, xenopus_tropicalis, danio_rerio, drosophila_melanogaster, caenorhabditis_elegans, saccharomyces_cerevisiae],
           note: "the set used here: mouse to budding yeast; few proteins have a yeast relative"}
      default: to_yeast
      logo: true
      logo_mode: freq      # the logo's first stack is residue frequency, as the explorer's; bits is a switch
    open_partners: true
    order: [p-map, p-cell, p-cc, p-ix, p-na, p-sites, p-sitetab, p-cons, p-score, p-pert, p-exp, p-struct, p-cond, p-dis, p-depmap, p-germline, p-kinds, p-regions, p-cluster, p-ptm, p-seq]   # the explorer's order, with the orthologs after the sites
    groups:                # about five headings, each holding its folds (website.protein.groups)
      - {id: g-overview, title: Overview and map, folds: [p-map, p-cell, p-kinds]}
      - {id: g-sites, title: Sites, folds: [p-sites, p-sitetab, p-cons, p-score, p-pert, p-exp, p-cluster, p-ptm]}
      - {id: g-binding, title: Binding and contacts, folds: [p-cc, p-ix, p-na]}
      - {id: g-context, title: Context, switch: true, folds: [p-cond, p-dis, p-depmap, p-germline]}
      - {id: g-structure, title: Structure and sequence, folds: [p-struct, p-regions, p-seq]}
    headings:              # the cards front end's folds under labeled headings, each fold in its group; "switch" adds the This protein / Dataset context switch
      - {id: h-ix, title: Interactions, folds: [p-cc, p-na]}
      - {id: h-sites, title: Sites and structure, folds: [p-score, p-pert, p-exp]}
      - {id: h-context, title: Protein context, switch: true, folds: [p-cond, p-dis, p-depmap, p-germline, p-kinds, p-regions, p-cons]}
      - {id: h-seq, title: Sequence features, folds: [p-cluster, p-ptm, p-seq]}
    context:               # the sets a fold lists for the protein, each tested across the dataset (the Dataset context view)
      p-cond: [condensate_proteome, hpa_location]
      p-dis: [disease_family]
    open: [p-map, p-cell]   # the map and where in the cell open, every other fold shut
    map:
      combined_marks: {default: folded}   # one "All modifications" block (a thin lane for each modification, the site's own first); the rows of the context marks fold behind it
      colour_by:            # the residue first (the default), then by the kinase motif class of the site (the question's own classes)
        - residue
        - {id: kinase_motif, label: Kinase motif class, analysis: kinase_motifs,
           help: "Each site by the kinase motif class it fits (proline-directed, basophilic, acidophilic); a site in more than one takes the first listed, one in none is gray"}
      default_off: [ptm]                  # the gray live UniProt row (glycosylation, lipidation, cross-links, other) starts off: the Rows menu turns it on
      hover:                # the hovers on the map: a concise card; the rest is on the pinned card and the site card
        site: [name, chips, nearby, click]
        chips: [sources, {attribute: pmids, count: PMIDs}, functional_score]
        context: [mark, residue, detail, source, click]
      marks_view: {attribute: functional_score, at_least: 0.5, label: score ≥ 0.5}   # every site at first; a click on the row label keeps the sites Ochoa 2020 scores 0.5 or more
      hide_ptm_kinds: [Phospho]   # the live UniProt "Other PTMs" row would repeat the phosphosites: one source for them
    genes:                 # one accession several genes encode: a short name for labels and titles, the full list on the page, every gene searchable
      input: uniprot_entries
      from: Entry
      to: "Gene Names (primary)"
      separator: ";"
      symbols: sites/data/hgnc_symbols.tsv   # previous and alias symbols (HGNC, CC0): HIST1H4B finds H4
      short:
        - {pattern: "^H3-3[AB]$", replace: "H3.3"}
        - {pattern: "^(H2A|H2B|H3|H4)[C-]\\d+[A-Z]?$", replace: "\\1"}
    numbering:             # proteins numbered without the initiator methionine in every label, link and search (histones; proteins UniProt records it removed for)
      - genes: "^(H1-\\d+P?|H2A[A-Z0-9-]*|H2B[A-Z0-9-]*|H3C\\d+|H3-\\d+[A-Z]?|H3Y\\d|H4C\\d+|H4-\\d+|MACROH2A\\d|CENPA)$"
        names: "^(putative |core )?histone (h1|h2a|h2b|h3|h4|macro-h2a)\\b|^testis-specific h1 histone|^histone h3-like centromeric"
        offset: -1
        label: histone numbering
        note: "Histone numbering, without the initiator methionine"
    nucleic:               # the RNA and DNA interactions card (CONTRACTS.md, RNA and DNA interactions)
      title: RNA and DNA interactions
      kinds: {rna: RNA, dna: DNA}
      near: {table: contacts_near, label: "in contact through a neighboring residue"}
      crosslinks:          # single residues only: no peptide or fragment is listed
        table: residues
        span: 5
        kinds: {rna_crosslink: rna, dna_crosslink: dna}
      regions:             # runs of residues bound in structures (no site is listed: the bound residues are the run itself)
        table: nucleic_regions
        kinds: {rna: rna, dna: dna}
        fields: {start: start, end: end, kind: nucleic_acid, entries: n_entries}
      motifs:
        table: dna_motifs
        kind: dna
        url: "https://jaspar.elixir.no/matrix/{id}/"
        fields: {id: matrix_id, name: name, class: tf_class, family: tf_family, consensus: consensus}
      rbns:
        table: rna_bind_n_seq
        kind: rna
        url: "https://www.encodeproject.org/experiments/{id}/"
        fields: {id: encode_experiment, conc: concentration, kmers: top_5mers, scores: top_5mer_R}
      eclip:
        table: eclip
        kind: rna
        url: {ENCODE: "https://www.encodeproject.org/experiments/{id}/", ENCORE: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE315407"}
        fields: {id: experiment, source: source, cell: cell_line, peaks: n_peaks, genes: top_target_genes, gene_peaks: top_target_peaks, kmers: top_5mers, ratios: top_5mer_ratios, same: same_data_as,
                 regions: {CDS: peaks_CDS, "3′ UTR": peaks_UTR3, "5′ UTR": peaks_UTR5, "non-coding exon": peaks_noncoding_exon, intron: peaks_intron, intergenic: peaks_intergenic}}
    structure:             # the 3D viewer's evidence at the sites (CONTRACTS.md, Structure evidence), through the tables above
      contacts:            # PDBe-KB interfaces at the sites, with the PDB entries that show each
        table: interactions
        include: [{column: kind, in: [pdb_rna, pdb_dna, pdb_protein, pdb_self]}]
        kinds: {pdb_rna: rna, pdb_dna: dna, pdb_protein: protein, pdb_self: self}
        label: PDBe-KB interfaces at the phosphosites
        help: "PDB entries where the phosphosite is at an interface with RNA, DNA, another protein or another copy (PDBe-KB)"
      bound:               # the RNA or DNA each site touches, entry by entry
        table: contacts
        label: RNA and DNA bound at the phosphosite
        help: "Nucleotides within reach of the site’s side chain in each PDB entry analyzed"
      residues:
        table: chain_evidence
        colourings:
          - id: crosslinks
            label: RNA/DNA crosslinks (cells)
            none: No crosslink recorded
            help: "Residues crosslinked to RNA or DNA in living cells, and the peptides and regions found bound"
            classes:
              - {id: both, label: Crosslinked to RNA and to DNA, colour: ev, all: [rna, dna]}
              - {id: rna, label: RNA-crosslinked residue, colour: rna, where: [{column: kind, equals: "rna_crosslink; at_residue"}]}
              - {id: dna, label: DNA-crosslinked residue, colour: dna, where: [{column: kind, equals: "dna_crosslink; at_residue"}]}
              - {id: rna_bound, label: "RNA-bound peptide or region (CAPRI, RBR-ID)", colour: rna_pale,
                 where: [{column: kind, in: ["capri_xl_peptide; in_peptide", "capri_adj_peptide; in_fragment", "rbrid_residue; in_region", "rbrid_region; in_region"]}]}
              - {id: dna_bound, label: "DNA-bound peptide or region (crosslink, DNA-binding)", colour: dna_pale,
                 where: [{column: kind, in: ["dna_crosslink; candidate_residue", "dna_crosslink; in_peptide", "dna_binding_region; in_region"]}]}
          - id: interfaces
            label: Interfaces in the PDB (PDBe-KB)
            none: At no interface in the PDB
            help: "Residues at an interface in a PDB entry (PDBe-KB) with RNA, DNA, another protein or another copy"
            classes:
              - {id: rna, label: RNA interface, colour: rna, where: [{column: kind, equals: "pdb_rna; at_residue"}]}
              - {id: dna, label: DNA interface, colour: dna, where: [{column: kind, equals: "pdb_dna; at_residue"}]}
              - {id: protein, label: Protein interface, colour: protein, where: [{column: kind, equals: "pdb_protein; at_residue"}]}
              - {id: self, label: Interface with another copy of the protein, colour: self, where: [{column: kind, equals: "pdb_self; at_residue"}]}
    cards:                 # the context cards (kit-pcards.js; CONTRACTS.md, Protein page cards), each from the tables above
      location:
        title: Location and condensates
        summary: Human Protein Atlas locations, subcellular maps and CD-CODE condensates
        hpa: {table: hpa, analysis: hpa_location, title: Subcellular location, source: Human Protein Atlas 25.1, url: "https://www.proteinatlas.org/search/{acc}", unsure: Uncertain}
        maps: true
        condensates:
          members: condensate_members
          names: condensates
          analysis: condensate_proteome
          title: Condensates
          source: CD-CODE 2.3
          url: "https://cd-code.org/condensates/{id}"
          max_score: 5
          default_type: biomolecular
          pubmed: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esummary.fcgi"
          roles: {member: member, driver: driver, client: client, regulator: regulator, unknown: role not given}
          evidence: {in_vivo: in vivo, in_cellulo: in cellulo, in_vitro: in vitro, frap: FRAP, colocalization: colocalization, mass_spectrometry: mass spectrometry,
                     emergent properties: emergent properties, others: other}
      dependency:
        title: Cancer cell lines and tumors
        excluded: cancer
        table: dependency
        unit: cancer cell lines
        sub: "Dependency of cancer cell lines on the gene (DepMap CRISPR screens) and changes at its serines, threonines and tyrosines in TCGA tumors and DepMap cell lines. Cancer genetics, not evidence about phosphorylation."
        histogram: {from: -3, to: 1, axis: gene effect per cell line (Chronos); lower is a stronger dependency, marks: [{at: 0, label: no effect}, {at: -1, label: median of common essentials}]}
        url: "https://depmap.org/portal/gene/{gene}?tab=overview"
        note: "Data: DepMap Public 24Q4 (CRISPR, Chronos; CC BY 4.0) and TCGA tumors (MC3 somatic calls from the GDC, open access; based on data generated by the TCGA Research Network). A change counts only at a serine, threonine or tyrosine of the canonical UniProt sequence."
      other_ptms:
        title: Other PTMs
        sub: "Other modifications recorded on this protein, as in the map legend."
        near: 10
      germline:
        title: Germline variants
        excluded: germline
        sub: "Variants in ClinVar (clinical classifications) and gnomAD v4.1 (population frequencies) at the protein's serines, threonines and tyrosines, against the protein's average for the same residue type. A variant at a residue does not show an effect on phosphorylation, and a variant seen in a population is not necessarily harmless."
        note: "Data: ClinVar (NCBI; public domain; submitters may claim rights in what they submitted) and gnomAD v4.1 exomes (CC0 1.0; Chen et al., Nature 625:92 (2024), doi:10.1038/s41586-023-06045-0). A variant counts only at a serine, threonine or tyrosine of the canonical UniProt sequence."
    sets:                  # cards of the protein's own sets, each linked to its page and selecting its proteins
      - id: p-dis
        title: Disease associations
        summary: "UniProt, Open Targets, Disease Ontology, DisGeNET terms and disease families"
        analyses: [disease_ontology, disease_term, disease_family, disease_family_additional]
        term_groups: {terms: disease_term, families: [disease_family, disease_family_additional]}
        live: {uniprot: true, open_targets: {graphql: "https://api.platform.opentargets.org/api/v4/graphql", size: 12, page: "https://platform.opentargets.org/target/{id}/associations"}}
    facts:                 # the headline cards under the map: each opens its section, with a hover
      - {count: marks, of: candidates, label: "{residues} phosphorylated", kind: Sites, glyph: pins, opens: p-seq}
      - {analysis: kinase_motifs, best: true, label: "in {class} motifs", kind: Sequence motif, glyph: letters, opens: p-score}
      - {analysis: disorder, classes: [disordered], label: in disordered regions, kind: Position in the protein, glyph: wave, opens: p-regions}
      - {analysis: condensate_proteome, best: true, label: "CD-CODE condensates, with {class}", kind: Condensates, glyph: drops, opens: p-kinds}
      - {analysis: disease_family, label: disease families, kind: Disease, glyph: cross, opens: p-kinds, hide_in: cards}
    card:                  # the site card: its blocks, each reading a table above (a block without its data is absent)
      hide_questions: [cancer_change, clinvar_plp, gnomad_variant]   # their counts are the blocks above (Changes, Germline variants)
      primary_questions: [kinase_motifs, disorder, domain_class, idr_charge]   # the rest are behind "Other questions"
      change_counts:       # changes at each candidate residue from residue_changes tables, beside the protein's average for that residue (the toggle: known sites only, or every candidate)
        - {id: tcga, label: TCGA, unit: [tumor, tumors], tables: [tcga_changes_S, tcga_changes_T, tcga_changes_Y], background: cancer_background, count: tcga_changes, gene: gene}
        - {id: depmap, label: DepMap, unit: [cell line, cell lines], tables: [depmap_changes_S, depmap_changes_T, depmap_changes_Y], background: cancer_background, count: depmap_changes, gene: gene}
      variant_counts:      # germline variants at each candidate residue from per-variant tables, beside the protein's average for that residue (the toggle as above)
        - id: clinvar
          lazy: true       # its rows are read from a file of their own when the card is opened
          label: ClinVar
          unit: [variant, variants]
          tables: [clinvar_S, clinvar_T, clinvar_Y]
          background: clinvar_background
          count: clinvar_variants
          gene: gene       # the column naming the gene; the card shows it for a protein several genes encode
          highlight: {column: germline_classification, matches: *plp, label: P/LP, title: "Classified pathogenic or likely pathogenic by ClinVar"}
          sort: [{column: review_stars, order: desc}]
          fields:
            - {column: germline_classification, label: Classification}
            - {column: review_stars, label: Review, type: stars, max: 4}
            - {column: conditions, label: Conditions, separator: "|", max: 60}
          link: {column: variation_id, url: "https://www.ncbi.nlm.nih.gov/clinvar/variation/{}/"}
        - id: gnomad
          lazy: true       # its rows are read from a file of their own when the card is opened
          label: gnomAD
          unit: [variant, variants]
          tables: [gnomad_S, gnomad_T, gnomad_Y]
          background: gnomad_background
          count: gnomad_variants
          gene: gene       # the column naming the gene; the card shows it for a protein several genes encode
          sort: [{column: af, order: desc}]
          fields:
            - {column: af, label: Allele frequency, type: sci}
            - {column: nhomalt, label: Homozygotes, type: int}
            - {column: grpmax, label: Highest group, words: {afr: African, amr: Admixed American, asj: Ashkenazi Jewish, eas: East Asian, fin: Finnish, mid: Middle Eastern, nfe: Non-Finnish European, sas: South Asian, remaining: Remaining}}
          link: {column: variant_id, url: "https://gnomad.broadinstitute.org/variant/{}?dataset=gnomad_r4"}
      excluded:            # changes the cards do not show, one list a card: kept in files of their own, counted by reason (CONTRACTS.md)
        - id: cancer
          lazy: true
          tables: [excluded_cancer]
          count_by: reason
          reasons: {residue_differs: "the source's residue differs from UniProt's", position_beyond_sequence: "the position lies beyond the end of UniProt's sequence"}
        - id: germline
          lazy: true
          tables: [excluded_germline]
          count_by: reason
          reasons: {residue_differs: "the source's residue differs from UniProt's", position_beyond_sequence: "the position lies beyond the end of UniProt's sequence"}
      evidence:            # interaction evidence: PDB entries, bound RNA and DNA, crosslinks near the site
        title: Interaction evidence
        entries:                             # the site's entries in structures, by kind (a site_evidence table)
          table: interactions
          kinds: {pdb_rna: RNA, pdb_dna: DNA, pdb_protein: "", pdb_self: another copy}   # "": the partner's name
          url: "https://www.rcsb.org/structure/{id}"
        sequences:                           # bound_windows tables: the RNA and DNA in contact in structures
          title: RNA and DNA contacts of {site}
          tables: [contacts, contacts_near]
          kinds: {rna: RNA, dna: DNA}
          types: {rrna: rRNA, trna: tRNA, snrna: snRNA, mrna: mRNA, other_ncrna: Other ncRNA, viral_rna: Viral RNA, rna_oligo: RNA oligo, other_rna: Other RNA,
                  nucleosomal_dna: Nucleosomal DNA, telomeric_dna: Telomeric DNA, other_dna: Other DNA}
          designed: {preparation: Synthetically obtained, label: oligo}
          ends: ["5′", "3′"]
          max: 5
        around:                              # a residue_evidence table: crosslinks and RNA-bound stretches at or near the site
          table: residues
          span: 3
          labels: {rna_crosslink: UV-crosslinked to RNA in living cells, dna_crosslink: UV-crosslinked to DNA in living cells,
                   capri_xl_peptide: inside CAPRI RNA-crosslinked peptide,
                   capri_adj_peptide: inside CAPRI RNA-bound peptide (ADJ), rbrid_residue: under an RBR-ID+ peptide, rbrid_region: inside an RBR-ID region,
                   dna_binding_region: inside a UniProt DNA-binding region}
      records:             # a site_records table: who binds it, and how it was found
        title: Who binds it, and how it was found
        table: records
        help:
          binds_modified: "the residue is phosphorylated in the structure (SEP, TPO or PTR), as the entry models it"
          binds_unmodified: structures that model an unmodified residue here (PDBe-KB interface)
          binds_other_residue: "structures with another residue here: a mutated construct or a natural variant"
          binds_state_not_read: PDBe-KB places an interface here, but the entry's sequence could not be matched to the site
          nucleic_acid: contacts in structures, crosslinks and RNA-bound peptides in cells, UniProt DNA-binding regions
          self: homo-oligomer contacts in structures
        labels:              # the headings of the groups (a group the groups attribute does not label); the summary line reads them too
          binds_modified: Binds it phosphorylated
          binds_unmodified: Binds it unmodified
          binds_other_residue: Binds a mutant or variant there
          binds_state_not_read: "At an interface, residue not read"
          nucleic_acid: RNA or DNA
          self: Another copy of the protein
        open: [binds_modified]
        summary:             # the one line that names partners (Interactions page, Sites table): its groups' names, the other partners counted
          - {label: binds phosphorylated, groups: [binds_modified], role: reader}
        rollup:              # the groups under two headings: the residue in the site's state, against in any other
          - {label: Binds it phosphorylated, groups: [binds_modified]}
          - {label: "Binds the residue, unmodified or in another state", groups: [binds_unmodified, binds_other_residue, binds_state_not_read]}
        kinds: {self: another copy, rna: RNA, dna: DNA}
        species: Homo sapiens                # partners of another species are named with theirs
        urls: {PDB: "https://www.rcsb.org/structure/{id}"}
        states: {serine: S (unmodified), threonine: T (unmodified), tyrosine: Y (unmodified), Sph: Sph (phosphoserine), Tph: Tph (phosphothreonine), Yph: Yph (phosphotyrosine), other_residue: variant, not_recorded: not recorded, not_read: not read}
  pages:
    - id: interactions
      tab: Interactions
      title: RNA, DNA and protein contacts
      sub: "Evidence at each phosphosite: crosslinks and RNA-bound peptides in cells, interfaces and bound RNA or DNA in solved structures, and partners."
      method: |
        The tables of this page are the release's supporting tables, read through the site file's mapping; no test reads them. One row is one piece of evidence at one phosphosite: a PDBe-KB interface residue in a PDB entry (with a protein, RNA, DNA or another copy of the protein), a residue UV-crosslinked to RNA or DNA in living cells, a residue inside an RNA-bound peptide (CAPRI) or under an RBR-ID peptide, or a residue inside a UniProt DNA-binding region.

        Bound RNA and DNA come from PDB structures: each chain of RNA or DNA within reach of the site’s side chain, with the bound sequence around the closest nucleotide. The records list who binds each site and how it was found, with the state of the residue in the structure or experiment (unmodified, phosphorylated, another residue, or not read).

        RBDmap and pCLAP evidence, predicted complexes and IntAct records are not in these tables.
      columns:             # how the page shows the tables' columns (a table's own: <table>.<column>)
        interactions.kind: {label: Evidence, values: {rna_crosslink: RNA-crosslinked residue, capri_xl_peptide: CAPRI XL-peptide, capri_adj_peptide: CAPRI ADJ-peptide, rbrid_residue: RBR-ID+ residue, dna_crosslink: DNA crosslink, dna_binding_region: UniProt DNA-binding region, pdb_protein: PDB protein interface, pdb_rna: PDB RNA interface, pdb_dna: PDB DNA interface, pdb_self: PDB interface with another copy}}
        interactions.ids: {label: Structures}
        partner_accession: {label: Partner}
        partner: {label: Partner gene}
        records.group: {label: Record, values: {binds_modified: Binds it phosphorylated, binds_unmodified: Binds it unmodified, binds_other_residue: Binds a mutant or variant there, binds_state_not_read: Binds it (state not read), nucleic_acid: RNA or DNA, self: Another copy of the protein}}
        records.source: {label: Evidence}
        records.partner_kind: {label: Partner kind, values: {protein: Protein, rna: RNA, dna: DNA, self: Another copy}}
        records.state: {label: The site in it, values: {serine: S (unmodified), threonine: T (unmodified), tyrosine: Y (unmodified), Sph: Sph (phosphoserine), Tph: Tph (phosphothreonine), Yph: Yph (phosphotyrosine), other_residue: Variant, not_recorded: Not recorded, not_read: Not read}}
        state_detail: {label: The site in it}
        context: {label: What it shows}
        pubmed: {label: Paper}
        window: {label: "Bound sequence ([contact])"}
        contacts.type: {label: Type, values: {rrna: rRNA, trna: tRNA, snrna: snRNA, mrna: mRNA, other_ncrna: Other ncRNA, viral_rna: Viral RNA, rna_oligo: RNA oligo, other_rna: Other RNA, nucleosomal_dna: Nucleosomal DNA, telomeric_dna: Telomeric DNA, other_dna: Other DNA}}
        contacts.name: {label: Molecule}
        contacts.distance: {label: Closest (Å)}
        contacts.entry: {label: PDB, type: pdb}
      groups:
        - name: RNA and DNA
          sections:
            - id: ixs-cells
              title: Crosslinks and RNA-bound peptides in cells
              question: Which phosphosites are crosslinked to RNA or DNA, lie inside an RNA-bound peptide, or lie in a DNA-binding region?
              blocks:
                - {kind: table, table: interactions, title: The crosslinks and RNA-bound peptides at each site, chips: kind, columns: [accession, kind, detail], limit: 25,
                   where: [{column: kind, in: [rna_crosslink, dna_crosslink, capri_xl_peptide, capri_adj_peptide, rbrid_residue, dna_binding_region]}]}
            - id: ix-na
              title: Bound RNA and DNA
              question: Which RNA and DNA do phosphosites contact in structures, and how close do they come?
              blocks:
                - {kind: table, table: contacts, title: RNA and DNA at phosphosites, sub: "Each PDB chain of RNA or DNA within reach of a site’s side chain, with the bound sequence around the closest nucleotide.", chips: type, columns: [accession, window, type, name, distance, entry], sort: distance, descending: false}
            - id: ix-pref
              title: Preferred RNA and DNA, by protein
              question: What do these proteins prefer to bind, in vitro and in cells?
              sub: proteins with RNA Bind-n-Seq data
              blocks:
                - {kind: table, table: rbns, title: RNA in vitro (RNA Bind-n-Seq), columns: [accession, top_5mers, concentration, encode_experiment]}
                - {kind: table, table: htr_selex, title: RNA in vitro (HTR-SELEX), columns: [accession, consensus, motif_kind, model_id]}
                - {kind: table, table: ix_eclip, title: RNA in cells (eCLIP), columns: [accession, cell_line, n_peaks, top_target_genes, top_5mers, experiment], sort: n_peaks}
                - {kind: table, table: ix_dna_motifs, title: DNA (JASPAR), columns: [accession, consensus, name, tf_family, matrix_id]}
        - name: Structures
          sections:
            - id: ixs-pdb
              title: Interfaces in PDB structures
              question: Which phosphosites are at protein, RNA or DNA interfaces in experimental structures?
              blocks:
                - {kind: table, table: interactions, title: The PDB interfaces at each site, chips: kind, columns: [accession, kind, partner_accession, ids, detail], limit: 25,
                   where: [{column: kind, in: [pdb_protein, pdb_rna, pdb_dna, pdb_self]}], partner: partner_accession, label: partner}
        - name: Binding proteins
          sections:
            - id: ix-who
              title: Proteins that bind the phosphosite
              question: Which proteins bind these sites, in which state of the residue, and how was each found?
              sub: phosphosites with a record
              blocks:
                - {kind: table, table: records, group_by: group, rollup: [{label: Binds it phosphorylated, values: [binds_modified]}, {label: "Binds the residue, unmodified or in another state", values: [binds_unmodified, binds_other_residue, binds_state_not_read]}], columns: [accession, partner_accession, source, method, state_detail, context, pubmed], partner: partner_accession, label: partner, limit: 40}
