# Site: the human lysine modification sites (acetylation and the other lysine acylations, ubiquitination and SUMOylation),
# from UniProt, iPTMnet, CPLM 4.0, Hendriks 2017 and Akimov 2018 (release v1.5.0 of PTM_Pipeline; CPLM states no license: its sites are included, cited).
# The same code and the same generic inputs as the methyllysine site; its own marks, questions, focus, words and colors.
# The four release tables are one set of marks, a row per lysine and type (marks.add with set: acyl_type); each type is a
# filter, and the key questions run again on each type with at least 200 lysines (marks_subsets). There is no earlier
# release to match, so every statistic is new (no reference). Contract: ptmcontext/schemas/site.schema.json.
schema_version: 1
id: lysine
title: Human lysine modification sites
status: working
mark: sites/marks/lysine.yaml
manifest: sites/lysine.inputs.json

snapshot: {input: uniprot_fasta, release: "UniProt 2026_03"}   # quoted: unquoted, YAML reads 2026_03 as 202603
inputs:                # role the layers read: manifest input that fills it
  disorder: mobidb_disorder
  domains: interpro_domains
  reactome: reactome_protein_pathways
  reactome_names: reactome_pathways
  hpa: hpa_locations
  abundance: paxdb_abundance
  panther_classes: panther_protein_classes
  panther_ontology: panther_class_ontology
  uniprot_entries: uniprot_entries
  gene_symbols: orghs_symbol_entrez
  disgenet: disgenet_term_genes
  hdo_term_genes: hdo_term_genes
  hdo_terms: hdo_terms
  accession_history: uniprot_accession_history
  cdcode_membership: cdcode_membership
  cdcode_proteins: cdcode_proteins
  cdcode_condensates: cdcode_condensates
  cdcode_members: cdcode_members_2_3
  hcm: hcm_cell_map
  organelle_ip: organelle_ip
  chromatin: chromatin_probability
  depmap_genes: depmap_gene_effect
  # interactions (the methyllysine site's roles)
  uniprot_disorder: uniprot_disordered_regions
  uniprot_domains: uniprot_domain_regions
  pdb_interfaces: {all_of: [pdbe_kb_interfaces_2026_10_16, pdbe_kb_interfaces_2026_10_20, pdbe_kb_interfaces_2026_10_21,
                            pdbe_kb_interfaces_2026_10_21_2, pdbe_kb_interfaces_2026_10_21_3, pdbe_kb_interfaces_2026_10_25]}
  pdb_observed: sifts_observed_ranges
  predicted_interfaces: protvar_interfaces
  intact_mutations: intact_mutations
  intact_binding_regions: intact_binding_regions
  complexes: complex_portal_complexes

marks:
  # The release's four tables, one set of marks: a row per lysine and type, the type in acyl_type (acetyl, ubiquitin, sumo, or
  # the acyl type of the acylation table, acetyl rows of which come from the acetylation table). The main view counts the
  # lysines with an experimental record (UniProt ECO:0000269 or ECO:0007744, an iPTMnet record curated from an experiment,
  # a CPLM record labelled Exp. or Exp./Dat.) or an unspecified iPTMnet record. Behind the lower-confidence switch, as the
  # methyllysine site's: the rows UniProt reports only by similarity (ECO:0000250 and other records without an experimental
  # code), and the rows only CPLM reports with the label Dat. (taken from another database; CPLM names no experiment).
  input: acetylation_sites_v1_5_0
  accession: canonical_UniProtAC
  position: position
  add:
    - {input: lysine_acylation_sites_v1_5_0, exclude: [{column: acyl_type, equals: acetyl}]}
    - {input: ubiquitination_sites_v1_5_0, set: {acyl_type: ubiquitin}}
    - {input: sumoylation_sites_v1_5_0, set: {acyl_type: sumo}}
  exclude:
    - {column: evidence_class, equals: by-similarity}     # in the main view their lysines count as other lysines
    - all_of: [{column: sources, equals: CPLM}, {column: cplm_evidence, equals: Dat.}]    # CPLM's database-derived records alone
  parts:                # a lysine of one type, for the questions on a lysine that has another (near_marks, window 0)
    - {id: acetylation, where: {column: acyl_type, equals: acetyl}}
    - {id: ubiquitination, where: {column: acyl_type, equals: ubiquitin}}
    - {id: sumoylation, where: {column: acyl_type, equals: sumo}}
    # the same, from one study alone: the SUMOylation sites of Hendriks 2017 and the ubiquitination sites of Akimov 2018 (with or
    # without CPLM), for the pairs asked again without the sites only CPLM reports
    - {id: sumoylation_hendriks, where: {all_of: [{column: acyl_type, equals: sumo}, {column: sources, contains: Hendriks 2017}]}}
    - {id: ubiquitination_akimov, where: {all_of: [{column: acyl_type, equals: ubiquitin}, {column: sources, contains: Akimov 2018}]}}
    - {id: other_acylation, where: {column: acyl_type, in: [2-hydroxyisobutyryl, beta-hydroxybutyryl, crotonyl, glutaryl, succinyl, lactoyl, methacryl, isonicotinyl, benzoyl, butyryl, malonyl, propionyl, phosphoglyceryl, biotinyl, lipoyl]}}
  residue_mismatch: error
  attributes:          # what the website keeps for each site: to color, filter and explain it (no test reads these)
    acyl_type:
      column: acyl_type
      join_rows: true                       # a lysine has a row for each type it carries: all of them
      label: Modification
      kind: list
      separator: "; "
      values:
        acetyl: Acetylation (Kac)
        ubiquitin: Ubiquitination (Kub)
        sumo: SUMOylation
        2-hydroxyisobutyryl: 2-Hydroxyisobutyrylation (Khib)
        beta-hydroxybutyryl: β-Hydroxybutyrylation (Kbhb)
        crotonyl: Crotonylation (Kcr)
        glutaryl: Glutarylation (Kglu)
        succinyl: Succinylation (Ksucc)
        lactoyl: Lactylation (Kla)
        methacryl: Methacrylation (Kmea)
        isonicotinyl: Isonicotinylation (Kinic)
        benzoyl: Benzoylation (Kbz)
        butyryl: Butyrylation (Kbu)
        malonyl: Malonylation (Kmal)
        propionyl: Propionylation (Kpr)
        phosphoglyceryl: Phosphoglycerylation (Kpgly)
        biotinyl: Biotinylation (Kbio)
        lipoyl: Lipoylation (Klip)
      colours:
        acetyl: "#15803d"
        ubiquitin: "#be185d"
        sumo: "#0369a1"
        2-hydroxyisobutyryl: "#8a7a1c"
        beta-hydroxybutyryl: "#854d0e"
        crotonyl: "#475569"
        glutaryl: "#4d7c0f"
        succinyl: "#b91c1c"
        lactoyl: "#a16207"
        methacryl: "#4338ca"
        isonicotinyl: "#0f766e"
        benzoyl: "#9d174d"
        butyryl: "#57534e"
        malonyl: "#1e3a8a"
        propionyl: "#3f6212"
        phosphoglyceryl: "#7f1d1d"
        biotinyl: "#713f12"
        lipoyl: "#365314"
      colour: true
      filter: true
      help: "The modifications reported on the lysine, one row each. Codes follow the usual form of the Brno histone nomenclature (ac, ub, su) with the lysine letter: Kac and Kub for acetylation and ubiquitination, SUMO for SUMOylation, and the common short names for the acylations (Khib, Kbhb, Kcr, Kglu, Ksucc, Kla, Kmea, Kinic, Kbz, Kbu, Kmal, Kpr, Kpgly, Kbio, Klip). SUMOylation is written SUMO so that it is not confused with Ksucc, succinylation"
    evidence_class:
      column: evidence_class
      join_rows: true
      provenance: true                       # how the site was found, not what it is
      label: Evidence
      kind: list
      separator: "; "
      values: {experimental: Experimental, unspecified: Unspecified, by-similarity: By similarity}
      colour: true
      filter: true
      help: "The best class of the records at the site. Experimental: UniProt ECO:0000269 or ECO:0007744, an iPTMnet record curated from an experiment, a CPLM record from an experimental paper, alone or with another database, a Hendriks 2017 SUMO-2 site or an Akimov 2018 ubiquitination site (both mass spectrometry). Unspecified: an iPTMnet record whose source has no evidence code, or a CPLM record taken from another database only. By similarity: UniProt's ECO:0000250 (lower-confidence variant)"
    sources:
      column: sources
      join_rows: true
      provenance: true
      label: Databases
      kind: list
      separator: "; "
      records:             # a database's own record of the protein
        UniProt: "https://www.uniprot.org/uniprotkb/{acc}/entry#ptm_processing"
        iPTMnet: "https://research.bioinformatics.udel.edu/iptmnet/entry/{acc}/"
      values: {UniProt: UniProt, iPTMnet: iPTMnet, CPLM: CPLM 4.0, Hendriks 2017: "Hendriks et al. 2017", Akimov 2018: "Akimov et al. 2018"}
      colour: true
      filter: true
      help: "The databases and the two studies that report the lysine. Most sites of every large type are from CPLM 4.0, which states no license. Hendriks 2017: Hendriks et al., Nat Struct Mol Biol 24:325 (2017), doi:10.1038/nsmb.3366, SUMO-2 sites found by mass spectrometry in HeLa and U2OS cells (its Supplementary Table 1). Akimov 2018: Akimov et al., Nat Struct Mol Biol 25:631 (2018), doi:10.1038/s41594-018-0084-y, ubiquitination sites found by the UbiSite method in Hep2 and Jurkat cells (its Supplementary Table 1). Choose one of the two studies to see its SUMOylation or ubiquitination sites without CPLM; the data sources tile gives the counts"
    cplm_evidence:
      column: cplm_evidence
      join_rows: true
      provenance: true
      label: CPLM evidence
      kind: list
      separator: "; "
      values: {Exp.: "Experimental paper", Exp./Dat.: "Paper and another database", Dat.: "Another database only"}
      filter: true
      help: "CPLM 4.0's own evidence label for the lysine. Curated from an experimental paper; also reported by another database; or another database only (these sit behind the lower-confidence switch). Empty for a lysine CPLM does not report"
    hendriks_cell_lines:
      column: hendriks_cell_lines
      join_rows: true
      provenance: true
      label: Cell line (Hendriks)
      kind: list
      separator: ";"
      colour: true
      filter: true
      help: "The cell lines (HeLa, U2OS) in which Hendriks et al. 2017 detected the SUMO-2 site by mass spectrometry; empty for a lysine that study did not report"
    hendriks_localization_probability:
      column: hendriks_localization_probability
      join_rows: true
      provenance: true
      label: Localization probability (Hendriks)
      kind: list
      separator: "; "
      help: "Hendriks et al. 2017: the probability that the SUMO is on this lysine and not on a neighbor (0 to 1); empty for a lysine that study did not report"
    akimov_cell_lines:
      column: akimov_cell_lines
      join_rows: true
      provenance: true
      label: Cell line (Akimov)
      kind: list
      separator: ";"
      colour: true
      filter: true
      help: "The cell lines (Hep2, Jurkat) in which Akimov et al. 2018 measured the ubiquitination site; empty for a lysine that study did not report"
    akimov_localization_probability:
      column: akimov_localization_probability
      join_rows: true
      provenance: true
      label: Localization probability (Akimov)
      kind: list
      separator: "; "
      help: "Akimov et al. 2018: the best probability that the ubiquitin is on this lysine and not on a neighbor (0 to 1); empty for a lysine that study did not report"
    iptmnet_score:
      column: iptmnet_score
      join_rows: true
      provenance: true
      label: iPTMnet score
      kind: list
      separator: "; "
      filter: true
      help: "iPTMnet 6.2's own score of the residue (1 to 4), calculated by iPTMnet from the evidence sources on its website; given only where iPTMnet reports the lysine"
    iptmnet_sources:
      column: iptmnet_sources
      join_rows: true
      provenance: true
      label: iPTMnet's upstream databases
      kind: list
      separator: "; "
      filter: true
      help: The databases iPTMnet collected the record from (unip is its copy of UniProt)
    pmids:
      column: pmids
      join_rows: true
      label: PubMed IDs
      kind: list
      separator: ";"
      link: {column: pmids, url: "https://pubmed.ncbi.nlm.nih.gov/{}/"}
      help: The papers the records cite
analyses:              # each: one statistics row per class, pooled (fisher) and within protein (mantel_haenszel); all new: no release to match
  - id: pdb_interface
    new: true
    title: PDB interfaces
    question: "Are modified lysines at interfaces in experimental structures?"
    sub: "Modified lysines against the other lysines of the same proteins observed in a PDB structure, at a PDBe-KB interface with RNA, DNA, a protein or any partner; all, ordered (outside UniProt disordered regions) and in domains"
    section: Protein interactions
    counting: every_candidate
    background: other lysines of the same proteins observed in a PDB structure
    proteins_with: pdb_interfaces                       # proteins PDBe-KB lists with an interface
    covered_by: pdb_observed                            # residues a PDB chain models (SIFTS)
    tests:
      - {category: protein, inside: {role: pdb_interfaces, where: [{column: class, matches: "([OPQ][0-9][A-Z0-9]{3}[0-9]|[A-NR-Z][0-9]([A-Z][A-Z0-9]{2}[0-9]){1,2})(-[0-9]+)?"}]}, label: Protein interface}
      - {category: any, inside: {role: pdb_interfaces, where: [{column: class, matches: "RNA|DNA|([OPQ][0-9][A-Z0-9]{3}[0-9]|[A-NR-Z][0-9]([A-Z][A-Z0-9]{2}[0-9]){1,2})(-[0-9]+)?"}]}, label: Any interface}
    strata:
      - {stratum: all}
      - {stratum: ordered, outside_of: uniprot_disorder, suffix: ", ordered regions"}
      - {stratum: domain, covered_by: uniprot_domains, suffix: ", in domains"}
  - id: predicted_interface
    new: true
    title: Predicted interfaces
    question: "Are modified lysines at predicted protein interfaces?"
    sub: "Modified lysines against the other lysines of the same proteins, at a ProtVar AlphaFold-Multimer interface residue of a heterodimer with pDockQ at or above 0.23 or 0.5; all, ordered and disordered (UniProt)"
    section: Protein interactions
    counting: every_candidate
    background: other lysines of the same proteins
    tests:
      - {category: pdockq_0.23, inside: {role: predicted_interfaces, where: [{column: class, at_least: 0.23}]},
         proteins_with: {role: predicted_interfaces, where: [{column: class, at_least: 0.23}], on_candidates: true}, label: "pDockQ ≥ 0.23"}
      - {category: pdockq_0.5, inside: {role: predicted_interfaces, where: [{column: class, at_least: 0.5}]},
         proteins_with: {role: predicted_interfaces, where: [{column: class, at_least: 0.5}], on_candidates: true}, label: "pDockQ ≥ 0.5"}
    strata:
      - {stratum: all}
      - {stratum: ordered, outside_of: uniprot_disorder, suffix: ", ordered regions"}
      - {stratum: disordered, covered_by: uniprot_disorder, suffix: ", disordered regions"}
  - id: intact
    new: true
    title: IntAct mutations and binding regions
    question: "Are modified lysines where IntAct maps interactions?"
    sub: "Modified lysines whose mutation changes an interaction, against the other mutated lysines; and inside an IntAct binding region of at most 20 residues, against the other lysines of the proteins with one (all, and in UniProt disordered regions)"
    section: Protein interactions
    counting: every_candidate
    tests:
      - {category: mutation_changes_interaction, inside: {role: intact_mutations, where: [{column: class, matches: "(?!MI:2226$).*"}]},
         covered_by: intact_mutations, background: other lysines of the same proteins with an IntAct mutation, label: Mutation changes an interaction}
      - {category: binding_region, inside: intact_binding_regions, proteins_with: intact_binding_regions,
         background: other lysines of the same proteins with an IntAct binding region, label: IntAct binding region}
      - {category: binding_region_disordered, inside: intact_binding_regions, proteins_with: intact_binding_regions, covered_by: uniprot_disorder,
         background: other lysines of the same proteins with an IntAct binding region, label: "Binding region, disordered residues"}
  - id: complex
    test: protein_sets
    new: true
    title: Protein complexes
    question: "Which complexes have more members with modified lysines than expected?"
    sub: "Proteins with modified lysines against the proteins in Complex Portal's curated human complexes, by complex of at least 3 members (one-sided hypergeometric test); a protein in several complexes is in each"
    section: Protein interactions
    sets:
      input: complexes
      set: complex_id
      protein: uniprot_accession
      include: [{column: curation, equals: curated}]
    names: {input: complexes, set: complex_id, name: complex_name}
    universe: annotated
    min_size: 3
    background: other proteins in a curated Complex Portal complex
    link: "https://www.ebi.ac.uk/complexportal/complex/{}"
    collapse_similar: {jaccard: 0.9}      # variants with (nearly) the same members with modified lysines are one row on the website, "X (+n similar)"; the statistics keep every row
  - id: histone
    family_label: All types
    test: protein_sets
    new: true
    title: Histones and other proteins
    question: "Are proteins with modified lysines more often histones than other proteins?"
    sub: "Proteins with modified lysines against the reviewed human proteome, by whether PANTHER places the protein in a histone family (H1, H2A, H2B, H3 or H4) or not (one-sided hypergeometric test)"
    section: Histones, protein classes and pathways
    sets:
      input: panther_classes
      protein: uniprot_accession
      rules:
        - {set: histone, when: [{column: family_name, in: [HISTONE H1, HISTONE H2A, HISTONE H2B, HISTONE H3, HISTONE H4]}]}
        - {set: non_histone}
    universe: snapshot
    whole_universe: true
    background: other reviewed human proteins
    order: [{categories: [histone, non_histone]}]
    labels: {histone: Histones, non_histone: Other proteins}
    help:
      histone: "PANTHER families HISTONE H1, H2A, H2B, H3 and H4 (PANTHER 19.0): the histones of the nucleosome and the linker histones"
      non_histone: "every other reviewed human protein, including the enzymes that modify histones"
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", with each abundance decile analyzed separately"}
  - id: panther_group
    family_label: All types
    new: true
    test: protein_sets
    title: Protein classes (PANTHER), grouped
    question: "Which protein classes hold more proteins with modified lysines than expected?"
    sub: "Proteins with modified lysines against the reviewed human proteome, by PANTHER protein class (grouped); every protein is in one group (one-sided hypergeometric test)"
    section: Histones, protein classes and pathways
    sets:
      input: panther_classes
      protein: uniprot_accession
      classes: protein_class_ids
      ontology: {input: panther_ontology, id: class_id, name: name, parent: parent_id, root: PC00000}
      level: top
      groups:                   # the release's overview groups (PTM_Pipeline config/panther_class_groups.json)
          "Transcription, chromatin and DNA": [PC00264, PC00077, PC00009]
          "RNA processing and translation": [PC00031, PC00263]
          "Metabolic enzymes": [PC00262]
          "Protein-modifying enzymes": [PC00260]
          "Signalling: receptors, ligands and modulators": [PC00197, PC00207, PC00095, PC00060]
          "Transport and membrane traffic": [PC00227, PC00219, PC00150]
          "Cytoskeleton, adhesion and matrix": [PC00085, PC00211, PC00069, PC00070, PC00102]
          "Scaffolds, adaptors and chaperones": [PC00226, PC00072]
          "Immunity and defence": [PC00090]
          "Other PANTHER classes": [PC00237, PC00210]
      unclassified: No PANTHER protein class
    universe: snapshot
    whole_universe: true
    background: other reviewed human proteins
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", with each abundance decile analyzed separately"}
  - id: panther_class
    new: true
    test: protein_sets
    title: Protein classes (PANTHER)
    question: "Which PANTHER protein classes hold more proteins with modified lysines than expected?"
    sub: "Proteins with modified lysines against the reviewed human proteome, by top-level PANTHER protein class; every protein is in one class (one-sided hypergeometric test)"
    section: Histones, protein classes and pathways
    sets:
      input: panther_classes
      protein: uniprot_accession
      classes: protein_class_ids
      ontology: {input: panther_ontology, id: class_id, name: name, parent: parent_id, root: PC00000}
      level: top
      unclassified: No PANTHER protein class
    universe: snapshot
    whole_universe: true
    background: other reviewed human proteins
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", with each abundance decile analyzed separately"}
  - id: panther_subclass
    new: true
    test: protein_sets
    title: Protein subclasses (PANTHER)
    question: "Which PANTHER protein subclasses hold more proteins with modified lysines than expected?"
    sub: "Proteins with modified lysines against the reviewed human proteome, every PANTHER class below the top level with 10 or more proteins; subclasses overlap (one-sided hypergeometric test)"
    section: Histones, protein classes and pathways
    sets:
      input: panther_classes
      protein: uniprot_accession
      classes: protein_class_ids
      ontology: {input: panther_ontology, id: class_id, name: name, parent: parent_id, root: PC00000}
      level: below_top
    universe: snapshot
    whole_universe: true
    min_size: 10
    background: other reviewed human proteins
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", with each abundance decile analyzed separately"}
  - id: reactome_top_level
    family_label: All types
    new: true
    test: protein_sets
    title: Reactome pathways, top level
    question: "Which top-level Reactome pathways hold more proteins with modified lysines than expected?"
    sub: "Proteins with modified lysines against the other proteins with a Reactome pathway, by top-level pathway (one-sided hypergeometric test)"
    section: Histones, protein classes and pathways
    sets: {input: reactome, set: pathway_id, protein: canonical_UniProtAC}
    names: {input: reactome_names, set: pathway_id, name: name, include: [{column: depth, equals: "0"}]}
    background: other reviewed human proteins with at least one Reactome 97 pathway
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", with each abundance decile analyzed separately"}
  - id: reactome_pathway
    new: true
    test: protein_sets
    title: Reactome pathways
    question: "Which Reactome pathways, at any level, hold more proteins with modified lysines than expected?"
    sub: "Proteins with modified lysines against the other proteins with a Reactome pathway, every pathway of 10 to 500 proteins (one-sided hypergeometric test)"
    section: Histones, protein classes and pathways
    sets: {input: reactome, set: pathway_id, protein: canonical_UniProtAC}
    names: {input: reactome_names, set: pathway_id, name: name}
    min_size: 10
    max_size: 500
    background: other reviewed human proteins with at least one Reactome 97 pathway
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", with each abundance decile analyzed separately"}
  - id: condensate_proteome
    new: true
    test: protein_sets
    title: Biomolecular condensates
    question: "Which biomolecular condensates are over-represented (CD-CODE)?"
    sub: "CD-CODE condensates with a higher fraction of members with modified lysines than the reviewed proteome: every human condensate (not synthetic) with at least five members, its members against all reviewed human proteins (one-sided hypergeometric test). Condensate proteins are about twice as often modified as proteins in general, so most condensates are enriched relative to the proteome, and few relative to other condensates"
    section: Location, chromatin and condensates
    sets:
      input: cdcode_membership
      set: condensate_id
      protein: uniprotkb_ac
      where:
        - {column: uniprotkb_ac, input: cdcode_proteins, key: uniprot_id, include: [{column: species_name, equals: Homo sapiens}]}
        - {column: condensate_id, input: cdcode_condensates, key: uid, include: [{column: species_name, equals: Homo sapiens}], exclude: [{column: condensate_type, equals: synthetic}]}
      history: {input: accession_history, from: key, to: accession, include: [{column: kind, equals: secondary}]}
    names: {input: cdcode_condensates, set: uid, name: name}
    universe: snapshot
    whole_universe: true
    min_size: 5
    order: [{by: fold_enrichment, descending: true}, {by: a, descending: true}]
    background: other reviewed human proteins
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", with each abundance decile analyzed separately"}
    scores: {input: cdcode_members, set: condensate_uid, protein: uniprot_accession, value: confidence_score, label: Membership confidence (CD-CODE),
             help: "CD-CODE's 0-5 confidence that the protein belongs to the condensate (CD-CODE 2.3)", levels: [2, 3, 4, 5], max: 5}
    filter: {label: CD-CODE condensate (members with modified lysines), any: In any CD-CODE condensate, sets: all}   # every condensate with a modified member, as the original
  - id: condensate
    new: true
    test: protein_sets
    title: Biomolecular condensates, compared with other condensate proteins
    question: "Which biomolecular condensates stand out among condensate proteins (CD-CODE)?"
    sub: "CD-CODE condensates with a higher fraction of members with modified lysines than all condensate proteins: every human condensate (not synthetic) with at least five members, its members against the proteins in any of these condensates, about half of which are modified (one-sided hypergeometric test)"
    section: Location, chromatin and condensates
    sets:
      input: cdcode_membership
      set: condensate_id
      protein: uniprotkb_ac
      where:
        - {column: uniprotkb_ac, input: cdcode_proteins, key: uniprot_id, include: [{column: species_name, equals: Homo sapiens}]}
        - {column: condensate_id, input: cdcode_condensates, key: uid, include: [{column: species_name, equals: Homo sapiens}], exclude: [{column: condensate_type, equals: synthetic}]}
      history: {input: accession_history, from: key, to: accession, include: [{column: kind, equals: secondary}]}
    names: {input: cdcode_condensates, set: uid, name: name}
