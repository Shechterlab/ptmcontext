  default_background: other reviewed human proteins   # examples inside the Highlight and partner boxes
  start:                   # the Overview's start panel for a first visit, and the Help page's starts (kit-help.js)
    protein: TP53
    text: "Human lysine acetylation, other acylation, ubiquitination and SUMOylation sites from UniProt, iPTMnet, CPLM 4.0 and two proteome-wide studies (Hendriks et al. 2017 for SUMO, Akimov et al. 2018 for ubiquitin): their positions, proteins and partners. Each tile is one question, comparing the modified lysines with the other lysines of the same proteins, for all types together; each question's page links to the same question for each type with enough sites. Search a protein or a gene list to test your own selection."
    examples:
      - {label: A histone, query: H3C1, help: "Histone H3's modified lysines (H3 K4, K9, K27 and K36 are K5, K10, K28 and K37 in UniProt's numbering)."}
      - {label: A list of genes, query: TP53 MDM2 UBE2I, help: "Every question is tested again on their modified lysines."}
      - {label: One modified lysine in its structure, query: TP53 K372, help: "Its protein's domain and disorder map, the evidence for the residue, and its structures."}
  stats: [marks, proteins, {attribute: sources, label: studies and databases, opens: provenance}]
  overview:                # what the Overview opens with: tiles, in sections, each with its strongest classes
    statistic_label: true  # each tile names its statistic
    question: "Which proteins have modified lysines?"
    rows: 7
    random_maps: {n: 3, title: Example proteins}   # a closed fold at the end of the Overview: proteins drawn at random, each end to end
    sections:
      - name: Where in the cell
        about: "Where in the cell the proteins with modified lysines localize."
        #  the drawing of the cell on the Overview (website.cell: the maps of the cell as one question)
        cards:
          - {analysis: where_in_the_cell, title: Where in the cell, drawing: true, wide: true}
          - {analysis: cell_chromatin, title: Chromatin probability}
      - name: Same lysine, different modifications
        about: "Whether a lysine with one modification is also reported with another more often than the other lysines of its protein: acetylation, ubiquitination, SUMOylation and methylation. Mass spectrometry finds some lysines far more often than others, so each tile also gives the result among lysines with another modification."
        cards:                                  # beside each pair: the same question among the lysines reported modified at all
          - {analysis: same_ac_ub, beside: [{analysis: same_ac_ub_modified, label: Among lysines with another modification}, {analysis: same_ac_ub_akimov, label: Ubiquitination from Akimov 2018 only}]}
          - {analysis: same_ac_su, beside: [{analysis: same_ac_su_modified, label: Among lysines with another modification}, {analysis: same_ac_su_hendriks, label: SUMOylation from Hendriks 2017 only}]}
          - {analysis: same_ub_su, beside: [{analysis: same_ub_su_modified, label: Among lysines with another modification}, {analysis: same_ub_su_studies, label: Akimov 2018 and Hendriks 2017 only}]}
          - {analysis: same_ac_methyl, beside: {analysis: same_ac_methyl_modified, label: Among lysines with another modification}}
          - {analysis: same_ub_methyl, beside: [{analysis: same_ub_methyl_modified, label: Among lysines with another modification}, {analysis: same_ub_methyl_akimov, label: Ubiquitination from Akimov 2018 only}]}
          - {analysis: same_su_methyl, beside: [{analysis: same_su_methyl_modified, label: Among lysines with another modification}, {analysis: same_su_methyl_hendriks, label: SUMOylation from Hendriks 2017 only}]}
      - name: Which proteins
        about: "Histones, protein classes, pathways and condensates of the proteins with modified lysines, for all types together. Each question's page links to the same question for each type with at least 200 lysines."
        cards:
          - {analysis: histone, title: Histones and other proteins}
          - {analysis: panther_group, title: Protein classes}
          - {analysis: reactome_top_level, title: Reactome pathways (top level), rows: 4}
          - {analysis: panther_subclass, title: Protein subclasses}
          - {analysis: condensate_proteome, title: Biomolecular condensates, order: q}
          - {analysis: condensate_role, title: Roles in condensates}
      - name: Where in the protein
        about: "Where in the protein the modified lysines are: sequence motifs, folded or disordered parts, domains, the charge of disordered regions."
        cards:
          - {analysis: disorder}
          - {analysis: idr_charge}
          - {analysis: structure_context}
          - {analysis: domain_class, title: Nearest domain class}
          - {analysis: motif, title: Sequence motifs}
          - {analysis: which_factor, wide: true}
      - name: Modification type
        about: "How many lysines have each modification: acetylation, ubiquitination, SUMOylation and the other acylations, each its own type."
        #  counted, not tested (website.counts)
        cards: [types]
      - name: Other modifications
        about: "Whether modified lysines are near other modifications (methylarginines, methyllysines and phosphosites), within 10 residues."
        cards:
          - {analysis: near_methylarginine}
          - {analysis: near_methyllysine}
          - {analysis: near_phospho}
          - {analysis: near_phospho_high}
      - name: Interactions
        about: "Whether modified lysines are where a protein touches another or at an RNA or DNA interface, and the complexes their proteins are in."
        cards:
          - {analysis: pdb_interface, title: Interfaces in PDB structures}
          - {analysis: predicted_interface, title: Predicted interfaces}
          - {analysis: intact, title: IntAct binding regions and mutations}
          - {analysis: complex, title: Protein complexes}
          - {analysis: pdb_interface_na, title: RNA and DNA interfaces in PDB structures}
      - name: Disease and cancer
        about: "Diseases linked to the proteins with modified lysines, and cancer cell dependency."
        show: 1
        more: More on disease
        cards:
          - analysis: disease_family
            title: Disease
            views:               # one question, two vocabularies: a switch on its page
              - label: DisGeNET families
                analysis: disease_family
                more: {analysis: disease_family_additional, label: "Show {n} more families", head: "Additional families"}
                members:
                  analysis: disease_term
                  label: Show the DisGeNET terms
                  noun: term
                  nouns: DisGeNET terms
                  id_label: UMLS CUI
                  none: terms in no family
                  of:
                    - {analysis: disease_family, label: disease families checked by hand}
                    - {analysis: disease_family_additional, label: "additional families, mostly clinical signs"}
              - label: Disease Ontology
                analysis: disease_ontology
                ontology: {short: 50, compare: 4, tree: 100, id_label: DOID, noun: term, nouns: terms}
          - {analysis: depmap_dependency, title: Cancer cell dependency}
      - name: Evidence and studies
        about: "How well supported the modification sites are, and which databases they come from. Most sites are from CPLM 4.0; about half the ubiquitination sites are also from Akimov et al. 2018 and most SUMOylation sites from Hendriks et al. 2017. The data sources tile shows how many sites each reports."
        #  counted, not tested (website.counts)
        cards: [provenance, evidence, cplm]
      - name: More questions
        about: "Further pathways, cell maps, protein classes and complexes, one question each."
        cards: [panther_class, {analysis: reactome_pathway, title: Reactome pathways (all levels)}, {analysis: hpa_location, title: Human Protein Atlas locations},
                cell_hcm_compartment, cell_hcm_domain, cell_organelle_ip, {analysis: condensate, title: "Biomolecular condensates (vs other condensates)", order: q},
                domain_context]
  cell:                    # "Where in the cell" (kit-cell.js): the maps of the cell as one question, as the explorer's
    id: where_in_the_cell
    title: Where in the cell
    question: "Where do proteins with modified lysines localize in the cell?"
    intro: "Five maps from four studies locate proteins in the cell, by imaging, proximity labeling, organelle pull-down and chromatin fractionation."
    note: "Not shown: the nuclear-body map of Dyakov et al. (bioRxiv 2024), whose license (CC BY-NC-ND) does not allow derived works, and the speckle, lamina and PML-body proteomes of Barutcu et al. 2022 and its nuclear-body RNA map. The nuclear position of the genes of RNAs bound by proteins with eCLIP data (APEX-seq, TSA-seq, Hi-C subcompartments) is not shown."
    maps:                  # each a protein-set question whose sets are compartments: the grids' columns, in order
      - {analysis: hpa_location, regions: cell_region_hpa, name: Human Protein Atlas, short: Protein Atlas, method: Imaging, cells: many cell lines,
         how: "antibody staining in many cell lines; locations of Approved or better reliability with 20 or more proteins",
         ref: HPA 25.1, doi: 10.1126/science.aal3321, url: "https://www.proteinatlas.org/humanproteome/subcellular", licence: CC BY 4.0, min_members: 20}
      - {analysis: cell_hcm_compartment, regions: cell_region_hcm, name: Human Cell Map, short: Cell Map, method: Proximity labeling, cells: HEK293,
         how: "proximity labeling from 192 baits; each protein is assigned to the compartment whose baits label it most",
         ref: Go et al. 2021, doi: 10.1038/s41586-021-03592-2, url: "https://humancellmap.org", licence: CC BY 4.0}
      - {analysis: cell_hcm_domain, name: "Human Cell Map, finer domains", short: Cell Map domains, method: Proximity labeling, cells: HEK293,
         how: "the same map at a finer scale: neighborhoods of proteins that label one another (SAFE domains)",
         ref: Go et al. 2021, doi: 10.1038/s41586-021-03592-2, url: "https://humancellmap.org", licence: CC BY 4.0}
      - {analysis: cell_organelle_ip, regions: cell_region_organelle_ip, name: Organelle IP, short: Organelle IP, method: Organelle pull-down, cells: HEK293T,
         how: "Organelles immunoprecipitated one by one. Each protein is assigned to the organelle it co-purifies with.",
         ref: Hein et al. 2025, doi: 10.1016/j.cell.2024.11.028, url: "https://github.com/czbiohub-sf/Organelle_IP_analyses_and_figures", licence: BSD-3-Clause (analysis repository)}
      - {analysis: cell_chromatin, graded: true, name: Chromatin probability, short: ChEP, method: Fractionation, cells: human cell lines,
         how: "probability that a protein is chromatin-bound, from chromatin enrichment across many conditions",
         ref: Kustatscher et al. 2014, doi: 10.1002/embj.201387614, url: "https://doi.org/10.1002/embj.201387614", licence: CC BY}
    regions:               # the sets of each map's regions question, and the part of the drawings each colors
      - {label: Nucleus, part: nucleus, in_text: the nucleus}
      - {label: Cytoplasm, in_text: the cytoplasm}
      - {label: Organelles and membranes, in_text: the organelles and membranes}
    compartments:          # the grid's rows: each a set in some maps, and the part of the drawings it colors (also: parts
      - group: Nucleus     # it colors when they have no row of their own); the release's groups (data/subcellular.json)
        rows:
          - {label: Chromatin, part: chromatin, also: [periphery, perinucleolar], sets: {cell_hcm_compartment: chromatin, cell_chromatin: "ICP >= 0.8 (chromatin)"}}
          - {label: Nucleoplasm, part: nucleoplasm, also: [nucleus], sets: {cell_hcm_compartment: nucleoplasm, cell_organelle_ip: nucleus, hpa_location: Nucleoplasm}}
          - {label: Nucleolus, part: nucleolus, sets: {cell_hcm_compartment: nucleolus, cell_organelle_ip: nucleolus, hpa_location: Nucleoli}}
          - {label: Nuclear speckles, part: speckles, sets: {cell_hcm_domain: "splicing speckles, nucleolus", hpa_location: Nuclear speckles}}
          - {label: Paraspeckles, part: paraspeckles, sets: {cell_hcm_domain: paraspeckles}}
          - {label: "Nuclear bodies (PML, Cajal …)", name: Nuclear bodies, part: bodies, also: [cajal, pml], sets: {cell_hcm_compartment: nuclear body, hpa_location: Nuclear bodies}}
          - {label: Nuclear envelope and lamina, name: Nuclear envelope, part: envelope, sets: {cell_hcm_compartment: nuclear outer membrane-ER membrane network, hpa_location: Nuclear membrane}}
          - {label: Nuclear pores, part: pores, sets: {cell_hcm_domain: nuclear pore}}
          - {label: Mitotic chromosome, sets: {hpa_location: Mitotic chromosome}}
      - group: Cytoplasm
        rows:
          - {label: "RNA granules (stress granules, P-bodies)", name: "Stress granules (cell map)", part: granules, sets: {cell_hcm_compartment: cytoplasmic ribonucleoprotein granule, cell_hcm_domain: cytoplasmic ribonucleoprotein granule, cell_organelle_ip: stress_granule}}
          - {label: P-bodies, part: pbodies, in_text: P-bodies, sets: {cell_organelle_ip: p-body, cell_hcm_domain: "centrosome enriched, P-body enriched"}}
          - {label: Translation, name: Ribosomes and translation, part: ribosomes, sets: {cell_organelle_ip: translation}}
          - {label: Cytosol, part: cytosol, sets: {cell_hcm_compartment: "actin cytoskeleton, cytosol", cell_organelle_ip: cytosol, hpa_location: Cytosol}}
          - {label: Actin cytoskeleton, name: Actin cortex, part: actin, sets: {cell_organelle_ip: actin_cytoskeleton, cell_hcm_domain: actin cytoskeleton, hpa_location: Actin filaments}}
          - {label: Microtubules, part: microtubules, sets: {cell_hcm_compartment: microtubule cytoskeleton, hpa_location: Microtubules}}
          - {label: Centrosome, part: centrosome, sets: {cell_hcm_compartment: centrosome, cell_organelle_ip: centrosome, hpa_location: Centrosome}}
          - {label: Proteasome, sets: {cell_organelle_ip: proteasome}}
      - group: Organelles and membranes
        rows:
          - {label: Mitochondria, part: mito, sets: {cell_hcm_compartment: mitochondrial matrix, cell_organelle_ip: mitochondrion, hpa_location: Mitochondria}}
          - {label: Endoplasmic reticulum, part: er, in_text: the ER, sets: {cell_hcm_compartment: ER membrane, cell_organelle_ip: ER, hpa_location: Endoplasmic reticulum}}
          - {label: Golgi, name: Golgi apparatus, part: golgi, in_text: the Golgi, sets: {cell_hcm_compartment: Golgi apparatus, cell_organelle_ip: Golgi, hpa_location: Golgi apparatus}}
          - {label: Endosomes and lysosomes, part: endolyso, sets: {cell_hcm_compartment: "endosome, lysosome", cell_organelle_ip: lysosome, hpa_location: Vesicles}}
          - {label: Peroxisomes, part: perox, sets: {cell_hcm_compartment: "mitochondrial outer membrane, peroxisome", cell_organelle_ip: peroxisome}}
          - {label: Plasma membrane, part: pm, sets: {cell_hcm_compartment: plasma membrane, cell_organelle_ip: plasma_membrane, hpa_location: Plasma membrane}}
    drawings:              # the kit's drawings (CONTRACTS.md names their parts), in order
      - {drawing: cell, title: "The cell"}
      - {drawing: nucleus, title: "The nucleus"}
  set_views:               # a protein-set question drawn with its proteins' numbers (kit-values.js): DepMap's dependency
    - analysis: depmap_dependency
      meter: common_essential                   # the class whose share the tile shows
      meter_words: commonly essential in cancer cell lines
      population: screened proteins
      intro: "{n} of {the} {total} {who} were screened (DepMap 24Q4, 1,178 cell lines). A protein's score is its median Chronos gene effect across the lines: 0 is no effect, −1 the median of commonly essential genes, and lower is a stronger dependency."
      box: {value: median, title: Median gene effect of each protein, axis: "median gene effect per protein (Chronos)",
            sub: "DepMap Public 24Q4 CRISPR (Chronos), median gene effect per protein across 1,178 lines. Boxes span the middle half of proteins, whiskers the 5th to 95th percentile. Lower is a stronger dependency"}
      caveat: "Essential proteins are abundant, and mass spectrometry finds abundant proteins most often, so proteins with modified lysines look more essential than the proteome whatever their modification does. A selection is also compared with the other proteins with modified lysines, which share that bias, and that comparison is fairer."
      chips:
        - {title: Strongest dependencies, value: median, order: ascending}
        - {title: Selective dependencies, note: "not commonly essential; 5% to under half of the lines depend on them, share shown", sets: [some_lines],
           share: [dependent_lines, lines_with_probability], order: descending}
      credit: "DepMap Public 24Q4 (doi:10.25452/figshare.plus.27993248; CC BY 4.0; Tsherniak et al. 2017; Chronos, Dempster et al. 2021). Commonly essential: DepMap's list of genes that at least 90% of lines rank among their strongest dependencies. A line depends on a gene when DepMap's dependency probability is at least 0.5. The results on tumors are in whole or part based upon data generated by the TCGA Research Network (https://www.cancer.gov/tcga): MC3 somatic calls (Ellrott et al. 2018)."
  counts:                  # questions answered by counting the sites, not by a test (CONTRACTS.md, count questions)
    types:
      kind: values
      attribute: acyl_type
      title: Modification type
      question: "How many lysines have each modification?"
      sub: "Modified lysines by the modification reported: acetylation (Kac), ubiquitination (Kub), SUMOylation and each acylation (Kcr, Khib, Kbhb, Kglu, Ksucc, Kla, Kmea, Kinic, Kbz, Kbu, Kmal, Kpr)"
      unit: [type, types]
      noun: types
      top: 4
      note: "A lysine has a row for each modification a database reports, so it counts under each. Each type is also a filter (Modification). The key questions are run again for each type with at least 200 lysines: the types with fewer have counts and filters only."
      method: "Each lysine lists the modifications its records give (the release tables' type: acyl_type for acetylation and the acylations, one table each for ubiquitination and SUMOylation). A type's count is the lysines with a record of it, by-similarity records and CPLM records taken from another database only left out."
    cplm:
      kind: values
      attribute: cplm_evidence
      title: CPLM evidence
      question: "How well supported are the lysines CPLM 4.0 reports?"
      sub: "Modified lysines reported by CPLM 4.0, by its own evidence label: experimental paper, or experimental paper and another database"
      unit: [label, labels]
      noun: CPLM labels
      top: 3
      note: "Nearly all ubiquitination, SUMOylation and acetylation sites, and most acylation sites, are from CPLM 4.0. Its records taken from another database (no experiment named) alone are in the lower-confidence variant (the switch at the top)."
      method: "CPLM 4.0's own evidence label for the lysine (the release's cplm_evidence column), joined over the lysine's rows. Lysines CPLM does not report have none and are not counted here."
    evidence:
      kind: values
      attribute: evidence_class
      title: Evidence
      question: "How well supported are the modified lysines?"
      sub: "Modified lysines by the best class of their records: experimental, or unspecified (iPTMnet's copy of UniProt, with no evidence code)"
      unit: [class, classes]
      noun: evidence classes
      top: 3
      note: "The sites counted here have an experimental record, or an unspecified iPTMnet record. The sites UniProt reports only by similarity to another species, and those only CPLM reports as taken from another database (its records marked as taken from another database), are the lower-confidence variant (the switch at the top)."
      method: "The release's evidence_class column: experimental is UniProt ECO:0000269 or ECO:0007744, an iPTMnet record curated from an experiment, a CPLM record from an experimental paper (alone or with another database), or a Hendriks 2017 or Akimov 2018 site; unspecified is iPTMnet's copy of UniProt, which has no ECO code."
    provenance:
      kind: values
      attribute: sources
      title: Studies and databases
      question: "Which databases and studies report the modified lysines?"
      sub: "Modified lysines reported by each database or study"
      unit: [study or database, studies and databases]
      noun: studies and databases
      top: 3
      note: "iPTMnet contains a copy of UniProt, so both databases agreeing is not always two measurements. CPLM 4.0 compiles records from other databases too (its records marked as taken from another database), so a lysine that CPLM and another database both report may rest on one original record. CPLM 4.0 states no license; its sites are included and cited. In the main view of the pinned release, CPLM reports 216,708 of the 229,038 lysine-and-type records (95%), alone or with another source: acetylation 99.6%, crotonylation 100%, ubiquitination 98% and SUMOylation 81%. Two proteome-wide studies are sources of their own: Akimov et al. 2018 reports 62,871 ubiquitination sites (1,839 that no database reports) and Hendriks et al. 2017 39,858 SUMOylation sites (8,960 that no database reports). The other 1,531 come from UniProt or iPTMnet without CPLM, among them most glutaryl, lactyl, benzoyl, methacryl and isonicotinyl records."
      method: "Each lysine lists the databases and studies that report it (the release's sources column). A database or study's count is the lysines it reports."
  filters:                 # the Filters panel: groups in order, from the questions and the sites' attributes
    - {name: Studies and databases, attributes: [sources, cplm_evidence, evidence_class, hendriks_cell_lines, akimov_cell_lines, iptmnet_score, iptmnet_sources]}
    - {name: Modification, attributes: [acyl_type]}
    - {name: Histone and protein class, analyses: [histone, panther_group, panther_class, reactome_top_level], proteins: [marks]}
    - {name: Same lysine, analyses: [same_ac_ub, same_ac_su, same_ub_su, same_ac_methyl, same_ub_methyl, same_su_methyl]}
    - {name: Protein interactions, analyses: [pdb_interface, predicted_interface, intact, complex]}
    - {name: Where in the cell, analyses: [cell_region_hpa, cell_region_hcm, cell_region_organelle_ip, hpa_location, cell_hcm_compartment, cell_hcm_domain, cell_organelle_ip, cell_chromatin, condensate_proteome]}
    - {name: Disease and cancer, analyses: [disease_family, disease_family_additional, disease_ontology, depmap_dependency]}
    - {name: Sequence motif, keys: ["m:at", "m:near"], analyses: [motif]}
    - {name: Structural context, analyses: [structure_context, idr_charge, domain_class, disorder, domain_context]}
    - {name: RNA and DNA, analyses: [pdb_interface_na]}
  dataset: {label: PTM_Pipeline data release, version: v1.5.0, date: "2026-11-13", url: "https://github.com/Shechterlab/PTM_Pipeline/tree/5fadf74/releases/v1.5.0"}
  download_terms: "The release's tables are under CC BY-NC-SA 4.0 (iPTMnet 6.2; UniProt data are CC BY 4.0). CPLM 4.0 states no license: its sites (rows whose databases name CPLM) are included, cited to Zhang et al., Nucleic Acids Res 50:D451 (2022), and the CC BY-NC-SA 4.0 gives no rights in them beyond what the authors allow. Cite the paper, the archive and the databases that report the sites you use (How to cite)."
  downloads:               # the release's files, at the commit the site was built from
    - {label: Acetylation sites, url: "https://raw.githubusercontent.com/Shechterlab/PTM_Pipeline/5fadf74/releases/v1.5.0/human_acetylation_sites_v1.5.0.tsv", format: TSV, note: "every acetylation record: one row per lysine, with its evidence class, sources and CPLM evidence label (53,177 rows)"}
    - {label: Other acylation sites, url: "https://raw.githubusercontent.com/Shechterlab/PTM_Pipeline/5fadf74/releases/v1.5.0/human_lysine_acylation_sites_v1.5.0.tsv", format: TSV, note: "every lysine acylation record (acetyl and 15 other acyl types, in acyl_type): one row per lysine and type"}
    - {label: Ubiquitination sites, url: "https://raw.githubusercontent.com/Shechterlab/PTM_Pipeline/5fadf74/releases/v1.5.0/human_ubiquitination_sites_v1.5.0.tsv", format: TSV, note: "every ubiquitination record, with its evidence class, sources, CPLM evidence label and the Akimov 2018 localization probability and cell lines (125,771 rows: 123,753 from CPLM 4.0, 62,871 from Akimov 2018)"}
    - {label: SUMOylation sites, url: "https://raw.githubusercontent.com/Shechterlab/PTM_Pipeline/5fadf74/releases/v1.5.0/human_sumoylation_sites_v1.5.0.tsv", format: TSV, note: "every SUMOylation record, with its evidence class, sources, CPLM evidence label and the Hendriks 2017 localization probability and cell lines (48,593 rows: 39,858 from Hendriks 2017, 39,493 from CPLM 4.0)"}
    - {label: Data dictionary, url: "https://raw.githubusercontent.com/Shechterlab/PTM_Pipeline/5fadf74/releases/v1.5.0/data_dictionary.tsv", format: TSV, note: "every column of every file, with its codes"}
    - {label: README, url: "https://github.com/Shechterlab/PTM_Pipeline/blob/5fadf74/releases/v1.5.0/README.md", format: Markdown, note: "how the release was made, its sources and what was dropped"}
    - {label: What changed, url: "https://github.com/Shechterlab/PTM_Pipeline/blob/5fadf74/releases/v1.5.0/CHANGES.md", format: Markdown, note: "the changes since the previous release"}
  search:                  # the search's words beyond genes and the questions' keys (kit-select.js, kit-search.js, kit-near.js)
    shorthand: {H4: P62805, H3: P68431, "H3.1": P68431, "H3.3": P84243}   # names papers use for a protein (H4K20, H3 K9)
    patterns:                # the motif finder: a pattern of residues on the sites' sequence windows
      at: motif              # motif:KKXE covers the site (motif families keep their names: motif:SUMO_consensus)
      near: window           # window:KKXK anywhere within the span
      span: 15
    spacing: {label: "Another modified lysine within", within: [2, 3, 5, 10, 20]}
  tabs:                    # the top tabs' words (the addresses #statistics and #method stay; #idrs opens its question)
    overview: {label: Overview, hint: "Click a class row to select its sites, or a tile's title to open the question."}
    proteins: {label: Proteins, hint: "One row per protein with modified lysines. Filter, sort and download."}
    sites: {label: Sites, hint: "One row per modified lysine, with its modifications and evidence. Filter, sort and download."}
    idrs: {label: Disordered regions, hint: "Disordered regions (IDRs) of proteins with modified lysines, and the modified lysines in them.", as: section, question: idr_charge}
    statistics: {label: All tests, hint: "Every test on the site, one row per class, with odds ratio, interval and q value."}
    method: {label: Methods & data, hint: "How each question was tested, the data behind it, and downloads."}
    help: {label: Help, hint: "Searching, filters, selections and keyboard keys."}
  partners: {species: 9606}         # interaction partners on protein pages, live from STRING (human)
  compare: {min_proteins: 10, min_marks: 30}
  tables:                  # tables the protein pages show (no test reads them), each in a format of CONTRACTS.md
    string:                # STRING v12.5 physical links, each pair listed once and read both ways, at score 0.7 or more
      input: string_physical_v12_5
      format: protein_partners
      columns: {accession: protein_a, partner_accession: protein_b, partner: gene_b, score: combined_score}
      both_ways: {partner: gene_a}
      include: [{column: combined_score, at_least: 700}]
  sites:                   # the Sites tab
    table:                 # the optional columns (the Columns menu): the same set on every site, where the data has it
      - {id: type, label: Modification, attribute: acyl_type, default: true, hide: xs}
      - {id: src, label: Reported by, attribute: sources, default: true, hide: sm}
      - {id: cplm, label: CPLM evidence, attribute: cplm_evidence, hide: sm}
      - {id: ctx, label: Context, menu: Disorder and domain context, analyses: [disorder, domain_context], hide: xs}
      - {id: struct, label: Structural context, analyses: [structure_context], hide: sm}
  protein:                 # the protein page
    open_partners: true
    map:
      hide_ptm_kinds: [SUMO, Ubiquitin, Lys acyl]   # the live UniProt row would repeat the lysine modifications of the tables
      combined_marks:      # one "All modifications" block (a thin lane for each modification, the site's own first); the rows of the context marks fold behind it
        default: folded
        split:             # a lane for each lysine modification the protein has, named by its code
          attribute: acyl_type
          short: {acetyl: Kac, ubiquitin: Kub, sumo: SUMO, 2-hydroxyisobutyryl: Khib, beta-hydroxybutyryl: Kbhb, crotonyl: Kcr, glutaryl: Kglu,
                  succinyl: Ksucc, lactoyl: Kla, methacryl: Kmea, isonicotinyl: Kinic, benzoyl: Kbz, butyryl: Kbu, malonyl: Kmal,
                  propionyl: Kpr, phosphoglyceryl: Kpgly, biotinyl: Kbio, lipoyl: Klip}
      default_off: [ptm]                  # the grey live UniProt row (glycosylation, lipidation, cross-links, other) starts off: the Rows menu turns it on
      hover:                # the hovers on the map: a concise card; the rest is on the pinned card and the site card
        site: [name, chips, nearby, click]
        chips: [sources, cplm_evidence, {attribute: pmids, count: PMIDs}]
        context: [mark, residue, detail, source, click]
    numbering:             # positions typed in a search read as the protein's page numbers them
      - genes: "^(H1-\\d+|H2A[A-Z0-9-]*|H2B[A-Z0-9-]*|H3C\\d+|H3-\\d+[A-Z]?|H3Y\\d|H4C\\d+|H4-\\d+|MACROH2A\\d|CENPA)$"
        names: "^(putative |core )?histone (h1|h2a|h2b|h3|h4|macro-h2a)\\b|^testis-specific h1 histone|^histone h3-like centromeric"
        offset: -1
        label: histone numbering
        note: "Histone numbering, without the initiator methionine"
