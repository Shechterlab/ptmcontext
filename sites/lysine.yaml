    min_size: 5
    background: the other proteins with eCLIP data that TSA-seq tests (at least 20 bound RNAs placed). A set is the proteins whose bound RNAs gather in the compartment
    abundance:
      input: abundance
      protein: canonical_UniProtAC
      value: percentile
      label: ', each PaxDb abundance decile a stratum'
    sizes:
      value: odds_ratio
      log2: true
      background: the log2 odds ratio of the bound RNAs of each other protein TSA-seq tests gathering in the compartment, called or not (supporting/eclip_rna_compartments). a and c count the proteins compared
    new: true
  - id: eclip_gene_hic
    test: protein_sets
    title: Genes of bound RNAs by Hi-C subcompartment
    question: Are the RNAs that proteins with a modified lysine bind transcribed from genes in one Hi-C subcompartment?
    sub: Proteins with eCLIP data whose bound RNAs are transcribed from genes of a Hi-C subcompartment (GM12878; Rao et al. 2014). Hi-C measures contacts between genomic regions, not the position of the RNAs, modified against the others (one-sided hypergeometric test)
    section: Location, chromatin and condensates
    sets:
      input: eclip_maps
      set: compartment
      protein: uniprot_accession
      include:
      - column: map
        equals: hic
      member_when:
      - column: gathers
        equals: 'true'
    whole_universe: true
    min_size: 5
    background: the other proteins with eCLIP data that Hi-C subcompartments tests (at least 20 bound RNAs placed). A set is the proteins whose bound RNAs gather in the compartment
    abundance:
      input: abundance
      protein: canonical_UniProtAC
      value: percentile
      label: ', each PaxDb abundance decile a stratum'
    sizes:
      value: odds_ratio
      log2: true
      background: the log2 odds ratio of the bound RNAs of each other protein Hi-C subcompartments tests gathering in the compartment, called or not (supporting/eclip_rna_compartments). a and c count the proteins compared
    new: true
