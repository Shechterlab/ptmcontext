  - id: same_ac_su_modified
    layer: near_marks
    with: {marks: sumoylation, window: 0, noun: SUMOylation site, labels: {near: "Also reported SUMOylated", none: "Not reported SUMOylated"}}
    marks_where: {column: acyl_type, equals: acetyl}
    new: true
    title: "Acetylated and SUMOylated lysines, among lysines with another modification"
    family: Acetylated and SUMOylated lysines
    family_label: Among lysines with another modification
    only_in: {marks: [ubiquitination, other_acylation, methyllysine]}   # only the lysines with a modification other than the two compared: found modified at all
    background: other lysines with another modification, of the same proteins
    question: "Are acetylated lysines more often also reported SUMOylated than the other lysines of their protein that have another modification?"
    sub: "The same question asked only among the lysines reported with some other modification (another type on this site, or methylation; not the two compared here), each protein analyzed separately. Mass spectrometry finds some lysines far more easily than others, which alone could make two modifications seem to share lysines; every lysine counted here was found modified at least once. The two compared modifications do not decide which lysines count: if they did, the lysines without the first would mostly be those with the second, and the comparison would lean toward fewer shared lysines"
    section: Same lysine, different modifications
  - id: same_ub_su
    layer: near_marks
    with: {marks: sumoylation, window: 0, noun: SUMOylation site, labels: {near: "Also reported SUMOylated", none: "Not reported SUMOylated"}}
    marks_where: {column: acyl_type, equals: ubiquitin}
    new: true
    title: Ubiquitinated and SUMOylated lysines
    family: Ubiquitinated and SUMOylated lysines
    family_label: All lysines
    question: "Are ubiquitinated lysines more often also reported SUMOylated than the other lysines of their protein?"
    sub: "Ubiquitinated lysines against the other lysines of the same proteins, by whether the lysine itself is also a SUMOylation site. Ubiquitin and SUMO attach to the same amino group, and both lists are mostly from CPLM 4.0, which compiles them from large mass-spectrometry studies of the proteome; the second line under the tile counts only the sites of two such studies, Akimov et al. 2018 and Hendriks et al. 2017"
