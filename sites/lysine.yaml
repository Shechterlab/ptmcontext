  # Taking all factors together: one conditional logistic regression, a stratum per protein (the multi-factor
  # Mantel-Haenszel; Breslow & Day 1980), the whole dataset (a selection is not refitted in the browser)
  - id: which_factor
    test: conditional_logit
    new: true
    title: Which factor matters most?
    question: "Taking all factors together, which ones distinguish a modified lysine from the other lysines of its protein?"
    sub: "One model: each modified lysine (of any type) against the other lysines of its protein, three factors at once. Each odds ratio is the factor's effect with the others held fixed; 'on its own' is the same factor in a model by itself"
    section: Where in the protein
    covariates:
      - {name: in_idr, label: In a disordered region, help: "Inside an IDR of 20 or more residues", layer: idr, is: [idr]}
      - {name: net_charge, label: "Local net charge (per +1)", help: "Lys and Arg minus Asp and Glu within 7 residues on either side, the lysine itself left out; the odds ratio is for each extra +1", window_sum: {window: 7, weights: {K: 1, R: 1, D: -1, E: -1}}}
      - {name: domain_distal, label: Far from any domain, help: "More than 20 residues from a domain, and not between two domains", layer: domain_context, is: [distal]}
  - id: pdb_interface_na
    new: true
    title: RNA and DNA interfaces in PDB structures
    question: "Are modified lysines at interfaces with RNA or DNA in experimental structures?"
    sub: "Modified lysines against the other lysines of the same proteins observed in a PDB structure, at a PDBe-KB interface with RNA or with DNA; all, ordered (outside UniProt disordered regions) and in domains"
    section: RNA and DNA
    counting: every_candidate
    background: other lysines of the same proteins observed in a PDB structure
    proteins_with: pdb_interfaces                       # proteins PDBe-KB lists with an interface
    covered_by: pdb_observed                            # residues a PDB chain models (SIFTS)
    tests:
      - {category: rna, inside: {role: pdb_interfaces, where: [{column: class, equals: RNA}]}, label: RNA interface}
      - {category: dna, inside: {role: pdb_interfaces, where: [{column: class, equals: DNA}]}, label: DNA interface}
    strata:
      - {stratum: all}
      - {stratum: ordered, outside_of: uniprot_disorder, suffix: ", ordered regions"}
      - {stratum: domain, covered_by: uniprot_domains, suffix: ", in domains"}
