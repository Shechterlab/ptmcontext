  # Near other marks: are modified lysines more often within 10 residues of another mark than the other lysines of their
  # protein? Context marks (context_marks below), not part of the release's analyses
  - id: near_phospho
    family_label: All types
    layer: near_marks
    with: {marks: phospho, window: 10, noun: phosphosite}
    new: true
    title: Near phosphosites (±10 residues)
    question: "Are modified lysines more often near a phosphosite than the other lysines of their protein?"
    sub: "Modified lysines against the other lysines of the same proteins, by whether a phosphosite (UniProt, iPTMnet and Ochoa 2020, by-similarity records left out) is within 10 residues on either side. Phosphosites are heavily studied, so a protein with many modified lysines is also likely to have more recorded phosphosites; the comparison within each protein limits that, not removes it"
    section: Other modifications
  - id: near_phospho_high
    family_label: All types
    layer: near_marks
    with: {marks: phospho_high, window: 10, noun: high-score phosphosite}
    new: true
    title: Near high-score phosphosites (±10 residues)
    question: "Are modified lysines more often near a high-score phosphosite than the other lysines of their protein?"
    sub: "Modified lysines against the other lysines of the same proteins, by whether a phosphosite with an Ochoa et al. 2020 functional score of 0.5 or more (about 10,900 sites; the score is a model of how likely a site is functionally important) is within 10 residues on either side. Sites without a score are not counted as high-score. The comparison within each protein limits the effect of heavily studied proteins, not removes it"
    section: Other modifications
  - id: near_methylarginine
    family_label: All types
    layer: near_marks
    with: {marks: methylarginine, window: 10, noun: methylarginine}
    new: true
    title: Near methylarginines (±10 residues)
    question: "Are modified lysines more often near a methylarginine than the other lysines of their protein?"
    sub: "Modified lysines against the other lysines of the same proteins, by whether a methylarginine (the methylarginine explorer's release v1.4.3, by-similarity records left out) is within 10 residues on either side"
    section: Other modifications
  - id: near_methyllysine
    family_label: All types
    layer: near_marks
    with: {marks: methyllysine, window: 10, noun: methyllysine}
    new: true
    title: Near methyllysines (±10 residues)
    question: "Are modified lysines more often near a methyllysine than the other lysines of their protein?"
    sub: "Modified lysines against the other lysines of the same proteins, by whether a methyllysine (UniProt, iPTMnet, CPLM 4.0 and Berryhill et al. 2023, release v1.5.0 of the methyllysine explorer; by-similarity records left out) is within 10 residues on either side, the lysine itself left out. A lysine that is itself methylated is asked about in the next section"
    section: Other modifications
  # The same lysine carrying two modifications: is a lysine with one modification more often also reported with another
  # than the other lysines of its protein? The comparison within each protein (Mantel-Haenszel over proteins) holds the
  # protein fixed, so how much it has been studied, how many lysines it has and how modified it is overall do not drive
  # the result; a lysine can carry either modification on different copies of the protein, so overlap is a statement about
  # reported residues, not one molecule. The pair is symmetric in its odds ratio, so each pair is asked once.
  - id: same_ac_ub
    layer: near_marks
    with: {marks: ubiquitination, window: 0, noun: ubiquitination site, labels: {near: "Also reported ubiquitinated", none: "Not reported ubiquitinated"}}
    marks_where: {column: acyl_type, equals: acetyl}
    new: true
    title: Acetylated and ubiquitinated lysines
    family: Acetylated and ubiquitinated lysines
    family_label: All lysines
    question: "Are acetylated lysines more often also reported ubiquitinated than the other lysines of their protein?"
    sub: "Acetylated lysines against the other lysines of the same proteins, by whether the lysine itself is also a ubiquitination site. Both modifications target lysine's amino group, so one lysine can have only one of them at a time; the question is whether, among the lysines of one protein, the acetylated ones have been reported ubiquitinated more or less often. Most ubiquitination sites come from CPLM 4.0 and Akimov et al. 2018; the second line under the tile counts the Akimov sites alone"
    section: Same lysine, different modifications
  - id: same_ac_ub_modified
    layer: near_marks
    with: {marks: ubiquitination, window: 0, noun: ubiquitination site, labels: {near: "Also reported ubiquitinated", none: "Not reported ubiquitinated"}}
    marks_where: {column: acyl_type, equals: acetyl}
    new: true
    title: "Acetylated and ubiquitinated lysines, among lysines with another modification"
    family: Acetylated and ubiquitinated lysines
    family_label: Among lysines with another modification
    only_in: {marks: [sumoylation, other_acylation, methyllysine]}   # only the lysines with a modification other than the two compared: found modified at all
    background: other lysines with another modification, of the same proteins
    question: "Are acetylated lysines more often also reported ubiquitinated than the other lysines of their protein that have another modification?"
    sub: "The same question asked only among the lysines reported with some other modification (another type on this site, or methylation; not the two compared here), each protein analyzed separately. Mass spectrometry finds some lysines far more easily than others, which alone could make two modifications seem to share lysines; every lysine counted here was found modified at least once. The two compared modifications do not decide which lysines count: if they did, the lysines without the first would mostly be those with the second, and the comparison would lean toward fewer shared lysines"
    section: Same lysine, different modifications
