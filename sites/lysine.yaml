    sub: "Acetylated lysines against the other lysines of the same proteins, by whether the lysine itself is also a SUMOylation site. Most SUMOylation sites come from CPLM 4.0 and Hendriks et al. 2017; the second line under the tile counts the Hendriks sites alone"
