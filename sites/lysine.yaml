  # Changes at the modified lysines in tumors and cell lines: a missense or stop change in at least one TCGA tumor (MC3) or DepMap
  # cell line, against the other lysines of the proteins with a modified lysine whose gene DepMap screened (the arginine question's
  # design); every mark of those proteins counts, one on a protein with no other candidate too (it adds nothing within proteins)
  - id: cancer_change
    new: true
    layer: residue_lists
    with:
      flags: {tcga_tumours: tcga_changes, depmap_cell_lines: depmap_changes}
      noun: changed lysine
      title: Changes in tumors and cell lines
      question: "Is a modified lysine changed in tumors or cancer cell lines more or less often than the other lysines of its protein?"
      sub: "Modified lysines against the other lysines of the proteins with a modified lysine whose gene DepMap screened: a missense or stop change in at least one TCGA tumor (MC3) or DepMap 24Q4 cell line. Not adjusted for codon or sequence context, which may differ between the modified lysines and the other lysines"
      section: Disease associations
      labels: {tcga_tumours: Changed in a TCGA tumor, depmap_cell_lines: Changed in a DepMap cell line}
      help:
        tcga_tumours: "A missense or stop change of the residue in at least one TCGA tumor (MC3 public calls from the GDC, 33 projects; FILTER PASS, and in OV and LAML also wga alone)"
        depmap_cell_lines: "A missense or stop change of the residue in at least one DepMap 24Q4 cell line (OmicsSomaticMutations, on the canonical UniProt isoform)"
    proteins: {input: depmap_genes, column: canonical_UniProtAC, label: " whose gene DepMap screened"}
    marks_alone: count
    order: [{categories: [tcga_tumours, depmap_cell_lines]}]
  # Germline variants at the modified lysines: a ClinVar single-residue substitution or stop with a pathogenic or likely pathogenic record,
  # or a gnomAD v4.1 exome variant, against the other lysines of the same proteins; every mark counts, as for the
  # tumor and cell-line question above
  - id: clinvar_plp
    new: true
    layer: residue_lists
    with:
      flags: {clinvar_plp: clinvar_plp}
      noun: lysine with a pathogenic ClinVar variant
      title: ClinVar pathogenic or likely pathogenic
      question: "Does a modified lysine carry a pathogenic or likely pathogenic ClinVar variant more or less often than the other lysines of its protein?"
      sub: "Modified lysines against the other lysines of the same proteins: a ClinVar single-residue substitution or stop classified pathogenic or likely pathogenic. ClinVar lists the genes and regions that clinical testing covers, so a well-studied protein has more variants at every residue; the comparison within each protein reduces that effect but does not remove it. Not adjusted for codon or sequence context, which may differ between the modified lysines and the other lysines"
      section: Disease associations
      labels: {clinvar_plp: Pathogenic or likely pathogenic in ClinVar}
      help:
        clinvar_plp: "A single-residue substitution or stop whose ClinVar germline classification is pathogenic or likely pathogenic (including Pathogenic/Likely pathogenic; conflicting classifications are not counted), on a RefSeq protein UniProt assigns to the entry"
    marks_alone: count
    order: [{categories: [clinvar_plp]}]
  - id: gnomad_variant
    new: true
    layer: residue_lists
    with:
      flags: {gnomad_variant: gnomad_variants}
      noun: lysine with a gnomAD variant
      title: gnomAD variants
      question: "Does a modified lysine carry a gnomAD variant more or less often than the other lysines of its protein?"
      sub: "Modified lysines against the other lysines of the same proteins: a missense or stop-gained variant in gnomAD v4.1 exomes (730,947 exomes; FILTER PASS), at any allele frequency. Most are rare. A variant observed in healthy adults does not show that it is benign, and a residue without one may only be rare in the sample. Not adjusted for codon or sequence context, which may differ between the modified lysines and the other lysines"
      section: Disease associations
      labels: {gnomad_variant: Variant in gnomAD}
      help:
        gnomad_variant: "A missense or stop-gained change of the residue in at least one gnomAD v4.1 exome variant that passed the filters (VEP consequence on a transcript UniProt assigns to the entry)"
    marks_alone: count
    order: [{categories: [gnomad_variant]}]
  # Near other marks: are modified lysines more often within 10 residues of another mark than the other lysines of their
  # protein? Context marks (context_marks below), not part of the release's analyses
  - id: near_phospho
    family_label: All types
    layer: near_marks
    with: {marks: phospho, window: 10, noun: phosphosite}
    new: true
    title: Near phosphosites (±10 residues)
    question: "Are modified lysines more often near a phosphosite than the other lysines of their protein?"
    sub: "Modified lysines against the other lysines of the same proteins, by whether a phosphosite (UniProt, iPTMnet and Ochoa 2020, by-similarity records left out) is within 10 residues on either side. Phosphosites are heavily studied, so a protein with many modified lysines is also likely to have more recorded phosphosites; the comparison within each protein reduces that effect but does not remove it"
    section: Other modifications
  - id: near_phospho_high
    family_label: All types
    layer: near_marks
    with: {marks: phospho_high, window: 10, noun: high-score phosphosite}
    new: true
    title: Near high-score phosphosites (±10 residues)
    question: "Are modified lysines more often near a high-score phosphosite than the other lysines of their protein?"
    sub: "Modified lysines against the other lysines of the same proteins, by whether a phosphosite with an Ochoa et al. 2020 functional score of 0.5 or more (about 10,900 sites; the score is a model of how likely a site is functionally important) is within 10 residues on either side. Sites without a score are not counted as high-score. The comparison within each protein reduces the effect of heavily studied proteins but does not remove it"
    section: Other modifications
  - id: near_methylarginine
    family_label: All types
    layer: near_marks
    with: {marks: methylarginine, window: 10, noun: methylarginine}
    new: true
    title: Near methylarginines (±10 residues)
    question: "Are modified lysines more often near a methylarginine than the other lysines of their protein?"
    sub: "Modified lysines against the other lysines of the same proteins, by whether a methylarginine (methylarginine release v1.7.0, by-similarity records left out) is within 10 residues on either side"
    section: Other modifications
  - id: near_methyllysine
    family_label: All types
    layer: near_marks
    with: {marks: methyllysine, window: 10, noun: methyllysine}
    new: true
    title: Near methyllysines (±10 residues)
    question: "Are modified lysines more often near a methyllysine than the other lysines of their protein?"
    sub: "Modified lysines against the other lysines of the same proteins, by whether a methyllysine (UniProt, iPTMnet and Berryhill et al. 2023, methyllysine release v1.7.0; by-similarity records left out) is within 10 residues on either side, the lysine itself left out. A lysine that is itself methylated is asked about in the next section"
    section: Other modifications
  # The same lysine carrying two modifications: is a lysine with one modification more often also reported with another
  # than the other lysines of its protein? The comparison within each protein (Mantel-Haenszel over proteins) holds the
  # protein fixed, so how much it has been studied, how many lysines it has and how modified it is overall do not drive
  # the result; a lysine can carry either modification on different copies of the protein, so overlap is a statement about
  # reported residues, not one molecule. The pair is symmetric in its odds ratio, so each pair is asked once.
  - id: same_ac_ub
    layer: near_marks
    with: {marks: ubiquitination, window: 0, noun: ubiquitination site, labels: {near: "Also reported ubiquitinated", none: "Not reported ubiquitinated"}}
    marks_where: {column: acyl_type, equals: acetyl}
    new: true
    title: Acetylated and ubiquitinated lysines
    family: Acetylated and ubiquitinated lysines
    family_label: All lysines
    question: "Are acetylated lysines more often also reported ubiquitinated than the other lysines of their protein?"
    sub: "Acetylated lysines against the other lysines of the same proteins, by whether the lysine itself is also a ubiquitination site. Both modifications target lysine's amino group, so one lysine can have only one of them at a time; the question is whether, among the lysines of one protein, the acetylated ones have been reported ubiquitinated more or less often. Most ubiquitination sites come from Akimov et al. 2018"
    section: Same lysine, different modifications
