  - id: eclip_rna_apexseq
    test: protein_sets
    title: Bound RNAs by APEX-seq
    question: Where do the RNAs that proteins with a modified lysine bind gather in the cell, by APEX-seq?
    sub: Proteins with eCLIP data whose bound RNAs localize to an APEX-seq compartment (HEK293T; Fazal et al. 2019), modified against the others (one-sided hypergeometric test)
    section: Location, chromatin and condensates
    sets:
      input: eclip_maps
      set: compartment
      protein: uniprot_accession
      include:
      - column: map
