    layer: near_marks
    with: {marks: sumoylation_hendriks, window: 0, noun: SUMOylation site of Hendriks 2017, labels: {near: "Also reported SUMOylated", none: "Not reported SUMOylated"}}
    marks_where: {all_of: [{column: acyl_type, equals: ubiquitin}, {column: sources, contains: Akimov 2018}]}
    new: true
    title: "Ubiquitinated and SUMOylated lysines, Akimov 2018 and Hendriks 2017"
    family: Ubiquitinated and SUMOylated lysines
    family_label: Akimov 2018 and Hendriks 2017
    question: "Are the ubiquitination sites of Akimov et al. 2018 more often among the SUMO-2 sites of Hendriks et al. 2017 than the other lysines of their protein?"
    sub: "The lysines Akimov et al. 2018 reports ubiquitinated against the other lysines of the same proteins, by whether Hendriks et al. 2017 reports the lysine SUMOylated: the two studies alone, no other site counted as modified"
    section: Same lysine, different modifications
  # Taking all factors together: one conditional logistic regression, a stratum per protein (the multi-factor
  # Mantel-Haenszel; Breslow & Day 1980), the whole dataset (a selection is not refitted in the browser)
  - id: which_factor
    test: conditional_logit
    new: true
    title: Which features remain associated after adjusting for the others?
    question: "Taking all factors together, which ones distinguish a modified lysine from the other lysines of its protein?"
    sub: "One model: each modified lysine (of any type) against the other lysines of its protein, three factors at once. Each odds ratio is the factor's effect with the others held fixed; 'on its own' is the same factor in a model by itself"
    section: Position in the protein
    covariates:
      - {name: in_idr, label: In a disordered region, help: "Inside a disordered region of 20 or more residues", layer: idr, is: [idr]}
      - {name: net_charge, label: "Local net charge (per +1)", help: "Lys and Arg minus Asp and Glu within 7 residues on either side, the lysine itself left out; the odds ratio is for each extra +1", window_sum: {window: 7, weights: {K: 1, R: 1, D: -1, E: -1}}}
      - {name: domain_distal, label: Far from any domain, help: "More than 20 residues from a domain, and not between two domains", layer: domain_context, is: [distal]}
  - id: pdb_interface_na
    new: true
    title: RNA and DNA interfaces in PDB structures
    question: "Are modified lysines at interfaces with RNA or DNA in experimental structures?"
    sub: "Modified lysines against the other lysines of the same proteins observed in a PDB structure, at a PDBe-KB interface with RNA or with DNA; all, ordered (outside UniProt disordered regions) and in domains"
    section: RNA and DNA
    counting: every_candidate
    background: other lysines of the same proteins observed in a PDB structure
    proteins_with: pdb_interfaces                       # proteins PDBe-KB lists with an interface
    covered_by: pdb_observed                            # residues a PDB chain models (SIFTS)
    tests:
      - {category: rna, inside: {role: pdb_interfaces, where: [{column: class, equals: RNA}]}, label: RNA interface}
      - {category: dna, inside: {role: pdb_interfaces, where: [{column: class, equals: DNA}]}, label: DNA interface}
    strata:
      - {stratum: all}
      - {stratum: ordered, outside_of: uniprot_disorder, suffix: ", ordered regions"}
      - {stratum: domain, covered_by: uniprot_domains, suffix: ", in domains"}
  # RNA and DNA binding in cells and the cells' RNA maps, and aromatic neighbors: the methylarginine site's questions on this site's residues
  # (no RBDmap, pCLAP or RG/GR tests: the release has no such data for these residues; no distance test: the release
  # measures side-chain distances at the site set's own sites only, so there is no background of other residues)
  - id: go_binding
    test: protein_sets
    title: RNA and DNA binding (GO)
    question: Are proteins with a modified lysine more often annotated to bind RNA or DNA?
    sub: Proteins with a modified lysine against every reviewed human protein, by Gene Ontology annotation to RNA binding (GO:0003723) or DNA binding (GO:0003677) or a term below them, any evidence or experimental evidence only (one-sided hypergeometric test)
    section: RNA and DNA
    sets:
      each:
      - set: rna_binding
        name: RNA binding (GO)
        table:
          input: go_binding
          protein: uniprot_accession
          include:
          - column: binding
            equals: rna
      - set: rna_binding_experimental
        name: RNA binding (GO, experimental evidence)
        table:
          input: go_binding
          protein: uniprot_accession
          include:
          - column: binding
            equals: rna
          - column: evidence_code
            in:
            - EXP
            - IDA
            - IPI
            - IMP
            - IGI
            - IEP
            - HTP
            - HDA
            - HMP
            - HGI
            - HEP
      - set: dna_binding
        name: DNA binding (GO)
        table:
          input: go_binding
          protein: uniprot_accession
          include:
          - column: binding
            equals: dna
      - set: dna_binding_experimental
        name: DNA binding (GO, experimental evidence)
        table:
          input: go_binding
          protein: uniprot_accession
          include:
          - column: binding
            equals: dna
          - column: evidence_code
            in:
            - EXP
            - IDA
            - IPI
            - IMP
            - IGI
            - IEP
            - HTP
            - HDA
            - HMP
            - HGI
            - HEP
    universe: snapshot
    whole_universe: true
    background: all reviewed human proteins
    abundance:
      input: abundance
      protein: canonical_UniProtAC
      value: percentile
      label: ', each PaxDb abundance decile a stratum'
    new: true
  - id: binding_protein
    test: protein_sets
    title: Proteins found binding RNA or DNA in cells
    question: Are proteins with a modified lysine among the proteins found binding RNA or DNA in cells?
    sub: Proteins with a modified lysine among the proteins each in-cell experiment found binding RNA or DNA, against the other proteins the experiment measured where it lists them, else every reviewed human protein (one-sided hypergeometric test)
    section: RNA and DNA
    order: as_listed
    sets:
      each:
      - set: rna_xl
        name: RNA-crosslinked residue (pepR-MS compendium)
        units: rna_crosslinks
        background: other reviewed human proteins
      - set: rna_capri
        name: Peptide next to an RNA crosslink (CAPRI)
        units:
        - capri_measured_adjacent
        - capri_adj
        universe_units: capri_measured
        background: other reviewed human proteins the experiment measured
      - set: rna_rbrid
        name: RNA-contact residue (RBR-ID)
        units: rbrid_residues
        universe_units: rbrid_quantified
        background: other reviewed human proteins the experiment measured
      - set: dna_xl
        name: DNA-crosslinked residue or peptide (Trendel 2025)
        units:
        - dna_crosslink_candidates
        - dna_crosslinked_peptides
        background: other reviewed human proteins
      - set: dna_interactome
        name: DNA interactome protein (Trendel 2025)
        table:
          input: dna_interactome
          protein: uniprot_accession
        background: other reviewed human proteins
    universe: snapshot
    whole_universe: true
    abundance:
      input: abundance
      protein: canonical_UniProtAC
      value: percentile
      label: ', each PaxDb abundance decile a stratum'
    new: true
  - id: crosslink
    title: RNA and DNA crosslinks in cells
    question: Are modified lysines where RNA or DNA crosslinks to proteins in cells?
    sub: 'Modified lysines against the other lysines of the proteins with each kind of evidence: crosslinked residues, RNA-bound peptides, RBR-ID residues and regions, DNA crosslinks and DNA-binding regions'
    section: RNA and DNA
    counting: every_candidate
    candidates_from: marks_and_left_out
    background: other lysines of the same proteins (proteins with that evidence)
    tests:
    - category: rna_crosslink
      inside: rna_crosslinks
      proteins_with: rna_crosslinks
      label: RNA-crosslinked residue
    - category: rna_crosslink_single_residue
      inside: rna_crosslinks_single
      proteins_with: rna_crosslinks_single
      label: RNA crosslink, one residue
    - category: rna_crosslink_within_3
      inside: rna_crosslinks
      within: 3
      proteins_with: rna_crosslinks
      label: ≤3 aa from an RNA crosslink
    - category: dna_crosslink
      inside: dna_crosslinks
      proteins_with: dna_crosslinks
      label: DNA-crosslinked residue
    - category: dna_crosslink_or_candidate
      inside: dna_crosslink_candidates
      proteins_with: dna_crosslink_candidates
      label: DNA crosslink or candidate
    - category: dna_crosslinked_peptide
      inside: dna_crosslinked_peptides
      proteins_with: dna_crosslinked_peptides
      label: DNA-crosslinked peptide
    - category: dna_binding_region
      inside: uniprot_dna_binding
      proteins_with: uniprot_dna_binding
      label: DNA-binding region (UniProt)
    - category: capri_xl_peptide
      inside: capri_xl
      proteins_with: capri_xl
      label: RNA-crosslinked peptide (CAPRI)
    - category: capri_adj_peptide
      inside: capri_adj
      proteins_with: capri_adj
      label: CAPRI adjacent peptide
    - category: rbrid_residue
      inside: rbrid_residues
      proteins_with: rbrid_residues
      label: RNA-contact residue (RBR-ID)
    - category: rbrid_residue_published_rule
      inside: rbrid_residues_published_rule
      proteins_with: rbrid_residues_published_rule
      label: RNA-contact residue (RBR-ID), published rule
    - category: rbrid_region
      inside: rbrid_regions
      proteins_with: rbrid_regions
      label: RBR-ID region
    - category: capri_adj_peptide_among_measured
      inside: capri_measured_adjacent
      proteins_with: capri_measured_adjacent
      covered_by: capri_measured
      label: CAPRI adjacent peptide, among measured
    - category: rbrid_residue_among_measured
      inside: rbrid_residues
      proteins_with: rbrid_residues
      covered_by: rbrid_quantified
      label: RNA-contact residue (RBR-ID), among measured
    new: true
  - id: sequence_proximity
    title: Distance along the chain to RNA evidence
    question: Are modified lysines near RNA-crosslinked residues along the sequence?
    sub: Modified lysines against the other lysines of the proteins with each kind of RNA evidence, within 0, 3, 5, 10 or 20 residues of it along the sequence
    section: RNA and DNA
    counting: every_candidate
    candidates_from: marks_and_left_out
    background: other lysines of the same proteins (proteins with that evidence)
    tests:
    - category: rna_crosslink
      inside: rna_crosslinks
      proteins_with: rna_crosslinks
      label: RNA-crosslinked residue
    - category: capri_adj_peptide
      inside: capri_adj
      proteins_with: capri_adj
      label: CAPRI adjacent peptide
    - category: capri_xl_peptide
      inside: capri_xl
      proteins_with: capri_xl
      label: RNA-crosslinked peptide (CAPRI)
    - category: rbrid_residue
      inside: rbrid_residues
      proteins_with: rbrid_residues
      label: RNA-contact residue (RBR-ID)
    strata:
    - stratum: within_0_residues
      within: 0
    - stratum: within_3_residues
      within: 3
    - stratum: within_5_residues
      within: 5
    - stratum: within_10_residues
      within: 10
    - stratum: within_20_residues
      within: 20
    new: true
