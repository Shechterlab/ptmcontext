variants:                # the same questions on other marks; ptmc run --variant <name>
  with_lower_confidence:
    label: With lower-confidence sites
    description: "Also counts the lysines UniProt reports only by similarity to another species (ECO:0000250 and other records without an experimental code) and the lysines only CPLM reports as taken from another database (CPLM’s own label), from the same tables"
    marks_select: {exclude: []}
    attributes: {}

# Context marks: other modifications of the same proteins, shown beside the lysine modifications (CONTRACTS.md, Context marks):
# methylarginine (the sites table of release v1.4.3, the methylarginine site's own marks), methyllysine and phosphorylation (the
# sites tables of release v1.5.0). A map row, "Other modifications nearby" on the site card, a filter, table columns and downloads
# follow from these entries; the near_marks questions test them. The tables are in sites/lysine.inputs.json. The site's own
# types (acetylation, ubiquitination, SUMOylation) are parts of its marks (marks.parts), not context marks.
context_marks:
  - id: methylarginine
    label: Methylarginine
    short: "Rme"   # the lane name in the map's "All modifications" block
    input: context_methylarginine_sites_v1_4_3
    columns: {accession: uniprot_accession, position: position, residue: residue, state: methyl_state}
    replaces_ptm_kinds: [Methyl]   # the live UniProt "Other PTMs" row would repeat the methylarginines and methyllysines: one source for them
    drop_evidence: []          # the v1.4.3 table has no evidence column: every row is kept
    colour: "#C2410C"          # the methylarginine site's orange accent
    colour_dark: "#FB923C"
    citation:
      short: Methylarginine Site Explorer
      cite: "Methylarginine sites of the human reviewed proteome, release v1.4.3 of PTM_Pipeline: DeAngelo et al., Cell Chem Biol 33:1404-1421 (2026), doi:10.1016/j.chembiol.2026.09.011"
      doi: 10.1016/j.chembiol.2026.09.011
      licence: CC BY-NC-SA 4.0
  - id: methyllysine
    label: Methyllysine
    short: "Kme"
    input: context_methyllysine_sites_v1_5_0
    columns: {accession: canonical_UniProtAC, position: position, residue: residue, state: state, evidence: evidence_class, sources: sources}
    same_residue: true          # a lysine that is also methylated says so on its card
    colour: "#7c3aed"          # violet, the methyllysine site's color
    colour_dark: "#a78bfa"
    citation:
      short: UniProt, iPTMnet, CPLM and Berryhill 2023
      cite: "Lysine methylation sites of the human reviewed proteome, release v1.5.0 of PTM_Pipeline: UniProt Consortium, Nucleic Acids Res 53:D609-D617 (2025), doi:10.1093/nar/gkae1010; Huang et al., Nucleic Acids Res 46:D542-D550 (2018), doi:10.1093/nar/gkx1104; Zhang et al., Nucleic Acids Res 50:D451-D459 (2022), doi:10.1093/nar/gkab849 (CPLM 4.0 states no license); Berryhill et al., Sci Rep 13:377 (2023), doi:10.1038/s41598-022-27175-x"
      licence: "CC BY-NC-SA 4.0; CPLM 4.0 states no license; Berryhill 2023 article CC BY 4.0"
    sources:
      UniProt: {cite: "UniProt Consortium, Nucleic Acids Res 53:D609 (2025)", doi: 10.1093/nar/gkae1010}
      iPTMnet: {cite: "Huang et al., Nucleic Acids Res 46:D542 (2018)", doi: 10.1093/nar/gkx1104}
      CPLM: {cite: "Zhang et al., Nucleic Acids Res 50:D451 (2022)", doi: 10.1093/nar/gkab849}
      Berryhill 2023: {cite: "Berryhill et al., Sci Rep 13:377 (2023)", doi: 10.1038/s41598-022-27175-x}
  - id: phospho
    label: Phosphosite
    short: "pS/pT/pY"
    input: context_phosphorylation_sites_v1_5_0
    columns: {accession: canonical_UniProtAC, position: position, residue: residue, state: state, evidence: evidence_class, sources: sources, score: functional_score}
    subset: {id: high, at_least: 0.5, label: score ≥ 0.5}   # shown at first: the sites Ochoa 2020 scores 0.5 or more (about 10,900); a click on the row label shows all. Sites with no score (UniProt or iPTMnet only) are hidden at first too
    replaces_ptm_kinds: [Phospho]   # the live UniProt "Other PTMs" row leaves its Phospho kind out: one source for phosphosites
    colour: "#0891B2"          # cyan: apart from the orange of methylarginines, the violet of methyllysines and the greens, rose and blue of the types
    colour_dark: "#1FA2C4"
    citation:
      short: UniProt, iPTMnet and Ochoa 2020
      cite: "Phosphorylation sites of the human reviewed proteome, release v1.5.0 of PTM_Pipeline: UniProt Consortium, Nucleic Acids Res 53:D609-D617 (2025), doi:10.1093/nar/gkae1010; Huang et al., Nucleic Acids Res 46:D542-D550 (2018), doi:10.1093/nar/gkx1104; Ochoa et al., Nat Biotechnol 38:365-373 (2020), doi:10.1038/s41587-019-0344-3 (the article is not open access; its supplementary table is included)"
      licence: "CC BY-NC-SA 4.0; Ochoa 2020 included"
    sources:
      UniProt: {cite: "UniProt Consortium, Nucleic Acids Res 53:D609 (2025)", doi: 10.1093/nar/gkae1010}
      iPTMnet: {cite: "Huang et al., Nucleic Acids Res 46:D542 (2018)", doi: 10.1093/nar/gkx1104}
      Ochoa 2020: {cite: "Ochoa et al., Nat Biotechnol 38:365 (2020)", doi: 10.1038/s41587-019-0344-3}
