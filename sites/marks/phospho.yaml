# Mark profile: phosphorylation of serine, threonine and tyrosine.
schema_version: 1
id: phospho
name: "Phosphorylation (S, T, Y)"
residues: [S, T, Y]
residue_names: {S: serine, T: threonine, Y: tyrosine}   # a family's among letters, named in its rows' background

states:   # PSI-MOD terms checked against EBI OLS, 2026-11-01
  # Codes follow the Brno nomenclature: Turner BM, Nat Struct Mol Biol 12:110-112 (2005), doi:10.1038/nsmb0205-110
  - {code: Sph, label: phosphoserine, psi_mod: "MOD:00046", pdb_component: SEP}
  - {code: Tph, label: phosphothreonine, psi_mod: "MOD:00047", pdb_component: TPO}
  - {code: Yph, label: phosphotyrosine, psi_mod: "MOD:00048", pdb_component: PTR}

modified_charge: {S: -2.0, T: -2.0, Y: -2.0}   # the phosphate, mostly dianionic at pH 7.4

enzymes:
  writers: []      # kinases: to come from a kinase-substrate layer, not listed by hand
  erasers: []
  reader_domains: []

motifs:
  window_flank: 7
  families:
    - {name: proline_directed, label: "S/T-P", help: "Pro at +1 (proline-directed kinases)", all: [{at: 1, in: P}]}
    - {name: acidophilic_CK2, label: "S/T-x-x-D/E", help: "Asp or Glu at +3 (CK2-like, acidophilic)", all: [{at: 3, in: DE}]}
    - {name: basophilic_RxxS, label: "R/K-x-x-S/T", help: "Arg or Lys at −3 (basophilic kinases)", all: [{at: -3, in: RK}]}

stickers:          # aromatic residues are the stickers of condensates and prion-like domains (Martin et al. 2020, doi:10.1126/science.aaw8653; Choi, Holehouse & Pappu 2020, doi:10.1146/annurev-biophys-121219-081629)
  residues: [Y, F, W]
  noun: aromatic residue
  nouns: aromatic residues
  heading: Aromatic patterning

words:
  mark: phosphosite
  marks: phosphosites
  residue: "S, T or Y"
  residues: "serines, threonines and tyrosines"
  marked: phosphorylated
  marked_long: phosphorylated
  writer: kinase
  writers: kinases
  within_protein: each protein analyzed separately

uniprot_features:   # the mark as UniProt names it (Modified residue descriptions): drawn in its own map row
  - "Phosphoserine"
  - "Phosphothreonine"
  - "Phosphotyrosine"
