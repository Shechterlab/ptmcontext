             p-body: P-body, actin_cytoskeleton: Actin cytoskeleton, centrosome: Centrosome, proteasome: Proteasome,
             14-3-3_scaffold: 14-3-3 scaffold, ER: ER, ERGIC: ERGIC, Golgi: Golgi, trans-Golgi: Trans-Golgi,
             early_endosome: Early endosome, recycling_endosome: Recycling endosome, lysosome: Lysosome,
             mitochondrion: Mitochondrion, peroxisome: Peroxisome, plasma_membrane: Plasma membrane}
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", with each abundance decile analyzed separately"}
  - id: cell_chromatin
    new: true
    test: protein_sets
    title: Chromatin probability
    question: "Are methylated proteins on chromatin more often than other proteins?"
    sub: "Methylated proteins against the other proteins with an interphase chromatin probability (chromatin enrichment for proteomics; Kustatscher et al. 2014), in four bins (one-sided hypergeometric test)"
    section: Location, chromatin and condensates
    sets:
      input: chromatin
      protein: canonical_UniProtAC
      rules:                       # each protein in the first bin it reaches (scripts/cell_maps.py, CHEP_BINS)
        - {set: "ICP >= 0.8 (chromatin)", when: [{column: interphase_chromatin_probability, at_least: 0.8}]}
        - {set: "ICP 0.5-0.8", when: [{column: interphase_chromatin_probability, at_least: 0.5}]}
        - {set: "ICP 0.2-0.5", when: [{column: interphase_chromatin_probability, at_least: 0.2}]}
        - {set: "ICP < 0.2 (not chromatin)"}
    whole_universe: true
    min_size: 5
    background: the other proteins with an interphase chromatin probability
    labels: {"ICP >= 0.8 (chromatin)": "Chromatin (probability ≥ 0.8)", "ICP 0.5-0.8": "Chromatin probability 0.5–0.8", "ICP 0.2-0.5": "Chromatin probability 0.2–0.5",
             "ICP < 0.2 (not chromatin)": "Not chromatin (probability < 0.2)"}
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", with each abundance decile analyzed separately"}
  # Disease families (scripts/14_disease_enrichment.py): DisGeNET terms (as DOSE 4.4.0 ships them) gathered into
  # families by name (the release's rules, sites/data/methylarginine_disease_families.yaml); the sets are Entrez genes,
  # each protein's through its UniProt primary gene name (the first of several) and org.Hs.eg.db's symbols. Every
  # reviewed protein's genes are the universe, those with a DisGeNET term the background; the eight audited families
  # and the additional ones are tested apart (BH within each)
  - id: disease_family
    new: true
    test: protein_sets
    title: Disease families (DisGeNET)
    question: "Which disease gene sets are over-represented?"
    sub: "Genes of methylated proteins vs all reviewed human genes with a DisGeNET term, by disease family: the eight families checked by hand (one-sided hypergeometric test). Association, not causation"
    set_note: "A family of DisGeNET disease terms gathered by name; one of the eight whose rules were checked by hand."
    section: Disease associations
    identifiers:
      noun: gene
      nouns: genes
      map:
        - {input: uniprot_entries, from: Entry, to: "Gene Names (primary)", separator: ";", take: first}
        - {input: gene_symbols, from: symbol, to: entrez_id}
    sets:
      input: disgenet
      set: term_id
      protein: entrez_id
      families: {rules: sites/data/methylarginine_disease_families.yaml, by: term_name, lists: [audited]}
    universe: snapshot
    background: other reviewed human genes (Entrez) with a DisGeNET term
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, combine: max, label: ", with each abundance decile analyzed separately"}
  - id: disease_family_additional
    new: true
    test: protein_sets
    title: More disease families
    question: "Which of the additional disease families, mostly clinical signs, are over-represented?"
    sub: "Genes of methylated proteins vs all reviewed human genes with a DisGeNET term, by additional disease family: grouped automatically by matching words in the disease terms, not checked by hand, mostly clinical signs; tested apart from the eight families checked by hand (one-sided hypergeometric test). Association, not causation"
    set_note: "A family of DisGeNET disease terms grouped automatically by matching words; not checked by hand."
    section: Disease associations
    identifiers:
      noun: gene
      nouns: genes
      map:
        - {input: uniprot_entries, from: Entry, to: "Gene Names (primary)", separator: ";", take: first}
        - {input: gene_symbols, from: symbol, to: entrez_id}
    sets:
      input: disgenet
      set: term_id
      protein: entrez_id
      families: {rules: sites/data/methylarginine_disease_families.yaml, by: term_name, lists: [additional]}
    universe: snapshot
    background: other reviewed human genes (Entrez) with a DisGeNET term
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, combine: max, label: ", with each abundance decile analyzed separately"}
  # Disease Ontology (scripts/14_disease_enrichment.py): the gene sets DOSE enrichDO tests (each term holds the genes of
  # the terms under it; Human Disease Ontology 2026-09-30), on the genes of the disease families: every reviewed
  # protein's genes are the universe, those with a Disease Ontology term the background, and every term of 10 genes or
  # more with a methylated gene is tested. The release keeps these rows in a supporting table, not in its statistics
  # table, so the run checks them against that table (reference.tables)
  - id: disease_ontology
    new: true
    test: protein_sets
    title: Disease Ontology
    question: "Which Disease Ontology terms hold more genes of methylated proteins than expected?"
    sub: "Genes of methylated proteins vs all reviewed human genes with a Disease Ontology term, every term of at least 10 genes; a term includes the genes of its child terms (one-sided hypergeometric test, as DOSE's enrichDO). Association, not causation"
    section: Disease associations
    identifiers:
      noun: gene
      nouns: genes
      map:
        - {input: uniprot_entries, from: Entry, to: "Gene Names (primary)", separator: ";", take: first}
        - {input: gene_symbols, from: symbol, to: entrez_id}
    sets: {input: hdo_term_genes, set: term_id, protein: entrez_id}
    names: {input: hdo_terms, set: term_id, name: name}
    hierarchy: {input: hdo_terms, set: term_id, parents: parents, root: "DOID:4"}
    universe: snapshot
    min_size: 10
    link: "https://disease-ontology.org/?id={}"
    filter: {label: Disease Ontology term (methylated proteins)}
    background: other reviewed human genes (Entrez) with a Disease Ontology term
  # DisGeNET terms one by one (scripts/14_disease_enrichment.py): the terms of the disease families, each tested as
  # DOSE's enrichDGN tests it (terms of 10 to 300 genes), against the same background. In the release's supporting
  # tables, not its statistics table: the run checks them against supporting/disease_terms_tested (reference.tables)
  - id: disease_term
    new: true
    test: protein_sets
    title: DisGeNET terms
    question: "Which DisGeNET disease terms hold more genes of methylated proteins than expected?"
    sub: "Genes of methylated proteins vs all reviewed human genes with a DisGeNET term, every term of 10 to 300 genes (one-sided hypergeometric test, as DOSE's enrichDGN). Association, not causation"
    section: Disease associations
    identifiers:
      noun: gene
      nouns: genes
      map:
        - {input: uniprot_entries, from: Entry, to: "Gene Names (primary)", separator: ";", take: first}
        - {input: gene_symbols, from: symbol, to: entrez_id}
    sets: {input: disgenet, set: term_id, protein: entrez_id}
    names: {input: disgenet, set: term_id, name: term_name}
    universe: snapshot
    min_size: 10
    max_size: 300
    link: "https://www.disgenet.com/search?view=DISEASES&idents={}&source=ALL&tab=GDA"
    background: other reviewed human genes (Entrez) with a DisGeNET term
  # Cancer cell lines (scripts/release_layers.py, CANCER): cancer cell genetics beside the sites, not evidence about
  # methylation. The dependency classes partition the entries whose gene DepMap 24Q4 screened (gene_effect)
  - id: depmap_dependency
    new: true
    test: protein_sets
    title: Cancer cell dependency
    question: "Do cancer cell lines depend on these proteins more than on others? (DepMap CRISPR screens)"
    sub: "DepMap Public 24Q4 dependency classes, methylated proteins vs all screened reviewed proteins (one per gene); the dependency of 1,178 cancer cell lines on them in CRISPR knockout screens. Cancer genetics, not evidence about methylation (one-sided hypergeometric test)"
    section: Disease associations
    sets:
      input: depmap_genes
      protein: canonical_UniProtAC
      rules:                       # the share of the screened lines whose dependency probability is at least 0.5
        - {set: common_essential, when: [{column: common_essential, equals: "True"}]}
        - {set: most_lines, when: [{ratio: [dependent_lines, lines_with_probability], at_least: 0.5}]}
        - {set: some_lines, when: [{ratio: [dependent_lines, lines_with_probability], at_least: 0.05}]}
        - {set: few_or_none}
    whole_universe: true
    order: [{categories: [common_essential, most_lines, some_lines, few_or_none]}]
    background: other reviewed human proteins whose gene DepMap 24Q4 screened (CRISPR, Chronos)
    labels: {common_essential: Commonly essential, most_lines: "Most lines (≥ 50%)", some_lines: "Some lines (5–50%)", few_or_none: "Few or none (< 5%)"}
    help:
      common_essential: "DepMap 24Q4 calls the gene commonly essential (CRISPRInferredCommonEssentials: it ranks among the strongest dependencies of at least 90% of lines)"
      most_lines: "not commonly essential, and at least 50% of the screened lines depend on it"
      some_lines: "not commonly essential, and 5% to under 50% of the lines depend on it (selective dependencies)"
      few_or_none: "fewer than 5% of the lines depend on it"
    abundance: {input: abundance, protein: canonical_UniProtAC, value: percentile, label: ", with each abundance decile analyzed separately"}
    values:                        # each screened protein's numbers, for the website (website.set_views); no test reads them
      columns:
        - {name: median, label: median gene effect, background: true}
        - {name: dependent_lines, label: lines that depend on it}
        - {name: lines_with_probability, label: lines screened}
  - {id: motif, layer: motif, new: true}
  - {id: disorder, layer: disorder, title: Disorder context, family_label: All states, new: true}
  - {id: domain_context, layer: domain_context, new: true}
  - {id: domain_class, layer: domain_class, with: {classes: sites/data/domain_classes.json}, new: true}
  - {id: structure_context, layer: structure_context, new: true}
  - {id: idr_charge, layer: idr_charge, new: true, title: Charge of disordered regions}   # not in the release: CIDER's charge classes of IDRs
  # Changes at the methyllysines in tumors and cell lines: a missense or stop change in at least one TCGA tumor (MC3) or DepMap
  # cell line, against the other lysines of the methylated proteins whose gene DepMap screened (the arginine question's
  # design); every mark of those proteins counts, one on a protein with no other candidate too (it adds nothing within proteins)
  - id: cancer_change
    new: true
    layer: residue_lists
    with:
      flags: {tcga_tumours: tcga_changes, depmap_cell_lines: depmap_changes}
      noun: changed lysine
      title: Changes in tumors and cell lines
      question: "Is a methyllysine changed in tumors or cancer cell lines more or less often than the other lysines of its protein?"
      sub: "Methyllysines against the other lysines of the methylated proteins whose gene DepMap screened: a missense or stop change in at least one TCGA tumor (MC3) or DepMap 24Q4 cell line. Not adjusted for codon or sequence context, which may differ between the methyllysines and the other lysines"
      section: Disease associations
      labels: {tcga_tumours: Changed in a TCGA tumor, depmap_cell_lines: Changed in a DepMap cell line}
      help:
        tcga_tumours: "A missense or stop change of the residue in at least one TCGA tumor (MC3 public calls from the GDC, 33 projects; FILTER PASS, and in OV and LAML also wga alone)"
        depmap_cell_lines: "A missense or stop change of the residue in at least one DepMap 24Q4 cell line (OmicsSomaticMutations, on the canonical UniProt isoform)"
    proteins: {input: depmap_genes, column: canonical_UniProtAC, label: " whose gene DepMap screened"}
    marks_alone: count
    order: [{categories: [tcga_tumours, depmap_cell_lines]}]
  # Germline variants at the methyllysines: a ClinVar single-residue substitution or stop with a pathogenic or likely pathogenic record,
  # or a gnomAD v4.1 exome variant, against the other lysines of the same proteins; every mark counts, as for the
  # tumor and cell-line question above
  - id: clinvar_plp
    new: true
    layer: residue_lists
    with:
      flags: {clinvar_plp: clinvar_plp}
      noun: lysine with a pathogenic ClinVar variant
      title: ClinVar pathogenic or likely pathogenic
      question: "Does a methyllysine carry a pathogenic or likely pathogenic ClinVar variant more or less often than the other lysines of its protein?"
      sub: "Methyllysines against the other lysines of the same proteins: a ClinVar single-residue substitution or stop classified pathogenic or likely pathogenic. ClinVar lists the genes and regions that clinical testing covers, so a well-studied protein has more variants at every residue; the comparison within each protein reduces that effect but does not remove it. Not adjusted for codon or sequence context, which may differ between the methyllysines and the other lysines"
      section: Disease associations
      labels: {clinvar_plp: Pathogenic or likely pathogenic in ClinVar}
      help:
        clinvar_plp: "A single-residue substitution or stop whose ClinVar germline classification is pathogenic or likely pathogenic (including Pathogenic/Likely pathogenic; conflicting classifications are not counted), on a RefSeq protein UniProt assigns to the entry"
    marks_alone: count
    order: [{categories: [clinvar_plp]}]
  - id: gnomad_variant
    new: true
    layer: residue_lists
    with:
      flags: {gnomad_variant: gnomad_variants}
      noun: lysine with a gnomAD variant
      title: gnomAD variants
      question: "Does a methyllysine carry a gnomAD variant more or less often than the other lysines of its protein?"
      sub: "Methyllysines against the other lysines of the same proteins: a missense or stop-gained variant in gnomAD v4.1 exomes (730,947 exomes; FILTER PASS), at any allele frequency. Most are rare. A variant observed in healthy adults does not show that it is benign, and a residue without one may only be rare in the sample. Not adjusted for codon or sequence context, which may differ between the methyllysines and the other lysines"
      section: Disease associations
      labels: {gnomad_variant: Variant in gnomAD}
      help:
        gnomad_variant: "A missense or stop-gained change of the residue in at least one gnomAD v4.1 exome variant that passed the filters (VEP consequence on a transcript UniProt assigns to the entry)"
    marks_alone: count
    order: [{categories: [gnomad_variant]}]
  # Near other marks: are methyllysines more often within 10 residues of another mark than the other lysines of their
  # protein? Context marks (context_marks below), not part of the release's analyses
  - id: near_phospho
    family_label: All states
    layer: near_marks
    with: {marks: phospho, window: 10, noun: phosphosite}
    new: true
    title: Near phosphosites (±10 residues)
    question: "Are methyllysines more often near a phosphosite than the other lysines of their protein?"
    sub: "Methyllysines against the other lysines of the same proteins, by whether a phosphosite (UniProt, iPTMnet and Ochoa 2020, by-similarity records left out) is within 10 residues on either side. Phosphosites are heavily studied, so a protein with many methyllysines is also likely to have more recorded phosphosites; the comparison within each protein reduces that effect but does not remove it"
    section: Other modifications
  - id: near_phospho_high
    family_label: All states
    layer: near_marks
    with: {marks: phospho_high, window: 10, noun: high-score phosphosite}
    new: true
    title: Near high-score phosphosites (±10 residues)
    question: "Are methyllysines more often near a high-score phosphosite than the other lysines of their protein?"
    sub: "Methyllysines against the other lysines of the same proteins, by whether a phosphosite with an Ochoa et al. 2020 functional score of 0.5 or more (about 10,900 sites; the score is a model of how likely a site is functionally important) is within 10 residues on either side. Sites without a score are not counted as high-score. The comparison within each protein reduces the effect of heavily studied proteins but does not remove it"
    section: Other modifications
  - id: near_methylarginine
    family_label: All states
    layer: near_marks
    with: {marks: methylarginine, window: 10, noun: methylarginine}
    new: true
    title: Near methylarginines (±10 residues)
    question: "Are methyllysines more often near a methylarginine than the other lysines of their protein?"
    sub: "Methyllysines against the other lysines of the same proteins, by whether a methylarginine (methylarginine release v1.7.0, by-similarity records left out) is within 10 residues on either side"
    section: Other modifications
    note: "The association comes from the database-curated sources: lysines of UniProt or iPTMnet are {or:near_methylarginine_uniprotipt:near} near a methylarginine, while Berryhill et al.'s affinity-enriched sites are {or:near_methylarginine_berryhill:near} ({sig:near_methylarginine_berryhill:near}). That points to which proteins were studied, not to a link between the two marks. Select a source to see its lysines:"   # the numbers are the statistics' (the source subsets below)
    note_filters:
      - {label: UniProt, query: "sources:UniProt"}
      - {label: iPTMnet, query: "sources:iPTMnet"}
      - {label: Berryhill 2023, query: "sources:Berryhill"}
  - id: near_acetylation
    family_label: All states
    layer: near_marks
    with: {marks: acetylation, window: 10, noun: "acetylation site", labels: {near: "An acetylation site within ±10", none: "No acetylation site within ±10"}}
    new: true
    title: Near acetylation sites (±10 residues)
    question: "Are methyllysines more often near an acetylation site than the other lysines of their protein?"
    sub: "Methyllysines against the other lysines of the same proteins, by whether an acetylation site (UniProt and iPTMnet, by-similarity records left out) is within 10 residues on either side. Acetylation is among the most studied lysine modifications and heavily studied proteins carry many records of every kind, so the comparison within each protein reduces that effect but does not remove it"
    section: Other modifications
  - id: near_other_acylation
    family_label: All states
    layer: near_marks
    with: {marks: other_acylation, window: 10, noun: "other acylation site", labels: {near: "Another lysine acylation within ±10", none: "No other acylation site within ±10"}}
    new: true
    title: Near other acylation sites (±10 residues)
    question: "Are methyllysines more often near another lysine acylation than the other lysines of their protein?"
    sub: "Methyllysines against the other lysines of the same proteins, by whether a lysine acylation other than acetylation (UniProt and iPTMnet, by-similarity records left out; 12 acyl types) is within 10 residues on either side. These modifications (crotonyl, 2-hydroxyisobutyryl, succinyl, malonyl, beta-hydroxybutyryl and others) come from far fewer studies than acetylation; the comparison within each protein reduces the effect of heavily studied proteins but does not remove it"
    section: Other modifications
  # Both marks on one lysine: is a methyllysine more often also reported acetylated than the other lysines of its
  # protein? The comparison within each protein (Mantel-Haenszel over proteins) holds the protein fixed, so how much it
  # has been studied, how many lysines it has and how acetylated it is overall do not drive the result; a lysine can carry
  # either mark on different copies of the protein, so overlap is a statement about reported residues, not one molecule
  - id: same_acetylation
    family_label: All states
    layer: near_marks
    with: {marks: acetylation, window: 0, noun: acetylation site, labels: {near: "Also reported acetylated", none: "Not reported acetylated"}}
    new: true
    title: Methylated and acetylated lysines
    question: "Are methyllysines more often also reported acetylated than the other lysines of their protein?"
    sub: "Methyllysines against the other lysines of the same proteins, by whether the lysine itself is also an acetylation site (UniProt and iPTMnet, by-similarity records left out). Methylation and acetylation compete for the same lysine, and both are best known on much-studied proteins such as histones, so the comparison is made within each protein: it asks whether, among the lysines of one protein, the methylated ones are the acetylated ones more often than chance"
    section: Other modifications
  - id: near_ubiquitination
    family_label: All states
    layer: near_marks
    with: {marks: ubiquitination, window: 10, noun: "ubiquitination site", labels: {near: "A ubiquitination site within ±10", none: "No ubiquitination site within ±10"}}
    new: true
    title: Near ubiquitination sites (±10 residues)
    question: "Are methyllysines more often near a ubiquitination site than the other lysines of their protein?"
    sub: "Methyllysines against the other lysines of the same proteins, by whether a ubiquitination site (Akimov et al. 2018, UniProt and iPTMnet; by-similarity records left out) is within 10 residues on either side"
    section: Other modifications
  - id: near_sumoylation
    family_label: All states
    layer: near_marks
    with: {marks: sumoylation, window: 10, noun: "SUMOylation site", labels: {near: "A SUMOylation site within ±10", none: "No SUMOylation site within ±10"}}
    new: true
    title: Near SUMOylation sites (±10 residues)
    question: "Are methyllysines more often near a SUMOylation site than the other lysines of their protein?"
    sub: "Methyllysines against the other lysines of the same proteins, by whether a SUMOylation site (Hendriks et al. 2017, UniProt and iPTMnet; by-similarity records left out) is within 10 residues on either side"
    section: Other modifications
  - id: same_ubiquitination
    family_label: All states
    layer: near_marks
    with: {marks: ubiquitination, window: 0, noun: ubiquitination site, labels: {near: "Also reported ubiquitinated", none: "Not reported ubiquitinated"}}
    new: true
    title: Methylated and ubiquitinated lysines
    question: "Are methyllysines more often also reported ubiquitinated than the other lysines of their protein?"
    sub: "Methyllysines against the other lysines of the same proteins, by whether the lysine itself is also a ubiquitination site (Akimov et al. 2018, UniProt and iPTMnet; by-similarity records left out). Ubiquitination is reported on about two lysines in five of the proteins in this table, mostly by large mass-spectrometry studies of the proteome, so the comparison is made within each protein; methylation and ubiquitin compete for the same lysine"
    section: Other modifications
  # Taking all factors together: one conditional logistic regression, a stratum per protein (the multi-factor
  # Mantel-Haenszel; Breslow & Day 1980), the whole dataset (a selection is not refitted in the browser)
  - id: which_factor
    test: conditional_logit
    new: true
    title: Which features remain associated after adjusting for the others?
    question: "Taking all factors together, which ones distinguish a methyllysine from the other lysines of its protein?"
    sub: "One model: each methyllysine against the other lysines of its protein, all four factors at once. Each odds ratio is the factor's effect with the others held fixed; 'on its own' is the same factor in a model by itself"
    section: Motif, disorder and structure
    covariates:
      - {name: in_idr, label: In a disordered region, help: "Inside a disordered region of 20 or more residues", layer: idr, is: [idr]}
      - {name: arks_motif, label: In an R-K-S/T sequence, help: "Arg right before the lysine and Ser or Thr right after it", layer: motif, flags: [ARKS]}
      - {name: net_charge, label: "Local net charge (per +1)", help: "Lys and Arg minus Asp and Glu within 7 residues on either side, the lysine itself left out; the odds ratio is for each extra +1", window_sum: {window: 7, weights: {K: 1, R: 1, D: -1, E: -1}}}
      - {name: domain_distal, label: Far from any domain, help: "More than 20 residues from a domain, and not between two domains", layer: domain_context, is: [distal]}
  # Interactions: each a question of yes-or-no tests, each against the lysines its evidence could have reached: the
  # residues a structure observed or a model covers. Every candidate counts in the pooled test, and the within-protein
  # row reports those counts (counting: every_candidate).
  - id: pdb_interface_na
    new: true
    title: RNA and DNA interfaces in PDB structures
    question: "Are methyllysines at interfaces with RNA or DNA in experimental structures?"
    sub: "Methyllysines against the other lysines of the same proteins observed in a PDB structure, at a PDBe-KB interface with RNA or with DNA; all, ordered (outside UniProt disordered regions) and in domains"
    section: RNA and DNA
    counting: every_candidate
    background: other lysines of the same proteins observed in a PDB structure
    proteins_with: pdb_interfaces                       # proteins PDBe-KB lists with an interface
    covered_by: pdb_observed                            # residues a PDB chain models (SIFTS)
    tests:
      - {category: rna, inside: {role: pdb_interfaces, where: [{column: class, equals: RNA}]}, label: RNA interface}
      - {category: dna, inside: {role: pdb_interfaces, where: [{column: class, equals: DNA}]}, label: DNA interface}
    strata:
      - {stratum: all}
      - {stratum: ordered, outside_of: uniprot_disorder, suffix: ", ordered regions"}
      - {stratum: domain, covered_by: uniprot_domains, suffix: ", in domains"}
  # RNA and DNA binding in cells and the cells' RNA maps, and aromatic neighbors: the methylarginine site's questions on this site's residues
  # (no RBDmap, pCLAP or RG/GR tests: the release has no such data for these residues; no distance test: the release
  # measures side-chain distances at the site set's own sites only, so there is no background of other residues)
  - id: go_binding
    test: protein_sets
    title: RNA and DNA binding (GO)
    question: Are methylated proteins more often annotated to bind RNA or DNA?
    sub: Methylated proteins against every reviewed human protein, by Gene Ontology annotation to RNA binding (GO:0003723) or DNA binding (GO:0003677) or a term below them, any evidence or experimental evidence only (one-sided hypergeometric test)
    section: RNA and DNA
    sets:
      each:
      - set: rna_binding
        name: RNA binding (GO)
        table:
          input: go_binding
          protein: uniprot_accession
          include:
          - column: binding
            equals: rna
      - set: rna_binding_experimental
        name: RNA binding (GO, experimental evidence)
        table:
          input: go_binding
          protein: uniprot_accession
          include:
          - column: binding
            equals: rna
          - column: evidence_code
            in:
            - EXP
            - IDA
            - IPI
            - IMP
            - IGI
            - IEP
            - HTP
            - HDA
            - HMP
            - HGI
            - HEP
      - set: dna_binding
        name: DNA binding (GO)
        table:
          input: go_binding
          protein: uniprot_accession
          include:
          - column: binding
            equals: dna
      - set: dna_binding_experimental
        name: DNA binding (GO, experimental evidence)
        table:
          input: go_binding
          protein: uniprot_accession
          include:
          - column: binding
            equals: dna
          - column: evidence_code
            in:
            - EXP
            - IDA
            - IPI
            - IMP
            - IGI
            - IEP
            - HTP
            - HDA
            - HMP
            - HGI
            - HEP
    universe: snapshot
    whole_universe: true
    background: all reviewed human proteins
    abundance:
      input: abundance
      protein: canonical_UniProtAC
      value: percentile
      label: ', each PaxDb abundance decile a stratum'
    new: true
  - id: binding_protein
    test: protein_sets
    title: Proteins found binding RNA or DNA in cells
    question: Are methylated proteins among the proteins found binding RNA or DNA in cells?
    sub: Methylated proteins among the proteins each in-cell experiment found binding RNA or DNA, against the other proteins the experiment measured where it lists them, else every reviewed human protein (one-sided hypergeometric test)
    section: RNA and DNA
    order: as_listed
    sets:
      each:
      - set: rna_xl
        name: RNA-crosslinked residue (pepR-MS compendium)
        units: rna_crosslinks
        background: other reviewed human proteins
      - set: rna_capri
        name: Peptide next to an RNA crosslink (CAPRI)
        units:
        - capri_measured_adjacent
        - capri_adj
        universe_units: capri_measured
        background: other reviewed human proteins the experiment measured
      - set: rna_rbrid
        name: RNA-contact residue (RBR-ID)
        units: rbrid_residues
        universe_units: rbrid_quantified
        background: other reviewed human proteins the experiment measured
      - set: dna_xl
        name: DNA-crosslinked residue or peptide (Trendel 2025)
        units:
        - dna_crosslink_candidates
        - dna_crosslinked_peptides
        background: other reviewed human proteins
      - set: dna_interactome
        name: DNA interactome protein (Trendel 2025)
        table:
          input: dna_interactome
          protein: uniprot_accession
        background: other reviewed human proteins
    universe: snapshot
    whole_universe: true
    abundance:
      input: abundance
      protein: canonical_UniProtAC
      value: percentile
      label: ', each PaxDb abundance decile a stratum'
    new: true
  - id: crosslink
    title: RNA and DNA crosslinks in cells
    question: Are methyllysines where RNA or DNA crosslinks to proteins in cells?
    sub: 'Methyllysines against the other lysines of the proteins with each kind of evidence: crosslinked residues, RNA-bound peptides, RBR-ID residues and regions, DNA crosslinks and DNA-binding regions'
    section: RNA and DNA
    counting: every_candidate
    candidates_from: marks_and_left_out
    background: other lysines of the same proteins (proteins with that evidence)
    tests:
    - category: rna_crosslink
      inside: rna_crosslinks
      proteins_with: rna_crosslinks
      label: RNA-crosslinked residue
    - category: rna_crosslink_single_residue
      inside: rna_crosslinks_single
      proteins_with: rna_crosslinks_single
      label: RNA crosslink, one residue
    - category: rna_crosslink_within_3
      inside: rna_crosslinks
      within: 3
      proteins_with: rna_crosslinks
      label: ≤3 aa from an RNA crosslink
    - category: dna_crosslink
      inside: dna_crosslinks
      proteins_with: dna_crosslinks
      label: DNA-crosslinked residue
    - category: dna_crosslink_or_candidate
      inside: dna_crosslink_candidates
      proteins_with: dna_crosslink_candidates
      label: DNA crosslink or candidate
    - category: dna_crosslinked_peptide
      inside: dna_crosslinked_peptides
      proteins_with: dna_crosslinked_peptides
      label: DNA-crosslinked peptide
    - category: dna_binding_region
      inside: uniprot_dna_binding
      proteins_with: uniprot_dna_binding
      label: DNA-binding region (UniProt)
    - category: capri_xl_peptide
      inside: capri_xl
      proteins_with: capri_xl
      label: RNA-crosslinked peptide (CAPRI)
    - category: capri_adj_peptide
      inside: capri_adj
      proteins_with: capri_adj
      label: CAPRI adjacent peptide
    - category: rbrid_residue
      inside: rbrid_residues
      proteins_with: rbrid_residues
      label: RNA-contact residue (RBR-ID)
    - category: rbrid_residue_published_rule
      inside: rbrid_residues_published_rule
      proteins_with: rbrid_residues_published_rule
      label: RNA-contact residue (RBR-ID), published rule
    - category: rbrid_region
      inside: rbrid_regions
      proteins_with: rbrid_regions
      label: RBR-ID region
    - category: capri_adj_peptide_among_measured
      inside: capri_measured_adjacent
      proteins_with: capri_measured_adjacent
      covered_by: capri_measured
      label: CAPRI adjacent peptide, among measured
    - category: rbrid_residue_among_measured
      inside: rbrid_residues
      proteins_with: rbrid_residues
      covered_by: rbrid_quantified
      label: RNA-contact residue (RBR-ID), among measured
    new: true
  - id: sequence_proximity
    title: Distance along the chain to RNA evidence
    question: Are methyllysines near RNA-crosslinked residues along the sequence?
    sub: Methyllysines against the other lysines of the proteins with each kind of RNA evidence, within 0, 3, 5, 10 or 20 residues of it along the sequence
    section: RNA and DNA
    counting: every_candidate
    candidates_from: marks_and_left_out
    background: other lysines of the same proteins (proteins with that evidence)
    tests:
    - category: rna_crosslink
      inside: rna_crosslinks
      proteins_with: rna_crosslinks
      label: RNA-crosslinked residue
    - category: capri_adj_peptide
      inside: capri_adj
      proteins_with: capri_adj
      label: CAPRI adjacent peptide
    - category: capri_xl_peptide
      inside: capri_xl
      proteins_with: capri_xl
      label: RNA-crosslinked peptide (CAPRI)
    - category: rbrid_residue
      inside: rbrid_residues
      proteins_with: rbrid_residues
      label: RNA-contact residue (RBR-ID)
    strata:
    - stratum: within_0_residues
      within: 0
    - stratum: within_3_residues
      within: 3
    - stratum: within_5_residues
      within: 5
    - stratum: within_10_residues
      within: 10
    - stratum: within_20_residues
      within: 20
    new: true
  - id: sticker_context_3
    family: Next to aromatic residues
    layer: neighbours
    with:
      window: 3
      noun: aromatic residue
      residues: [Y, F, W]
    new: true
    title: Next to aromatic residues (within 3)
    question: Are methyllysines more often next to aromatic residues than the other lysines of their protein?
    sub: Methyllysines against the other lysines of the same proteins, by how many aromatic residues (Tyr, Phe, Trp) are within 3 residues on either side. Aromatic residues pair with lysine in condensates (cation–π), and methylation may weaken that contact
    section: Position in the protein
  - id: sticker_context_5
    family: Next to aromatic residues
    layer: neighbours
    with:
      window: 5
      noun: aromatic residue
      residues: [Y, F, W]
    new: true
    title: Next to aromatic residues (within 5)
    question: Are methyllysines more often next to aromatic residues than the other lysines of their protein?
    sub: Methyllysines against the other lysines of the same proteins, by how many aromatic residues (Tyr, Phe, Trp) are within 5 residues on either side
    section: Position in the protein
  - id: sticker_context_3_idr
    family: Next to aromatic residues
    layer: neighbours
    with:
      window: 3
      noun: aromatic residue
      residues: [Y, F, W]
    only_in: idr
    new: true
    title: Next to aromatic residues, in disordered regions (within 3)
    question: Inside disordered regions, are methyllysines more often next to aromatic residues than the other lysines there?
    sub: 'Only lysines inside disordered regions of 20 or more residues: methyllysines against the other lysines of the same proteins in disordered regions, by how many aromatic residues are within 3 residues on either side'
    section: Position in the protein
  - id: sticker_context_5_idr
    family: Next to aromatic residues
    layer: neighbours
    with:
      window: 5
      noun: aromatic residue
      residues: [Y, F, W]
    only_in: idr
    new: true
    title: Next to aromatic residues, in disordered regions (within 5)
    question: Inside disordered regions, are methyllysines more often next to aromatic residues than the other lysines there?
    sub: 'Only lysines inside disordered regions of 20 or more residues: methyllysines against the other lysines of the same proteins in disordered regions, by how many aromatic residues are within 5 residues on either side'
    section: Position in the protein
  - id: eclip_rna_apexseq
    test: protein_sets
    title: Bound RNAs by APEX-seq
    question: Where do the RNAs that methylated proteins bind gather in the cell, by APEX-seq?
    sub: Proteins with eCLIP data whose bound RNAs localize to an APEX-seq compartment (HEK293T; Fazal et al. 2019), methylated against the others (one-sided hypergeometric test)
    section: Location, chromatin and condensates
    sets:
      input: eclip_maps
      set: compartment
      protein: uniprot_accession
      include:
      - column: map
        equals: apexseq
      member_when:
      - column: gathers
        equals: 'true'
    whole_universe: true
    min_size: 5
    background: the other proteins with eCLIP data that APEX-seq tests (at least 20 bound RNAs placed). A set is the proteins whose bound RNAs gather in the compartment
    abundance:
      input: abundance
      protein: canonical_UniProtAC
      value: percentile
      label: ', each PaxDb abundance decile a stratum'
    sizes:
      value: odds_ratio
      log2: true
      background: the log2 odds ratio of the bound RNAs of each other protein APEX-seq tests gathering in the compartment, called or not (supporting/eclip_rna_compartments). a and c count the proteins compared
    new: true
  - id: eclip_gene_tsaseq
    test: protein_sets
    title: Genes of bound RNAs by TSA-seq
    question: Are the RNAs that methylated proteins bind transcribed from genes near nuclear speckles?
    sub: Proteins with eCLIP data whose bound RNAs are transcribed from genes near nuclear speckles by TSA-seq (K562; Chen et al. 2018). TSA-seq measures the position of the genes in the nucleus, not of the RNAs, methylated against the others (one-sided hypergeometric test)
    section: Location, chromatin and condensates
    sets:
      input: eclip_maps
      set: compartment
      protein: uniprot_accession
      include:
      - column: map
        equals: tsaseq
      member_when:
      - column: gathers
        equals: 'true'
    whole_universe: true
    min_size: 5
    background: the other proteins with eCLIP data that TSA-seq tests (at least 20 bound RNAs placed). A set is the proteins whose bound RNAs gather in the compartment
    abundance:
      input: abundance
      protein: canonical_UniProtAC
      value: percentile
      label: ', each PaxDb abundance decile a stratum'
    sizes:
      value: odds_ratio
      log2: true
      background: the log2 odds ratio of the bound RNAs of each other protein TSA-seq tests gathering in the compartment, called or not (supporting/eclip_rna_compartments). a and c count the proteins compared
    new: true
  - id: eclip_gene_hic
    test: protein_sets
    title: Genes of bound RNAs by Hi-C subcompartment
    question: Are the RNAs that methylated proteins bind transcribed from genes in one Hi-C subcompartment?
    sub: Proteins with eCLIP data whose bound RNAs are transcribed from genes of a Hi-C subcompartment (GM12878; Rao et al. 2014). Hi-C measures contacts between genomic regions, not the position of the RNAs, methylated against the others (one-sided hypergeometric test)
    section: Location, chromatin and condensates
    sets:
      input: eclip_maps
      set: compartment
      protein: uniprot_accession
      include:
      - column: map
        equals: hic
      member_when:
      - column: gathers
        equals: 'true'
    whole_universe: true
    min_size: 5
    background: the other proteins with eCLIP data that Hi-C subcompartments tests (at least 20 bound RNAs placed). A set is the proteins whose bound RNAs gather in the compartment
    abundance:
      input: abundance
      protein: canonical_UniProtAC
      value: percentile
      label: ', each PaxDb abundance decile a stratum'
    sizes:
      value: odds_ratio
      log2: true
      background: the log2 odds ratio of the bound RNAs of each other protein Hi-C subcompartments tests gathering in the compartment, called or not (supporting/eclip_rna_compartments). a and c count the proteins compared
    new: true
marks_subsets:           # the key questions again on the lysines of one methylation degree (a lysine with a row of the degree counts; the
                         # others are other lysines): each adds '<question>_<id>' to the sidebar, under its question's entry (family)
  - id: me1
    label: Kme1
    where: {column: state, equals: me1}
    note: "Only the lysines with a monomethyl (Kme1) record are counted as methylated"
    analyses: [histone, panther_group, disorder, near_methylarginine, near_phospho, near_phospho_high, near_acetylation, near_other_acylation, same_acetylation, near_ubiquitination, near_sumoylation, same_ubiquitination]
  - id: me2
    label: Kme2
    where: {column: state, equals: me2}
    note: "Only the lysines with a dimethyl (Kme2) record are counted as methylated"
    analyses: [histone, panther_group, disorder, near_methylarginine, near_phospho, near_phospho_high, near_acetylation, near_other_acylation, same_acetylation, near_ubiquitination, near_sumoylation, same_ubiquitination]
  - id: me3
    label: Kme3
    where: {column: state, equals: me3}
    note: "Only the lysines with a trimethyl (Kme3) record are counted as methylated"
    analyses: [histone, panther_group, disorder, near_methylarginine, near_phospho, near_phospho_high, near_acetylation, near_other_acylation, same_acetylation, near_ubiquitination, near_sumoylation, same_ubiquitination]
  # the sources of the near-methylarginine note: the lysines each database reports (sources, a ';'-separated list)
  - id: uniprotipt
    label: UniProt or iPTMnet
    where: {any_of: [{column: sources, contains: UniProt}, {column: sources, contains: iPTMnet}]}
    note: "Only the lysines that UniProt or iPTMnet reports (alone or with other databases) are counted as methylated"
    analyses: [near_methylarginine]
  - id: berryhill
    label: Berryhill 2023 only
    where: {column: sources, equals: "Berryhill 2023"}
    note: "Only the lysines that Berryhill et al. 2023 alone reports are counted as methylated"
    analyses: [near_methylarginine]

# Controls (CONTRACTS.md, Controls): questions repeated with one change each, shown on each question's page beside its
# result (not as Overview tiles)
controls:
  - id: nohist
    label: histones set aside
    when: "the histones are set aside"
    note: "Histones set aside (PANTHER families HISTONE H1, H2A, H2B, H3 and H4, as the question Histones and other proteins defines them): neither their methyllysines nor their other residues count"
    analyses: [same_acetylation, same_ubiquitination, cell_chromatin]
    without_proteins:
      input: panther_classes
      column: uniprot_accession
      include: [{column: family_name, in: [HISTONE H1, HISTONE H2A, HISTONE H2B, HISTONE H3, HISTONE H4]}]
      label: histones
  - id: inidr
    label: inside disordered regions
    when: "only lysines inside disordered regions are compared"
    note: "Only the lysines inside intrinsically disordered regions (MobiDB) count, methyllysines and other lysines alike, so the comparison shows whether the result holds inside disordered regions"
    analyses: [near_phospho, near_phospho_high, near_methylarginine, near_acetylation, near_other_acylation, near_ubiquitination, near_sumoylation, idr_charge]
    only_in: idr
  # High-confidence lysines: reported by at least two independent studies. Only experimental records count (by-similarity,
  # unspecified and text-mined records give nothing). A study is a PubMed ID in the record's pmids, or a direct dataset
  # (Berryhill 2023, Ochoa 2020, Hendriks 2017 as its PubMed ID 28112733, Akimov 2018 as 29967540, so a database citing
  # the same paper is not counted twice). UniProt and iPTMnet count only through the papers they cite. Ochoa 2020 is
  # one study, however many of its observations there are. A lysine's studies are pooled over all its rows.
  - id: hc
    label: high-confidence sites
    when: "only the lysines at least two independent studies report are compared"
    note: "Only the lysines at least two independent studies report (each paper counted once, whether it comes from a database citing it or from the study's own data; Ochoa 2020 counted once; records by similarity, unspecified or text-mined count for nothing); the other sites are counted on neither side"
    analyses: [motif, disorder, idr_charge]
    marks_where:
      distinct_units_at_least: 2
      units:
        columns: [pmids]
        separator: ";"
        direct:
          column: sources
          map: {Berryhill 2023: Berryhill 2023, Ochoa 2020: Ochoa 2020, Hendriks 2017: "28112733", Akimov 2018: "29967540"}
        only_where: {column: evidence_class, equals: experimental}
    marks_outside: left_out

variants:                # the same questions on other marks; ptmc run --variant <name>
  with_lower_confidence:
    label: With lower-confidence sites
    description: "Also counts the lysines UniProt reports only by similarity to another species (ECO:0000250 and other records without an experimental code) from the same table"
    marks_select: {exclude: []}
    attributes: {}

# Context marks: other modifications of the same proteins, shown beside the methyllysines (CONTRACTS.md, Context marks):
# methylarginine (the sites table of release v1.7.0, the methylarginine site's own marks) and phosphorylation (the sites
# table of release v1.7.0). A map row, "Other modifications nearby" on the site card, a filter, table columns and downloads follow
# from these entries; the near_marks questions below test them. Both tables are in sites/methyllysine.inputs.json.
context_marks:
  - id: methylarginine
    label: Methylarginine
    short: "Rme"   # the lane name in the map's "All modifications" block
    input: context_methylarginine_sites_v1_5_1
    columns: {accession: uniprot_accession, position: position, residue: residue, state: methyl_state}
    replaces_ptm_kinds: [Methyl]   # the live UniProt "Other PTMs" row would repeat the methylarginines: one source for them
    drop_evidence: []          # the v1.7.0 table has no evidence column: every row is kept
