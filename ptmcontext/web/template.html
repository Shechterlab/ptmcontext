<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{NAME}}</title>
  <meta name="description" content="{{TAGLINE}}">
  <link rel="icon" href="{{LOGO_HREF}}">
  {{FONTS}}
  <link rel="stylesheet" href="assets/kit.css">
  <style>:root { {{THEME}} }</style>
  <script>try { var t = localStorage.getItem('ptmc-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body class="{{BODYCLASS}}">
  <script>/* the narrow header on every page but the Overview, from the first paint (kit.js sets the same class when it routes) */try { var h = location.hash; if (h && !/^#(overview(\?|$)|\?)/.test(h) && !document.body.classList.contains('full-header')) document.body.classList.add('slim'); } catch (e) {}</script>
  <button type="button" class="skip" data-skip>Skip to results</button>
  <header class="hero">
    <div class="hero-art" aria-hidden="true">{{ART}}</div>
    <div class="wrap">
      <div class="brand">
        <h1><a href="#overview" title="Back to the overview"><img class="site-mark" src="{{LOGO_HREF}}" alt="" width="52" height="52"><span>{{NAME}}</span></a></h1>
        <button type="button" class="hero-intro" data-start-show>Show introduction</button>
        <div class="brand-side">{{LAB}}<nav class="brand-links" aria-label="Site and lab links"><details class="links-menu" open><summary>Links</summary><div class="links-list">{{LINKS}}</div></details></nav></div>
      </div>
      <div class="lede">
        <p class="lede-what">{{TAGLINE}}</p>
        {{CITE}}
        <p class="lede-note">{{VERSION}}</p>
      </div>
      <div class="hero-stats" id="hero-stats" aria-label="Summary"></div>
    </div>
  </header>
  <div class="dock" id="dock" aria-label="Site"></div>

  <div class="toolbar">
    <div class="wrap">
      <div class="search-field" role="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="A question, a class or a motif" aria-label="Search proteins and sites, or filter">
        <button class="search-clear" id="q-clear" type="button" aria-label="Clear search" hidden>×</button>
      </div>
      <div class="scope" id="scope"></div>
      <nav class="tabs" id="tabs" aria-label="Pages"></nav>
    </div>
  </div>

  <script>/* the links are a menu on narrow screens, open on wide ones */try { var lm = document.querySelector(".links-menu"), mq = matchMedia("(max-width: 640px)"); var fit = function () { lm.open = !mq.matches; }; fit(); mq.addEventListener("change", fit); } catch (e) {}</script>

  <div class="wrap layout">
    <aside class="rail" id="rail" aria-label="Sections and filters"></aside>
    <main id="view"></main>
  </div>
  <div class="rail-scrim" data-rail-close></div>

  <footer class="site">
    <div class="wrap">
      <span id="credit"></span>
      <span class="theme-switch" role="group" aria-label="Color theme">
        <button type="button" data-theme-choice="auto">Auto</button><button type="button" data-theme-choice="light">Light</button><button type="button" data-theme-choice="dark">Dark</button>
      </span>
    </div>
  </footer>
  <div id="tip" role="tooltip" hidden></div>
  <script id="site-data" type="application/json">{{DATA}}</script>
  <script src="assets/kit.js"></script>
</body>
</html>
