[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "proteomekit"
version = "0.1.0"
description = "One proteome background, many units and marks: the Shechter lab's shared model of the human proteome (sequence, regions, domains, modifications) and the tests and release format built on it"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "statsmodels>=0.14", "jsonschema>=4.0", "pyyaml>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
pk = "proteomekit.cli:main"

[tool.setuptools]
packages = ["proteomekit", "proteomekit.layers"]

[tool.setuptools.package-data]
proteomekit = ["profiles/*.yaml", "schemas/*.json", "config/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
