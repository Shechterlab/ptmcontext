name: tests
on: [push, pull_request]
jobs:
  # The jobs run side by side: lint (seconds), the tests, and the link audit, one job per site, each building its site
  # (about 25 minutes, the lysine site about 45).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e packages/ptmstats -e ".[test]" ruff
      - run: ruff check ptmcontext tests packages --select E,F,W --ignore E501
      - run: ruff format --check ptmcontext tests packages
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # the site kit's scripts and stylesheet (ptmcontext/web/assets): formatting and a minimal lint (eslint.config.js)
      - run: npx --yes prettier@3.8.1 --check "ptmcontext/web/assets/*.js" "ptmcontext/web/assets/*.css"
      - run: npx --yes eslint@10.1.0 ptmcontext/web/assets

  test:
