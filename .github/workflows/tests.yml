      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e packages/ptmstats -e .
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Build the site
        run: |
          ptmc run sites/${{ matrix.site }}.yaml --root reference
          ptmc web sites/${{ matrix.site }}.yaml
      - name: Export audits (text overlap, legends)
        timeout-minutes: 60
        env:
          PROTEINS: ${{ matrix.proteins }}
          SELECTION: ${{ matrix.selection }}
        run: |
          sudo apt-get install -y --no-install-recommends poppler-utils
          mkdir -p "$RUNNER_TEMP/pw" && (cd "$RUNNER_TEMP/pw" && npm init -y >/dev/null && npm install playwright@1.63.0 && npx playwright install --with-deps chromium)
          python3 -m http.server 8931 --directory out/${{ matrix.site }}/web >/dev/null 2>&1 &
          sleep 2
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          # the PDF's libraries and fonts, which the kit loads from these addresses; the page may reach nothing else
          mkdir -p "$RUNNER_TEMP/cdn" && cd "$RUNNER_TEMP/cdn"
          for u in $(grep -ohE "https://(cdnjs\.cloudflare\.com|cdn\.jsdelivr\.net)/[^'\"]+\.(js|ttf)" "$GITHUB_WORKSPACE"/ptmcontext/web/assets/kit.js | sort -u); do curl -fsSL -O "$u"; done
          cd "$GITHUB_WORKSPACE"
          args=()
          [ -n "$PROTEINS" ] && args+=(--proteins "$PROTEINS")
          [ -n "$SELECTION" ] && args+=(--selection "$SELECTION")
          fail=0
          node tools/audit/export_overlap.js http://localhost:8931/index.html "${args[@]}" || fail=1
          node tools/audit/export_legend.js http://localhost:8931/index.html --pdf --cdn "$RUNNER_TEMP/cdn" "${args[@]}" || fail=1
          exit $fail
