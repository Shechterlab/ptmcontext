name: tests
on: [push, pull_request]
# a newer push to the same branch (or PR) cancels the run still going for an older one, so the queue does not build up
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  # The sites CI builds, their per-site parameters and the files of the data repository they read all come from the site files
  # (website.ci; tools/ci_plan.py): adding a site is its site file, not an edit here.
  plan:
    runs-on: ubuntu-latest
    outputs:
      link_matrix: ${{ steps.plan.outputs.link_matrix }}
      export_matrix: ${{ steps.plan.outputs.export_matrix }}
      audit_files: ${{ steps.plan.outputs.audit_files }}
      test_files: ${{ steps.plan.outputs.test_files }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e packages/ptmstats -e .
      - id: plan
        run: python tools/ci_plan.py --github-output "$GITHUB_OUTPUT"
  # the data pin (data_pin.json) must be one commit everywhere and, in CI, a tagged release of PTM_Pipeline (git ls-remote):
  # a site is not built from an untagged data release. Offline, run `python tools/check_data_pin.py --offline`
  data-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python tools/check_data_pin.py --require-tag
  # The jobs run side by side: lint (seconds), the tests, and the link audit, one job per site, each building its site
  # (about 25 minutes, the lysine site about 45).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the commit-message check reads the history
      # no commit message since 8425cba, or in the pushed range, may carry a Co-Authored-By: Claude or Claude-Session line
      - name: Commit messages carry no assistant attribution
        run: tools/check_commit_messages.sh 8425cba "${{ github.event.before }}"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e packages/ptmstats -e ".[test]" ruff
      - run: ruff check ptmcontext tests packages --select E,F,W --ignore E501
      - run: ruff format --check ptmcontext tests packages
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # the site kit's scripts and stylesheet (ptmcontext/web/assets): formatting and a minimal lint (eslint.config.js)
      - run: npx --yes prettier@3.8.1 --check "ptmcontext/web/assets/*.js" "ptmcontext/web/assets/*.css"
      - run: npx --yes eslint@10.1.0 ptmcontext/web/assets

  test:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The parity test reads release v1.4.3's inputs and statistics as data (checked against inputs.json MD5s);
      # no code of that repository is run.
      - uses: actions/checkout@v5
        with:
          repository: Shechterlab/PTM_Pipeline
          ref: 07e0e88bba86a7b91c30e166d4cd01cffb9400ef  # PTM_Pipeline, the commit of data_pin.json; actions/checkout needs the full hash. The tag is v1.7.0 (checked by tools/check_data_pin.py); the hash is what is checked out
          path: reference
          sparse-checkout: ${{ needs.plan.outputs.test_files }}
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e packages/ptmstats -e ".[test]"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # tools/audit/external.js (checked by tests/test_links_audit.py) requires playwright for its HTTP client; no browser is needed
      - run: npm install --no-save playwright@1.63.0
      - run: pytest -q
        env:
          PTMCONTEXT_ROOT: reference

  link-audit:
    needs: plan
    name: link-audit (${{ matrix.site }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # workers: browser pages at once; budget: minutes after which no new page is started (the rest listed as not visited):
      # website.ci.audit of each site file (the lysine site's pages are the largest: two workers keep the runner's memory in hand)
      matrix: ${{ fromJSON(needs.plan.outputs.link_matrix) }}
    steps:
      - uses: actions/checkout@v5
      # The parity test reads release v1.4.3's inputs and statistics as data (checked against inputs.json MD5s);
      # no code of that repository is run.
      - uses: actions/checkout@v5
        with:
          repository: Shechterlab/PTM_Pipeline
          ref: 07e0e88bba86a7b91c30e166d4cd01cffb9400ef  # PTM_Pipeline, the commit of data_pin.json; actions/checkout needs the full hash. The tag is v1.7.0 (checked by tools/check_data_pin.py); the hash is what is checked out
          path: reference
          sparse-checkout: ${{ needs.plan.outputs.audit_files }}
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e packages/ptmstats -e .
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # every internal link and control of the built site (tools/audit/links.js, without the external links: links.yml checks those
      # weekly); fails on a link to no view, a control that does nothing or a page error
      - name: Link audit (internal)
        env:
          PTMCONTEXT_ROOT: reference
        run: |
          ptmc run sites/${{ matrix.site }}.yaml --root reference
          ptmc web sites/${{ matrix.site }}.yaml
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          python3 -m http.server 8841 --directory out/${{ matrix.site }}/web >/dev/null 2>&1 &
          sleep 2
          node tools/audit/links.js http://localhost:8841/index.html --max 4 --workers ${{ matrix.workers }} --budget ${{ matrix.budget }} --verbose

  # What every download of a built site draws: no text over another or across a line of its figure, and every card's color key
  # (and legend) in the export, SVG and PDF (PNG is drawn from the same SVG as the PDF). Each site is built from a run,
  # served as it is built and walked in a headless browser, without and with a selection; any hit fails the job. One job
  # per site, in parallel, on every push; the Pages deploy (pages.yml) does not wait for them.
  export-audits:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # website.ci.audit of each site file: the walk's default selections and proteins are the methylarginine site's
      matrix: ${{ fromJSON(needs.plan.outputs.export_matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: Shechterlab/PTM_Pipeline
          ref: 07e0e88bba86a7b91c30e166d4cd01cffb9400ef  # PTM_Pipeline, the commit of data_pin.json; actions/checkout needs the full hash. The tag is v1.7.0 (checked by tools/check_data_pin.py); the hash is what is checked out
          path: reference
          sparse-checkout: ${{ needs.plan.outputs.audit_files }}
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e packages/ptmstats -e .
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Build the site
        run: |
          ptmc run sites/${{ matrix.site }}.yaml --root reference
          ptmc web sites/${{ matrix.site }}.yaml
      - name: Export audits (text overlap, legends)
        timeout-minutes: 110
        env:
          PROTEINS: ${{ matrix.proteins }}
          SELECTION: ${{ matrix.selection }}
        run: |
          sudo apt-get install -y --no-install-recommends poppler-utils
          mkdir -p "$RUNNER_TEMP/pw" && (cd "$RUNNER_TEMP/pw" && npm init -y >/dev/null && npm install playwright@1.63.0 && npx playwright install --with-deps chromium)
          python3 -m http.server 8931 --directory out/${{ matrix.site }}/web >/dev/null 2>&1 &
          sleep 2
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          # the PDF's libraries and fonts, which the kit loads from these addresses; the page may reach nothing else
          mkdir -p "$RUNNER_TEMP/cdn" && cd "$RUNNER_TEMP/cdn"
          for u in $(grep -ohE "https://(cdnjs\.cloudflare\.com|cdn\.jsdelivr\.net)/[^'\"]+\.(js|ttf)" "$GITHUB_WORKSPACE"/ptmcontext/web/assets/kit.js | sort -u); do curl -fsSL -O "$u"; done
          cd "$GITHUB_WORKSPACE"
          args=()
          [ -n "$PROTEINS" ] && args+=(--proteins "$PROTEINS")
          [ -n "$SELECTION" ] && args+=(--selection "$SELECTION")
          fail=0
          node tools/audit/export_overlap.js http://localhost:8931/index.html "${args[@]}" || fail=1
          node tools/audit/export_legend.js http://localhost:8931/index.html --pdf --cdn "$RUNNER_TEMP/cdn" "${args[@]}" || fail=1
          exit $fail
