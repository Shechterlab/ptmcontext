          node-version: "22"
      # every internal link and control of the built site (tools/audit/links.js, without the external links: links.yml checks those
      # weekly); fails on a link to no view, a control that does nothing or a page error
      - name: Link audit (internal)
        env:
          PTMCONTEXT_ROOT: reference
        run: |
          ptmc run sites/${{ matrix.site }}.yaml --root reference
          ptmc web sites/${{ matrix.site }}.yaml
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          python3 -m http.server 8841 --directory out/${{ matrix.site }}/web >/dev/null 2>&1 &
          sleep 2
          node tools/audit/links.js http://localhost:8841/index.html --max 4 --workers 4

  # What every download of a built site draws: no text over another or across a line of its figure, and every card's color key
  # (and legend) in the export, SVG and PDF (PNG is drawn from the same SVG as the PDF). Each site is built from a run,
  # served as it is built and walked in a headless browser, without and with a selection; any hit fails the job. One job
  # per site, in parallel, on every push; the Pages deploy (pages.yml) does not wait for them.
  export-audits:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: methylarginine
            proteins: ""
            selection: ""
          # the walk's default selections and proteins are the methylarginine site's: the other sites' own (a histone class,
          # its chromatin class, histone H3 and p53; a proline-directed kinase class, p53 and AKT1)
          - site: methyllysine
            proteins: P68431,P04637
            selection: "f=p:histone~histone|f=p:panther_group~Transcription, chromatin and DNA"
          - site: phospho
            proteins: P04637,P31749
            selection: "f=p:kinase_motifs~proline_directed"
          - site: lysine
            proteins: P68431,P04637
            selection: "f=p:histone~histone|f=p:panther_group~Transcription, chromatin and DNA"
