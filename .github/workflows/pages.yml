# Build every site from its sources and publish them on GitHub Pages, with a landing page. Runs on each push to develop,
# the working branch the site is served from, and to main (and by hand). Pages' source must be "GitHub Actions", and
# the github-pages environment must allow develop among its deployment branches. The methylarginine site reads the release's public inputs as data, checked against inputs.json, and
# must still equal release v1.4.3. The export audits (text overlap, legends) run in tests.yml, so a deploy does not wait for them.
# The four sites are built in parallel jobs (one matrix entry each, the slowest about 45 minutes instead of the four in a row,
# about two hours); a last job downloads their websites, assembles them with the landing page (ptmc pages) and uploads the Pages artifact.
# (The yeast site is not published: sites/yeast_phospho.yaml stays as an example of a second organism.)
name: pages
on:
  push:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    name: build (${{ matrix.site }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        site: [methylarginine, methyllysine, phospho, lysine]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: Shechterlab/PTM_Pipeline
          ref: aa895fc1a0b5b2e32ad9606c94ad65fab3f03beb  # PTM_Pipeline; actions/checkout needs the full hash
          path: reference
          sparse-checkout: |
            inputs/reference
            releases/v1.5.0/human_methyllysine_sites_v1.5.0.tsv
            releases/v1.5.0/human_phosphorylation_sites_v1.5.0.tsv
            releases/v1.5.0/human_acetylation_sites_v1.5.0.tsv
            releases/v1.5.0/human_lysine_acylation_sites_v1.5.0.tsv
            releases/v1.5.0/human_ubiquitination_sites_v1.5.0.tsv
            releases/v1.5.0/human_sumoylation_sites_v1.5.0.tsv
            inputs/annotation/mobidb_disorder_intervals_2026-03-30.tsv
            inputs/annotation/interpro_108.0_domain_intervals.tsv
            inputs/annotation/interpro_108.0_all_entry_intervals.tsv
            inputs/annotation/go_bp_human_2026-11-04.tsv
            inputs/annotation/go_bp_terms_2026-11-04.tsv
            inputs/layers/reactome_human_protein_pathways.tsv
            inputs/layers/reactome_human_pathways.tsv
            inputs/layers/hpa_subcellular_locations.tsv
            inputs/layers/paxdb_human_integrated_abundance.tsv
            inputs/annotation/panther_19.0_protein_classes.tsv
            inputs/annotation/panther_19.0_protein_class_ontology.tsv
            inputs/disease/dose_4.4.0_disgenet_term_genes.tsv
            inputs/disease/orghsegdb_3.22.0_symbol_entrez.tsv
            inputs/disease/hdo_2026-09-30_term_genes.tsv
            inputs/disease/hdo_2026-09-30_terms.tsv
            inputs/annotation/cdcode_protein_membership_v2.2.tsv
            inputs/annotation/cdcode_proteins_2026-03-18.csv
            inputs/annotation/cdcode_condensates_2026-03-18.csv
            inputs/interactions/cdcode_2.3_condensate_members_2026-10-16.tsv
            inputs/layers/cell_map_hcm_go2021.tsv
            inputs/layers/cell_map_organelle_ip_hein2025.tsv
            inputs/layers/cell_map_chromatin_kustatscher2014.tsv
            inputs/layers/depmap_24q4_gene_effect_summary.tsv
            inputs/layers/depmap_24q4_arginine_changes.tsv
            inputs/layers/tcga_mc3_arginine_changes.tsv
            releases/v1.4.3/human_methylarginine_sites_v1.4.3.tsv
            releases/v1.4.3/statistics_v1.4.3.tsv
            releases/v1.4.3/human_methylarginine_proteins_v1.4.3.tsv
            releases/v1.4.3/supporting/nucleic_acid_contacts_v1.4.3.tsv
            releases/v1.4.3/supporting/nucleic_acid_near_sites_v1.4.3.tsv
            releases/v1.4.3/supporting/dna_motifs_v1.4.3.tsv
            releases/v1.4.3/supporting/eclip_v1.4.3.tsv
            releases/v1.4.3/supporting/nucleic_acid_regions_v1.4.3.tsv
            releases/v1.4.3/supporting/rna_bind_n_seq_v1.4.3.tsv
            releases/v1.4.3/supporting/protein_partners_v1.4.3.tsv
            releases/v1.4.3/supporting/other_ptm_sites_v1.4.3.tsv
            releases/v1.4.3/supporting/functional_experiments_v1.4.3.tsv
            releases/v1.4.3/supporting/residue_evidence_v1.4.3.tsv
            releases/v1.4.3/supporting/site_interaction_records_v1.4.3.tsv
            releases/v1.4.3/supporting/site_interactions_v1.4.3.tsv
            releases/v1.4.3/supporting/source_records_v1.4.3.tsv
            releases/v1.4.3/studies_v1.4.3.tsv
            releases/v1.4.3/supporting/carm1_ko_v1.4.3.tsv
            releases/v1.4.3/supporting/maron2021_inhibitors_v1.4.3.tsv
            releases/v1.4.3/supporting/writer_perturbations_v1.4.3.tsv
            releases/v1.4.3/human_methylarginine_lower_confidence_sites_v1.4.3.tsv
            releases/v1.4.3/statistics_with_lower_confidence_v1.4.3.tsv
            releases/v1.4.3/supporting/density_windows_v1.4.3.tsv
            releases/v1.4.3/supporting/disease_ontology_v1.4.3.tsv
            releases/v1.4.3/supporting/disease_terms_tested_v1.4.3.tsv
            releases/v1.4.3/analyses_with_lower_confidence/disease/disease_ontology.tsv
            releases/v1.4.3/analyses_with_lower_confidence/disease/disease_terms.tsv
            inputs/interactions/capri_panhale2019_adj_peptides.tsv
            inputs/interactions/capri_panhale2019_measured_peptides.tsv
            inputs/interactions/capri_panhale2019_xl_peptides.tsv
            inputs/interactions/intact_binding_regions_human_2026-10-19.tsv
            inputs/interactions/intact_mutations_human_2026-10-19.tsv
            inputs/interactions/pclap_mullari2017_peptides.tsv
            inputs/interactions/pdbe_kb_interface_residues_2026-10-16.tsv
            inputs/interactions/pdbe_kb_interface_residues_2026-10-20.tsv
            inputs/interactions/pdbe_kb_interface_residues_2026-10-21.tsv
            inputs/interactions/pdbe_kb_interface_residues_2026-10-21_2.tsv
            inputs/interactions/pdbe_kb_interface_residues_2026-10-21_3.tsv
            inputs/interactions/pdbe_kb_interface_residues_2026-10-25.tsv
            inputs/interactions/pepr_ms_v2_table_s2_rna_crosslinked_peptides.tsv
            inputs/interactions/pepr_ms_v2_table_s3_focused_sites.tsv
            inputs/interactions/protvar_predicted_interfaces_2024.05.28_pdockq0.23.tsv
            inputs/interactions/quickgo_human_rna_dna_binding_2026-10-16.tsv
            inputs/interactions/rbdmap_castello2016_measured_peptides.tsv
            inputs/interactions/rbdmap_castello2016_rna_bound_fragments.tsv
            inputs/interactions/rbrid_oksuz2023_k562_coverage.tsv
            inputs/interactions/rbrid_oksuz2023_k562_positive_residues.tsv
            inputs/interactions/rbrid_oksuz2023_k562_segments.tsv
            inputs/interactions/sifts_observed_ranges_human_2026-10-16.tsv
            inputs/interactions/trendel2025_dna_crosslink_localisation.tsv
            inputs/interactions/trendel2025_dna_crosslinked_peptides.tsv
            inputs/interactions/trendel2025_mcf7_dna_interactome.tsv
            inputs/interactions/uniprot_human_dna_binding_regions_2026-10-16.tsv
            inputs/interactions/uniprot_human_regions_2026-10-16.tsv
            releases/v1.4.3/supporting/arginine_nucleic_acid_distances_v1.4.3.tsv
            releases/v1.4.3/supporting/complexes_v1.4.3.tsv
            releases/v1.4.3/supporting/dna_motifs_v1.4.3.tsv
            releases/v1.4.3/supporting/eclip_v1.4.3.tsv
            releases/v1.4.3/supporting/eclip_rna_compartments_v1.4.3.tsv
            releases/v1.4.3/supporting/arginine_background_v1.4.3.tsv
            releases/v1.4.3/supporting/htr_selex_v1.4.3.tsv
            releases/v1.4.3/supporting/rna_bind_n_seq_v1.4.3.tsv
            releases/v1.5.0/human_methyllysine_sites_v1.5.0.tsv
            inputs/interactions/string_v12.5_human_physical_links_score400.tsv
            inputs/interactions/complex_portal_human_complexes_2026-10-16.tsv
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e packages/ptmstats -e .
      # Methylarginine: the release's public inputs as data (v1.4.3). Methyllysine (unlisted on the landing page; in the sites'
      # header menu), phosphosites and lysine modifications (listed): release v1.5.0 of PTM_Pipeline, pinned above, with the
      # generic inputs the methylarginine site reads. Those three have no reference release: every statistic is new. The
      # lower-confidence variants of the phosphosite and lysine sites are not built here.
      - name: Run and build ${{ matrix.site }}
        run: |
          ptmc run sites/${{ matrix.site }}.yaml --root reference
          case "${{ matrix.site }}" in phospho|lysine) lower=no ;; *) lower=yes ;; esac
          [ "$lower" = no ] || ptmc run sites/${{ matrix.site }}.yaml --root reference --variant with_lower_confidence
          ptmc web sites/${{ matrix.site }}.yaml
          [ "$lower" = no ] || ptmc web sites/${{ matrix.site }}.yaml --variant with_lower_confidence
      # the website and the run record, which the landing page reads; the one-file copy (out/<site>/web/<site>.html, up to
      # 84 MB) is not published on Pages: kept in its own artifact
      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.site }}
          path: |
            out/${{ matrix.site }}/web
            out/${{ matrix.site }}/run.json
            !out/${{ matrix.site }}/web/${{ matrix.site }}.html
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: one-file-copy-${{ matrix.site }}
          path: out/${{ matrix.site }}/web/${{ matrix.site }}.html
          retention-days: 30
          if-no-files-found: ignore
  assemble:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e packages/ptmstats -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: site-*
          path: out-parts
      # each artifact holds out/<site>/..., kept under its own name: move them back to out/<site>
      - run: |
          mkdir -p out
          for d in out-parts/site-*; do mkdir -p "out/${d#out-parts/site-}"; cp -a "$d"/. "out/${d#out-parts/site-}/"; done
          ls out/*
      - run: ptmc pages sites/methylarginine.yaml sites/methyllysine.yaml sites/phospho.yaml sites/lysine.yaml --out _site --skip-missing
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        # the site is about 230 MB in 2,350 files; GitHub's sync took longer than the default 10 minutes on 2026-11-09
        with:
          timeout: 1800000
  # one open issue says the published site is stale: opened (or commented on) when a build or deploy fails, closed when a
  # deploy succeeds; watch the label "pages-failure" instead of Actions' e-mails
  report:
    needs: [build, assemble, deploy]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: skipped-sites
          path: skipped
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESULT: ${{ needs.build.result == 'success' && needs.assemble.result || needs.build.result }}/${{ needs.deploy.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        run: |
          gh label create pages-failure --repo "$REPO" --color B42318 --description "The Pages build or deploy failed" 2>/dev/null || true
          open=$(gh issue list --repo "$REPO" --label pages-failure --state open --json number --jq '.[0].number')
          skipped=$(cat skipped/skipped_sites.txt 2>/dev/null | tr '\n' ' ')
          if [ "$RESULT" = "success/success" ] && [ -n "$skipped" ]; then
            body="Deployed from $REF at ${SHA:0:7} without: $skipped. The site's staging or run step failed, so the published copy of it is stale or absent. Log: $RUN"
            if [ -n "$open" ]; then gh issue comment "$open" --repo "$REPO" --body "$body"
            else gh issue create --repo "$REPO" --label pages-failure --title "Pages deployed without $skipped" --body "$body"; fi
          elif [ "$RESULT" = "success/success" ]; then
            [ -n "$open" ] && gh issue close "$open" --repo "$REPO" --comment "Deployed again from $REF at ${SHA:0:7}: $RUN" || true
          elif [ "$RESULT" != "cancelled/skipped" ] && [ "$RESULT" != "cancelled/cancelled" ]; then
            body="Build/deploy: $RESULT on $REF at ${SHA:0:7}. Log: $RUN"
            if [ -n "$open" ]; then gh issue comment "$open" --repo "$REPO" --body "$body"
            else gh issue create --repo "$REPO" --label pages-failure --title "Pages build failing on $REF" --body "$body"; fi
          fi
