# Build every site from its sources and publish them on GitHub Pages, with a landing page. Runs on each push to develop,
# the working branch the site is served from, and to main (and by hand). Pages' source must be "GitHub Actions", and
# the github-pages environment must allow develop among its deployment branches. The methylarginine site reads the release's public inputs as data, checked against inputs.json, and
# must still equal release v1.7.0 (methylarginine data as in v1.4.3). The export audits (text overlap, legends) run in tests.yml, so a deploy does not wait for them.
# The published sites (those with website.ci, in its order: tools/ci_plan.py) are built in parallel jobs (one matrix entry each,
# the slowest about 45 minutes instead of all in a row, about two hours); a last job downloads their websites, assembles them with the landing page (ptmc pages) and uploads the Pages artifact.
# Where the live site comes from is one repository variable, PAGES_MODE (Settings > Secrets and variables > Actions > Variables).
# Unset or "develop" (today): every push to develop or main deploys. "tags" (from 1.0.0, see VERSIONING.md): only a tag vX.Y.Z
# deploys; pushes to develop and main still build, so a broken build shows, but do not deploy. The github-pages environment
# must allow the tags v* then. A tag push in "develop" mode does nothing: its commit was deployed from the branch.
# (The yeast site is not published: sites/yeast_phospho.yaml stays as an example of a second organism.)
name: pages
on:
  push:
    branches: [develop, main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  # The sites CI builds, their per-site parameters and the files of the data repository they read all come from the site files
  # (website.ci; tools/ci_plan.py): adding a site is its site file, not an edit here.
  plan:
    if: github.ref_type != 'tag' || vars.PAGES_MODE == 'tags'
    runs-on: ubuntu-latest
    outputs:
      pages_matrix: ${{ steps.plan.outputs.pages_matrix }}
      pages_sites: ${{ steps.plan.outputs.pages_sites }}
      build_files: ${{ steps.plan.outputs.build_files }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e packages/ptmstats -e .
      - id: plan
        run: python tools/ci_plan.py --github-output "$GITHUB_OUTPUT"
  build:
    needs: plan
    name: build (${{ matrix.site }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.pages_matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: Shechterlab/PTM_Pipeline
          ref: 07e0e88bba86a7b91c30e166d4cd01cffb9400ef  # PTM_Pipeline, the commit of data_pin.json; actions/checkout needs the full hash. The tag is v1.7.0 (checked by tools/check_data_pin.py); the hash is what is checked out
          path: reference
          sparse-checkout: ${{ needs.plan.outputs.build_files }}
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e packages/ptmstats -e .
      # Methylarginine: the release's public inputs as data (v1.7.0). Methyllysine (unlisted on the landing page; in the sites'
      # header menu), phosphosites and lysine modifications (listed): release v1.5.0 of PTM_Pipeline, pinned above, with the
      # generic inputs the methylarginine site reads. Those three have no reference release: every statistic is new. The
      # lower-confidence variant is built where the site file says so (website.ci.lower_confidence: methylarginine and methyllysine).
      - name: Run and build ${{ matrix.site }}
        run: |
          ptmc run sites/${{ matrix.site }}.yaml --root reference
          lower=${{ matrix.lower && 'yes' || 'no' }}
          [ "$lower" = no ] || ptmc run sites/${{ matrix.site }}.yaml --root reference --variant with_lower_confidence
          ptmc web sites/${{ matrix.site }}.yaml
          [ "$lower" = no ] || ptmc web sites/${{ matrix.site }}.yaml --variant with_lower_confidence
      # the website, the run record and the protein list, which the landing page reads (its cards and its search); the one-file copy (out/<site>/web/<site>.html, up to
      # 84 MB) is not published on Pages: kept in its own artifact
      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.site }}
          path: |
            out/${{ matrix.site }}/web
            out/${{ matrix.site }}/run.json
            out/${{ matrix.site }}/proteins.tsv
            !out/${{ matrix.site }}/web/${{ matrix.site }}.html
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: one-file-copy-${{ matrix.site }}
          path: out/${{ matrix.site }}/web/${{ matrix.site }}.html
          retention-days: 30
          if-no-files-found: ignore
  assemble:
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e packages/ptmstats -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: site-*
          path: out-parts
      # each artifact holds out/<site>/..., kept under its own name: move them back to out/<site>
      - run: |
          mkdir -p out
          for d in out-parts/site-*; do mkdir -p "out/${d#out-parts/site-}"; cp -a "$d"/. "out/${d#out-parts/site-}/"; done
          ls out/*
      - run: ptmc pages ${{ needs.plan.outputs.pages_sites }} --out _site --skip-missing
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: assemble
    if: vars.PAGES_MODE != 'tags' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        # the site is about 230 MB in 2,350 files; GitHub's sync took longer than the default 10 minutes on 2026-11-09
        with:
          timeout: 1800000
  # one open issue says the published site is stale: opened (or commented on) when a build or deploy fails, closed when a
  # deploy succeeds; watch the label "pages-failure" instead of Actions' e-mails
  report:
    needs: [plan, build, assemble, deploy]
    if: always() && github.event_name != 'pull_request' && needs.plan.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: skipped-sites
          path: skipped
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESULT: ${{ needs.build.result == 'success' && needs.assemble.result || needs.build.result }}/${{ needs.deploy.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        run: |
          gh label create pages-failure --repo "$REPO" --color B42318 --description "The Pages build or deploy failed" 2>/dev/null || true
          open=$(gh issue list --repo "$REPO" --label pages-failure --state open --json number --jq '.[0].number')
          skipped=$(cat skipped/skipped_sites.txt 2>/dev/null | tr '\n' ' ')
          if [ "$RESULT" = "success/success" ] && [ -n "$skipped" ]; then
            body="Deployed from $REF at ${SHA:0:7} without: $skipped. The site's staging or run step failed, so the published copy of it is stale or absent. Log: $RUN"
            if [ -n "$open" ]; then gh issue comment "$open" --repo "$REPO" --body "$body"
            else gh issue create --repo "$REPO" --label pages-failure --title "Pages deployed without $skipped" --body "$body"; fi
          elif [ "$RESULT" = "success/success" ]; then
            [ -n "$open" ] && gh issue close "$open" --repo "$REPO" --comment "Deployed again from $REF at ${SHA:0:7}: $RUN" || true
          elif [ "$RESULT" != "cancelled/skipped" ] && [ "$RESULT" != "cancelled/cancelled" ] && [ "$RESULT" != "success/skipped" ]; then
            body="Build/deploy: $RESULT on $REF at ${SHA:0:7}. Log: $RUN"
            if [ -n "$open" ]; then gh issue comment "$open" --repo "$REPO" --body "$body"
            else gh issue create --repo "$REPO" --label pages-failure --title "Pages build failing on $REF" --body "$body"; fi
          fi
